name: Generate remaining Local Managed Controls batches

on:
  push:
    branches:
      - managed-controls/program-bootstrap
    paths:
      - '.github/scripts/generate_managed_controls_batches.py'
      - '.github/workflows/managed-controls-program-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: managed-controls-local-program-bootstrap
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: managed-controls/program-bootstrap
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Generate and push task branches
        run: python .github/scripts/generate_managed_controls_batches.py
