name: R0 source snapshot

on:
  pull_request:
    branches: [release/3.0]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event.pull_request.number == 2299
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Archive source tree
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=.venv --exclude=.uv-cache -czf "$RUNNER_TEMP/r0-source.tgz" .
      - name: Upload source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r0-source-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/r0-source.tgz
          if-no-files-found: error
          retention-days: 1
