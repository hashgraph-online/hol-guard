name: Diagnose Pi hook worker

on:
  push:
    branches:
      - fix/main-publish-yanked-release-anchor
    paths:
      - ".github/workflows/diagnose-pi-hook-worker.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
      - name: Enable evaluator traceback for this diagnostic only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/codex_plugin_scanner/guard/daemon/hook_process_entrypoint.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("import time\n", "import time\nimport traceback\n", 1)
          old = '''        except BaseException as error:\n            reason_code = (\n                "daemon_hook_process_not_ready" if sqlite_error_is_busy_locked(error) else "daemon_hook_process_failed"\n            )\n            response = {"payload": None, "reason_code": reason_code}\n'''
          new = '''        except BaseException as error:\n            traceback.print_exc()\n            reason_code = (\n                "daemon_hook_process_not_ready" if sqlite_error_is_busy_locked(error) else "daemon_hook_process_failed"\n            )\n            response = {"payload": None, "reason_code": reason_code}\n'''
          if text.count(old) != 1:
              raise SystemExit("evaluator exception block changed unexpectedly")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Install test environment
        run: uv sync --frozen --extra dev --python 3.12
      - name: Reproduce exact shard 10 ordering
        shell: bash
        run: |
          uv run --no-sync python scripts/ci/pytest_shard.py \
            --shard-index 10 \
            --shard-count 16 \
            --granularity node \
            --duration-manifest ci/pytest-duration-manifest.json.gz \
            --max-manifest-age-days 28 > pytest-nodes.txt
          test -s pytest-nodes.txt
          PYTHONPATH=scripts/ci uv run --no-sync pytest @pytest-nodes.txt -s --tb=long
