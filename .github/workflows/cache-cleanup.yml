name: Cache cleanup

# The repository cache is capped at 10 GB with LRU eviction. Every main push
# saves a new CodeQL overlay database, and lockfile changes leave the previous
# Rust target caches behind. A compiler-environment change leaves the previous
# environment's caches behind as well. Prune entries a newer one has replaced,
# and compiler cache objects no build has read for two hours, so they stop
# evicting the caches the next run restores.
on:
  workflow_run:
    workflows: [CodeQL Analysis]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: cache-cleanup
  cancel-in-progress: true

jobs:
  prune:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          ref: main
      - name: Plan superseded main-branch cache cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh cache list --ref refs/heads/main --limit 5000 --json id,key,ref,createdAt,lastAccessedAt,version,sizeInBytes > "$RUNNER_TEMP/caches.json"
          python3 scripts/ci/protected_runtime_archives.py --repository "$GH_REPO" --output "$RUNNER_TEMP/protected-archives.json"
          python3 scripts/ci/prune_superseded_caches.py "$RUNNER_TEMP/caches.json" \
            --protected-archives "$RUNNER_TEMP/protected-archives.json" \
            --report "$RUNNER_TEMP/cache-prune-plan.json" > "$RUNNER_TEMP/prune.txt"
      - name: Retain the cleanup plan before deleting any cache
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cache-cleanup-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/caches.json
            ${{ runner.temp }}/protected-archives.json
            ${{ runner.temp }}/cache-prune-plan.json
          if-no-files-found: error
          retention-days: 7
      - name: Delete planned main-branch caches
        id: delete
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/ci/protected_runtime_archives.py --repository "$GH_REPO" \
            --verify-plan "$RUNNER_TEMP/cache-prune-plan.json" --output "$RUNNER_TEMP/cache-prune-verification.json"
          jq -c '{source_verification, skipped_archives}' "$RUNNER_TEMP/cache-prune-verification.json"
          jq -r '.selected[].id' "$RUNNER_TEMP/cache-prune-verification.json" > "$RUNNER_TEMP/prune.txt"
          deleted=0
          failed=0
          while read -r id; do
            [ -n "$id" ] || continue
            if gh cache delete "$id"; then
              deleted=$((deleted + 1))
            else
              failed=$((failed + 1))
              echo "::warning::could not delete cache $id"
            fi
          done < "$RUNNER_TEMP/prune.txt"
          echo "Deleted $deleted superseded or idle cache entries; $failed failed" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain final source verification
        if: always() && steps.delete.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cache-cleanup-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cache-prune-verification.json
          if-no-files-found: error
          retention-days: 7
