name: Wake Desktop Core stable feed

on:
  workflow_run:
    workflows: ["Publish to PyPI"]
    types: [completed]
  issues:
    types: [opened]
  push:
    branches:
      - main
    paths:
      # Test-only changes are validated in PR CI without waking release producers.
      - .github/workflows/wake-desktop-core-alpha-feed.yml
      - scripts/release/wake_desktop_core_feeds.py
  pull_request:
    paths:
      - .github/workflows/wake-desktop-core-alpha-feed.yml
      - scripts/release/wake_desktop_core_feeds.py
      - tests/test_wake_desktop_core_feeds.py

permissions:
  contents: read

concurrency:
  group: wake-desktop-core-stable-feed
  cancel-in-progress: false

jobs:
  wake:
    name: Dispatch Desktop Core stable feed
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'issues' &&
       (github.event.issue.author_association == 'OWNER' ||
        github.event.issue.author_association == 'MEMBER' ||
        github.event.issue.author_association == 'COLLABORATOR') &&
       startsWith(github.event.issue.title, '[desktop-core-feed]')) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch') &&
       ((github.event.workflow_run.event == 'workflow_dispatch' &&
         github.event.workflow_run.head_branch == 'main') ||
        startsWith(github.event.workflow_run.head_branch, 'v3.')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out trusted wake automation
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # The Python router applies strict stable-version validation to this coarse branch filter.
      - name: Download completed publication checksums
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: distribution-sha256-native
          path: .publication
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Dispatch feed producer
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PUBLICATION_CHECKSUMS: .publication/distribution-sha256-native.txt
        run: python3 scripts/release/wake_desktop_core_feeds.py
