name: Temporary PR 2691 Windows error-preservation diagnostic

on:
  push:
    branches:
      - fix/native-runtime-process-lifecycle
    paths:
      - .github/workflows/temporary-pr2691-windows-relative-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/native-runtime-process-lifecycle
          persist-credentials: false
      - name: Preserve relative child error kinds
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          path = Path('rust/crates/guard-runtime/src/resident_state_windows.rs')
          text = path.read_text(encoding='utf-8')

          old = '''fn with_existing_directory<T, F>(path: &Path, private_root: &Path, action: F) -> Result<T, String>
          where
              F: FnOnce(&guard_runtime_windows_process::PrivateDirectoryBinding) -> io::Result<T>,
          {
              let owner =
                  current_process_sid().map_err(|_| "native_resident_windows_owner_sid_failed".to_owned())?;
              guard_runtime_windows_process::bind_directory(
                  path,
                  private_root,
                  private_root,
                  |handle, _is_target, _created, is_private| {
                      if is_private {
                          repair_windows_handle(handle, true, owner.as_ref()).map_err(io::Error::other)
                      } else {
                          Ok(())
                      }
                  },
              )
              .and_then(|binding| action(&binding))
              .map_err(|error| error.to_string())
          }
          '''
          new = '''fn with_existing_directory<T, F>(path: &Path, private_root: &Path, action: F) -> io::Result<T>
          where
              F: FnOnce(&guard_runtime_windows_process::PrivateDirectoryBinding) -> io::Result<T>,
          {
              let owner = current_process_sid()
                  .map_err(|_| io::Error::other("native_resident_windows_owner_sid_failed"))?;
              guard_runtime_windows_process::bind_directory(
                  path,
                  private_root,
                  private_root,
                  |handle, _is_target, _created, is_private| {
                      if is_private {
                          repair_windows_handle(handle, true, owner.as_ref()).map_err(io::Error::other)
                      } else {
                          Ok(())
                      }
                  },
              )
              .and_then(|binding| action(&binding))
          }
          '''
          if text.count(old) != 1:
              raise RuntimeError(f'helper replacement target count: {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''    with_existing_directory(parent, private_root, |binding| {
                  let file = binding.create_private_file(name, &descriptor)?;
                  if let Err(error) = verify_windows_handle(&file, owner.as_ref()) {
                      let _ = guard_runtime_windows_process::delete_private_file_handle(&file);
                      return Err(io::Error::other(error));
                  }
                  Ok(file)
              })
              .map_err(io::Error::other)
          '''
          new = '''    with_existing_directory(parent, private_root, |binding| {
                  let file = binding.create_private_file(name, &descriptor)?;
                  if let Err(error) = verify_windows_handle(&file, owner.as_ref()) {
                      let _ = guard_runtime_windows_process::delete_private_file_handle(&file);
                      return Err(io::Error::other(error));
                  }
                  Ok(file)
              })
          '''
          if text.count(old) != 1:
              raise RuntimeError(f'create caller target count: {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''    with_existing_directory(parent, private_root, |binding| {
                  binding.open_private_file(name)
              })
              .map_err(io::Error::other)
          '''
          new = '''    with_existing_directory(parent, private_root, |binding| {
                  binding.open_private_file(name)
              })
          '''
          if text.count(old) != 1:
              raise RuntimeError(f'open caller target count: {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''    with_existing_directory(path, private_root, |binding| {
                  let handle = binding.handle();
                  handle.try_clone()
              })
              .map_err(io::Error::other)
          '''
          new = '''    with_existing_directory(path, private_root, |binding| {
                  let handle = binding.handle();
                  handle.try_clone()
              })
          '''
          if text.count(old) != 1:
              raise RuntimeError(f'open directory target count: {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''    with_existing_directory(parent, private_root, |binding| {
                  let source = binding.open_private_file(temporary_name)?;
                  verify_windows_handle(&source, owner.as_ref()).map_err(io::Error::other)?;
                  binding.replace_private_file(&source, destination_name)
              })
          }
          '''
          new = '''    with_existing_directory(parent, private_root, |binding| {
                  let source = binding.open_private_file(temporary_name)?;
                  verify_windows_handle(&source, owner.as_ref()).map_err(io::Error::other)?;
                  binding.replace_private_file(&source, destination_name)
              })
              .map_err(|error| error.to_string())
          }
          '''
          if text.count(old) != 1:
              raise RuntimeError(f'replace caller target count: {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''    with_existing_directory(parent, private_root, |binding| {
                  let file = match binding.open_private_file(name) {
                      Ok(file) => file,
                      Err(error) if error.kind() == io::ErrorKind::NotFound => return Ok(false),
                      Err(error) => return Err(error),
                  };
                  guard_runtime_windows_process::delete_private_file_handle(&file).map(|()| true)
              })
          }
          '''
          new = '''    with_existing_directory(parent, private_root, |binding| {
                  let file = match binding.open_private_file(name) {
                      Ok(file) => file,
                      Err(error) if error.kind() == io::ErrorKind::NotFound => return Ok(false),
                      Err(error) => return Err(error),
                  };
                  guard_runtime_windows_process::delete_private_file_handle(&file).map(|()| true)
              })
              .map_err(|error| error.to_string())
          }
          '''
          if text.count(old) != 1:
              raise RuntimeError(f'remove caller target count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          '@ | python -
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo clippy --manifest-path rust/Cargo.toml --locked --workspace --all-targets -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --locked -p hol-guard-runtime --bin hol-guard-runtime approval::approval_v4::tests::ed25519_assertion_validates_and_persists_counter_zero_and_one -- --nocapture
          cargo test --manifest-path rust/Cargo.toml --locked --workspace --all-targets

# Error-kind preservation validation.
