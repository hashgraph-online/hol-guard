name: Reviewed Sonar audit origin

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify-reviewed-origin:
    if: >-
      github.event.pull_request.number == 2778 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/sonar-blocker-control-flow' &&
      github.actor == 'kantorcodes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Verify the committed request boundary and review guard
        run: |
          uv run --no-sync ruff check tests/test_cloud_audit_job_destination.py tests/test_apply_sonar_audit_review.py
          uv run --no-sync ruff format --check --diff tests/test_cloud_audit_job_destination.py tests/test_apply_sonar_audit_review.py
          uv run --no-sync pytest -q tests/test_cloud_workspace_audit_destination.py tests/test_cloud_audit_job_destination.py tests/test_apply_sonar_audit_review.py
          git diff --exit-code
      - name: Apply the single source-pinned reviewed disposition
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: uv run --no-sync python scripts/ci/apply_sonar_audit_review.py --apply
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: sonar-audit-origin-review
          path: sonar-audit-review/
          if-no-files-found: warn
