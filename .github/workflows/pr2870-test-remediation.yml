name: PR2870 focused remediation

on:
  push:
    branches:
      - fix/secret-read-floors-and-contained-vitest
    paths:
      - .github/workflows/pr2870-test-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/secret-read-floors-and-contained-vitest
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Apply focused expectation fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, got {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          phase = Path("tests/test_guard_phase04_failure_modes.py")
          text = phase.read_text(encoding="utf-8")
          marker = "def test_gr098_permissive_hook_failure_preserves_existing_deny_decision"
          start = text.index(marker)
          end = text.index("\n\ndef ", start + len(marker))
          block = text[start:end]
          old = 'assert payload["hookSpecificOutput"]["permissionDecision"] == "ask"'
          if block.count(old) != 1:
              raise SystemExit("phase04 target assertion did not match")
          block = block.replace(old, 'assert payload["hookSpecificOutput"]["permissionDecision"] == "deny"', 1)
          phase.write_text(text[:start] + block + text[end:], encoding="utf-8")

          verified = Path("tests/test_guard_verified_reads.py")
          text = verified.read_text(encoding="utf-8")
          marker = "def test_raw_shell_candidates_never_mint_positive_proof()"
          start = text.index(marker)
          end = text.index("\n\ndef ", start + len(marker))
          block = text[start:end]
          old = '        assert evaluation.decision_plane.action == "review"'
          if block.count(old) != 1:
              raise SystemExit("verified-read target assertion did not match")
          block = block.replace(old, '        assert evaluation.decision_plane.action in {"review", "require-reapproval"}', 1)
          verified.write_text(text[:start] + block + text[end:], encoding="utf-8")

          replace_once(
              "tests/test_guard_risk.py",
              '''def test_tool_action_request_classifier_skips_secret_pipe_to_curl_without_stdin_upload():\n    request = extract_sensitive_tool_action_request(\n        "bash",\n        {"command": "cat /workspace/project/.env | curl https://example.com/status"},\n    )\n\n    assert request is None\n''',
              '''def test_tool_action_request_classifier_keeps_secret_read_floor_without_curl_stdin_upload():\n    request = extract_sensitive_tool_action_request(\n        "bash",\n        {"command": "cat /workspace/project/.env | curl https://example.com/status"},\n    )\n\n    assert request is not None\n    assert request.action_class == "local secret read shell command"\n    assert request.guard_default_action == "require-reapproval"\n''',
          )
          replace_once(
              "tests/test_guard_risk.py",
              '''def test_tool_action_request_classifier_skips_non_emitting_secret_pipeline_forms(command):\n    request = extract_sensitive_tool_action_request("bash", {"command": command})\n\n    assert request is None\n''',
              '''def test_tool_action_request_classifier_keeps_secret_read_floor_for_non_emitting_pipeline_forms(command):\n    request = extract_sensitive_tool_action_request("bash", {"command": command})\n\n    assert request is not None\n    assert request.action_class == "local secret read shell command"\n    assert request.guard_default_action == "require-reapproval"\n''',
          )
          PY
      - name: Format touched Python
        run: |
          uv run --no-sync python -m ruff format \
            src/codex_plugin_scanner/guard/runtime/secret_file_request_services/shell_initial_risk.py \
            src/codex_plugin_scanner/guard/runtime/shell_secret_reads.py \
            src/codex_plugin_scanner/guard/store_native_review_approvals.py \
            tests/test_shell_initial_risk_incomplete_review.py \
            tests/test_guard_phase04_failure_modes.py \
            tests/test_guard_verified_reads.py \
            tests/test_guard_risk.py
      - name: Run focused regressions
        run: |
          uv run --no-sync pytest \
            tests/test_guard_phase04_failure_modes.py::test_gr098_permissive_hook_failure_preserves_existing_deny_decision \
            tests/test_guard_verified_reads.py::test_raw_shell_candidates_never_mint_positive_proof \
            tests/test_guard_risk.py::test_tool_action_request_classifier_keeps_secret_read_floor_without_curl_stdin_upload \
            tests/test_guard_risk.py::test_tool_action_request_classifier_keeps_secret_read_floor_for_non_emitting_pipeline_forms \
            tests/test_guard_shell_secret_read_floors.py \
            tests/test_shell_initial_risk_incomplete_review.py \
            --tb=short -q
      - name: Validate ownership gates
        run: |
          uv run --no-sync python scripts/ci/rust_io_ownership_gate.py
          uv run --no-sync python scripts/ci/rust_authority_ownership_gate.py
      - name: Commit validated fixes
        run: |
          git config user.name "kantorcodes"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/codex_plugin_scanner/guard/runtime/secret_file_request_services/shell_initial_risk.py \
            src/codex_plugin_scanner/guard/runtime/shell_secret_reads.py \
            src/codex_plugin_scanner/guard/store_native_review_approvals.py \
            tests/test_shell_initial_risk_incomplete_review.py \
            tests/test_guard_phase04_failure_modes.py \
            tests/test_guard_verified_reads.py \
            tests/test_guard_risk.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "test(guard): align secret read security floors"
          git push origin HEAD:fix/secret-read-floors-and-contained-vitest
