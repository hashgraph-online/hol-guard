name: CI Windows shim admin
description: Replay the Windows package-shim admin vectors and run the native shim op on a real Windows host.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version: "3.12"
    - name: Stage trust bindings the native build embeds
      shell: pwsh
      run: |
        python scripts/refresh_extension_artifacts.py --trust-only
        if ($LASTEXITCODE -ne 0) {
          throw "Staging Windows native trust bindings failed with exit code $LASTEXITCODE"
        }
    - uses: ./.github/actions/setup-rust
    - name: Replay the recorded Windows shim vectors
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        $env:SHIM_VECTOR_ROOT_BASE = Join-Path $env:RUNNER_TEMP 'shim-vectors'
        New-Item -ItemType Directory -Force $env:SHIM_VECTOR_ROOT_BASE | Out-Null
        cargo test --manifest-path rust/Cargo.toml --locked -p guard-command --test shim_admin_vectors
    - name: Install and report shims through the native op on Windows
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        cargo test --manifest-path rust/Cargo.toml --locked -p hol-guard-runtime --bin hol-guard-runtime shim_op
