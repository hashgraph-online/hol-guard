name: PR2870 read-only debugging sources

on:
  push:
    branches:
      - fix/secret-read-floors-and-contained-vitest
    paths:
      - .github/workflows/pr2870-finalize.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - name: Export tracked source snapshots for offline debugging
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr2870-debug
          git archive --format=tar.gz HEAD > /tmp/pr2870-debug/head.tar.gz
          git archive --format=tar.gz origin/main > /tmp/pr2870-debug/main.tar.gz
          base=$(git merge-base HEAD origin/main)
          git archive --format=tar.gz "$base" > /tmp/pr2870-debug/base.tar.gz
          printf 'head=%s\nmain=%s\nbase=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse origin/main)" "$base" > /tmp/pr2870-debug/refs.txt
          git diff "$base" HEAD > /tmp/pr2870-debug/pr.patch
      - name: Download public Python test dependencies for offline debugging
        run: |
          python -m pip download --only-binary=:all: --dest /tmp/pr2870-debug/wheels '.[dev]'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr2870-debug-sources
          path: /tmp/pr2870-debug
          if-no-files-found: error
          retention-days: 1
