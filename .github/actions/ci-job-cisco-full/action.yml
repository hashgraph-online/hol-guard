name: CI cisco-full
description: Run the cisco-full checks inside the existing CI job.
runs:
  using: composite
  steps:
  - name: Download this run's current command projections
    uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
    with:
      name: pytest-native-command-projections
      path: .
  - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
    with:
      python-version: '3.13'
  - name: Set up uv
    id: setup-uv-primary
    continue-on-error: true
    uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
    with:
      version: 0.9.26
      enable-cache: true
      cache-dependency-glob: ${{ env.CI_UV_CACHE_DEPENDENCY_GLOB }}
      cache-suffix: cisco
  - name: Retry uv setup after transient download failure
    if: steps.setup-uv-primary.outcome == 'failure'
    uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
    with:
      version: 0.9.26
      enable-cache: true
      cache-dependency-glob: ${{ env.CI_UV_CACHE_DEPENDENCY_GLOB }}
      cache-suffix: cisco
  - run: python3.13 -m pip install --dry-run --no-deps --require-hashes -r docker-requirements.txt
    shell: bash
  - run: uv sync --frozen --no-dev --group ci-test --extra cisco --group cisco-mcp --python 3.13
    shell: bash
  - run: uv run --no-sync pytest tests/test_cisco_install_surfaces.py tests/test_mcp_security.py tests/test_cli.py tests/test_action_runner.py
      tests/test_live_cisco_smoke.py --tb=short
    shell: bash
