name: Generate remaining Local Managed Controls batches v2

on:
  push:
    branches:
      - managed-controls/program-bootstrap
    paths:
      - '.github/workflows/managed-controls-program-bootstrap-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: managed-controls-local-program-bootstrap-v2
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: managed-controls/program-bootstrap
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Generate and push task branches
        run: |
          python - <<'PY'
          from __future__ import annotations

          import importlib.util
          from pathlib import Path

          path = Path('.github/scripts/generate_managed_controls_batches.py')
          spec = importlib.util.spec_from_file_location('managed_controls_batches', path)
          if spec is None or spec.loader is None:
              raise SystemExit('Unable to load Managed Controls generator')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          def safe_ensure_package() -> None:
              module.write(
                  module.PACKAGE / '__init__.py',
                  '"""Release 3.0 Extension-First Managed Controls contracts."""',
              )
              module.write(
                  module.TESTS / '__init__.py',
                  '"""Managed Controls conformance tests."""',
              )

          module.ensure_package = safe_ensure_package
          module.main()
          PY
