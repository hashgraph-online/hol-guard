name: MDM Cloud integration lab

on:
  pull_request:
    branches: [release/3.0]
    paths:
      - "src/codex_plugin_scanner/guard/mdm/**"
      - "scripts/mdm/**"
      - "tests/test_guard_mdm_cloud_*.py"
      - "docs/guard/mdm-cloud-integration-lab-*.md"
      - "docs/guard/schemas/mdm-cloud-*.json"
      - ".github/workflows/mdm-cloud-integration-lab.yml"
  push:
    branches: [release/3.0]
    paths:
      - "src/codex_plugin_scanner/guard/mdm/**"
      - "scripts/mdm/**"
      - "tests/test_guard_mdm_cloud_*.py"
      - "docs/guard/mdm-cloud-integration-lab-*.md"
      - "docs/guard/schemas/mdm-cloud-*.json"
      - ".github/workflows/mdm-cloud-integration-lab.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: mdm-cloud-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-policy-activation:
    name: Native policy activation assertions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
          save-cache: false
      - name: Install locked test dependencies
        run: uv sync --frozen --extra dev --python 3.12
      - name: Build native candidate from the selected source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          export HOL_GUARD_BUILD_SHA="$GITHUB_SHA"
          export HOL_GUARD_PACKAGE_VERSION="$(uv run --no-sync python scripts/sync_repo_version.py --check)"
          cd rust
          cargo build --locked --release -p hol-guard-runtime
      - name: Require native publication and first admission assertions
        env:
          HOL_GUARD_NATIVE: force
          HOL_GUARD_NATIVE_BINARY: ${{ github.workspace }}/rust/target/release/hol-guard-runtime
          PYTHONPATH: src
        run: |
          test -x "$HOL_GUARD_NATIVE_BINARY"
          mkdir -p artifacts/native-policy-activation
          uv run --no-sync pytest -q -m slow \
            tests/test_native_cloud_policy_resident.py \
            tests/test_native_scoped_policy_resident.py \
            --junitxml=artifacts/native-policy-activation/results.xml
      - name: Validate bounded native assertion evidence
        if: always()
        run: |
          uv run --no-sync python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          directory = Path('artifacts/native-policy-activation')
          directory.mkdir(parents=True, exist_ok=True)
          result = directory / 'results.xml'
          cases = list(ET.parse(result).getroot().iter('testcase')) if result.is_file() else []
          expected = {
              'test_first_action_after_publish_uses_the_signed_default[1]',
              'test_first_action_after_publish_uses_the_signed_default[2]',
              'test_signed_exact_policy_is_consumed_by_actual_resident[canonical]',
              'test_signed_exact_policy_is_consumed_by_actual_resident[memory]',
          }
          passed = len(cases) == len(expected) and {case.get('name') for case in cases} == expected and all(
              all(case.find(tag) is None for tag in ('skipped', 'failure', 'error'))
              for case in cases
          )
          clean = subprocess.run(
              ['git', 'status', '--porcelain', '--untracked-files=no'],
              check=True, capture_output=True, text=True,
          ).stdout.strip() == ''
          source = subprocess.run(
              ['git', 'rev-parse', 'HEAD'], check=True, capture_output=True, text=True,
          ).stdout.strip()
          clean = clean and source == os.environ['GITHUB_SHA']
          binary = Path('rust/target/release/hol-guard-runtime')
          passed = passed and clean and binary.is_file()
          report = {
              'schema': 'native-policy-activation-proof.v1',
              'sourceSha': os.environ['GITHUB_SHA'],
              'runtime': 'github-hosted-linux',
              'boundary': 'built native runtime with source integration tests',
              'installedWheelCertification': 'not-evaluated',
              'scopedFeatureNegotiation': 'test-only; production advertisement not evaluated',
              'status': 'pass' if passed else 'fail',
              'assertionCount': len(cases),
              'allAssertionsPassed': passed,
              'exactCleanSourceVerified': clean,
              'binarySha256': hashlib.sha256(binary.read_bytes()).hexdigest() if binary.is_file() else None,
          }
          (directory / 'proof.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report))
          assert passed, 'Native activation requires all four expected assertions to execute and pass against exact clean source.'
          PY
      - name: Retain native assertion evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-policy-activation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/native-policy-activation/proof.json
          if-no-files-found: error
          retention-days: 30

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HOL_MDM_LAB_PROJECT: mdm-cloud-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Set up uv
        id: setup-uv-primary
        continue-on-error: true
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
          save-cache: false
      - name: Retry uv setup after transient download failure
        if: steps.setup-uv-primary.outcome == 'failure'
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
          save-cache: false
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Generate an ephemeral MDM lab admin token
        shell: bash
        run: |
          token="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$token"
          echo "HOL_MDM_LAB_ADMIN_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Run focused contracts, persistence, and real-HTTP restart tests
        run: |
          uv run --no-sync pytest -q -ra --override-ini="addopts=" \
            tests/test_guard_mdm_cloud_control.py \
            tests/test_guard_mdm_cloud_hardening.py \
            tests/test_guard_mdm_cloud_schemas.py \
            tests/test_guard_mdm_cloud_lab_registration.py \
            tests/test_guard_mdm_cloud_lab_integration.py
      - name: Lint and format MDM Cloud hardening surfaces
        run: |
          uv run --no-sync ruff check \
            src/codex_plugin_scanner/guard/mdm/cloud_control.py \
            scripts/mdm/cloud-lab \
            scripts/mdm/run-cloud-integration-lab.py \
            tests/test_guard_mdm_cloud_control.py \
            tests/test_guard_mdm_cloud_hardening.py \
            tests/test_guard_mdm_cloud_lab_registration.py \
            tests/test_guard_mdm_cloud_lab_integration.py
          uv run --no-sync ruff format --check \
            src/codex_plugin_scanner/guard/mdm/cloud_control.py \
            scripts/mdm/cloud-lab \
            scripts/mdm/run-cloud-integration-lab.py \
            tests/test_guard_mdm_cloud_control.py \
            tests/test_guard_mdm_cloud_hardening.py \
            tests/test_guard_mdm_cloud_lab_registration.py \
            tests/test_guard_mdm_cloud_lab_integration.py
      - name: Validate Compose model
        run: |
          docker compose \
            --project-name "$HOL_MDM_LAB_PROJECT" \
            --file scripts/mdm/cloud-lab/docker-compose.yml \
            config --quiet
      - name: Run standalone multi-device Docker lab with process restart
        run: |
          mkdir -p artifacts/mdm-cloud-lab
          uv run --no-sync python scripts/mdm/run-cloud-integration-lab.py \
            --project "$HOL_MDM_LAB_PROJECT" \
            --artifacts artifacts/mdm-cloud-lab
      - name: Validate report checksum and native boundary
        run: |
          uv run --no-sync python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          report_path = Path('artifacts/mdm-cloud-lab/mdm-cloud-integration-report.json')
          checksum_path = Path('artifacts/mdm-cloud-lab/mdm-cloud-integration-report.json.sha256')
          report = json.loads(report_path.read_text())
          expected = checksum_path.read_text().split()[0]
          assert hashlib.sha256(report_path.read_bytes()).hexdigest() == expected
          assert report['schemaVersion'] == 'hol-guard-mdm-cloud-integration-lab.v1'
          assert report['healthy'] is True
          assert report['stepCount'] >= 50
          assert report['nativeCertification']['outcome'] == 'not-evaluated'
          assert all(step['passed'] is True for step in report['steps'])
          PY
      - name: Trivy scan MDM lab image and configuration
        run: |
          docker run --rm -v "$PWD:/workdir" \
            aquasec/trivy@sha256:85e87be1a96459c38a4eea47dc64eb2d342bb14cd4b4cef96adcf6ff03378b7c \
            fs --scanners misconfig,secret --severity HIGH,CRITICAL \
            --exit-code 1 --quiet /workdir/scripts/mdm/cloud-lab
      - name: Collect bounded Compose logs on failure
        if: failure()
        run: |
          mkdir -p artifacts/mdm-cloud-lab
          docker compose \
            --project-name "$HOL_MDM_LAB_PROJECT" \
            --file scripts/mdm/cloud-lab/docker-compose.yml \
            logs --no-color --tail 1000 > artifacts/mdm-cloud-lab/workflow-compose.log 2>&1 || true
      - name: Upload MDM Cloud lab evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mdm-cloud-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mdm-cloud-lab
          if-no-files-found: error
          retention-days: 30
      - name: Tear down lab
        if: always()
        run: |
          docker compose \
            --project-name "$HOL_MDM_LAB_PROJECT" \
            --file scripts/mdm/cloud-lab/docker-compose.yml \
            down --volumes --remove-orphans || true
