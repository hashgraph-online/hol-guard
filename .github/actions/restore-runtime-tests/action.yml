name: Restore exact runtime test executables
description: Reuse compilation only; all workspace test partitions still execute their tests.
inputs:
  partition:
    description: Workspace test partition archive family (runtime, command, or core).
    default: runtime
outputs:
  cache-hit:
    description: Whether the complete exact-input archive was restored.
    value: ${{ steps.archive.outputs.cache-hit }}
  cache-primary-key:
    description: Exact archive key, for the trusted main writer only.
    value: ${{ steps.archive.outputs.cache-primary-key }}
runs:
  using: composite
  steps:
    - name: Stage the native trust inputs before hashing
      shell: bash
      run: python3 scripts/refresh_extension_artifacts.py --trust-only
    - name: Identify the runtime test build environment
      id: environment
      shell: bash
      env:
        ARCHIVE_PARTITION: ${{ inputs.partition }}
      run: |
        echo "image=${ImageOS:?}" >> "$GITHUB_OUTPUT"
        if [ "${ARCHIVE_PARTITION}" != "runtime" ]; then
          echo "partition=${ARCHIVE_PARTITION}-" >> "$GITHUB_OUTPUT"
        else
          echo "partition=" >> "$GITHUB_OUTPUT"
        fi
        python3 -m scripts.ci.native_cache_environment >> "$GITHUB_OUTPUT"
    - name: Identify the selected package inputs
      id: inputs
      shell: bash
      env:
        ARCHIVE_PARTITION: ${{ inputs.partition }}
      run: python3 -m scripts.ci.rust_test_archive_inputs --partition "$ARCHIVE_PARTITION" >> "$GITHUB_OUTPUT"
    - name: Restore the exact runtime test archive
      id: archive
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ runner.temp }}/runtime-test-archive.tar.zst
        # No prefix fallback: source, compiler, profile and runner must all match.
        # Hash every local dependency kind and shared source, plus the existing
        # global metadata/contracts/fixtures. Unrelated package source edits do
        # not discard complete test binaries for another package group.
        key: runtime-test-archive-v3-${{ steps.environment.outputs.partition }}${{ runner.arch }}-${{ steps.environment.outputs.image }}-${{ steps.environment.outputs.compiler-env }}-lto-${{ env.CARGO_PROFILE_RELEASE_LTO }}-cgu-${{ env.CARGO_PROFILE_RELEASE_CODEGEN_UNITS }}-${{ steps.inputs.outputs.digest }}
