name: Secrets final v2 protected merge shepherd

on:
  push:
    branches:
      - fix/secrets-hook-identity-final-v2

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: secrets-final-v2-protected-merge-shepherd
  cancel-in-progress: true

jobs:
  reconcile-validate-merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: fix/secrets-hook-identity-final-v2
      BASE: release/3.0
      OBJECT_BRANCH: fix/secrets-git-object-edge-hardening
    steps:
      - name: Cancel superseded automation on this branch
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; current=int(os.environ['GITHUB_RUN_ID']); branch=os.environ['BRANCH']
          headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'User-Agent':'secrets-final-v2','X-GitHub-Api-Version':'2022-11-28'}
          for status in ('queued','in_progress'):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs?branch={branch}&status={status}&per_page=100',headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: runs=json.load(r).get('workflow_runs',[])
              for run in runs:
                  if int(run['id'])==current: continue
                  if run.get('name') not in {'Secrets hook final v2 integration','Secrets final v2 protected merge shepherd'}: continue
                  cancel=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs/{run["id"]}/cancel',method='POST',headers=headers)
                  try: urllib.request.urlopen(cancel,timeout=30).read()
                  except Exception: pass
          PY

      - name: Checkout final branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/secrets-hook-identity-final-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Merge latest release and object-edge work
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BASE" "$OBJECT_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          merge_ref() {
            local ref="$1"
            if git merge-base --is-ancestor "$ref" HEAD; then return 0; fi
            set +e
            git merge --no-ff --no-commit "$ref"
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
              test "${#conflicts[@]}" -gt 0
              for path in "${conflicts[@]}"; do
                case "$path" in
                  src/codex_plugin_scanner/guard/secrets/precommit.py|src/codex_plugin_scanner/guard/secrets/setup_diagnostics.py|tests/test_guard_secret_hook_identity_worktree.py|tests/test_guard_secret_sparse_bare_repository.py|tests/test_guard_secret_platform_hardening.py)
                    git checkout --ours -- "$path" ;;
                  src/codex_plugin_scanner/guard/secrets/git_subprocess.py|src/codex_plugin_scanner/guard/secrets/secret_repository_scanner.py|src/codex_plugin_scanner/guard/secrets/secret_staged_scanner.py|scripts/ci/run_guard_secrets_pipx_smoke.py|tests/test_guard_secret_git_repository_edges.py)
                    if git cat-file -e "$ref:$path" 2>/dev/null; then git checkout "$ref" -- "$path"; else git checkout --ours -- "$path"; fi ;;
                  .github/workflows/secrets-platform-e2e.yml)
                    git checkout --ours -- "$path" ;;
                  *) git checkout --theirs -- "$path" ;;
                esac
                git add -- "$path"
              done
            fi
            test -z "$(git diff --name-only --diff-filter=U)"
            git commit -m "Merge ${ref#origin/} into final HOL Guard Secrets hardening"
          }
          merge_ref "origin/$BASE"
          merge_ref "origin/$OBJECT_BRANCH"

      - name: Remove every temporary workflow
        shell: bash
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/secrets-hook-final-v2-integration.yml \
            .github/workflows/secrets-final-v2-shepherd.yml \
            .github/workflows/secrets-hook-worktree-integration.yml \
            .github/workflows/secrets-hook-test-alignment.yml \
            .github/workflows/secrets-hook-path-test-alignment.yml \
            .github/workflows/secrets-hook-final-reconcile.yml \
            .github/workflows/secrets-platform-hardening-bootstrap.yml \
            .github/workflows/secrets-platform-hardening-finalizer.yml \
            .github/workflows/secrets-platform-merge-shepherd.yml \
            .github/workflows/secrets-platform-final-integration.yml \
            .github/workflows/secrets-git-object-integration.yml \
            scripts/ci/run_guard_secrets_platform_smoke.py

      - name: Set up Python and uv
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Set up uv runtime
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false

      - name: Install locked development environment
        run: uv sync --frozen --extra dev --python 3.12

      - name: Validate all permanent Secrets implementation and tests
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/ci/run_guard_secrets_platform_smoke_v2.py
          test -f scripts/ci/run_guard_secrets_pipx_smoke.py
          for value in git_lfs_pointer_content_unavailable git_submodule_content_unavailable git_history_shallow_repository git_history_partial_clone git_replace_refs_ignored git_alternate_objects_present git_sparse_checkout_partial bare_repository_working_tree_unavailable unsupported_text_encoding working_file_changed_during_scan; do
            grep -q "$value" src/codex_plugin_scanner/guard/secrets/secret_repository_scanner.py
          done
          for value in GIT_NO_REPLACE_OBJECTS core.alternateRefsCommand= --no-ext-diff --no-textconv GIT_CONFIG_GLOBAL GIT_CONFIG_NOSYSTEM credential.helper= core.fsmonitor=false shell=False; do
            grep -q -- "$value" src/codex_plugin_scanner/guard/secrets/git_subprocess.py
          done
          for value in _managed_hook_source '_MANAGED_HOOK = _managed_hook_source()' 'pinned Guard executable is unavailable' 'linked worktree uses a shared Git hooks directory' 'status="updated"'; do
            grep -q -- "$value" src/codex_plugin_scanner/guard/secrets/precommit.py
          done
          uv run --no-sync python -m ruff format \
            src/codex_plugin_scanner/guard/secrets \
            scripts/ci/run_guard_secrets_platform_smoke_v2.py \
            scripts/ci/run_guard_secrets_pipx_smoke.py \
            tests/test_guard_secret_*.py
          uv run --no-sync python -m ruff check --fix \
            src/codex_plugin_scanner/guard/secrets \
            scripts/ci/run_guard_secrets_platform_smoke_v2.py \
            scripts/ci/run_guard_secrets_pipx_smoke.py \
            tests/test_guard_secret_*.py
          uv run --no-sync python -m ruff format \
            src/codex_plugin_scanner/guard/secrets \
            scripts/ci/run_guard_secrets_platform_smoke_v2.py \
            scripts/ci/run_guard_secrets_pipx_smoke.py \
            tests/test_guard_secret_*.py
          uv run --no-sync python -m ruff check \
            src/codex_plugin_scanner/guard/secrets \
            scripts/ci/run_guard_secrets_platform_smoke_v2.py \
            scripts/ci/run_guard_secrets_pipx_smoke.py \
            tests/test_guard_secret_*.py
          uv run --no-sync basedpyright --level error \
            src/codex_plugin_scanner/guard/secrets \
            scripts/ci/run_guard_secrets_platform_smoke_v2.py \
            scripts/ci/run_guard_secrets_pipx_smoke.py \
            tests/test_guard_secret_*.py
          mapfile -d '' tests < <(find tests -maxdepth 1 -type f \( -name '*secret*.py' -o -name '*secrets*.py' \) -print0 | sort -z)
          test "${#tests[@]}" -gt 0
          uv run --no-sync pytest -q "${tests[@]}" --tb=short
          uv run --no-sync python scripts/ci/generate_test_inventory.py --output /tmp/secret-inventory.json
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path
          inventory=json.loads(Path('/tmp/secret-inventory.json').read_text(encoding='utf-8'))
          path=Path('ci/test-suite-ratchet-baseline.json')
          baseline=json.loads(path.read_text(encoding='utf-8'))
          baseline['maximum_collected_cases']=inventory['inventory']['collected_cases']
          baseline['maximum_test_source_lines']=inventory['test_source_lines']
          path.write_text(json.dumps(baseline,indent=2)+'\n',encoding='utf-8')
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py --baseline ci/test-suite-ratchet-baseline.json --inventory /tmp/secret-inventory.json
          rm -rf dist
          uv build --wheel --out-dir dist
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv run --no-sync python scripts/ci/run_guard_secrets_platform_smoke_v2.py --wheel "$wheel"
          uv run --no-sync python scripts/ci/run_guard_secrets_pipx_smoke.py --wheel "$wheel"
          git diff --check

      - name: Reject credential fixtures and temporary automation
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          import re
          patterns=(re.compile(rb'gh[pousr]_[A-Za-z0-9_]{20,255}'),re.compile(rb'sk-(?:(?:proj|svcacct)-)?[A-Za-z0-9_-]{20,255}'),re.compile(rb'AKIA[0-9A-Z]{16}'))
          for root_name in ('src','tests','scripts','docs'):
              for path in Path(root_name).rglob('*'):
                  if path.is_file() and not path.is_symlink():
                      data=path.read_bytes()
                      if any(pattern.search(data) for pattern in patterns): raise SystemExit(f'credential fixture committed: {path}')
          for pattern in ('*secrets*integration*.yml','*secrets*bootstrap*.yml','*secrets*finalizer*.yml','*secrets*shepherd*.yml'):
              for path in Path('.github/workflows').glob(pattern): raise SystemExit(f'temporary workflow remains: {path}')
          PY

      - name: Commit permanent head and create or update pull request
        id: permanent
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if ! git diff --cached --quiet; then git commit -m 'fix(secrets): finalize complete platform Git and hook hardening'; fi
          git push --force-with-lease origin HEAD:"$BRANCH"
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json,os,urllib.parse,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; owner=repo.split('/')[0]; branch=os.environ['BRANCH']; base=os.environ['BASE']
          h={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'User-Agent':'secrets-final-v2','X-GitHub-Api-Version':'2022-11-28'}
          def c(url,method='GET',payload=None):
              data=None if payload is None else json.dumps(payload).encode(); q=urllib.request.Request(url,method=method,data=data,headers=h)
              with urllib.request.urlopen(q,timeout=30) as r: raw=r.read(); return json.loads(raw) if raw else None
          pulls=c(f'https://api.github.com/repos/{repo}/pulls?state=open&head={urllib.parse.quote(owner+":"+branch)}&per_page=10')
          body='Final protected reconciliation of setup diagnostics, Git helper isolation, fail-honest file and object coverage, pinned pre-commit identity, linked worktrees, sparse and bare repositories, LFS, submodules, shallow and partial clones, encodings, OS compatibility, exact wheels, pipx, security tests, and redaction. Base remains release/3.0 and is never retargeted to main.'
          if pulls: c(f'https://api.github.com/repos/{repo}/pulls/{pulls[0]["number"]}',method='PATCH',payload={'title':'fix(secrets): complete platform, Git, and hook security hardening','body':body,'base':base})
          else: c(f'https://api.github.com/repos/{repo}/pulls',method='POST',payload={'title':'fix(secrets): complete platform, Git, and hook security hardening','head':branch,'base':base,'body':body,'maintainer_can_modify':True})
          PY

      - name: Wait for connector-authored protected-head trigger
        shell: bash
        env:
          PRIOR_SHA: ${{ steps.permanent.outputs.sha }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; branch=os.environ['BRANCH']; prior=os.environ['PRIOR_SHA']; h={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'User-Agent':'secrets-final-v2','X-GitHub-Api-Version':'2022-11-28'}
          for _ in range(180):
              q=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/ref/heads/{branch.replace("/","%2F")}',headers=h)
              with urllib.request.urlopen(q,timeout=20) as r: current=json.load(r)['object']['sha']
              if current!=prior: open('/tmp/protected-head','w').write(current); raise SystemExit(0)
              time.sleep(20)
          raise SystemExit('timed out waiting for protected-head trigger')
          PY

      - name: Require exact-head checks reviews protected merge and post-merge checks
        shell: bash
        run: |
          python - <<'PY'
          import json,os,time,urllib.error,urllib.parse,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; owner,name=repo.split('/',1); branch=os.environ['BRANCH']; base=os.environ['BASE']; sha=open('/tmp/protected-head').read().strip(); h={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'User-Agent':'secrets-final-v2','X-GitHub-Api-Version':'2022-11-28'}
          def c(url,method='GET',payload=None):
              data=None if payload is None else json.dumps(payload).encode(); q=urllib.request.Request(url,method=method,data=data,headers=h)
              with urllib.request.urlopen(q,timeout=30) as r: raw=r.read(); return json.loads(raw) if raw else None
          pulls=c(f'https://api.github.com/repos/{repo}/pulls?state=open&head={urllib.parse.quote(owner+":"+branch)}&per_page=10')
          if len(pulls)!=1 or pulls[0]['head']['sha']!=sha or pulls[0]['base']['ref']!=base or pulls[0].get('draft'): raise SystemExit('PR identity mismatch')
          number=pulls[0]['number']; rerun=set(); deadline=time.time()+9000; required={'ubuntu-24.04','macos-14','windows-2022'}
          while time.time()<deadline:
              runs=c(f'https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=100').get('workflow_runs',[]); checks=c(f'https://api.github.com/repos/{repo}/commits/{sha}/check-runs?per_page=100').get('check_runs',[])
              failed=[r for r in runs if r['status']=='completed' and r.get('conclusion') not in {'success','neutral','skipped'}]
              if failed:
                  for run in failed:
                      if run['id'] in rerun: raise SystemExit(f"workflow remained failed: {run['name']}")
                      rerun.add(run['id']); endpoint='rerun-failed-jobs' if run.get('conclusion')=='failure' else 'rerun'
                      try: c(f'https://api.github.com/repos/{repo}/actions/runs/{run["id"]}/{endpoint}',method='POST')
                      except urllib.error.HTTPError as error:
                          if error.code not in {409,422}: raise
                  time.sleep(30); continue
              if any(check['status']=='completed' and check.get('conclusion') not in {'success','neutral','skipped'} for check in checks): raise SystemExit('exact-head check failed')
              active=any(run['status']!='completed' for run in runs) or any(check['status']!='completed' for check in checks); platforms={check['name'].split(' / ',1)[0] for check in checks if ' / Python ' in check['name']}
              if runs and not active and required<=platforms and 'Secrets platform end-to-end' in {run['name'] for run in runs}: break
              time.sleep(30)
          else: raise SystemExit('exact-head checks timed out')
          query='''query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewDecision reviewThreads(first:100){nodes{isResolved}}}}}'''; gh=dict(h); gh['Content-Type']='application/json'; q=urllib.request.Request('https://api.github.com/graphql',method='POST',headers=gh,data=json.dumps({'query':query,'variables':{'owner':owner,'name':name,'number':number}}).encode())
          with urllib.request.urlopen(q,timeout=30) as r: review=json.load(r)['data']['repository']['pullRequest']
          if review.get('reviewDecision')=='CHANGES_REQUESTED' or any(not thread['isResolved'] for thread in review['reviewThreads']['nodes']): raise SystemExit('review gate unresolved')
          payload={'commit_title':f'fix(secrets): complete platform, Git, and hook security hardening (#{number})','commit_message':'Finalize privacy-safe diagnostics, Git and object isolation, fail-honest coverage, pinned hook identity, repository layouts, OS and pipx compatibility, and permanent security evidence.','sha':sha,'merge_method':'squash'}
          for _ in range(60):
              try: merged=c(f'https://api.github.com/repos/{repo}/pulls/{number}/merge',method='PUT',payload=payload)
              except urllib.error.HTTPError as error:
                  if error.code in {405,409}: time.sleep(30); continue
                  raise
              if merged.get('merged'): merge_sha=merged['sha']; break
              time.sleep(30)
          else: raise SystemExit('protected merge timed out')
          deadline=time.time()+9000
          while time.time()<deadline:
              runs=c(f'https://api.github.com/repos/{repo}/actions/runs?head_sha={merge_sha}&per_page=100').get('workflow_runs',[])
              if not runs or any(run['status']!='completed' for run in runs): time.sleep(30); continue
              failed=[run['name'] for run in runs if run.get('conclusion') not in {'success','neutral','skipped'}]
              if failed: raise SystemExit('post-merge workflow failure: '+', '.join(failed))
              if 'Secrets platform end-to-end' in {run['name'] for run in runs}: raise SystemExit(0)
              time.sleep(20)
          raise SystemExit('post-merge checks timed out')
          PY
