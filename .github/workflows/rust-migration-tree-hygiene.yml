name: Rust migration tree hygiene

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/**"
      - "scripts/ci/**"
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "scripts/ci/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-migration-tree-hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Self-test the residue detector
        run: python3 scripts/ci/rust_migration_tree_hygiene.py --self-test
      - name: Reject retired migration delivery artifacts
        run: python3 scripts/ci/rust_migration_tree_hygiene.py --root .
