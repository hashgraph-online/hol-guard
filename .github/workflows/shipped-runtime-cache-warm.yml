name: Warm shipped runtime cache

on:
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'contributions/**'
      - 'contracts/**'
      - 'spec/**'
      - 'src/codex_plugin_scanner/guard/contracts/**'
      - '.cargo/**'
      - 'scripts/refresh_extension_artifacts.py'
      - 'scripts/ci/native_cache_environment.py'
      - '.github/actions/setup-rust/**'
      - '.github/actions/ci-job-native-release-size/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/shipped-runtime-cache-warm.yml'

permissions:
  contents: read

# Cold fat-LTO work must not delay the other native cache producers.
concurrency:
  group: shipped-runtime-cache-warm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: shipped-native-ci-build-${{ github.sha }}-linux
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-job-native-release-size
