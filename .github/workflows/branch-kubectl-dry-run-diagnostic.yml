name: Branch kubectl dry-run diagnostic

on:
  push:
    branches:
      - fix/docker-kubernetes-command-coverage

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/docker-kubernetes-command-coverage
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Print command matcher diagnostics
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          from codex_plugin_scanner.guard.runtime.command_extensions import BUILT_IN_COMMAND_EXTENSION_REGISTRY
          from codex_plugin_scanner.guard.runtime.command_model import parse_shell_command
          from codex_plugin_scanner.guard.runtime.command_option_parsing import argument_semantics
          from codex_plugin_scanner.guard.runtime.command_rules import ExecutableMatcher, _after_leading_options, _without_options

          commands = [
              'kubectl autoscale deployment api --min=2 --max=4 --dry-run=server',
              'kubectl replace --force -f deployment.yaml --dry-run=server',
              'kubectl run debug --image=alpine --dry-run=client',
              'kubectl.exe drain node-a --dry-run=server',
          ]
          root = Path.cwd()
          for command in commands:
              canonical = parse_shell_command(command, cwd=root, home_dir=root)
              segment = canonical.segments[0]
              print('COMMAND', command)
              print('NORMALIZED', canonical.normalized_text)
              print('SEGMENT', repr(segment))
              print('TOKENS', segment.tokens)
              print('ARGUMENTS', segment.arguments)
              for extension in BUILT_IN_COMMAND_EXTENSION_REGISTRY.extensions:
                  for rule in extension.rules:
                      if rule.matcher is None or not rule.matcher.match(canonical):
                          continue
                      print('RULE', rule.rule_id)
                      for variant in rule.safe_variants:
                          print('VARIANT', variant.variant_id, 'MATCH', variant.matcher.match(canonical), 'REPR', repr(variant.matcher))
                          matcher = variant.matcher
                          leaves = matcher.matchers if hasattr(matcher, 'matchers') else (matcher,)
                          for leaf in leaves:
                              if not isinstance(leaf, ExecutableMatcher):
                                  continue
                              args = tuple(arg.lower() for arg in segment.arguments)
                              subargs = _without_options(args, leaf.interspersed_options_with_values, leaf.interspersed_flags)
                              if leaf.allow_leading_options:
                                  subargs = _after_leading_options(subargs, leaf.leading_options_with_values, leaf.interspersed_flags)
                              flagargs = subargs[len(leaf.subcommands):] if leaf.subcommands else subargs
                              semantics = argument_semantics(flagargs, options_with_values=(leaf.options_with_values | leaf.leading_options_with_values | leaf.interspersed_options_with_values), inverse_flag_pairs=leaf.inverse_flag_pairs)
                              print('LEAF', leaf.subcommands, 'ARGS', args, 'SUBARGS', subargs, 'FLAGARGS', flagargs, 'SEMANTICS', semantics, 'REQVALS', leaf.required_option_values, 'REQFLAGS', leaf.required_flags, 'FORBID', leaf.forbidden_flags)
          PY
