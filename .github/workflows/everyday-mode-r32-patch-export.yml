name: Export Everyday Mode release 3.2 product patch

on:
  push:
    branches:
      - feat/everyday-mode-r32-complete-v2

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out immutable trigger commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reconstruct verified product patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            automation/everyday-core-delivery-20260828 \
            release/3.2
          payload_ref=origin/automation/everyday-core-delivery-20260828
          : > "$RUNNER_TEMP/core.patch.gz.b64"
          for part in \
            core-000.b64 core-001.b64 core-002.b64 core-003.b64 \
            core-rem-00.b64 core-rem-01.b64 core-rem-02.b64
          do
            git show "$payload_ref:.github/everyday-payload/$part" >> "$RUNNER_TEMP/core.patch.gz.b64"
          done
          test "$(wc -c < "$RUNNER_TEMP/core.patch.gz.b64")" -eq 155736
          echo '2c89fbef608d80006fad320844d5a59bcf610a884e4013a49db4c316285225aa  '"$RUNNER_TEMP/core.patch.gz.b64" | sha256sum --check
          base64 --decode "$RUNNER_TEMP/core.patch.gz.b64" > "$RUNNER_TEMP/core.patch.gz"
          echo '8aef82d90217e2936a6200099f902815f16f540e865da375c8b2a01ff975d45e  '"$RUNNER_TEMP/core.patch.gz" | sha256sum --check
          gzip --decompress --stdout "$RUNNER_TEMP/core.patch.gz" > "$RUNNER_TEMP/core.patch"
          echo 'b70b55098e1a41e9989921f82e7e013b329822ac1b23d17266f0d67e523a5eda  '"$RUNNER_TEMP/core.patch" | sha256sum --check

      - name: Upload exact verified patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: everyday-mode-r32-product-patch-${{ github.sha }}
          path: ${{ runner.temp }}/core.patch
          retention-days: 1
          if-no-files-found: error

      - name: Diagnose application against current release 3.2
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          exec > >(tee "$RUNNER_TEMP/apply-diagnostic.txt") 2>&1
          git checkout --detach origin/release/3.2
          echo "release_head=$(git rev-parse HEAD)"
          echo '--- git apply --check ---'
          git apply --check "$RUNNER_TEMP/core.patch"
          direct=$?
          echo "direct_status=$direct"
          if [ "$direct" -eq 0 ]; then
            git apply --index "$RUNNER_TEMP/core.patch"
          else
            echo '--- git apply --3way --check ---'
            git apply --3way --check "$RUNNER_TEMP/core.patch"
            threeway=$?
            echo "threeway_status=$threeway"
            if [ "$threeway" -eq 0 ]; then
              git apply --3way --index "$RUNNER_TEMP/core.patch"
            fi
          fi
          echo '--- changed files ---'
          git status --short
          echo '--- patch paths ---'
          git apply --numstat "$RUNNER_TEMP/core.patch" || true
          exit 0

      - name: Upload application diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: everyday-mode-r32-apply-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/apply-diagnostic.txt
          retention-days: 1
          if-no-files-found: warn
