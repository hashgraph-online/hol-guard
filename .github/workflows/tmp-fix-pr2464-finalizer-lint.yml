name: Repair PR 2464 finalizer lint mode

"on":
  pull_request:
    branches:
      - release/3.0
    paths:
      - .github/workflows/tmp-fix-pr2464-finalizer-lint.yml

permissions:
  contents: write

concurrency:
  group: repair-pr-2464-finalizer-lint
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'hashgraph-online/hol-guard' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/rust-daemon-edge-workflow-validation' &&
      github.event.pull_request.base.ref == 'release/3.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/rust-daemon-edge-workflow-validation
          fetch-depth: 2
      - name: Enable deterministic lint fixes and remove this helper
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          branch='fix/rust-daemon-edge-workflow-validation'
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          remote_sha=$(git ls-remote --exit-code origin "refs/heads/${branch}" | awk '{print $1}')
          test "$remote_sha" = "$EXPECTED_HEAD_SHA"
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/tmp-fix-pr2464-windows-inventory.yml')
          text = path.read_text(encoding='utf-8')
          old = '          uv run --no-sync ruff check \\\n'
          new = '          uv run --no-sync ruff check --fix \\\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one lint command, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/tmp-fix-pr2464-finalizer-lint.yml
          git diff --check
          git add .github/workflows/tmp-fix-pr2464-windows-inventory.yml
          git diff --cached --check
          git config user.name 'Michael Kantor'
          git config user.email '6068672+kantorcodes@users.noreply.github.com'
          git commit --signoff -m 'ci: enable deterministic lint fixes in PR 2464 finalizer'
          remote_sha=$(git ls-remote --exit-code origin "refs/heads/${branch}" | awk '{print $1}')
          test "$remote_sha" = "$EXPECTED_HEAD_SHA"
          git push origin "HEAD:refs/heads/${branch}"
