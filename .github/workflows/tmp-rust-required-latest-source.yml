name: Temporary Rust-required latest source snapshot

on:
  push:
    branches:
      - fix/rust-required-no-python-runtime-fallback
    paths:
      - .github/workflows/tmp-rust-required-latest-source.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/rust-required-no-python-runtime-fallback
          fetch-depth: 1
          persist-credentials: false
      - name: Archive exact source
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=.venv --exclude=.uv-cache --exclude=source.tgz -czf "$RUNNER_TEMP/source.tgz" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-required-latest-source-${{ github.sha }}
          path: ${{ runner.temp }}/source.tgz
          if-no-files-found: error
          retention-days: 1
