[pr_reviewer]
extra_instructions = """\
Follow the repository review guidance in AGENTS.md.
The 500-line/file-size maintainability rule applies to source code, not JSON.
Never raise line-count, file-length, oversized-file, or split-the-file findings for *.json files, including declarative command-extension sources, fixtures, generated JSON, schemas, manifests, and contracts.
Continue reviewing JSON for correctness, security, schema validity, trust-boundary mistakes, and unnecessary generated churn.
When a pull request adds or grows *.py code under src/, report one finding asking whether the new runtime logic belongs in Rust under rust/crates/. Do not report tests/, ci/, scripts/, deleted or shrinking Python, thin shims that only call the native runtime, or fixes to existing Python that has no Rust equivalent yet.
"""

[pr_code_suggestions]
extra_instructions = """\
Follow the repository review guidance in AGENTS.md.
Do not suggest splitting or shrinking *.json files solely because of line count or file size.
"""
