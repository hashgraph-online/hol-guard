name: Patch PR 2464 secure fixture repair

on:
  push:
    branches:
      - fix/rust-daemon-edge-workflow-validation
    paths:
      - .github/workflows/tmp-patch-pr2464-repair-v2.yml
  pull_request:
    branches:
      - release/3.0
    paths:
      - .github/workflows/tmp-patch-pr2464-repair-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-pr-2464-secure-fixture-repair
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/rust-daemon-edge-workflow-validation
          fetch-depth: 2
      - name: Preserve the canonical secure filesystem fixture identity
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          branch='fix/rust-daemon-edge-workflow-validation'
          remote_sha=$(git ls-remote --exit-code origin "refs/heads/${branch}" | awk '{print $1}')
          test "$remote_sha" = "$EXPECTED_HEAD_SHA"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/tmp-fix-pr2464-windows-inventory.yml')
          text = path.read_text(encoding='utf-8')
          replacements = (
              (
                  'std::{env::temp_dir as td, io::Write, process::id}',
                  'std::{env::temp_dir as t, io::Write, process::id as p}',
              ),
              (
                  'td().canonicalize().unwrap_or(td()).join(format!("guard-fs-{name}-{}", id()))',
                  't().canonicalize().unwrap_or(t()).join(format!("guard-secure-fs-{}-{}", name, p()))',
              ),
          )
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'unexpected secure fixture anchor count for {old!r}: {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/tmp-patch-pr2464-repair-v2.yml
          git diff --check
          git add -A
          git diff --cached --check
          git config user.name 'Michael Kantor'
          git config user.email '6068672+kantorcodes@users.noreply.github.com'
          git commit --signoff -m 'ci: preserve secure filesystem fixture identity'
          git push origin "HEAD:refs/heads/${branch}"
