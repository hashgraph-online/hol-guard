name: Branch Ruff format

on:
  push:
    branches:
      - fix/docker-kubernetes-command-coverage

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/docker-kubernetes-command-coverage
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            requirements.txt
            docker-requirements.txt
      - run: uv sync --frozen --extra dev --python 3.12
      - run: |
          uv run --no-sync python -m ruff format \
            src/codex_plugin_scanner/guard/runtime/command_common_extension_helpers.py \
            src/codex_plugin_scanner/guard/runtime/command_kubernetes_common_extensions.py
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/codex_plugin_scanner/guard/runtime/command_common_extension_helpers.py \
                  src/codex_plugin_scanner/guard/runtime/command_kubernetes_common_extensions.py
          git commit -m "style: apply Ruff formatting"
          git push origin HEAD:fix/docker-kubernetes-command-coverage
