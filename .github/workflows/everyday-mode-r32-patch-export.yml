name: Export Everyday Mode release 3.2 product patch

on:
  push:
    branches:
      - feat/everyday-mode-r32-complete-v2

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out immutable trigger commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reconstruct verified product patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            automation/everyday-core-delivery-20260828 \
            release/3.2
          payload_ref=origin/automation/everyday-core-delivery-20260828
          : > "$RUNNER_TEMP/core.patch.gz.b64"
          for part in \
            core-000.b64 core-001.b64 core-002.b64 core-003.b64 \
            core-rem-00.b64 core-rem-01.b64 core-rem-02.b64
          do
            git show "$payload_ref:.github/everyday-payload/$part" >> "$RUNNER_TEMP/core.patch.gz.b64"
          done
          test "$(wc -c < "$RUNNER_TEMP/core.patch.gz.b64")" -eq 155736
          echo '2c89fbef608d80006fad320844d5a59bcf610a884e4013a49db4c316285225aa  '"$RUNNER_TEMP/core.patch.gz.b64" | sha256sum --check
          base64 --decode "$RUNNER_TEMP/core.patch.gz.b64" > "$RUNNER_TEMP/core.patch.gz"
          echo '8aef82d90217e2936a6200099f902815f16f540e865da375c8b2a01ff975d45e  '"$RUNNER_TEMP/core.patch.gz" | sha256sum --check
          gzip --decompress --stdout "$RUNNER_TEMP/core.patch.gz" > "$RUNNER_TEMP/core.patch"
          echo 'b70b55098e1a41e9989921f82e7e013b329822ac1b23d17266f0d67e523a5eda  '"$RUNNER_TEMP/core.patch" | sha256sum --check

      - name: Apply to current release 3.2 without publishing
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach origin/release/3.2
          if git apply --check "$RUNNER_TEMP/core.patch"; then
            git apply --index "$RUNNER_TEMP/core.patch"
          else
            git apply --3way --index "$RUNNER_TEMP/core.patch"
          fi
          git diff --cached --check
          if git diff --cached --name-only | grep -E '^\.github/(workflows|scripts)/'; then
            echo 'Product patch contains temporary automation.' >&2
            exit 1
          fi
          if find . -type f \( -name 'HOL_GUARD_EVERYDAY_MODE_PRD*' -o -name 'HOL_GUARD_EVERYDAY_MODE_TODO*' -o -name '*TAKEAWAY_PROMPT*' \) | grep -q .; then
            echo 'Private planning artifact found in patched source.' >&2
            exit 1
          fi
          git config user.name 'source-export'
          git config user.email 'source-export@invalid'
          git commit -m 'local: materialize Everyday Mode product patch'
          git archive --format=tar.gz --output="$RUNNER_TEMP/patched-source.tar.gz" HEAD

      - name: Upload exact patch and patched source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: everyday-mode-r32-patched-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/core.patch
            ${{ runner.temp }}/patched-source.tar.gz
          retention-days: 1
          if-no-files-found: error
