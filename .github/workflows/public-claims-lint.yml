name: Public claims lint

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/public-claims-lint.yml"
      - "*.md"
      - "docs/guard/**"
      - ".factory/**"
      - "scripts/ci/public_claims_lint.py"
      - "tests/test_public_claims_lint.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/public-claims-lint.yml"
      - "*.md"
      - "docs/guard/**"
      - ".factory/**"
      - "scripts/ci/public_claims_lint.py"
      - "tests/test_public_claims_lint.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-claims-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Reject antivirus and universal claims with no stated limit
        run: python3 scripts/ci/public_claims_lint.py --root .
