name: Finalize PR 2464 Windows process inventory

"on":
  pull_request:
    branches:
      - release/3.0
    paths:
      - .github/workflows/tmp-fix-pr2464-windows-inventory.yml

permissions:
  contents: write

concurrency:
  group: finalize-pr-2464-windows-process-inventory
  cancel-in-progress: true

jobs:
  finalize:
    if: >-
      github.repository == 'hashgraph-online/hol-guard' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/rust-daemon-edge-workflow-validation' &&
      github.event.pull_request.base.ref == 'release/3.0'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/rust-daemon-edge-workflow-validation
          fetch-depth: 2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Install Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
      - name: Apply, validate, and commit the deterministic repair
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PATCH_SHA256: 7b893f5445992d83fbdf6c075bc54506ac40666e3d3045c93d7837d1a9379aa7
        run: |
          set -euo pipefail
          branch='fix/rust-daemon-edge-workflow-validation'
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          remote_sha=$(git ls-remote --exit-code origin "refs/heads/${branch}" | awk '{print $1}')
          test "$remote_sha" = "$EXPECTED_HEAD_SHA"

          patch_b64="$RUNNER_TEMP/pr2464-patch.py.gz.b64"
          patch_file="$RUNNER_TEMP/pr2464-patch.py"
