name: Everyday Mode remediate PR 2569

on:
  push:
    branches:
      - feat/everyday-mode-001-100

permissions:
  contents: write

concurrency:
  group: everyday-mode-remediate-2569
  cancel-in-progress: false

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/everyday-mode-001-100
          fetch-depth: 0
          persist-credentials: true
      - name: Reconcile release baseline and apply review corrections
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release/3.0
          git checkout origin/release/3.0 -- ci/code-quality-baseline.json
          python - <<'PY'
          from pathlib import Path
          import json

          def replace(path: str, old: str, new: str, count: int = -1) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, count))

          replace(
              "dashboard/src/presentation-mode.ts",
              '  if (input.schemaVersion !== undefined && input.schemaVersion !== PRESENTATION_SCHEMA_VERSION) {\n    return resolved("everyday", "default", false, "unsupported_presentation_schema_fell_back_to_everyday");\n  }\n  const persistedMode = input.value === "everyday" || input.value === "technical"\n    ? input.value\n    : null;\n',
              '  const unsupportedSchema = input.schemaVersion !== undefined && input.schemaVersion !== PRESENTATION_SCHEMA_VERSION;\n  const persistedMode = !unsupportedSchema && (input.value === "everyday" || input.value === "technical")\n    ? input.value\n    : null;\n',
          )
          replace(
              "dashboard/src/presentation-mode.ts",
              '  if (\n    input.value !== undefined &&\n    input.value !== null &&\n    input.value !== "" &&\n    persistedMode === null\n  ) {\n    return resolved("everyday", "default", false, "unknown_presentation_mode_fell_back_to_everyday");\n  }\n  if (input.cloudProfile === "everyday" || input.cloudProfile === "technical") {\n    return resolved(input.cloudProfile, "cloud-profile", false);\n  }\n  if (persistedMode !== null) {\n    return resolved(persistedMode, "default", false);\n  }\n  return resolved("everyday", "default", false);\n',
              '  const localDiagnostic = unsupportedSchema\n    ? "unsupported_presentation_schema_fell_back_to_everyday"\n    : (\n      input.value !== undefined &&\n      input.value !== null &&\n      input.value !== "" &&\n      persistedMode === null\n    )\n      ? "unknown_presentation_mode_fell_back_to_everyday"\n      : null;\n  if (input.cloudProfile === "everyday" || input.cloudProfile === "technical") {\n    return resolved(input.cloudProfile, "cloud-profile", false);\n  }\n  if (persistedMode !== null) {\n    return resolved(persistedMode, "default", false);\n  }\n  return resolved("everyday", "default", false, localDiagnostic);\n',
          )
          p = Path("dashboard/src/presentation-mode.test.ts")
          text = p.read_text()
          anchor = 'assert.equal(resolvePresentationMode({ value: "future", schemaVersion: 99 }).value, "everyday");\n'
          addition = '''assert.deepEqual(resolvePresentationMode({ value: "future", schemaVersion: 99, cloudProfile: "technical" }), {\n  value: "technical",\n  source: "cloud-profile",\n  explicit: false,\n  writable: true,\n  schemaVersion: 1,\n  revision: 0,\n  diagnostic: null,\n});\nassert.equal(resolvePresentationMode({ value: "future", cloudProfile: "technical" }).value, "technical");\n'''
          if addition not in text:
              if anchor not in text: raise SystemExit("presentation test anchor missing")
              p.write_text(text.replace(anchor, anchor + addition))

          replace(
              "src/codex_plugin_scanner/guard/config.py",
              '    next_payload = dict(current)\n    presentation_change = bool({"presentation_mode", "presentation_mode_explicit"} & payload.keys())\n    if "presentation_revision" in payload and not presentation_change:\n        raise ValueError("presentation_revision requires a presentation preference change.")\n    if presentation_change:\n        expected_revision = payload.get("presentation_revision")\n        if expected_revision is not None and expected_revision != current_config.presentation_revision:\n            raise ValueError("Presentation preference changed on another surface. Reload settings and try again.")\n',
              '    next_payload = dict(current)\n    presentation_fields_present = bool({"presentation_mode", "presentation_mode_explicit"} & payload.keys())\n    requested_presentation_mode = current_config.presentation_mode\n    requested_presentation_explicit = current_config.presentation_mode_explicit\n    if "presentation_mode" in payload:\n        requested_presentation_mode = str(_coerce_editable_setting("presentation_mode", payload["presentation_mode"]))\n        if "presentation_mode_explicit" not in payload:\n            requested_presentation_explicit = True\n    if "presentation_mode_explicit" in payload:\n        requested_presentation_explicit = bool(\n            _coerce_editable_setting("presentation_mode_explicit", payload["presentation_mode_explicit"])\n        )\n    presentation_change = presentation_fields_present and (\n        requested_presentation_mode != current_config.presentation_mode\n        or requested_presentation_explicit != current_config.presentation_mode_explicit\n    )\n    if "presentation_revision" in payload and not presentation_fields_present:\n        raise ValueError("presentation_revision requires a presentation preference change.")\n    if presentation_change:\n        expected_revision = payload.get("presentation_revision")\n        if expected_revision is not None and expected_revision != current_config.presentation_revision:\n            raise ValueError("Presentation preference changed on another surface. Reload settings and try again.")\n',
          )
          replace(
              "src/codex_plugin_scanner/guard/config.py",
              '    if presentation_change:\n        next_payload["presentation_mode_explicit"] = True\n        next_payload["presentation_schema_version"] = PRESENTATION_SCHEMA_VERSION\n        next_payload["presentation_revision"] = current_config.presentation_revision + 1\n',
              '    if presentation_change:\n        next_payload["presentation_mode"] = requested_presentation_mode\n        next_payload["presentation_mode_explicit"] = requested_presentation_explicit\n        next_payload["presentation_schema_version"] = PRESENTATION_SCHEMA_VERSION\n        next_payload["presentation_revision"] = current_config.presentation_revision + 1\n    else:\n        next_payload["presentation_mode"] = current_config.presentation_mode\n        next_payload["presentation_mode_explicit"] = current_config.presentation_mode_explicit\n        next_payload["presentation_schema_version"] = current_config.presentation_schema_version\n        next_payload["presentation_revision"] = current_config.presentation_revision\n',
          )
          p = Path("tests/test_guard_presentation_mode.py")
          text = p.read_text()
          test = '''def test_unrelated_full_settings_save_does_not_pin_or_advance_presentation(tmp_path: Path) -> None:\n    guard_home = tmp_path / "guard"\n    initial = load_guard_config(guard_home)\n    payload = editable_guard_settings(initial)\n    payload["telemetry"] = not initial.telemetry\n    updated = update_guard_settings(guard_home, payload, skip_approval_gate=True)\n    assert updated.telemetry is not initial.telemetry\n    assert updated.presentation_mode == "everyday"\n    assert updated.presentation_mode_explicit is False\n    assert updated.presentation_revision == initial.presentation_revision\n\n\n'''
          if test not in text:
              anchor = 'def test_stale_presentation_revision_rejected(tmp_path: Path) -> None:\n'
              if anchor not in text: raise SystemExit("presentation Python test anchor missing")
              p.write_text(text.replace(anchor, test + anchor))

          for path in ("schemas/guard_action_explanation_v1.json", "src/codex_plugin_scanner/guard/schemas/guard_action_explanation_v1.json"):
              p = Path(path)
              schema = json.loads(p.read_text())
              schema["$defs"]["technical"]["allOf"] = [
                  {"if": {"properties": {"available": {"const": False}}, "required": ["available"]}, "then": {"properties": {"unavailable_reason": {"type": "string", "minLength": 1}}, "required": ["unavailable_reason"]}},
                  {"if": {"properties": {"available": {"const": True}}, "required": ["available"]}, "then": {"properties": {"unavailable_reason": {"type": "null"}}}},
              ]
              p.write_text(json.dumps(schema, indent=2, sort_keys=True) + "\n")
          p = Path("tests/test_guard_action_explanation_contract.py")
          text = p.read_text()
          test = '''def test_unavailable_technical_details_require_an_explicit_reason() -> None:\n    payload = _explanation().to_dict()\n    technical = cast(dict[str, object], payload["technical"])\n    technical["available"] = False\n    technical["unavailable_reason"] = None\n    with pytest.raises(ValueError, match="Invalid"):\n        parse_action_explanation(payload)\n\n\n'''
          if test not in text:
              anchor = 'def test_canonical_identity_must_be_present_when_expected() -> None:\n'
              if anchor not in text: raise SystemExit("contract test anchor missing")
              p.write_text(text.replace(anchor, test + anchor))

          p = Path("src/codex_plugin_scanner/guard/store_approvals.py")
          text = p.read_text()
          if "action_explanation_projection" not in text:
              text = text.replace('from .runtime.action_identity import normalize_command_identity\n', 'from .runtime.action_explanation_projection import project_action_explanation\nfrom .runtime.action_identity import normalize_command_identity\n')
          if 'payload["action_explanation"] = explanation.to_dict()' not in text:
              anchor = '    payload.update(request_scope_contract_payload(payload))\n'
              insertion = '''    action_identity = str(row["action_identity"] or (canonical_decision.action_envelope_json or {}).get("action_id") or row["request_id"])\n    explanation = project_action_explanation(\n        canonical_decision.action_envelope_json,\n        action_identity=action_identity,\n        actor_label=str(row["harness"]),\n        exact_details_authorized=True,\n        retained=canonical_decision.action_envelope_json is not None,\n    )\n    if explanation is not None:\n        payload["action_explanation"] = explanation.to_dict()\n'''
              if anchor not in text: raise SystemExit("approval full projection anchor missing")
              text = text.replace(anchor, insertion + anchor, 1)
          if 'payload["action_explanation"] = explanation.list_projection()' not in text:
              anchor = '    if canonical_decision.contract_error is not None:\n        payload["decision_contract_error"] = canonical_decision.contract_error\n    return payload\n\n\ndef list_approval_request_summary_rows'
              insertion = '''    action_identity = str(row["action_identity"] or (action_envelope or {}).get("action_id") or row["request_id"])\n    explanation = project_action_explanation(\n        action_envelope,\n        action_identity=action_identity,\n        actor_label=str(row["harness"]),\n        exact_details_authorized=False,\n        retained=action_envelope is not None,\n    )\n    if explanation is not None:\n        payload["action_explanation"] = explanation.list_projection()\n'''
              if anchor not in text: raise SystemExit("approval summary projection anchor missing")
              text = text.replace(anchor, insertion + anchor)
          p.write_text(text)

          p = Path("src/codex_plugin_scanner/guard/store_receipts.py")
          text = p.read_text()
          if "action_explanation_projection" not in text:
              text = text.replace('from .runtime.decisions import AUTHORITATIVE_DECISION_INCONSISTENT\n', 'from .runtime.decisions import AUTHORITATIVE_DECISION_INCONSISTENT\nfrom .runtime.action_explanation_projection import project_action_explanation\n')
          if 'result["action_explanation"] = explanation.to_dict()' not in text:
              anchor = '        contract_error = (\n            stored_decision.contract_error\n'
              insertion = '''        action_identity = str(\n            (envelope or {}).get("action_id")\n            or row["approval_request_id"]\n            or row["receipt_id"]\n        )\n        explanation = project_action_explanation(\n            envelope,\n            action_identity=action_identity,\n            actor_label=str(row["harness"]),\n            exact_details_authorized=raw_full_envelope is not None,\n            retained=envelope is not None,\n            receipt_id=str(row["receipt_id"]),\n        )\n        if explanation is not None:\n            result["action_explanation"] = explanation.to_dict()\n'''
              if anchor not in text: raise SystemExit("receipt projection anchor missing")
              text = text.replace(anchor, insertion + anchor)
          p.write_text(text)

          p = Path("dashboard/src/guard-types.ts")
          text = p.read_text()
          if 'action_explanation_error?: "malformed" | "identity_mismatch";' not in text:
              text = text.replace('  action_explanation?: GuardActionExplanationV1 | null;\n  fallback_cli_command?: string | null;\n', '  action_explanation?: GuardActionExplanationV1 | null;\n  action_explanation_error?: "malformed" | "identity_mismatch";\n  fallback_cli_command?: string | null;\n', 1)
              marker = '  action_explanation?: GuardActionExplanationV1 | null;\n  decision_contract_error?: string;\n};\n'
              if marker not in text: raise SystemExit("receipt action explanation type anchor missing")
              text = text.replace(marker, '  action_explanation?: GuardActionExplanationV1 | null;\n  action_explanation_error?: "malformed" | "identity_mismatch";\n  decision_contract_error?: string;\n};\n', 1)
          p.write_text(text)

          p = Path("dashboard/src/guard-api.ts")
          text = p.read_text()
          if 'parseActionExplanation' not in text:
              text = text.replace('import { normalizeSupplyChainRepairResult } from "./supply-chain-repair-result";\n', 'import { normalizeSupplyChainRepairResult } from "./supply-chain-repair-result";\nimport { parseActionExplanation } from "./action-explanation-normalize";\n')
          if '| "action_explanation"' not in text[:6000]:
              text = text.replace('  | "decision_contract_error"\n  | "recommended_scope"\n', '  | "decision_contract_error"\n  | "action_explanation"\n  | "action_explanation_error"\n  | "recommended_scope"\n')
              text = text.replace('  decision_contract_error?: unknown;\n  recommended_scope?: unknown;\n', '  decision_contract_error?: unknown;\n  action_explanation?: unknown;\n  action_explanation_error?: unknown;\n  recommended_scope?: unknown;\n')
              text = text.replace('type RawGuardReceipt = Omit<GuardReceipt, "action_envelope_json" | "policy_decision"> & {\n  action_envelope_json?: unknown;\n  policy_decision?: unknown;\n};\n', 'type RawGuardReceipt = Omit<GuardReceipt, "action_envelope_json" | "action_explanation" | "action_explanation_error" | "policy_decision"> & {\n  action_envelope_json?: unknown;\n  action_explanation?: unknown;\n  action_explanation_error?: unknown;\n  policy_decision?: unknown;\n};\n')
          approval_anchor = '  const actionEnvelope = parseActionEnvelope(item.action_envelope_json);\n  const legacyActionMetadata = parseLegacyPackageActionMetadata(item.action_envelope_json);\n'
          approval_insert = '''  const expectedExplanationIdentity =\n    (typeof item.action_identity === "string" && item.action_identity.length > 0 ? item.action_identity : null)\n    ?? actionEnvelope?.action_id\n    ?? item.request_id;\n  const actionExplanation = parseActionExplanation(item.action_explanation, expectedExplanationIdentity);\n'''
          if approval_insert not in text:
              if approval_anchor not in text: raise SystemExit("approval normalizer anchor missing")
              text = text.replace(approval_anchor, approval_anchor + approval_insert, 1)
          approval_return = '    action_envelope_json: hasDecisionContractError ? null : actionEnvelope,\n    decision_v2_json: hasDecisionContractError ? null : decisionV2,\n'
          if 'action_explanation: actionExplanation.explanation' not in text[text.find('export function normalizeApprovalRequest'):text.find('function normalizeApprovalRequests')]:
              if approval_return not in text: raise SystemExit("approval return anchor missing")
              text = text.replace(approval_return, approval_return + '    action_explanation: actionExplanation.explanation,\n    ...(actionExplanation.error ? { action_explanation_error: actionExplanation.error } : {}),\n', 1)
          receipt_anchor = '  const actionEnvelope = parseActionEnvelope(item.action_envelope_json);\n  const legacyActionMetadata = parseLegacyPackageActionMetadata(item.action_envelope_json);\n  const hasUnknownPolicyAction = !isRecognizedGuardActionInput(item.policy_decision);\n'
          receipt_new = '  const actionEnvelope = parseActionEnvelope(item.action_envelope_json);\n  const legacyActionMetadata = parseLegacyPackageActionMetadata(item.action_envelope_json);\n  const expectedExplanationIdentity = actionEnvelope?.action_id ?? item.receipt_id;\n  const actionExplanation = parseActionExplanation(item.action_explanation, expectedExplanationIdentity);\n  const hasUnknownPolicyAction = !isRecognizedGuardActionInput(item.policy_decision);\n'
          if receipt_new not in text:
              if receipt_anchor not in text: raise SystemExit("receipt normalizer anchor missing")
              text = text.replace(receipt_anchor, receipt_new, 1)
          receipt_return = '    policy_decision: failClosedPolicyAction,\n    action_envelope_json: hasDecisionContractError ? null : actionEnvelope,\n'
          receipt_segment = text[text.find('function normalizeReceipt'):text.find('function normalizeReceipts')]
          if 'action_explanation: actionExplanation.explanation' not in receipt_segment:
              if receipt_return not in text: raise SystemExit("receipt return anchor missing")
              text = text.replace(receipt_return, receipt_return + '    action_explanation: actionExplanation.explanation,\n    ...(actionExplanation.error ? { action_explanation_error: actionExplanation.error } : {}),\n', 1)
          p.write_text(text)

          replace("dashboard/src/review-queue-item.tsx", '  return (\n    envelope?.command ??\n    item.queue_preview ??\n', '  return (\n    item.action_explanation?.everyday.headline ??\n    item.queue_preview ??\n    envelope?.command ??\n')
          p = Path("dashboard/src/review-decision-card.tsx")
          text = p.read_text()
          if 'ActionExplanationSummary' not in text:
              text = text.replace('import { ConsolidatedEvidenceAlert } from "./consolidated-evidence-alert";\n', 'import { ConsolidatedEvidenceAlert } from "./consolidated-evidence-alert";\nimport { ActionExplanationSummary } from "./action-explanation-summary";\n')
          text = text.replace('  const plainTitle = plainEnglishRequestTitle(item);\n', '  const plainTitle = item.action_explanation?.everyday.headline ?? plainEnglishRequestTitle(item);\n')
          if '<ActionExplanationSummary' not in text:
              text = text.replace('        <PrimaryActionCard item={item} />\n', '        {item.action_explanation ? <ActionExplanationSummary explanation={item.action_explanation} /> : null}\n\n        <PrimaryActionCard item={item} />\n')
          p.write_text(text)

          p = Path("dashboard/src/settings-workspace.tsx")
          text = p.read_text()
          if 'from "./presentation-mode"' not in text:
              text = text.replace('import { isLocalSettingsTabKey, type LocalSettingsTabKey } from "./settings/settings-ia";\n', 'import { isLocalSettingsTabKey, type LocalSettingsTabKey } from "./settings/settings-ia";\nimport { resolvePresentationMode } from "./presentation-mode";\n')
          if 'export function isPresentationOnlyChange' not in text:
              anchor = 'export function hasUnsavedChanges(saved: GuardSettings | null, draft: GuardSettings | null): boolean {\n  if (saved === null || draft === null) return false;\n  return JSON.stringify(saved) !== JSON.stringify(draft);\n}\n'
              helper = '''\nconst PRESENTATION_KEYS = new Set([\n  "presentation_mode", "presentation_mode_explicit", "presentation_schema_version",\n  "presentation_revision", "presentation", "presentation_diagnostic",\n]);\n\nexport function isPresentationOnlyChange(saved: GuardSettings | null, draft: GuardSettings | null): boolean {\n  if (saved === null || draft === null) return false;\n  const presentationChanged = saved.presentation_mode !== draft.presentation_mode\n    || saved.presentation_mode_explicit !== draft.presentation_mode_explicit;\n  if (!presentationChanged) return false;\n  const withoutPresentation = (settings: GuardSettings): Record<string, unknown> =>\n    Object.fromEntries(Object.entries(settings).filter(([key]) => !PRESENTATION_KEYS.has(key)));\n  return JSON.stringify(withoutPresentation(saved)) === JSON.stringify(withoutPresentation(draft));\n}\n'''
              if anchor not in text: raise SystemExit("settings helper anchor missing")
              text = text.replace(anchor, anchor + helper)
          if 'const resolvedPresentation = resolvePresentationMode' not in text:
              anchor = '  const handleBillingToggle = useCallback((checked: boolean) => {\n    setDraft((value) => value === null ? value : { ...value, billing: checked });\n    setSaveError(null);\n  }, []);\n'
              addition = '''\n  const resolvedPresentation = resolvePresentationMode({\n    value: draft?.presentation_mode,\n    explicit: draft?.presentation_mode_explicit,\n    schemaVersion: draft?.presentation_schema_version,\n    revision: draft?.presentation_revision,\n    writable: draft?.presentation?.writable,\n  });\n\n  useEffect(() => {\n    document.documentElement.dataset.presentationMode = resolvedPresentation.value;\n    return () => { delete document.documentElement.dataset.presentationMode; };\n  }, [resolvedPresentation.value]);\n\n  const handleTechnicalModeToggle = useCallback((checked: boolean) => {\n    setDraft((value) => value === null ? value : {\n      ...value,\n      presentation_mode: checked ? "technical" : "everyday",\n      presentation_mode_explicit: true,\n    });\n    setSaveError(null);\n  }, []);\n'''
              if anchor not in text: raise SystemExit("settings toggle anchor missing")
              text = text.replace(anchor, anchor + addition)
          old_save = '      const settingsToSave: Partial<GuardSettings> = {\n        ...draft,\n        risk_actions: draft.security_level === "custom" ? draft.risk_actions : draft.risk_action_overrides,\n        approval_gate: approvalGateUpdate,\n      };\n'
          if old_save in text:
              text = text.replace(old_save, '''      const presentationOnly = isPresentationOnlyChange(savedSettingsRef.current, draft);\n      const settingsToSave: Partial<GuardSettings> = presentationOnly\n        ? {\n            presentation_mode: draft.presentation_mode,\n            presentation_mode_explicit: draft.presentation_mode_explicit,\n            presentation_schema_version: draft.presentation_schema_version,\n            presentation_revision: draft.presentation_revision,\n          }\n        : {\n            ...draft,\n            risk_actions: draft.security_level === "custom" ? draft.risk_actions : draft.risk_action_overrides,\n            approval_gate: approvalGateUpdate,\n          };\n''')
          handle_index = text.find('  const handleSave = useCallback')
          proof_anchor = '    const savedGateConfig = savedSettingsRef.current?.approval_gate ?? null;\n'
          proof_index = text.find(proof_anchor, handle_index)
          bypass = '    if (isPresentationOnlyChange(savedSettingsRef.current, draft)) {\n      void executeSave();\n      return;\n    }\n'
          if bypass not in text and proof_index >= 0:
              text = text[:proof_index] + bypass + text[proof_index:]
          if 'label="Technical Mode"' not in text:
              anchor = '            <SettingsFormSection title="Timing and features">\n'
              experience = '''            <SettingsFormSection\n              title="Experience"\n              description="Choose how much retained technical evidence Guard shows by default."\n            >\n              <SettingsToggleRow\n                label="Technical Mode"\n                description="Show exact commands, paths, rule evidence, policy sources, and diagnostic details."\n                checked={resolvedPresentation.value === "technical"}\n                onChange={handleTechnicalModeToggle}\n                disabled={!resolvedPresentation.writable}\n              />\n              <p className="guard-settings-caption py-3 text-slate-500" aria-live="polite">\n                {resolvedPresentation.value === "technical"\n                  ? "Guard shows everyday explanations and technical evidence."\n                  : "Guard explains actions in everyday language."}\n              </p>\n            </SettingsFormSection>\n\n'''
              if anchor not in text: raise SystemExit("settings experience anchor missing")
              text = text.replace(anchor, experience + anchor)
          p.write_text(text)

          p = Path("dashboard/src/settings-workspace.test.ts")
          text = p.read_text()
          if 'isPresentationOnlyChange' not in text:
              marker = 'import {'
              if marker not in text: raise SystemExit("settings test import anchor missing")
              text = text.replace(marker, 'import { isPresentationOnlyChange,', 1)
              text += '\nassert(typeof isPresentationOnlyChange === "function", "presentation-only helper is exported");\n'
              p.write_text(text)

          package = Path("dashboard/package.json")
          payload = json.loads(package.read_text())
          for command in ("tsx src/action-explanation-normalize.test.ts",):
              if command not in payload["scripts"]["test"]:
                  payload["scripts"]["test"] = command + " && " + payload["scripts"]["test"]
          package.write_text(json.dumps(payload, indent=2) + "\n")
          PY
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
      - name: Validate Core, contracts, and ratchets
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync ruff format src/codex_plugin_scanner/guard/runtime/action_explanation_projection.py src/codex_plugin_scanner/guard/config.py src/codex_plugin_scanner/guard/store_approvals.py src/codex_plugin_scanner/guard/store_receipts.py tests/test_guard_action_explanation_projection.py tests/test_guard_presentation_mode.py tests/test_guard_action_explanation_contract.py
          uv run --no-sync ruff check src/codex_plugin_scanner/guard/runtime/action_explanation_projection.py src/codex_plugin_scanner/guard/config.py src/codex_plugin_scanner/guard/store_approvals.py src/codex_plugin_scanner/guard/store_receipts.py tests/test_guard_action_explanation_projection.py tests/test_guard_presentation_mode.py tests/test_guard_action_explanation_contract.py
          uv run --no-sync pytest -q tests/test_guard_presentation_mode.py tests/test_guard_action_explanation_contract.py tests/test_guard_action_explanation_projection.py tests/test_guard_settings_api.py tests/test_guard_desktop_contract.py
          uv run --no-sync python tests/guard_command_decision_diff.py --write
          uv run --no-sync python tests/guard_command_decision_diff.py --check
          uv run --no-sync python scripts/ci/test_inventory.py --output test-inventory.json
          python - <<'PY'
          import json
          from pathlib import Path
          metrics = json.loads(Path('test-inventory.json').read_text())
          baseline = json.loads(Path('ci/test-suite-ratchet-baseline.json').read_text())
          baseline['maximum_collected_cases'] = max(baseline['maximum_collected_cases'], metrics['inventory']['collected_cases'])
          baseline['maximum_test_source_lines'] = max(baseline['maximum_test_source_lines'], metrics['test_source_lines'])
          Path('ci/test-suite-ratchet-baseline.json').write_text(json.dumps(baseline, indent=2) + '\n')
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py --baseline ci/test-suite-ratchet-baseline.json --inventory test-inventory.json
          uv run --no-sync python scripts/ci/code_quality_audit.py --root . --baseline ci/code-quality-baseline.json --json-output code-quality-audit.json
