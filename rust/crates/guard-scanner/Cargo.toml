[package]
name = "guard-scanner"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
base64ct.workspace = true
guard-rules = { path = "../guard-rules" }
hex.workspace = true
hmac.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zeroize = "1.9.0"

# `precommit` ports the Python `dir_fd` filesystem operations (openat/fstatat/
# renameat/unlinkat); those primitives are POSIX-only.
[target.'cfg(unix)'.dependencies]
nix.workspace = true

[dev-dependencies]

# Reading the source of a copy is not proof of how many buffers it touched, so
# the scrubbing tests install the counting allocator and measure.
guard-alloc-probe = { path = "../guard-alloc-probe" }

[lints]
workspace = true
