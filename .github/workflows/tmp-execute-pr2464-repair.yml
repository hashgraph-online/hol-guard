name: Execute PR 2464 repair without workflow mutation

on:
  pull_request:
    branches:
      - release/3.0
    paths:
      - .github/workflows/tmp-execute-pr2464-repair.yml
      - .github/workflows/tmp-fix-pr2464-windows-inventory.yml
      - rust/crates/guard-runtime/src/main.rs
      - rust/crates/guard-secure-fs/src/lib.rs
      - src/codex_plugin_scanner/guard/daemon/manager.py
      - src/codex_plugin_scanner/guard/windows_processes.py
      - tests/test_guard_daemon_manager.py
      - tests/test_windows_processes.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: execute-pr-2464-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/rust-daemon-edge-workflow-validation
          fetch-depth: 2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Install Rust 1.88
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
      - name: Execute and validate the source-only repair
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          branch='fix/rust-daemon-edge-workflow-validation'
          remote_sha=$(git ls-remote --exit-code origin "refs/heads/${branch}" | awk '{print $1}')
          test "$remote_sha" = "$EXPECTED_HEAD_SHA"

          if test -e src/codex_plugin_scanner/guard/windows_processes.py; then
            echo 'Source repair is already present.'
            exit 0
          fi

          python - <<'PY'
          from __future__ import annotations

          import textwrap
          from pathlib import Path

          workflow_path = Path('.github/workflows/tmp-fix-pr2464-windows-inventory.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          if workflow.count(start_marker) != 1 or workflow.count(end_marker) != 1:
              raise RuntimeError('unexpected embedded repair script markers')
          script = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = textwrap.dedent(script)

          replacements = (
              (
                  'std::{env::temp_dir as td, io::Write, process::id}',
                  'std::{env::temp_dir as t, io::Write, process::id as p}',
              ),
              (
                  'td().canonicalize().unwrap_or(td()).join(format!("guard-fs-{name}-{}", id()))',
                  't().canonicalize().unwrap_or(t()).join(format!("guard-secure-fs-{}-{}", name, p()))',
              ),
              ('path.unlink(missing_ok=True)', 'pass'),
          )
          for old, new in replacements:
              count = script.count(old)
              if count != 1:
                  raise RuntimeError(f'unexpected embedded repair anchor count for {old!r}: {count}')
              script = script.replace(old, new, 1)

          exec(compile(script, '<pr-2464-repair>', 'exec'), {'__name__': '__main__'})
          PY

          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync ruff format \
            src/codex_plugin_scanner/guard/windows_processes.py \
            src/codex_plugin_scanner/guard/daemon/manager.py \
            tests/test_windows_processes.py \
            tests/test_guard_daemon_manager.py
          uv run --no-sync ruff check \
            src/codex_plugin_scanner/guard/windows_processes.py \
            src/codex_plugin_scanner/guard/daemon/manager.py \
            tests/test_windows_processes.py \
            tests/test_guard_daemon_manager.py
          uv run --no-sync ruff format --check \
            src/codex_plugin_scanner/guard/windows_processes.py \
            src/codex_plugin_scanner/guard/daemon/manager.py \
            tests/test_windows_processes.py \
            tests/test_guard_daemon_manager.py
          uv run --no-sync basedpyright --level error \
            src/codex_plugin_scanner/guard/windows_processes.py \
            src/codex_plugin_scanner/guard/daemon/manager.py

          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo fmt --manifest-path rust/Cargo.toml --all --check
          cargo clippy --manifest-path rust/Cargo.toml --locked --workspace --all-targets -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --locked --workspace --all-targets

          uv run --no-sync pytest -q \
            tests/test_windows_processes.py \
            tests/test_guard_daemon_manager.py \
            tests/test_native_runtime_admission.py \
            tests/test_daemon_bounded_http.py \
            tests/test_rust_daemon_edge_hardening_contracts.py \
            --tb=short

          uv run --no-sync python scripts/ci/test_inventory.py --output test-inventory.json
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory test-inventory.json

          temporary_workflows=(
            .github/workflows/tmp-execute-pr2464-repair.yml
            .github/workflows/tmp-fix-pr2464-windows-inventory.yml
            .github/workflows/tmp-patch-pr2464-repair-v2.yml
          )
          rm -f "${temporary_workflows[@]}"
          uv run --no-sync python scripts/ci/code_quality_audit.py \
            --root . \
            --baseline ci/code-quality-baseline.json \
            --json-output code-quality-audit.json
          uv run --no-sync python scripts/ci/rust_migration_tree_hygiene.py
          git checkout -- "${temporary_workflows[@]}"
          rm -f code-quality-audit.json test-inventory.json

          git diff --check
          git diff --exit-code -- .github/workflows
          git add \
            rust/crates/guard-runtime/src/main.rs \
            rust/crates/guard-secure-fs/src/lib.rs \
            src/codex_plugin_scanner/guard/daemon/manager.py \
            src/codex_plugin_scanner/guard/windows_processes.py \
            tests/test_guard_daemon_manager.py \
            tests/test_windows_processes.py
          git diff --cached --check
          git status --short
          git config user.name 'Michael Kantor'
          git config user.email '6068672+kantorcodes@users.noreply.github.com'
          git commit --signoff -m 'fix(daemon): finish Windows process inventory hardening'
          git push origin "HEAD:refs/heads/${branch}"
