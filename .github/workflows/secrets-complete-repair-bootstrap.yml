name: Secrets hardening source export

on:
  push:
    branches:
      - fix/secrets-hook-identity-final-v2
    paths:
      - '.github/workflows/secrets-complete-repair-bootstrap.yml'

permissions:
  contents: read

concurrency:
  group: secrets-hardening-source-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout final branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/secrets-hook-identity-final-v2
          fetch-depth: 0
          persist-credentials: false

      - name: Export reviewed source snapshots and integration recipes
        shell: bash
        run: |
          set -euo pipefail
          refs=(
            release/3.0
            fix/secrets-complete-hardening-final-v1
            fix/secrets-complete-hardening-final-v2
            fix/secrets-e2e-platform-hardening
            fix/secrets-e2e-platform-hardening-final
            fix/secrets-e2e-platform-hardening-v2
            fix/secrets-git-process-hardening-v2
            fix/secrets-git-object-edge-hardening
            fix/secrets-hardening-bootstrap-cleanup
            fix/secrets-hardening-final-cleanup-20260813
            fix/secrets-hook-identity-worktree-hardening
            fix/secrets-hook-identity-final-v2
            fix/secrets-coverage-edge-cases-v2
            fix/secrets-windows-shell-diagnostic-v2
            test/secrets-complete-release-gate-v2
          )
          rm -rf secrets-source-snapshots
          mkdir -p secrets-source-snapshots
          for ref in "${refs[@]}"; do
            if ! git fetch --no-tags origin "$ref"; then
              echo "Missing optional ref: $ref" >&2
              continue
            fi
            safe="${ref//\//__}"
            worktree="/tmp/secrets-source-${safe}"
            destination="secrets-source-snapshots/${safe}"
            rm -rf "$worktree" "$destination"
            git worktree add --detach "$worktree" "origin/$ref"
            mkdir -p "$destination"

            if test -d "$worktree/src/codex_plugin_scanner/guard/secrets"; then
              mkdir -p "$destination/src/codex_plugin_scanner/guard"
              cp -a "$worktree/src/codex_plugin_scanner/guard/secrets" \
                "$destination/src/codex_plugin_scanner/guard/"
            fi

            while IFS= read -r -d '' path; do
              relative="${path#"$worktree/"}"
              mkdir -p "$destination/$(dirname "$relative")"
              cp -a "$path" "$destination/$relative"
            done < <(
              find "$worktree/tests" -maxdepth 1 -type f \
                \( -name 'test_guard_secret*.py' -o -name 'test_guard_secrets*.py' \) \
                -print0 2>/dev/null || true
            )

            for directory in scripts/ci .github/workflows docs/guard; do
              if test ! -d "$worktree/$directory"; then
                continue
              fi
              while IFS= read -r -d '' path; do
                relative="${path#"$worktree/"}"
                mkdir -p "$destination/$(dirname "$relative")"
                cp -a "$path" "$destination/$relative"
              done < <(
                find "$worktree/$directory" -maxdepth 3 -type f \
                  \( -iname '*secret*' -o -iname '*credential*' \) -print0
              )
            done

            for path in pyproject.toml uv.lock ci/test-suite-ratchet-baseline.json; do
              if test -f "$worktree/$path"; then
                mkdir -p "$destination/$(dirname "$path")"
                cp -a "$worktree/$path" "$destination/$path"
              fi
            done

            git -C "$worktree" log --oneline --decorate -100 > "$destination/COMMITS.txt"
            git diff --stat origin/release/3.0..."origin/$ref" > "$destination/DIFFSTAT.txt" || true
            git worktree remove --force "$worktree"
          done

          find secrets-source-snapshots -type f -print | sort > secrets-source-snapshots/MANIFEST.txt

      - name: Upload source snapshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: secrets-hardening-all-candidate-snapshots
          path: secrets-source-snapshots
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
