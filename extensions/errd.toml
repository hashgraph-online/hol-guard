# errd — context-aware Python traceback analyzer
# https://pypi.org/project/errd/ | https://github.com/Das-R10/errd
#
# errd runs entirely locally: no network calls, no API key required.
# It reads log files and Python source from disk, scores symbols,
# redacts secrets, and writes errd-context.md to the working directory.
#
# Guard classification: read-only analysis tool.
# Risk surface: reads .py source files and log files within the repo;
# writes a single output file (errd-context.md) to cwd by default.
# No shell exec, no network, no package installs.

[extension]
name        = "errd"
version     = "1"
description = "Context-aware Python traceback analyzer. Reads log files and local source, writes errd-context.md. No network or API key required."
homepage    = "https://pypi.org/project/errd/"

# ── Command: errd analyze ─────────────────────────────────────────────────────
[[commands]]
name        = "analyze"
executable  = "errd"
subcommand  = "analyze"
description = "Parse a Python traceback log, score relevant source symbols, and write a token-budgeted errd-context.md for AI debugging."

# Risk profile: reads source + log files; writes one markdown file to cwd.
# No shell expansion, no network calls, no package installs.
action_class   = "read-write-local"
default_action = "allow"

[[commands.args]]
name        = "log_file"
kind        = "positional"
required    = true
description = "Path to the log or traceback file to analyze."
sensitive   = false

[[commands.args]]
name        = "--budget"
short       = "-b"
kind        = "option"
required    = false
description = "Token budget for the generated context package (500–128000, default 4000)."
sensitive   = false

[[commands.args]]
name        = "--output"
short       = "-o"
kind        = "option"
required    = false
description = "Output path for errd-context.md. Defaults to ./errd-context.md in cwd."
sensitive   = false

[[commands.args]]
name        = "--repo"
short       = "-r"
kind        = "option"
required    = false
description = "Project root directory. Auto-detected from traceback paths if not provided."
sensitive   = false

# ── Command: errd version ─────────────────────────────────────────────────────
[[commands]]
name           = "version"
executable     = "errd"
subcommand     = "version"
description    = "Print the installed errd version and exit."
action_class   = "info"
default_action = "allow"
