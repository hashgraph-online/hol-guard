name: Everyday release source
on:
  push:
    branches: [feat/everyday-runtime-r32-20260907]
    paths: [.github/workflows/tmp-everyday-r32-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: |
          git rev-parse HEAD > "$RUNNER_TEMP/source-sha.txt"
          git archive --format=tar.gz -o "$RUNNER_TEMP/source.tar.gz" HEAD
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: everyday-core-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/source.tar.gz
            ${{ runner.temp }}/source-sha.txt
          if-no-files-found: error
          retention-days: 7
