name: Temporary PR 2464 release merge

on:
  push:
    branches:
      - fix/rust-daemon-edge-workflow-validation

permissions:
  contents: write

concurrency:
  group: tmp-pr2464-release-merge
  cancel-in-progress: false

jobs:
  merge-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/rust-daemon-edge-workflow-validation

      - name: Merge release/3.0 and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail

          branch="fix/rust-daemon-edge-workflow-validation"
          workflow_path=".github/workflows/tmp-pr2464-merge-release.yml"
          original_head="$(git rev-parse HEAD)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin release/3.0
          release_head="$(git rev-parse origin/release/3.0)"

          if git merge-base --is-ancestor "$release_head" HEAD; then
            git rm "$workflow_path"
            git commit \
              -m "chore: remove temporary PR 2464 merge workflow" \
              -m "Signed-off-by: Michael Kantor <6068672+kantorcodes@users.noreply.github.com>"
          else
            set +e
            git merge --no-ff --no-commit origin/release/3.0
            merge_status=$?
            set -e

            conflicts="$(git diff --name-only --diff-filter=U)"
            unexpected_conflicts="$(printf '%s\n' "$conflicts" | sed '/^$/d' | grep -v '^ci/test-suite-ratchet-baseline.json$' || true)"
            if [[ -n "$unexpected_conflicts" ]]; then
              printf 'Unexpected merge conflicts:\n%s\n' "$unexpected_conflicts" >&2
              git diff --cc -- "$unexpected_conflicts" >&2 || true
              exit 1
            fi

            if printf '%s\n' "$conflicts" | grep -qx 'ci/test-suite-ratchet-baseline.json'; then
              cat > ci/test-suite-ratchet-baseline.json <<'JSON'
          {
            "maximum_collected_cases": 15161,
            "maximum_test_source_lines": 327432,
            "schema_version": 1
          }
          JSON
              git add ci/test-suite-ratchet-baseline.json
            elif [[ $merge_status -ne 0 ]]; then
              echo "Merge failed without the expected ratchet conflict." >&2
              exit 1
            fi

            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Unresolved merge conflicts remain." >&2
              git diff --cc >&2 || true
              exit 1
            fi

            git rm "$workflow_path"

            python -m py_compile \
              src/codex_plugin_scanner/guard/daemon/bounded_http.py \
              src/codex_plugin_scanner/guard/daemon/manager.py \
              src/codex_plugin_scanner/guard/windows_processes.py \
              tests/test_guard_daemon_manager.py \
              tests/test_windows_processes.py
            python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("ci/test-suite-ratchet-baseline.json").read_text(encoding="utf-8"))
          assert payload == {
              "maximum_collected_cases": 15161,
              "maximum_test_source_lines": 327432,
              "schema_version": 1,
          }
          PY
            git diff --check

            git commit \
              -m "chore: merge release/3.0 into PR 2464" \
              -m "Resolve the test-suite ratchet additively while preserving the daemon hardening and the latest release/3.0 recovery and MCP changes." \
              -m "Signed-off-by: Michael Kantor <6068672+kantorcodes@users.noreply.github.com>"
          fi

          git push \
            --force-with-lease="refs/heads/${branch}:${original_head}" \
            origin "HEAD:refs/heads/${branch}"
