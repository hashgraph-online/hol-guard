name: Branch regenerate command decision diff

on:
  push:
    branches:
      - fix/docker-kubernetes-command-coverage

permissions:
  contents: write

concurrency:
  group: branch-regenerate-command-decision-diff
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
          save-cache: false
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Regenerate decision diff fixture
        run: uv run --no-sync python tests/guard_command_decision_diff.py --write
      - name: Commit regenerated fixture
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_BRANCH: fix/docker-kubernetes-command-coverage
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet -- tests/fixtures/guard-command-corpus/decision-diff-report.json; then
            exit 0
          fi
          remote_tip="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          if [ "$remote_tip" != "$TRIGGER_SHA" ]; then
            echo "Branch advanced; skipping stale regeneration commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/guard-command-corpus/decision-diff-report.json
          git commit -m "test: refresh command decision diff fixture"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            push origin "HEAD:${TARGET_BRANCH}"
