name: PR 2848 final CI repair

on:
  push:
    branches:
      - chore/sync-main-into-release-3.2-20260907

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: chore/sync-main-into-release-3.2-20260907
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Apply repairs
        run: python scripts/ci/pr2848_final_ci_repair.py
      - name: Validate repaired Python sources
        run: python -m py_compile src/codex_plugin_scanner/guard/adapters/cline_hooks.py tests/test_cline_hook_transports.py
      - name: Commit repairs and remove temporary helpers
        run: |
          rm .github/workflows/pr2848-final-ci-repair.yml
          rm scripts/ci/pr2848_final_ci_repair.py
          git config user.name 'Michael Kantor'
          git config user.email '6068672+kantorcodes@users.noreply.github.com'
          git add src/codex_plugin_scanner/guard/adapters/cline_hooks.py tests/test_cline_hook_transports.py dashboard/e2e/installed-extension-control-center.spec.ts .github/workflows/pr2848-final-ci-repair.yml scripts/ci/pr2848_final_ci_repair.py
          git diff --cached --check
          git commit -m 'fix: stabilize installed extension and Cline contracts'
          git push origin HEAD:chore/sync-main-into-release-3.2-20260907
