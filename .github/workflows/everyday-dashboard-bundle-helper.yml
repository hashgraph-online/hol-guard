name: Everyday dashboard bundle helper

on:
  push:
    branches:
      - fix/everyday-mode-live-wiring-20260908

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: cd dashboard && bun install --frozen-lockfile && bun run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: everyday-dashboard-static
          path: src/codex_plugin_scanner/guard/daemon/static
          if-no-files-found: error
