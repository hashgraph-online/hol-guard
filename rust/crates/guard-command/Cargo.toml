[package]
name = "guard-command"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Integration tests share one binary (tests/integration.rs) so CI links
# one test executable instead of a hundred. Files that install process-wide
# state or that CI runs by name keep their own binary below.
autotests = false

[dependencies]
base64.workspace = true
caseless.workspace = true
mailparse.workspace = true
guard-scanner = { path = "../guard-scanner" }
guard-secure-fs = { path = "../guard-secure-fs" }
guard-contracts = { path = "../guard-contracts" }
guard-runtime-windows-process = { path = "../guard-runtime-windows-process" }
regex.workspace = true
fancy-regex.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
hex.workspace = true
ruzstd.workspace = true
idna.workspace = true
percent-encoding.workspace = true
pep440_rs.workspace = true
toml.workspace = true
roxmltree.workspace = true
getrandom.workspace = true
fs2.workspace = true
libc.workspace = true
ring.workspace = true
rsa.workspace = true
base64ct.workspace = true
ureq = { version = "=3.3.0", default-features = false, features = ["rustls"] }
url = "=2.5.8"
unicode-normalization = "0.1.25"
tree-sitter = "=0.25.10"
tree-sitter-bash = "=0.25.1"
# Newer patch releases require Rust beyond the workspace MSRV.
tree-sitter-language = "=0.1.5"

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["user"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true

[build-dependencies]
guard-command-build = { path = "../guard-command-build" }
hex.workspace = true
ruzstd.workspace = true
serde_json.workspace = true
sha2.workspace = true
zstd.workspace = true

[dev-dependencies]
tempfile = "3.10"
guard-contained-process = { path = "../guard-contained-process" }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
rcgen = { version = "=0.13.2", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
# Keep synthetic-certificate tests compatible with the workspace MSRV.
time = "=0.3.47"

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "native_command_source_cli"
path = "tests/native_command_source_cli.rs"

[[test]]
name = "pretool_git_push"
path = "tests/pretool_git_push.rs"

[[test]]
name = "pretool_git_publish_chain"
path = "tests/pretool_git_publish_chain.rs"

[[test]]
name = "pretool_git_push_unregistered"
path = "tests/pretool_git_push_unregistered.rs"

[[test]]
name = "pretool_worktree_cd_windows"
path = "tests/pretool_worktree_cd_windows.rs"

[[test]]
name = "shim_admin_vectors"
path = "tests/shim_admin_vectors.rs"

[[test]]
name = "mcp_stdio_probe_windows"
path = "tests/mcp_stdio_probe_windows.rs"

[[test]]
name = "launch_identity_windows"
path = "tests/launch_identity_windows.rs"

[[test]]
name = "pretool_rg_hidden_whitelist"
path = "tests/pretool_rg_hidden_whitelist.rs"

[[test]]
name = "pretool_search_pattern_options"
path = "tests/pretool_search_pattern_options.rs"
