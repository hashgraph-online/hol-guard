name: Release 3.2 command namespace fix

on:
  push:
    branches:
      - fix/3.2-command-review-followup
    paths:
      - .github/workflows/release-32-command-namespace-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/3.2-command-review-followup
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false
      - name: Install locked development environment
        run: uv sync --frozen --extra dev --python 3.12
      - name: Preserve delegated package namespace
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          import subprocess

          old = "command.package.dotnet"
          new = "command.package-dotnet"
          expected = {
              "src/codex_plugin_scanner/guard/runtime/command_common_cli_rules_2.py",
              "src/codex_plugin_scanner/guard/runtime/command_common_cli_rules_5.py",
              "src/codex_plugin_scanner/guard/runtime/command_common_cli_specs.py",
              "tests/test_guard_command_ecosystem_setup.py",
              "tests/test_guard_command_review_followup.py",
          }
          found = set(subprocess.check_output(["git", "grep", "-l", old], text=True).splitlines())
          if found != expected:
              raise SystemExit(f"unexpected {old} locations: {sorted(found)}")

          for name in sorted(expected - {"tests/test_guard_command_ecosystem_setup.py"}):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"missing expected identifier in {name}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          ecosystem = Path("tests/test_guard_command_ecosystem_setup.py")
          text = ecosystem.read_text(encoding="utf-8")
          if text.count('assert len(package_extensions) == 9') != 1:
              raise SystemExit("unexpected package extension count assertion")
          if text.count('        "command.package.dotnet",\n') != 1:
              raise SystemExit("unexpected dotnet package inventory assertion")
          text = text.replace('assert len(package_extensions) == 9', 'assert len(package_extensions) == 8')
          text = text.replace('        "command.package.dotnet",\n', '')
          ecosystem.write_text(text, encoding="utf-8")

          leftover = subprocess.run(["git", "grep", "-n", old], text=True, capture_output=True)
          if leftover.returncode == 0:
              raise SystemExit(f"reserved package namespace still used by direct dotnet extension:\n{leftover.stdout}")
          if leftover.returncode != 1:
              raise SystemExit(leftover.stderr)
          PY
          uv run --no-sync ruff format \
            src/codex_plugin_scanner/guard/runtime/command_common_cli_rules_2.py \
            src/codex_plugin_scanner/guard/runtime/command_common_cli_rules_5.py \
            src/codex_plugin_scanner/guard/runtime/command_common_cli_specs.py \
            tests/test_guard_command_ecosystem_setup.py \
            tests/test_guard_command_review_followup.py
      - name: Run focused command regressions
        run: |
          uv run --no-sync pytest \
            tests/test_guard_command_ecosystem_setup.py::test_package_extensions_delegate_to_existing_package_firewall \
            tests/test_guard_command_review_followup.py \
            tests/test_guard_command_common_cli_extensions.py \
            tests/test_guard_command_common_cli_gaps.py \
            --tb=short
      - name: Refresh deterministic command evidence
        run: |
          uv run --no-sync python tests/guard_command_decision_diff.py --write
          uv run --no-sync python tests/guard_command_decision_diff.py --check
      - name: Verify formatting
        run: |
          uv run --no-sync ruff check src/ tests/test_guard_command_ecosystem_setup.py tests/test_guard_command_review_followup.py
          uv run --no-sync ruff format --check src/ tests/test_guard_command_ecosystem_setup.py tests/test_guard_command_review_followup.py
      - name: Commit fixes and remove one-shot workflow
        shell: bash
        run: |
          digest="$(uv run --no-sync python tests/guard_command_decision_diff.py --metrics | uv run --no-sync python -c 'import json,sys; print(json.load(sys.stdin)["report_framed_sha256"])')"
          git rm .github/workflows/release-32-command-namespace-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/codex_plugin_scanner/guard/runtime/command_common_cli_rules_2.py \
            src/codex_plugin_scanner/guard/runtime/command_common_cli_rules_5.py \
            src/codex_plugin_scanner/guard/runtime/command_common_cli_specs.py \
            tests/test_guard_command_ecosystem_setup.py \
            tests/test_guard_command_review_followup.py \
            tests/fixtures/guard-command-corpus/decision-diff-report.json
          git commit -m 'fix(commands): preserve package firewall namespace' -m "Decision-Diff-Framed-SHA256: ${digest}"
          git push origin HEAD:fix/3.2-command-review-followup
