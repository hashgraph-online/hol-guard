name: Rust runtime performance

on:
  pull_request:
    branches: [main]
    paths:
      - "rust/**"
      - "scripts/bench_guard_native_full_path.py"
      - "scripts/bench_guard_native_release_gate.py"
      - "scripts/bench_guard_native_installed_slo.py"
      - "scripts/native_slo_adapter.py"
      - "scripts/native_slo_contract.py"
      - "scripts/stress_guard_daemon.py"
      - "src/codex_plugin_scanner/guard/native_runtime.py"
      - "src/codex_plugin_scanner/guard/native_resident_client.py"
      - "src/codex_plugin_scanner/guard/native_resident_stream.py"
      - "src/codex_plugin_scanner/guard/daemon/server.py"
      - "src/codex_plugin_scanner/guard/daemon/hook_process_*.py"
      - ".github/workflows/rust-runtime-performance.yml"
      - ".github/actions/setup-rust/**"
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "scripts/bench_guard_native_full_path.py"
      - "scripts/bench_guard_native_release_gate.py"
      - "scripts/bench_guard_native_installed_slo.py"
      - "scripts/native_slo_adapter.py"
      - "scripts/native_slo_contract.py"
      - "scripts/stress_guard_daemon.py"
      - "src/codex_plugin_scanner/guard/native_runtime.py"
      - "src/codex_plugin_scanner/guard/native_resident_client.py"
      - "src/codex_plugin_scanner/guard/native_resident_stream.py"
      - "src/codex_plugin_scanner/guard/daemon/server.py"
      - "src/codex_plugin_scanner/guard/daemon/hook_process_*.py"
      - ".github/workflows/rust-runtime-performance.yml"
      - ".github/actions/setup-rust/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-runtime-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.9.26"
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Install cached Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          cache-key: pytest-native-command
      - name: Install content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.18.0
      - name: Build version-matched runtime
        env:
          HOL_GUARD_BUILD_SHA: ${{ github.sha }}
          RUSTC_WORKSPACE_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "on"
          SCCACHE_GHA_VERSION: pytest-native-command
          SCCACHE_GHA_RW_MODE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'READ_WRITE' || 'READ_ONLY' }}
          SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
        run: |
          VERSION=$(uv run --no-sync python scripts/sync_repo_version.py --check)
          export HOL_GUARD_PACKAGE_VERSION="$VERSION"
          cargo build --manifest-path rust/Cargo.toml --locked --release -p hol-guard-runtime -p guard-command --bin hol-guard-runtime --bin guard-command-source
          uv run --no-sync python scripts/ci/verify_native_command_program.py --compiler rust/target/release/guard-command-source
          rust/target/release/hol-guard-runtime self-test --json
          "$SCCACHE_PATH" --show-stats
      - name: Enforce native performance gates
        env:
          HOL_GUARD_NATIVE: force
          HOL_GUARD_NATIVE_BINARY: ${{ github.workspace }}/rust/target/release/hol-guard-runtime
        run: |
          uv run --no-sync python scripts/bench_guard_native_release_gate.py \
            --runtime "$HOL_GUARD_NATIVE_BINARY" \
            --warm-iterations 100 \
            --cold-iterations 3 \
            --json native-performance.json \
            --enforce
      - name: Publish aggregate benchmark evidence
        if: always()
        run: test ! -f native-performance.json || cat native-performance.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: hol-guard-native-performance
          path: native-performance.json
          if-no-files-found: warn
