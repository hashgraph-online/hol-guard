name: Reviewed Sonar hook bridge argv

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify-reviewed-argv:
    if: >-
      github.event.pull_request.number == 5276 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/sonar-s8705-hook-bridge' &&
      github.actor == 'kantorcodes'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.9.26'
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Verify the review guard and the untouched scanner scope
        run: |
          uv run --no-sync ruff check scripts/ci/apply_sonar_hook_bridge_review.py tests/test_apply_sonar_hook_bridge_review.py
          uv run --no-sync ruff format --check --diff scripts/ci/apply_sonar_hook_bridge_review.py tests/test_apply_sonar_hook_bridge_review.py
          uv run --no-sync pytest -q tests/test_apply_sonar_hook_bridge_review.py tests/test_sonar_fixture_source_scope.py
          git diff --exit-code
      - name: Apply the single source-pinned reviewed disposition
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: uv run --no-sync python scripts/ci/apply_sonar_hook_bridge_review.py --apply
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: sonar-hook-bridge-review
          path: sonar-hook-bridge-review/
          if-no-files-found: warn
