name: Debug formatter diff

on:
  pull_request:
    paths:
      - "src/codex_plugin_scanner/guard/cli/update_subprocess.py"
      - ".github/workflows/debug-format-diff.yml"

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Install formatter
        run: python -m pip install --disable-pip-version-check ruff==0.15.17
      - name: Show formatter diff
        run: python -m ruff format --diff src/codex_plugin_scanner/guard/cli/update_subprocess.py
