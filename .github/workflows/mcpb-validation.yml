name: MCPB pull request validation

on:
  pull_request:
    branches: [main, release/3.0]
    paths:
      - "distributions/mcpb/**"
      - "scripts/ci/pack_mcpb.py"
      - "tests/test_pack_mcpb.py"
      - ".github/workflows/mcpb-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate one-click MCP bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull request merge source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Validate Python wrapper
        run: python -m compileall -q distributions/mcpb/server
      - name: Pack the MCP bundle
        run: |
          set -euo pipefail
          python3 scripts/ci/pack_mcpb.py distributions/mcpb "$RUNNER_TEMP/hol-guard.mcpb"
          test -s "$RUNNER_TEMP/hol-guard.mcpb"
