name: Secrets hook identity test alignment

on:
  push:
    branches:
      - fix/secrets-hook-identity-worktree-hardening

permissions:
  contents: write

concurrency:
  group: secrets-hook-identity-test-alignment
  cancel-in-progress: true

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/secrets-hook-identity-worktree-hardening
          fetch-depth: 0
          persist-credentials: true
      - name: Align the permanent path-hijack assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_guard_secret_platform_hardening.py')
          text = path.read_text(encoding='utf-8')
          old = '    assert "command -v hol-guard" in managed\n'
          new = (
              '    assert "command -v hol-guard" not in managed\n'
              '    assert "pinned Guard executable is unavailable" in managed\n'
          )
          if old not in text:
              raise SystemExit('old PATH lookup assertion was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/secrets-hook-test-alignment.yml
          git add tests/test_guard_secret_platform_hardening.py
          git commit -m 'test(secrets): assert pinned hook identity'
          git push origin HEAD:fix/secrets-hook-identity-worktree-hardening
