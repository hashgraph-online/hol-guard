name: PR 2798 formatting diagnostic
on:
  push:
    branches:
      - diagnostics/pr2798-format-5354f54
    paths:
      - .github/workflows/pr2798-format-diagnostic.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 5354f548de3cb496cecca6271527de5947d77e90
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Show exact formatter changes
        run: uv run --no-sync ruff format --diff src/
      - name: Check types independently of formatting
        if: ${{ !cancelled() }}
        run: uv run --no-sync basedpyright --level error
