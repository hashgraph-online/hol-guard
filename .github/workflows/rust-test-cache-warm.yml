name: Warm trusted Rust test caches
on:
  push:
    branches: [main]
    paths:
      - rust/**
      - contributions/**
      - contracts/**
      - spec/**
      - tests/fixtures/**
      - src/codex_plugin_scanner/guard/contracts/**
      - src/codex_plugin_scanner/guard/schemas/**
      - .cargo/**
      - scripts/**
      - .github/actions/setup-rust/**
      - .github/actions/restore-runtime-tests/**
      - .github/workflows/ci.yml
      - .github/workflows/rust-test-cache-warm.yml

permissions:
  actions: read
  contents: read

env:
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

# Finish the active warm run and retain only the newest pending main revision.
# Required consumers use a separate same-SHA FIFO lock and are never coalesced.
concurrency:
  group: trusted-rust-test-warm-main
  cancel-in-progress: false

jobs:
  warm:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ format('trusted-rust-tests-{0}', github.sha) }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Configure the checked test profile
        run: |
          # Libraries keep their existing optimization and dependency fingerprints.
          # The workspace wrapper lowers optimization only for --test compilations.
          echo "CARGO_PROFILE_TEST_OPT_LEVEL=1" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_DEBUG_ASSERTIONS=true" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_OVERFLOW_CHECKS=true" >> "$GITHUB_ENV"
          # Line tables keep panic backtraces readable while cutting link time
          # across test binaries; full debuginfo is never inspected in CI.
          echo "CARGO_PROFILE_TEST_DEBUG=line-tables-only" >> "$GITHUB_ENV"
      # Hash before installing the wrapper, exactly as required consumers do.
      # Keep the same archive path in every call so cache versions also match.
      - name: Restore exact core test compilation
        id: core
        uses: ./.github/actions/restore-runtime-tests
        with:
          partition: core
      - name: Restore exact command test compilation
        id: command
        uses: ./.github/actions/restore-runtime-tests
        with:
          partition: command
      - name: Restore exact runtime test compilation
        id: runtime
        uses: ./.github/actions/restore-runtime-tests
        with:
          partition: runtime
      - uses: ./.github/actions/setup-rust
        if: steps.core.outputs.cache-hit != 'true' || steps.command.outputs.cache-hit != 'true' || steps.runtime.outputs.cache-hit != 'true'
        with:
          cache-key: ci-workspace-test
          cache-fallback-key: ci-workspace-test-runtime-1
          components: clippy
          normalize-toolchains: "true"
      - name: Install content-addressed compiler cache
        if: steps.core.outputs.cache-hit != 'true' || steps.command.outputs.cache-hit != 'true' || steps.runtime.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.18.0
      - name: Route workspace crates through the compiler cache
        if: steps.core.outputs.cache-hit != 'true' || steps.command.outputs.cache-hit != 'true' || steps.runtime.outputs.cache-hit != 'true'
        run: |
          # A content-addressed wrapper path invalidates Cargo fingerprints when
          # compiler behavior changes, without invalidating third-party crates.
          wrapper_hash="$(sha256sum scripts/ci/rust_test_compiler.sh | cut -d ' ' -f 1)"
          wrapper="$RUNNER_TEMP/hol-guard-rust-test-$wrapper_hash"
          install -m 0755 scripts/ci/rust_test_compiler.sh "$wrapper"
          {
            echo "RUSTC_WORKSPACE_WRAPPER=$wrapper"
            echo "SCCACHE_GHA_ENABLED=on"
            echo "SCCACHE_GHA_VERSION=ci-workspace-test"
            echo "SCCACHE_GHA_RW_MODE=${SCCACHE_MODE}"
            echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1"
          } >> "$GITHUB_ENV"
        env:
          SCCACHE_MODE: READ_WRITE
      - name: Check compiler cache readiness
        if: steps.core.outputs.cache-hit != 'true' || steps.command.outputs.cache-hit != 'true' || steps.runtime.outputs.cache-hit != 'true'
        run: |
          # --zero-stats connects to an existing daemon or starts one. Startup
          # storage failures precede SCCACHE_IGNORE_SERVER_IO_ERROR's fallback.
          # Diagnostics can include signed cache URLs; keep them runner-local.
          if ! sccache --zero-stats > "$RUNNER_TEMP/sccache-readiness.log" 2>&1; then
            echo "::warning::Compiler cache unavailable; compiling directly."
            echo "HOL_GUARD_CI_SCCACHE=off" >> "$GITHUB_ENV"
          fi
      - name: Provision the Linux test linker
        if: steps.core.outputs.cache-hit != 'true' || steps.command.outputs.cache-hit != 'true' || steps.runtime.outputs.cache-hit != 'true'
        run: bash scripts/ci/setup_test_linker.sh
      - name: Archive complete core test compilation
        if: steps.core.outputs.cache-hit != 'true'
        run: bash scripts/ci/archive_rust_tests.sh core
      - name: Save exact core test compilation
        if: steps.core.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/runtime-test-archive.tar.zst
          key: ${{ steps.core.outputs.cache-primary-key }}
      - name: Archive complete command test compilation
        if: steps.command.outputs.cache-hit != 'true'
        run: bash scripts/ci/archive_rust_tests.sh command
      - name: Save exact command test compilation
        if: steps.command.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/runtime-test-archive.tar.zst
          key: ${{ steps.command.outputs.cache-primary-key }}
      - name: Archive complete runtime test compilation
        if: steps.runtime.outputs.cache-hit != 'true'
        run: bash scripts/ci/archive_rust_tests.sh runtime
      - name: Save exact runtime test compilation
        if: steps.runtime.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/runtime-test-archive.tar.zst
          key: ${{ steps.runtime.outputs.cache-primary-key }}
      - name: Report compiler cache statistics
        if: always() && (steps.core.outputs.cache-hit != 'true' || steps.command.outputs.cache-hit != 'true' || steps.runtime.outputs.cache-hit != 'true')
        run: '"$SCCACHE_PATH" --show-stats || true'
