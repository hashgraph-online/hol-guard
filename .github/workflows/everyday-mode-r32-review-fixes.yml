name: Apply Everyday Mode review fixes

on:
  push:
    branches:
      - feat/everyday-mode-r32-final

permissions:
  contents: write

concurrency:
  group: everyday-mode-r32-review-fixes
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out immutable branch head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed fixes
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 --decode | gzip --decompress > "$RUNNER_TEMP/review-fixes.patch"
          echo '88e7bc871954573b57e24c9f78a69f4253827e34f30bd23566f37822b867877c  '"$RUNNER_TEMP/review-fixes.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/review-fixes.patch"
          git apply "$RUNNER_TEMP/review-fixes.patch"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: '1.3.6'

      - name: Format, regenerate evidence, and validate
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
          python_targets=(
            src/codex_plugin_scanner/guard/config.py
            src/codex_plugin_scanner/guard/presentation_mode.py
            src/codex_plugin_scanner/guard/cli/commands_dispatch_desktop.py
            tests/test_guard_presentation_mode.py
            tests/test_guard_everyday_mode_completion.py
          )
          uv run --no-sync python -m ruff format "${python_targets[@]}"
          uv run --no-sync python -m ruff check --fix "${python_targets[@]}"
          uv run --no-sync python -m ruff check "${python_targets[@]}"
          uv run --no-sync python tests/guard_command_decision_diff.py --write
          uv run --no-sync python tests/guard_command_decision_diff.py --check
          uv run --no-sync python scripts/ci/test_inventory.py --output "$RUNNER_TEMP/test-inventory.json"
          python - <<'PY'
          import json
          from pathlib import Path

          inventory = json.loads(Path("/home/runner/work/_temp/test-inventory.json").read_text())
          baseline = {
              "schema_version": 1,
              "maximum_collected_cases": inventory["inventory"]["collected_cases"],
              "maximum_test_source_lines": inventory["test_source_lines"],
          }
          Path("ci/test-suite-ratchet-baseline.json").write_text(json.dumps(baseline, indent=2) + "\n")
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory "$RUNNER_TEMP/test-inventory.json"
          uv run --no-sync pytest -q \
            tests/test_guard_presentation_mode.py \
            tests/test_guard_everyday_mode_completion.py \
            tests/test_guard_desktop_contract.py \
            tests/test_guard_action_explanation_contract.py \
            tests/test_guard_command_decision_diff.py
          cd dashboard
          bun install --frozen-lockfile
          bun run test
          bun run build

      - name: Commit only reviewed source and generated gates
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/everyday-mode-r32-review-fixes.yml
          rm -f "$workflow"
          git diff --check
          python - <<'PY'
          import subprocess
          from pathlib import Path

          allowed = {
              ".github/workflows/everyday-mode-r32-review-fixes.yml",
              "ci/test-suite-ratchet-baseline.json",
              "dashboard/src/presentation-migration.ts",
              "dashboard/src/presentation-mode.test.ts",
              "dashboard/src/presentation-mode.ts",
              "src/codex_plugin_scanner/guard/cli/commands_dispatch_desktop.py",
              "src/codex_plugin_scanner/guard/config.py",
              "src/codex_plugin_scanner/guard/presentation_migration.py",
              "src/codex_plugin_scanner/guard/presentation_mode.py",
              "tests/fixtures/guard-command-corpus/decision-diff-report.json",
              "tests/test_guard_everyday_mode_completion.py",
              "tests/test_guard_presentation_mode.py",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          unexpected = changed - allowed
          required = {
              "src/codex_plugin_scanner/guard/config.py",
              "src/codex_plugin_scanner/guard/cli/commands_dispatch_desktop.py",
              "src/codex_plugin_scanner/guard/presentation_mode.py",
              "dashboard/src/presentation-mode.ts",
              "tests/test_guard_presentation_mode.py",
              "tests/test_guard_everyday_mode_completion.py",
          }
          if unexpected or not required <= changed:
              raise SystemExit(f"invalid changed paths: unexpected={sorted(unexpected)} missing={sorted(required - changed)}")
          for obsolete in (
              "src/codex_plugin_scanner/guard/presentation_migration.py",
              "dashboard/src/presentation-migration.ts",
          ):
              if Path(obsolete).exists():
                  raise SystemExit(f"obsolete migration module remained: {obsolete}")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve presentation revision and schema compatibility'
          git push origin HEAD:feat/everyday-mode-r32-final
