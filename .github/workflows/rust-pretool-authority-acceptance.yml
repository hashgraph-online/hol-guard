name: Rust PreToolUse authority acceptance

on:
  push:
    branches: [fix/rust-authority-batch-1]
    paths:
      - ".github/workflows/rust-pretool-authority-acceptance.yml"
      - "scripts/ci/rust_pretool_authority_integration.py"
      - "rust/**"
      - "src/codex_plugin_scanner/guard/native_command_model.py"
      - "src/codex_plugin_scanner/guard/native_pretool.py"
      - "src/codex_plugin_scanner/guard/native_runtime*.py"
      - "src/codex_plugin_scanner/guard/daemon/hook_worker.py"
      - "tests/test_rust_pretool_authority*.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rust-pretool-authority-acceptance.yml"
      - "scripts/ci/rust_pretool_authority_integration.py"
      - "rust/**"
      - "src/codex_plugin_scanner/guard/native_command_model.py"
      - "src/codex_plugin_scanner/guard/native_pretool.py"
      - "src/codex_plugin_scanner/guard/native_runtime*.py"
      - "src/codex_plugin_scanner/guard/daemon/hook_worker.py"
      - "tests/test_rust_pretool_authority*.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-pretool-authority-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
      - name: Enforce source authority invariants
        run: |
          ! grep -q "Python remains authoritative" src/codex_plugin_scanner/guard/native_command_model.py
          ! grep -q "Python remains authoritative" src/codex_plugin_scanner/guard/native_pretool.py
          grep -q "def review_pre_tool_native(" src/codex_plugin_scanner/guard/native_pretool.py
          grep -q 'command == "pre-tool"' rust/crates/guard-runtime/src/main.rs
          grep -q "pub fn evaluate_pre_tool" rust/crates/guard-command/src/pretool.rs
          grep -q 'if event_name == "PreToolUse":' src/codex_plugin_scanner/guard/daemon/hook_worker.py
          uv run --no-sync python scripts/ci/rust_pretool_no_python_gate.py --root .
      - name: Compile and lint Rust authority
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all --check
          cargo clippy --manifest-path rust/Cargo.toml --locked --workspace --all-targets -- -D warnings
      - name: Build version-matched release runtime
        env:
          HOL_GUARD_BUILD_SHA: ${{ github.sha }}
        run: |
          VERSION=$(uv run --no-sync python scripts/sync_repo_version.py --check)
          export HOL_GUARD_PACKAGE_VERSION="$VERSION"
          cargo build --manifest-path rust/Cargo.toml --locked --release -p hol-guard-runtime
          rust/target/release/hol-guard-runtime self-test --json
      - name: Run real-binary adversarial integration
        run: |
          uv run --no-sync python scripts/ci/rust_pretool_authority_integration.py \
            --runtime rust/target/release/hol-guard-runtime \
            --json rust-pretool-authority-integration.json
      - name: Run resident and binary integration suites
        env:
          HOL_GUARD_NATIVE: force
          HOL_GUARD_NATIVE_BINARY: ${{ github.workspace }}/rust/target/release/hol-guard-runtime
        run: |
          uv run --no-sync pytest -q \
            tests/test_rust_pretool_authority.py \
            tests/test_rust_pretool_authority_worker.py \
            ci/native_runtime/test_command_model_resident.py \
            ci/native_runtime/test_guard_native_runtime_binary.py \
            --tb=short
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rust-pretool-authority-evidence
          path: rust-pretool-authority-integration.json
          if-no-files-found: error
          retention-days: 14
