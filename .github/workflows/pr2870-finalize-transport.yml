name: PR 2870 finalize CI fixes

on:
  push:
    branches:
      - fix/secret-read-floors-and-contained-vitest

permissions:
  contents: write

jobs:
  finalize:
    if: "${{ github.repository == 'hashgraph-online/hol-guard' && github.event.head_commit.message == 'ci: apply verified PR 2870 CI fixes' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          ref: fix/secret-read-floors-and-contained-vitest
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      - name: Apply and validate final CI fixes
        shell: bash
        run: |
          set -euo pipefail
          cat .github/pr2870-finalize/*.b64 | base64 -d > /tmp/pr2870-ci-fixes.patch
          test "$(sha256sum /tmp/pr2870-ci-fixes.patch | cut -d' ' -f1)" = "351c36c2d4963ed86bba18e46ff794f5ade8d075c409fe5d6bb84910930a1f8b"
          git apply --check /tmp/pr2870-ci-fixes.patch
          git apply /tmp/pr2870-ci-fixes.patch
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync python tests/guard_command_decision_diff.py --write
          uv run --no-sync pytest -q \
            tests/test_guard_github_workflow_runtime.py::test_resolved_guard_lineage_issues_bounded_retry_capability \
            tests/test_guard_command_decision_diff.py::test_fresh_process_report_is_environment_independent_and_bounded \
            tests/test_guard_shell_secret_read_floors.py \
            tests/test_guard_shell_read_syntax_fidelity.py \
            tests/test_guard_compound_developer_inspection.py
          uv run --no-sync python tests/guard_command_decision_diff.py --check
          uv run --no-sync ruff check \
            src/codex_plugin_scanner/guard/runtime/command_evaluation.py \
            src/codex_plugin_scanner/guard/runtime/_shell_secret_read_support.py
          uv run --no-sync ruff format --check \
            src/codex_plugin_scanner/guard/runtime/command_evaluation.py \
            src/codex_plugin_scanner/guard/runtime/_shell_secret_read_support.py
          test "$(wc -l < src/codex_plugin_scanner/guard/runtime/_shell_secret_read_support.py)" -le 500
          git diff --check
          rm -rf .github/pr2870-finalize .github/workflows/pr2870-finalize-transport.yml
          git add -A
          git config user.name "Michael Kantor"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git commit -m "fix(guard): preserve authorized workflows and fast-path shell reads"
          git push origin HEAD:fix/secret-read-floors-and-contained-vitest
