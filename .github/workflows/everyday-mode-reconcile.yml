name: Everyday Mode reconcile

on:
  push:
    branches:
      - feat/everyday-mode-001-100

permissions:
  contents: write

concurrency:
  group: everyday-mode-reconcile-001-100
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out feature head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/everyday-mode-001-100
          fetch-depth: 0
          persist-credentials: true
      - name: Reconcile release/3.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin release/3.0
          set +e
          git merge --no-commit -X ours origin/release/3.0
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              if git ls-files -u -- "$path" | awk '$3 == 2 {found=1} END{exit !found}'; then
                git checkout --ours -- "$path"
                git add "$path"
              else
                git rm --ignore-unmatch "$path"
              fi
            done < /tmp/conflicts.txt
            if git diff --name-only --diff-filter=U | grep -q .; then
              git status --short
              exit 1
            fi
          fi
          if ! git diff --cached --quiet || [ -f .git/MERGE_HEAD ]; then
            git commit --no-edit
          fi
      - name: Remove one-shot workflow
        shell: bash
        run: git rm .github/workflows/everyday-mode-reconcile.yml
      - name: Focused backend validation
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src/codex_plugin_scanner/guard/presentation_mode.py src/codex_plugin_scanner/guard/runtime/action_explanation_contract.py
          python -m pytest -q tests/test_guard_presentation_mode.py tests/test_guard_action_explanation_contract.py tests/test_guard_codex_browser_authority.py
      - name: Dashboard validation
        shell: bash
        working-directory: dashboard
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec tsx src/presentation-mode.test.ts
          pnpm run build
      - name: Commit reconciled head
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          git push origin HEAD:feat/everyday-mode-001-100
