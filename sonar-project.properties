# SonarQube Cloud CI-based analysis, run from .github/workflows/ci.yml ("sonar" job).
# The presence of this file switches the project off automatic analysis.
sonar.projectKey=hashgraph-online_hol-guard
sonar.organization=hashgraph-online
sonar.projectName=hol-guard

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=**/test_*.py

sonar.python.version=3.10, 3.11, 3.12, 3.13
# Generated by coverage xml in the "sonar" job after combining the 96 pytest shards.
sonar.python.coverage.reportPaths=coverage.xml

# Bundled dashboard build output shipped inside the wheel is generated code.
sonar.exclusions=src/codex_plugin_scanner/guard/daemon/static/**
