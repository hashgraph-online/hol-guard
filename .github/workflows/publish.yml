name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Release channel"
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - stable
      release_train:
        description: "Authorized release train"
        required: true
        type: choice
        options:
          - "3.0"
          - main
      release_version:
        description: "Exact canonical release version"
        required: true
        type: string
      expected_sha:
        description: "Exact source commit authorized for publication"
        required: true
        type: string
  push:
    branches: [main, release/3.0]
  pull_request:
    branches: [main, release/3.0, release/3.2]
    types: [opened, synchronize, reopened, labeled]
    # Skip pull requests that touch nothing the wheel, sdist or installed canary
    # reads: tests, docs and unrelated workflows. Later entries re-include
    # shipped Markdown and the test modules the installed canary imports.
    paths:
      - "**"
      - "!tests/**"
      - "!docs/**"
      - "!fuzzers/**"
      - "!**/*.md"
      - "!.github/workflows/**"
      - ".github/workflows/publish.yml"
      - ".github/workflows/release-native-prepare.yml"
      - ".github/workflows/release-native-wheel.yml"
      - "README.md"
      - "src/**"
      - "scripts/**"
      - "rust/**"
      - "contracts/**"
      - "contributions/**"
      - "docs/guard/contracts/guard-cloud-review.md"
      - "tests/__init__.py"
      - "tests/guard_command_corpus*.py"
      - "tests/harness_attribution_env.py"
      - "tests/native_command_test_support.py"
      - "tests/native_guard_home_key.py"
      - "tests/native_github_offline.py"
      - "tests/fixtures/**"
      - "tests/dockerlabs/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Serialize publish-capable branch events while keeping pull-request
  # validation isolated by its merge ref. Alpha dispatches get their own group
  # so a push to the same branch can never replace a pending alpha, or the reverse.
  group: hol-guard-publish-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.release_channel == 'alpha' && '-alpha' || '' }}
  cancel-in-progress: false

jobs:
  authorize-release:
    name: Authorize release dispatch
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Enforce release authority
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_CHANNEL: ${{ github.event.inputs.release_channel }}
          RELEASE_TRAIN: ${{ github.event.inputs.release_train }}
          RELEASE_VERSION: ${{ github.event.inputs.release_version }}
          EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
        run: |
          if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "Release workflow reruns are denied; create a fresh authorized dispatch" >&2
            exit 1
          fi
          case "${RELEASE_CHANNEL}:${RELEASE_TRAIN}:${GITHUB_REF}" in
            alpha:3.0:refs/heads/release/3.0)
              if [[ "$GITHUB_ACTOR_ID" != "6068672" && "$GITHUB_ACTOR_ID" != "301892678" ]]; then
                echo "Release dispatch actor is not an authorized maintainer" >&2
                exit 1
              fi
              ;;
            alpha:main:refs/heads/main)
              # Release Please dispatches main alphas only after checking the requesting maintainer.
              if [[ "$GITHUB_ACTOR_ID" != "6068672" && "$GITHUB_ACTOR_ID" != "301892678" && "$GITHUB_ACTOR_ID" != "41898282" ]]; then
                echo "Release dispatch actor is not an authorized maintainer" >&2
                exit 1
              fi
              ;;
            stable:main:refs/heads/main)
              if [[ "$GITHUB_ACTOR_ID" != "6068672" && "$GITHUB_ACTOR_ID" != "301892678" && "$GITHUB_ACTOR_ID" != "41898282" ]]; then
                echo "Release dispatch actor is not an authorized maintainer" >&2
                exit 1
              fi
              ;;
            "stable:main:refs/tags/v${RELEASE_VERSION}")
              if [[ "$GITHUB_ACTOR_ID" != "6068672" && "$GITHUB_ACTOR_ID" != "301892678" && "$GITHUB_ACTOR_ID" != "41898282" ]]; then
                echo "Release dispatch actor is not an authorized maintainer" >&2
                exit 1
              fi
              ;;
            *)
              echo "Release channel, train, and source branch are not an authorized combination" >&2
              exit 1
              ;;
          esac
          if [[ "$EXPECTED_SHA" != "$GITHUB_SHA" ]]; then
            echo "Expected source SHA does not match the dispatch source" >&2
            exit 1
          fi

  resolve-alpha-version:
    name: Resolve main alpha version
    needs: authorize-release
    # Native compilation embeds the exact version, so a "next" alpha is resolved here,
    # in parallel with the native compile, instead of after Build + Verify. Build + Verify
    # adopts this exact version and revalidates it, so both jobs always agree.
    if: >-
      vars.RELEASE_PUBLISHING_ENABLED == 'true' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1 &&
      github.ref == 'refs/heads/main' &&
      inputs.release_channel == 'alpha' && inputs.release_train == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.9.26"
      - name: Resolve and validate alpha version
        id: version
        env:
          GITHUB_REF: ${{ github.ref }}
          RELEASE_VERSION: ${{ github.event.inputs.release_version }}
          EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git rev-parse 'HEAD^{commit}')
          BASE_VERSION=$(uv run --no-project --with packaging==25.0 python scripts/sync_repo_version.py --check)
          PYPI_VERSIONS=$(uv run --no-project --with packaging==25.0 python scripts/verify_release_registry.py \
            list-versions --registry pypi)
          TESTPYPI_VERSIONS=$(uv run --no-project --with packaging==25.0 python scripts/verify_release_registry.py \
            list-versions --registry testpypi)
          TAG_VERSIONS=$(git ls-remote --tags --refs origin 'refs/tags/alpha/v*' | sed 's#.*refs/tags/alpha/v##' | jq -R -s \
            'split("\n") | map(select(length > 0))')
          EXISTING_VERSIONS=$(jq -n \
            --argjson pypi "$PYPI_VERSIONS" \
            --argjson testpypi "$TESTPYPI_VERSIONS" \
            --argjson tags "$TAG_VERSIONS" \
            '$pypi + $testpypi + $tags | unique')
          if [[ "$RELEASE_VERSION" == "next" ]]; then
            RELEASE_VERSION=$(uv run --no-project --with packaging==25.0 python scripts/compute_alpha_release_version.py \
              --release-train main --base-version "$BASE_VERSION" <<< "$EXISTING_VERSIONS")
          fi
          mapfile -t EXISTING_VERSIONS_ARRAY < <(
            jq -r --arg candidate "$RELEASE_VERSION" '.[] | select(. != $candidate)' <<< "$EXISTING_VERSIONS"
          )
          if jq -e --arg candidate "$RELEASE_VERSION" 'index($candidate) != null' <<< "$EXISTING_VERSIONS" >/dev/null; then
            echo "Alpha version ${RELEASE_VERSION} was already published or reserved" >&2
            exit 1
          fi
          VALIDATOR_ARGS=(
            --channel alpha
            --version "$RELEASE_VERSION"
            --git-ref refs/heads/main
            --actual-ref "$GITHUB_REF"
            --github-sha "$SOURCE_SHA"
            --expected-sha "$EXPECTED_SHA"
            --base-version "$BASE_VERSION"
          )
          for existing_version in "${EXISTING_VERSIONS_ARRAY[@]}"; do
            VALIDATOR_ARGS+=(--existing-version "$existing_version")
          done
          VERSION=$(uv run --no-project --with packaging==25.0 python scripts/validate_alpha_release.py "${VALIDATOR_ARGS[@]}")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved main alpha version: $VERSION"

  resolve-canary-version:
    name: Resolve PR canary version
    # Native compilation embeds the exact version, so the PR canary version is resolved once,
    # before both the native compile and Build + Verify. Both adopt it, so a rerun of either
    # job can never pair binaries with a different version.
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.action != 'labeled' || github.event.label.name == 'publish-testpypi-canary')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            pyproject.toml
            uv.lock
            scripts/sync_repo_version.py
            src/codex_plugin_scanner/version.py
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.9.26"
      - name: Compute PR canary version
        id: version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          BASE_VERSION=$(uv run --no-project --with packaging==25.0 python scripts/sync_repo_version.py --check)
          VERSION=$(BASE_VERSION="$BASE_VERSION" python3 - <<'PY'
          import os

          def pair(left: int, right: int) -> int:
              total = left + right
              return total * (total + 1) // 2 + right

          print(f"{os.environ['BASE_VERSION']}.dev{pair(pair(int(os.environ['PR_NUMBER']), int(os.environ['GITHUB_RUN_NUMBER'])), int(os.environ['GITHUB_RUN_ATTEMPT']))}")
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved PR canary version: $VERSION"

  precompile-native-linux-x64:
    name: Prepare native release binaries (x86_64-unknown-linux-musl)
    needs: [authorize-release, resolve-alpha-version, resolve-canary-version]
    # Stable tag dispatches, authorized main alpha dispatches and opted-in PR canaries
    # compile once, beside Build + Verify. The wheel jobs then only verify, self-test on
    # native hardware, and package. A failed version resolution skips this job, so wheels
    # fall back to an in-job compile and Build + Verify still rejects the dispatch on its own.
    # PR canaries keep the stable fat-LTO profile, so their wheels still prove the PyPI
    # size budgets, and their compiles only read the trusted caches.
    if: >-
      always() && !cancelled() &&
      needs.authorize-release.result == 'success' &&
      (
        (
          vars.RELEASE_PUBLISHING_ENABLED == 'true' &&
          github.event_name == 'workflow_dispatch' && github.run_attempt == 1 &&
          (
            (
              github.ref == format('refs/tags/v{0}', inputs.release_version) &&
              inputs.release_channel == 'stable' && inputs.release_train == 'main'
            ) ||
            (
              github.ref == 'refs/heads/main' &&
              inputs.release_channel == 'alpha' && inputs.release_train == 'main' &&
              needs.resolve-alpha-version.result == 'success'
            )
          )
        ) ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.pull_request.labels.*.name, 'publish-testpypi-canary') &&
          needs.resolve-canary-version.result == 'success'
        )
      )
    uses: ./.github/workflows/release-native-prepare.yml
    with:
      target: x86_64-unknown-linux-musl
      source_sha: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.sha }}
      version: ${{ needs.resolve-alpha-version.outputs.version || needs.resolve-canary-version.outputs.version || inputs.release_version }}
      # Alpha native wheels ship only on the GitHub prerelease, never on PyPI, so they
      # use fast per-crate codegen. Stable keeps whole-program fat LTO.
      fast_codegen: ${{ inputs.release_channel == 'alpha' }}
    permissions:
      contents: read
      actions: read

  precompile-native-macos-x64:
    name: Prepare native release binaries (x86_64-apple-darwin)
    needs: [authorize-release, resolve-alpha-version, resolve-canary-version]
    # Stable tag dispatches, authorized main alpha dispatches and opted-in PR canaries
    # compile once, beside Build + Verify. The wheel jobs then only verify, self-test on
    # native hardware, and package. A failed version resolution skips this job, so wheels
    # fall back to an in-job compile and Build + Verify still rejects the dispatch on its own.
    # PR canaries keep the stable fat-LTO profile, so their wheels still prove the PyPI
    # size budgets, and their compiles only read the trusted caches.
    if: >-
      always() && !cancelled() &&
      needs.authorize-release.result == 'success' &&
      (
        (
          vars.RELEASE_PUBLISHING_ENABLED == 'true' &&
          github.event_name == 'workflow_dispatch' && github.run_attempt == 1 &&
          (
            (
              github.ref == format('refs/tags/v{0}', inputs.release_version) &&
              inputs.release_channel == 'stable' && inputs.release_train == 'main'
            ) ||
            (
              github.ref == 'refs/heads/main' &&
              inputs.release_channel == 'alpha' && inputs.release_train == 'main' &&
              needs.resolve-alpha-version.result == 'success'
            )
          )
        ) ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.pull_request.labels.*.name, 'publish-testpypi-canary') &&
          needs.resolve-canary-version.result == 'success'
        )
      )
    uses: ./.github/workflows/release-native-prepare.yml
    with:
      target: x86_64-apple-darwin
      source_sha: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.sha }}
      version: ${{ needs.resolve-alpha-version.outputs.version || needs.resolve-canary-version.outputs.version || inputs.release_version }}
      # Alpha native wheels ship only on the GitHub prerelease, never on PyPI, so they
      # use fast per-crate codegen. Stable keeps whole-program fat LTO.
      fast_codegen: ${{ inputs.release_channel == 'alpha' }}
    permissions:
      contents: read
      actions: read

  precompile-native-macos-arm64:
    name: Prepare native release binaries (aarch64-apple-darwin)
    needs: [authorize-release, resolve-alpha-version, resolve-canary-version]
    # Stable tag dispatches, authorized main alpha dispatches and opted-in PR canaries
    # compile once, beside Build + Verify. The wheel jobs then only verify, self-test on
    # native hardware, and package. A failed version resolution skips this job, so wheels
    # fall back to an in-job compile and Build + Verify still rejects the dispatch on its own.
    # PR canaries keep the stable fat-LTO profile, so their wheels still prove the PyPI
    # size budgets, and their compiles only read the trusted caches.
    if: >-
      always() && !cancelled() &&
      needs.authorize-release.result == 'success' &&
      (
        (
          vars.RELEASE_PUBLISHING_ENABLED == 'true' &&
          github.event_name == 'workflow_dispatch' && github.run_attempt == 1 &&
          (
            (
              github.ref == format('refs/tags/v{0}', inputs.release_version) &&
              inputs.release_channel == 'stable' && inputs.release_train == 'main'
            ) ||
            (
              github.ref == 'refs/heads/main' &&
              inputs.release_channel == 'alpha' && inputs.release_train == 'main' &&
              needs.resolve-alpha-version.result == 'success'
            )
          )
        ) ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.pull_request.labels.*.name, 'publish-testpypi-canary') &&
          needs.resolve-canary-version.result == 'success'
        )
      )
    uses: ./.github/workflows/release-native-prepare.yml
    with:
      target: aarch64-apple-darwin
      source_sha: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.sha }}
      version: ${{ needs.resolve-alpha-version.outputs.version || needs.resolve-canary-version.outputs.version || inputs.release_version }}
      # Alpha native wheels ship only on the GitHub prerelease, never on PyPI, so they
      # use fast per-crate codegen. Stable keeps whole-program fat LTO.
      fast_codegen: ${{ inputs.release_channel == 'alpha' }}
    permissions:
      contents: read
      actions: read

  precompile-native-windows-x64:
    name: Prepare native release binaries (x86_64-pc-windows-msvc)
    needs: [authorize-release, resolve-alpha-version, resolve-canary-version]
    # Stable tag dispatches, authorized main alpha dispatches and opted-in PR canaries
    # compile once, beside Build + Verify. The wheel jobs then only verify, self-test on
    # native hardware, and package. A failed version resolution skips this job, so wheels
    # fall back to an in-job compile and Build + Verify still rejects the dispatch on its own.
    # PR canaries keep the stable fat-LTO profile, so their wheels still prove the PyPI
    # size budgets, and their compiles only read the trusted caches.
    if: >-
      always() && !cancelled() &&
      needs.authorize-release.result == 'success' &&
      (
        (
          vars.RELEASE_PUBLISHING_ENABLED == 'true' &&
          github.event_name == 'workflow_dispatch' && github.run_attempt == 1 &&
          (
            (
              github.ref == format('refs/tags/v{0}', inputs.release_version) &&
              inputs.release_channel == 'stable' && inputs.release_train == 'main'
            ) ||
            (
              github.ref == 'refs/heads/main' &&
              inputs.release_channel == 'alpha' && inputs.release_train == 'main' &&
              needs.resolve-alpha-version.result == 'success'
            )
          )
        ) ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.pull_request.labels.*.name, 'publish-testpypi-canary') &&
          needs.resolve-canary-version.result == 'success'
        )
      )
    uses: ./.github/workflows/release-native-prepare.yml
    with:
      target: x86_64-pc-windows-msvc
      source_sha: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.sha }}
      version: ${{ needs.resolve-alpha-version.outputs.version || needs.resolve-canary-version.outputs.version || inputs.release_version }}
      # Alpha native wheels ship only on the GitHub prerelease, never on PyPI, so they
      # use fast per-crate codegen. Stable keeps whole-program fat LTO.
      fast_codegen: ${{ inputs.release_channel == 'alpha' }}
    permissions:
      contents: read
      actions: read

  precompile-native-windows-arm64:
    name: Prepare native release binaries (aarch64-pc-windows-msvc)
    needs: [authorize-release, resolve-alpha-version, resolve-canary-version]
    # Stable tag dispatches, authorized main alpha dispatches and opted-in PR canaries
    # compile once, beside Build + Verify. The wheel jobs then only verify, self-test on
    # native hardware, and package. A failed version resolution skips this job, so wheels
    # fall back to an in-job compile and Build + Verify still rejects the dispatch on its own.
    # PR canaries keep the stable fat-LTO profile, so their wheels still prove the PyPI
    # size budgets, and their compiles only read the trusted caches.
    if: >-
      always() && !cancelled() &&
      needs.authorize-release.result == 'success' &&
      (
        (
          vars.RELEASE_PUBLISHING_ENABLED == 'true' &&
          github.event_name == 'workflow_dispatch' && github.run_attempt == 1 &&
          (
            (
              github.ref == format('refs/tags/v{0}', inputs.release_version) &&
              inputs.release_channel == 'stable' && inputs.release_train == 'main'
            ) ||
            (
              github.ref == 'refs/heads/main' &&
              inputs.release_channel == 'alpha' && inputs.release_train == 'main' &&
              needs.resolve-alpha-version.result == 'success'
            )
          )
        ) ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.pull_request.labels.*.name, 'publish-testpypi-canary') &&
          needs.resolve-canary-version.result == 'success'
        )
      )
    uses: ./.github/workflows/release-native-prepare.yml
    with:
      target: aarch64-pc-windows-msvc
      source_sha: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.sha }}
      version: ${{ needs.resolve-alpha-version.outputs.version || needs.resolve-canary-version.outputs.version || inputs.release_version }}
      # Alpha native wheels ship only on the GitHub prerelease, never on PyPI, so they
      # use fast per-crate codegen. Stable keeps whole-program fat LTO.
      fast_codegen: ${{ inputs.release_channel == 'alpha' }}
    permissions:
      contents: read
      actions: read

  build:
    name: Build + Verify
    # always() lets Build + Verify run when the alpha resolver is skipped (every non-alpha
    # event); the authorization result still gates it.
    if: >-
      always() && !cancelled() &&
      needs.authorize-release.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || github.run_attempt == 1) &&
      (github.event_name != 'push' || github.run_attempt == 1) &&
      (github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip release publish]')) &&
      (github.event.action != 'labeled' || github.event.label.name == 'publish-testpypi-canary')
    needs: [authorize-release, resolve-alpha-version, resolve-canary-version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      release_train: ${{ steps.version.outputs.release_train }}
      base_version: ${{ steps.version.outputs.base_version }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      release_repair: ${{ steps.version.outputs.release_repair }}
      native_wheel_matrix: ${{ steps.native_wheel_matrix.outputs.matrix }}
      native_wheel_targets: ${{ steps.native_wheel_matrix.outputs.targets }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          # Full commit and tag history for ancestry checks; blobs only for the checked-out tree.
          fetch-depth: 0
          filter: blob:none
          ref: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.sha }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Verify release uv before dependency install
        env:
          EXPECTED_UV_VERSION: "0.9.26"
          SETUP_UV_ACTION_REF: fac544c07dec837d0ccb6301d7b5580bf5edae39
        run: |
          python3 scripts/write_release_toolchain_sbom.py \
            --output "$RUNNER_TEMP/hol-guard-release-toolchain-preflight.cdx.json" \
            --release-version preflight \
            --expected-uv-version "$EXPECTED_UV_VERSION" \
            --setup-action-ref "$SETUP_UV_ACTION_REF"
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra publish --extra cisco
      - name: Compute publish version
        id: version
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_CHANNEL: ${{ github.event.inputs.release_channel }}
          RELEASE_TRAIN: ${{ github.event.inputs.release_train }}
          RELEASE_VERSION: ${{ github.event.inputs.release_version }}
          EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
          RESOLVED_ALPHA_VERSION: ${{ needs.resolve-alpha-version.outputs.version }}
          RESOLVED_CANARY_VERSION: ${{ needs.resolve-canary-version.outputs.version }}
          RELEASE_PUBLISHING_ENABLED: ${{ vars.RELEASE_PUBLISHING_ENABLED }}
        run: |
          BASE_VERSION=$(uv run --no-sync python scripts/sync_repo_version.py --check)
          VERSION="$BASE_VERSION"
          CHANNEL="integration"
          TRAIN=""
          SOURCE_SHA=$(git rev-parse 'HEAD^{commit}')

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$RELEASE_PUBLISHING_ENABLED" != "true" ]]; then
              echo "Release publishing is disabled until protected environments are verified" >&2
              exit 1
            fi
            if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
              echo "Release workflow reruns are denied; create a fresh authorized dispatch" >&2
              exit 1
            fi
            CHANNEL="$RELEASE_CHANNEL"
            TRAIN="$RELEASE_TRAIN"
            if [[ "$CHANNEL" == "alpha" && "$TRAIN" == "3.0" ]]; then
              if [[ "$GITHUB_ACTOR_ID" != "6068672" && "$GITHUB_ACTOR_ID" != "301892678" ]]; then
                echo "Release dispatch actor is not an authorized maintainer" >&2
                exit 1
              fi
              TRAIN_REF="refs/heads/release/${TRAIN}"
              if [[ "$GITHUB_REF" != "$TRAIN_REF" ]]; then
                echo "Alpha releases must run from ${TRAIN_REF}" >&2
                exit 1
              fi

              EXISTING_VERSION_FILE=$(mktemp)
              uv run --no-sync python scripts/verify_release_registry.py \
                list-versions --registry pypi | jq -r '.[]' > "$EXISTING_VERSION_FILE"
              uv run --no-sync python scripts/verify_release_registry.py \
                list-versions --registry testpypi | jq -r '.[]' >> "$EXISTING_VERSION_FILE"
              git tag --list 'alpha/v*' | sed 's#^alpha/v##' >> "$EXISTING_VERSION_FILE"
              mapfile -t EXISTING_VERSIONS < <(
                awk -v candidate="$RELEASE_VERSION" '$0 != candidate' "$EXISTING_VERSION_FILE"
              )
              VALIDATOR_ARGS=(
                --channel "$CHANNEL"
                --version "$RELEASE_VERSION"
                --git-ref "$TRAIN_REF"
                --actual-ref "$GITHUB_REF"
                --github-sha "$SOURCE_SHA"
                --expected-sha "$EXPECTED_SHA"
              )
              for existing_version in "${EXISTING_VERSIONS[@]}"; do
                VALIDATOR_ARGS+=(--existing-version "$existing_version")
              done
              VERSION=$(uv run --no-sync python scripts/validate_alpha_release.py "${VALIDATOR_ARGS[@]}")
            elif [[ "$CHANNEL" == "alpha" && "$TRAIN" == "main" ]]; then
              if [[ "$GITHUB_ACTOR_ID" != "6068672" && "$GITHUB_ACTOR_ID" != "301892678" && "$GITHUB_ACTOR_ID" != "41898282" ]]; then
                echo "Release dispatch actor is not an authorized maintainer" >&2
                exit 1
              fi
              if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
                echo "Main alpha releases must run from refs/heads/main" >&2
                exit 1
              fi
              # Optional test builds for the next minor; they never move the stable line.
              PYPI_VERSIONS=$(uv run --no-sync python scripts/verify_release_registry.py \
                list-versions --registry pypi)
              TESTPYPI_VERSIONS=$(uv run --no-sync python scripts/verify_release_registry.py \
                list-versions --registry testpypi)
              TAG_VERSIONS=$(git tag --list 'alpha/v*' | sed 's#^alpha/v##' | jq -R -s \
                'split("\n") | map(select(length > 0))')
              EXISTING_VERSIONS=$(jq -n \
                --argjson pypi "$PYPI_VERSIONS" \
                --argjson testpypi "$TESTPYPI_VERSIONS" \
                --argjson tags "$TAG_VERSIONS" \
                '$pypi + $testpypi + $tags | unique')
              if [[ "$RELEASE_VERSION" == "next" && -n "$RESOLVED_ALPHA_VERSION" ]]; then
                # The native binaries embed the resolver's version; adopt it so a tag or
                # upload that lands between the two jobs cannot split them. The checks
                # below still reject it if it is now published or reserved.
                RELEASE_VERSION="$RESOLVED_ALPHA_VERSION"
              elif [[ "$RELEASE_VERSION" == "next" ]]; then
                RELEASE_VERSION=$(uv run --no-sync python scripts/compute_alpha_release_version.py \
                  --release-train main --base-version "$BASE_VERSION" <<< "$EXISTING_VERSIONS")
              fi
              mapfile -t EXISTING_VERSIONS_ARRAY < <(
                jq -r --arg candidate "$RELEASE_VERSION" '.[] | select(. != $candidate)' <<< "$EXISTING_VERSIONS"
              )
              if jq -e --arg candidate "$RELEASE_VERSION" 'index($candidate) != null' <<< "$EXISTING_VERSIONS" >/dev/null; then
                echo "Alpha version ${RELEASE_VERSION} was already published or reserved" >&2
                exit 1
              fi
              VALIDATOR_ARGS=(
                --channel "$CHANNEL"
                --version "$RELEASE_VERSION"
                --git-ref refs/heads/main
                --actual-ref "$GITHUB_REF"
                --github-sha "$SOURCE_SHA"
                --expected-sha "$EXPECTED_SHA"
                --base-version "$BASE_VERSION"
              )
              for existing_version in "${EXISTING_VERSIONS_ARRAY[@]}"; do
                VALIDATOR_ARGS+=(--existing-version "$existing_version")
              done
              VERSION=$(uv run --no-sync python scripts/validate_alpha_release.py "${VALIDATOR_ARGS[@]}")
            elif [[ "$CHANNEL" == "stable" && "$TRAIN" == "main" ]]; then
              if [[ "$GITHUB_ACTOR_ID" != "6068672" && "$GITHUB_ACTOR_ID" != "301892678" && "$GITHUB_ACTOR_ID" != "41898282" ]]; then
                echo "Release dispatch actor is not an authorized maintainer" >&2
                exit 1
              fi
              if [[ "$GITHUB_REF" != "refs/heads/main" && "$GITHUB_REF" != "refs/tags/v${RELEASE_VERSION}" ]]; then
                echo "Stable releases must run from refs/heads/main" >&2
                exit 1
              fi
              PYPI_VERSIONS=$(uv run --no-sync python scripts/verify_release_registry.py \
                list-versions --registry pypi)
              TESTPYPI_VERSIONS=$(uv run --no-sync python scripts/verify_release_registry.py \
                list-versions --registry testpypi)
              TAG_VERSIONS=$(git tag --list 'v*' | sed 's/^v//' | jq -R -s \
                'split("\n") | map(select(length > 0))')
              VERSIONS=$(jq -n \
                --argjson pypi "$PYPI_VERSIONS" \
                --argjson testpypi "$TESTPYPI_VERSIONS" \
                --argjson tags "$TAG_VERSIONS" \
                --arg candidate "$RELEASE_VERSION" \
                '$pypi + $testpypi + ($tags | map(select(. != $candidate))) | unique')
              EXPECTED_VERSION=$(uv run --no-sync python scripts/compute_main_release_version.py \
                --base-version "$BASE_VERSION" <<< "$VERSIONS")
              REPAIRING=false
              if [[ "$RELEASE_VERSION" != "$EXPECTED_VERSION" ]]; then
                LATEST_PYPI=$(uv run --no-sync python scripts/compute_main_release_version.py \
                  --base-version "$BASE_VERSION" --latest-existing <<< "$PYPI_VERSIONS")
                ASSET_NAMES_FILE=$(mktemp)
                RELEASE_VIEW_ERROR=$(mktemp)
                if gh release view "v${RELEASE_VERSION}" --repo "$GITHUB_REPOSITORY" --json assets \
                  --jq '.assets[].name' > "$ASSET_NAMES_FILE" 2>"$RELEASE_VIEW_ERROR"; then
                  REPAIR_ARGS=(--asset-names-file "$ASSET_NAMES_FILE")
                elif grep -q "release not found" "$RELEASE_VIEW_ERROR"; then
                  REPAIR_ARGS=(--release-missing)
                else
                  echo "Could not inspect the GitHub release for ${RELEASE_VERSION}" >&2
                  exit 1
                fi
                if jq -e --arg candidate "$RELEASE_VERSION" 'index($candidate) == null' <<< "$PYPI_VERSIONS" >/dev/null; then
                  REPAIR_ARGS+=(--deferred-pypi)
                fi
                if [[ "${REPAIR_ARGS[0]}" == "--asset-names-file" ]]; then
                  # A run that stopped after upload (for example on a companion project's
                  # quota) leaves the release complete but never records it as published.
                  PUBLISHED_RECORDS=$(gh api --paginate \
                    "repos/$GITHUB_REPOSITORY/commits/v${RELEASE_VERSION}/statuses?per_page=100" \
                    --jq ".[] | select(.context == \"hol-guard / published ${RELEASE_VERSION}\" and .state == \"success\") | .id")
                  if [[ -z "$PUBLISHED_RECORDS" ]]; then
                    REPAIR_ARGS+=(--publication-unrecorded)
                  fi
                fi
                if ! uv run --no-sync python scripts/stable_release_asset_repair.py \
                  --requested "$RELEASE_VERSION" \
                  --expected-next "$EXPECTED_VERSION" \
                  --latest-pypi "$LATEST_PYPI" \
                  "${REPAIR_ARGS[@]}"; then
                  echo "Stable release version must match the next registry-derived version: ${EXPECTED_VERSION}" >&2
                  exit 1
                fi
                git fetch --force --no-tags origin "+refs/tags/v${RELEASE_VERSION}:refs/tags/v${RELEASE_VERSION}"
                SOURCE_SHA=$(git rev-parse "v${RELEASE_VERSION}^{commit}")
                if ! git merge-base --is-ancestor "$SOURCE_SHA" HEAD; then
                  echo "Published release is not an ancestor of this dispatch" >&2
                  exit 1
                fi
                echo "release_repair=true" >> "$GITHUB_OUTPUT"
                REPAIRING=true
              fi
              if git rev-parse -q --verify "v${RELEASE_VERSION}^{commit}" >/dev/null; then
                tag_sha=$(git rev-parse "v${RELEASE_VERSION}^{commit}")
                if [[ "$tag_sha" != "$SOURCE_SHA" ]]; then
                  if ! git merge-base --is-ancestor "$tag_sha" HEAD; then
                    echo "Stable tag does not target the dispatch source or one of its ancestors" >&2
                    exit 1
                  fi
                  # Finish an already reserved canonical version with repaired
                  # workflow code, without moving its immutable source tag.
                  SOURCE_SHA="$tag_sha"
                  echo "release_repair=true" >> "$GITHUB_OUTPUT"
                  REPAIRING=true
                fi
              fi
              VERSION="$RELEASE_VERSION"
              if [[ "$REPAIRING" == "true" ]]; then
                git checkout --detach "$SOURCE_SHA"
                uv sync --frozen --extra dev --extra publish --extra cisco
              fi
            else
              echo "Unsupported release channel and train: ${CHANNEL}:${TRAIN}" >&2
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/release/3.0" ]]; then
            if [[ "$RELEASE_PUBLISHING_ENABLED" != "true" ]]; then
              echo "Release publishing is disabled until protected environments are verified" >&2
              exit 1
            fi
            TRAIN="3.0"
            TRAIN_REF="refs/heads/release/${TRAIN}"
            ACTUAL_REF="$GITHUB_REF"
            EXPECTED_SOURCE="$GITHUB_SHA"
            if [[ "$SOURCE_SHA" != "$EXPECTED_SOURCE" ]]; then
              echo "Checked-out source does not match the immutable release source" >&2
              exit 1
            fi
            CHANNEL="alpha"
            PYPI_VERSIONS=$(uv run --no-sync python scripts/verify_release_registry.py \
              list-versions --registry pypi)
            TESTPYPI_VERSIONS=$(uv run --no-sync python scripts/verify_release_registry.py \
              list-versions --registry testpypi)
            TAG_VERSIONS=$(git tag --list 'alpha/v*' | sed 's#^alpha/v##' | jq -R -s 'split("\n") | map(select(length > 0))')
            EXISTING_VERSIONS=$(jq -n \
              --argjson pypi "$PYPI_VERSIONS" \
              --argjson testpypi "$TESTPYPI_VERSIONS" \
              --argjson tags "$TAG_VERSIONS" \
              '$pypi + $testpypi + $tags | unique')
            mapfile -t SOURCE_ALPHA_TAGS < <(
              git tag --points-at "$SOURCE_SHA" --list "alpha/v${TRAIN}.1a*" | sed 's#^alpha/v##'
            )
            if [[ "${#SOURCE_ALPHA_TAGS[@]}" -gt 1 ]]; then
              echo "Source commit has multiple reserved alpha versions" >&2
              exit 1
            fi
            if [[ "${#SOURCE_ALPHA_TAGS[@]}" -eq 1 ]]; then
              RELEASE_VERSION="${SOURCE_ALPHA_TAGS[0]}"
              REUSING_RESERVED_ALPHA=true
              uv run --no-sync python scripts/compute_alpha_release_version.py \
                --release-train "$TRAIN" --validate-phase-only <<< "$EXISTING_VERSIONS"
            else
              RELEASE_VERSION=$(uv run --no-sync python scripts/compute_alpha_release_version.py \
                --release-train "$TRAIN" <<< "$EXISTING_VERSIONS")
              REUSING_RESERVED_ALPHA=false
            fi
            EXISTING_VERSIONS_ARRAY=()
            if [[ "$REUSING_RESERVED_ALPHA" != "true" ]]; then
              mapfile -t EXISTING_VERSIONS_ARRAY < <(jq -r '.[]' <<< "$EXISTING_VERSIONS")
            fi
            VALIDATOR_ARGS=(
              --channel "$CHANNEL"
              --version "$RELEASE_VERSION"
              --git-ref "$TRAIN_REF"
              --actual-ref "$ACTUAL_REF"
              --github-sha "$SOURCE_SHA"
              --expected-sha "$SOURCE_SHA"
            )
            for existing_version in "${EXISTING_VERSIONS_ARRAY[@]}"; do
              VALIDATOR_ARGS+=(--existing-version "$existing_version")
            done
            VERSION=$(uv run --no-sync python scripts/validate_alpha_release.py "${VALIDATOR_ARGS[@]}")
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            CHANNEL="canary"
            # Adopt the version the native compile embeds; never recompute it here.
            if [[ ! "$RESOLVED_CANARY_VERSION" =~ ^${BASE_VERSION//./\\.}\.dev[0-9]+$ ]]; then
              echo "PR canary version '${RESOLVED_CANARY_VERSION}' was not resolved from ${BASE_VERSION}" >&2
              exit 1
            fi
            VERSION="$RESOLVED_CANARY_VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "release_train=$TRAIN" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Computed $CHANNEL version: $VERSION"
      - name: Select native wheel platforms
        id: native_wheel_matrix
        env:
          CHANNEL: ${{ steps.version.outputs.channel }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
          # Windows ARM64 and Linux ARM64 wheels ship on alpha and stable GitHub releases only.
          # Pull request canaries skip those runners, and so do sources that predate each wheel.
          NATIVE_WHEEL_MATRIX: >-
            [
            {"runner": "ubuntu-latest", "platform_tag": "manylinux_2_17_x86_64", "target": "x86_64-unknown-linux-musl",
             "runtime": "rust/target/x86_64-unknown-linux-musl/release/hol-guard-runtime",
             "source_compiler": "rust/target/x86_64-unknown-linux-musl/release/guard-command-source"},
            {"runner": "macos-15-intel", "platform_tag": "macosx_13_0_x86_64", "target": "x86_64-apple-darwin",
             "runtime": "rust/target/x86_64-apple-darwin/release/hol-guard-runtime",
             "source_compiler": "rust/target/x86_64-apple-darwin/release/guard-command-source"},
            {"runner": "macos-15", "platform_tag": "macosx_11_0_arm64", "target": "aarch64-apple-darwin",
             "runtime": "rust/target/aarch64-apple-darwin/release/hol-guard-runtime",
             "source_compiler": "rust/target/aarch64-apple-darwin/release/guard-command-source"},
            {"runner": "windows-latest", "platform_tag": "win_amd64", "rustflags": "-C link-arg=/Brepro",
             "target": "x86_64-pc-windows-msvc",
             "runtime": "rust/target/x86_64-pc-windows-msvc/release/hol-guard-runtime.exe",
             "source_compiler": "rust/target/x86_64-pc-windows-msvc/release/guard-command-source.exe"},
            {"runner": "windows-11-arm", "platform_tag": "win_arm64", "rustflags": "-C link-arg=/Brepro",
             "target": "aarch64-pc-windows-msvc",
             "runtime": "rust/target/aarch64-pc-windows-msvc/release/hol-guard-runtime.exe",
             "source_compiler": "rust/target/aarch64-pc-windows-msvc/release/guard-command-source.exe"},
            {"runner": "ubuntu-24.04-arm", "platform_tag": "manylinux_2_17_aarch64", "target": "aarch64-unknown-linux-musl",
             "runtime": "rust/target/aarch64-unknown-linux-musl/release/hol-guard-runtime",
             "source_compiler": "rust/target/aarch64-unknown-linux-musl/release/guard-command-source"}
            ]
        run: |
          set -euo pipefail
          filter='.'
          if [[ "$CHANNEL" == "canary" ]] || ! git cat-file -e "${SOURCE_SHA}:scripts/embed_native_wheel_manifest.py"; then
            filter='map(select(.platform_tag != "win_arm64" and .platform_tag != "manylinux_2_17_aarch64"))'
          elif ! git grep -q manylinux_2_17_aarch64 "$SOURCE_SHA" -- scripts/release_artifact_sets.py; then
            filter='map(select(.platform_tag != "manylinux_2_17_aarch64"))'
          fi
          echo "matrix=$(jq -c "$filter" <<< "$NATIVE_WHEEL_MATRIX")" >> "$GITHUB_OUTPUT"
          echo "targets=$(jq -c "$filter | map(.target)" <<< "$NATIVE_WHEEL_MATRIX")" >> "$GITHUB_OUTPUT"
      - name: Verify release toolchain and write SBOM
        env:
          EXPECTED_UV_VERSION: "0.9.26"
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          SETUP_UV_ACTION_REF: fac544c07dec837d0ccb6301d7b5580bf5edae39
        run: |
          python3 scripts/write_release_toolchain_sbom.py \
            --output "release-metadata/plugin-scanner-v${RELEASE_VERSION}.toolchain.cdx.json" \
            --release-version "$RELEASE_VERSION" \
            --expected-uv-version "$EXPECTED_UV_VERSION" \
            --setup-action-ref "$SETUP_UV_ACTION_REF"
      - name: Stamp package version when needed
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          CURRENT_VERSION=$(uv run --no-sync python scripts/sync_repo_version.py --check)
          if [[ "$CURRENT_VERSION" == "$VERSION" ]]; then
            echo "Package metadata already matches $VERSION"
            exit 0
          fi
          uv run --no-sync python scripts/sync_repo_version.py --version "$VERSION"
      - name: Stage release source compiler trust defaults
        run: python scripts/refresh_extension_artifacts.py --trust-only
      - name: Install pinned Rust toolchain for release source compiler
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - name: Cache release source compiler dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: release-native-v1
          workspaces: rust
          shared-key: release-source-compiler
          cache-workspace-crates: false
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.18.0
      - name: Generate projections for release source distributions
        env:
          HOL_GUARD_BUILD_SHA: ${{ steps.version.outputs.source_sha }}
          HOL_GUARD_PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          # Content-addressed reuse survives fresh-checkout mtimes. Only trusted
          # main pushes may write; pull requests and dispatches are read-only.
          RUSTC_WORKSPACE_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: 'on'
          SCCACHE_GHA_VERSION: release-source-compiler-v1
          SCCACHE_GHA_RW_MODE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'READ_WRITE' || 'READ_ONLY' }}
          SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 build --manifest-path rust/Cargo.toml --locked --release \
            --config 'profile.release.lto="off"' --config 'profile.release.codegen-units=16' \
            -p guard-command --bin guard-command-source
          python scripts/build_native_command_program.py --compiler rust/target/release/guard-command-source
          echo "HOL_GUARD_BUILD_SOURCE_COMPILER=$GITHUB_WORKSPACE/rust/target/release/guard-command-source" >> "$GITHUB_ENV"
          "$SCCACHE_PATH" --show-stats
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Build dashboard assets from release source
        working-directory: dashboard
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build
      - name: Build Guard package (hol-guard)
        env:
          HOL_GUARD_BUILD_SOURCE_COMPILER: rust/target/release/guard-command-source
          HOL_GUARD_BUNDLE_ASSET_OUTPUT: ${{ github.workspace }}/installed-bundle-assets
        run: |
          cp pyproject.toml pyproject.toml.bak
          python3 - <<'PY'
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          text = text.replace('name = "hol-guard"', 'name = "hol-guard"', 1)
          start = text.index("[project.scripts]")
          end = text.index("\n\n[project.urls]")
          scripts = "[project.scripts]\n" \
              'hol-guard = "codex_plugin_scanner.cli:main"\n' \
              'plugin-guard = "codex_plugin_scanner.cli:main"\n' \
              'hol-guard-eval = "codex_plugin_scanner.guard.evaluation_cli:main"'
          text = text[:start] + scripts + text[end:]
          path.write_text(text, encoding="utf-8")
          PY
          uv run --no-sync python -m build
          mv pyproject.toml.bak pyproject.toml
      - name: Build scanner package (plugin-scanner)
        env:
          HOL_GUARD_BUILD_SOURCE_COMPILER: rust/target/release/guard-command-source
        run: |
          cp pyproject.toml pyproject.toml.bak
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          text = text.replace('name = "hol-guard"', 'name = "plugin-scanner"', 1)
          text, description_count = re.subn(
              r'^description = ".*"$',
              'description = "Lint, verify, and gate plugin ecosystems for maintainers, CI, and publish workflows."',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if description_count != 1:
              raise RuntimeError("Expected one project description in pyproject.toml")
          start = text.index("[project.scripts]")
          end = text.index("\n\n[project.urls]")
          scripts = "[project.scripts]\n" \
              'plugin-scanner = "codex_plugin_scanner.cli:main"\n' \
              'plugin-ecosystem-scanner = "codex_plugin_scanner.cli:main"'
          text = text[:start] + scripts + text[end:]
          path.write_text(text, encoding="utf-8")
          PY
          uv run --no-sync python -m build
          mv pyproject.toml.bak pyproject.toml
      - name: Verify distributions
        env:
          CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          uv run --no-sync twine check dist/*
          python3 scripts/verify_guard_wheel_entrypoints.py dist
          # Stable builds only: the version is stamped by now, so --release compares every
          # coverage record's Guard version against the build being published. Alpha and
          # canary versions never equal the release a record is promoted for.
          release_args=()
          if [[ "$CHANNEL" == "stable" ]]; then release_args+=(--release); fi
          for wheel in dist/*.whl; do
            uv run --no-sync python scripts/ci/validate_harness_version_coverage.py \
              "${release_args[@]}" --wheel "$wheel"
          done
      - name: Record immutable distribution hashes
        run: |
          find dist -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > distribution-sha256.txt
      - name: Bind installed canary subject
        if: github.event_name == 'pull_request'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
        run: |
          uv run --no-sync python scripts/installed_canary_proof.py write-subject \
            --dist-dir dist \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --output installed-canary-subject.json
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: distributions
          path: dist/
      - name: Upload distribution hashes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: distribution-sha256
          path: distribution-sha256.txt
      - name: Retain immutable optional installed data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: installed-bundle-assets
          path: installed-bundle-assets/
          if-no-files-found: error
      - name: Retain the release source compiler for publication checks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-source-compiler
          path: rust/target/release/guard-command-source
          if-no-files-found: error
          retention-days: 1
      - name: Upload installed canary subject
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: installed-canary-subject
          path: installed-canary-subject.json
          if-no-files-found: error
      - name: Upload release toolchain SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-toolchain-sbom
          path: release-metadata/*.cdx.json
          if-no-files-found: error



  build-native-guard-wheel-linux-x64:
    name: Build native Guard wheel (x86_64-unknown-linux-musl)
    if: >-
