name: Paseo main source inspection
on:
  push:
    branches: [inspect/paseo-main-ci-source]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export pinned development formatter
        run: |
          python3 -m venv /tmp/paseo-tools
          /tmp/paseo-tools/bin/python -m pip install 'ruff==0.15.17'
          mkdir -p inspection
          cp /tmp/paseo-tools/bin/ruff inspection/ruff
          sha256sum inspection/ruff > inspection/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paseo-main-formatter
          path: inspection/
          retention-days: 1
          if-no-files-found: error
