name: PR 2848 dashboard assets refresh

on:
  push:
    branches:
      - chore/sync-main-into-release-3.2-20260907

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: chore/sync-main-into-release-3.2-20260907
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Rebuild committed dashboard assets
        run: |
          cd dashboard
          bun install --frozen-lockfile
          bun run build
      - name: Commit refreshed assets and remove helper
        run: |
          rm .github/workflows/pr2848-dashboard-assets.yml
          git config user.name 'Michael Kantor'
          git config user.email '6068672+kantorcodes@users.noreply.github.com'
          git add src/codex_plugin_scanner/guard/daemon/static .github/workflows/pr2848-dashboard-assets.yml
          git diff --cached --check
          git commit -m 'build: refresh dashboard assets after main sync'
          git push origin HEAD:chore/sync-main-into-release-3.2-20260907
