name: CI scheduling-sensitive
description: Run the scheduling-sensitive checks inside the existing CI job.
inputs:
  python-version:
    description: Explicit python-version from the calling job.
    required: true
runs:
  using: composite
  steps:
  - uses: ./.github/actions/setup-ci-python
    with:
      python-version: ${{ inputs.python-version }}
      cache-dependency-glob: ${{ env.CI_UV_CACHE_DEPENDENCY_GLOB }}
  - name: Download native command evaluators
    uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
    with:
      name: pytest-native-command-evaluators
      path: rust/target/release
  - name: Download matching native command projections
    uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
    with:
      name: pytest-native-command-projections
      path: .
  - name: Bind the compiled native runtime
    run: |
      chmod 0755 rust/target/release/hol-guard-runtime
      echo "HOL_GUARD_NATIVE_BINARY=$GITHUB_WORKSPACE/rust/target/release/hol-guard-runtime" >> "$GITHUB_ENV"
    shell: bash
  - name: Run scheduling-sensitive tests untraced
    run: uv run --no-sync pytest tests/test_guard_extension_control_recovery.py tests/test_guard_sandbox.py tests/test_guard_js_lockfile_resolution_phase11.py
      tests/test_guard_runtime_hook_scheduler.py tests/test_guard_hook_process_runner.py::test_scheduler_and_runner_complete_48_routine_reviews_without_capacity_denial
      tests/test_guard_daemon_storage_liveness.py::test_locked_storage_hook_burst_fails_safe_without_stranding_daemon tests/test_guard_approval_store_scale.py::TestQueueScaleTargets::test_listing_first_queue_page_with_100k_rows_stays_under_100ms
      tests/test_guard_continuation_contract.py tests/test_guard_approval_store_scale.py::TestQueueScaleTargets::test_listing_queue_page_without_totals_stays_under_50ms_with_100k_rows
      tests/test_guard_approval_store_scale.py::TestQueueScaleTargets::test_resolving_one_request_with_100k_rows_stays_under_100ms
      tests/test_guard_daemon_acceptance.py::test_packaged_correctness_workloads[mixed-harness-fairness] tests/test_guard_omp_fast_path_regression.py::test_omp_post_tool_read_burst_uses_resident_scanner
      tests/test_guard_cloud_review_runtime_recovery.py::test_cloud_review_worker_survives_ten_thousand_recurring_disconnects
      tests/test_rust_io_ownership_gate.py::test_gate_inventories_reachable_io_and_passes_current_sources --tb=short
    shell: bash
