name: Apply PR 2745 future-schema write guard

on:
  push:
    branches:
      - feat/everyday-mode-r32-final

permissions:
  contents: write

concurrency:
  group: pr2745-future-schema-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/everyday-mode-r32-final
          fetch-depth: 0

      - name: Apply reviewed fix and regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text(encoding="utf-8")
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}")
              target.write_text(content.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/codex_plugin_scanner/guard/presentation_settings.py",
              """    current_explicit: bool,
              current_revision: int,
          ) -> PresentationSettingsUpdate:
          """,
              """    current_explicit: bool,
              current_revision: int,
              current_writable: bool = True,
          ) -> PresentationSettingsUpdate:
          """,
          )

          replace_once(
              "src/codex_plugin_scanner/guard/presentation_settings.py",
              """    if requested:
              expected_revision = payload.get(\"presentation_revision\")
              if expected_revision is not None and expected_revision != current_revision:
                  raise ValueError(\"Presentation preference changed on another surface. Reload settings and try again.\")
          return PresentationSettingsUpdate(
              requested=requested,
              changed=requested and (mode != current_mode or explicit != current_explicit),
              mode=mode,
              explicit=explicit,
          )
          """,
              """    changed = requested and (mode != current_mode or explicit != current_explicit)
              if requested:
              expected_revision = payload.get(\"presentation_revision\")
              if expected_revision is not None and expected_revision != current_revision:
                  raise ValueError(\"Presentation preference changed on another surface. Reload settings and try again.\")
              if changed and not current_writable:
                  raise ValueError(
                      \"Presentation settings use a newer schema and cannot be changed by this Guard version.\"
                  )
          return PresentationSettingsUpdate(
              requested=requested,
              changed=changed,
              mode=mode,
              explicit=explicit,
          )
          """,
          )

          replace_once(
              "src/codex_plugin_scanner/guard/config.py",
              """        current_mode=coerce_presentation_mode_write(current_config.presentation_mode),
              current_explicit=current_config.presentation_mode_explicit,
              current_revision=current_config.presentation_revision,
          )
          """,
              """        current_mode=coerce_presentation_mode_write(current_config.presentation_mode),
              current_explicit=current_config.presentation_mode_explicit,
              current_revision=current_config.presentation_revision,
              current_writable=current_config.presentation_diagnostic
              != UNSUPPORTED_PRESENTATION_SCHEMA_DIAGNOSTIC,
          )
          """,
          )

          replace_once(
              "tests/test_guard_presentation_mode.py",
              """    assert 'presentation_mode = \"future\"' in persisted
              assert \"presentation_schema_version = 99\" in persisted


          def test_revision_only_write_is_rejected(tmp_path: Path) -> None:
          """,
              """    assert 'presentation_mode = \"future\"' in persisted
              assert \"presentation_schema_version = 99\" in persisted
              before = config_path.read_text(encoding=\"utf-8\")
              with pytest.raises(ValueError, match=\"newer schema\"):
                  update_guard_settings(
                      guard_home,
                      {
                          \"presentation_mode\": \"technical\",
                          \"presentation_revision\": current.presentation_revision,
                      },
                      skip_approval_gate=True,
                  )
              assert config_path.read_text(encoding=\"utf-8\") == before


          def test_revision_only_write_is_rejected(tmp_path: Path) -> None:
          """,
          )

          baseline_path = Path("ci/test-suite-ratchet-baseline.json")
          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
          if baseline.get("maximum_collected_cases") != 16455 or baseline.get("maximum_test_source_lines") != 354853:
              raise SystemExit(f"unexpected ratchet baseline: {baseline}")
          baseline["maximum_test_source_lines"] = 354864
          baseline_path.write_text(json.dumps(baseline, indent=2) + "\n", encoding="utf-8")

          Path(".github/workflows/pr2745-future-schema-fix.yml").unlink()
          PY

          python -m compileall -q \
            src/codex_plugin_scanner/guard/config.py \
            src/codex_plugin_scanner/guard/presentation_settings.py \
            tests/test_guard_presentation_mode.py

      - name: Commit fix to the existing PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Michael Kantor"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git add \
            src/codex_plugin_scanner/guard/config.py \
            src/codex_plugin_scanner/guard/presentation_settings.py \
            tests/test_guard_presentation_mode.py \
            ci/test-suite-ratchet-baseline.json \
            .github/workflows/pr2745-future-schema-fix.yml
          git diff --cached --check
          git commit -m "fix: preserve unsupported presentation schemas"
          git push origin HEAD:feat/everyday-mode-r32-final
