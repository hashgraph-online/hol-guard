name: Upstream drift

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-drift
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Compare reviewed upstream pins with current releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.upstream_drift --json upstream-drift.json
      - name: Keep the drift report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: upstream-drift
          path: upstream-drift.json
          if-no-files-found: ignore
          retention-days: 30
