[workspace]
members = [
    "crates/guard-contracts",
    "crates/guard-rules",
    "crates/guard-scanner",
    "crates/guard-secure-fs",
    "crates/guard-hook-core",
    "crates/guard-policy-snapshot",
    "crates/guard-runtime",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
hex = "0.4.3"
libc = "0.2.175"
regex = "1.11.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
thiserror = "2.0.16"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
correctness = "deny"
suspicious = "deny"
