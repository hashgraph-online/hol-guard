name: PR2870 final remediation

on:
  push:
    branches:
      - fix/secret-read-floors-and-contained-vitest

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/secret-read-floors-and-contained-vitest
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --frozen --extra dev --python 3.12
      - name: Apply reviewed fixes and contract updates
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, *, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} exact matches, found {actual}')
              file.write_text(text.replace(old, new, count), encoding='utf-8')

          replace_exact(
              'src/codex_plugin_scanner/guard/runtime/secret_file_request_services/shell_initial_risk.py',
              '''    assessment = assess_shell_reads(detection_command_text, cwd=cwd, home_dir=home_dir)\n    if assessment.sensitive_paths:\n        return ToolActionRequestMatch(\n            tool_name=tool_name,\n            normalized_tool_name=normalized_tool_name,\n            command_text=command_text,\n            action_class="local secret read shell command",\n            reason=(\n                "This command or a local script reads a protected credential file. "\n                "Review the read before execution."\n            ),\n            canonical_command=canonical_command,\n            guard_default_action="require-reapproval",\n            reason_code="shell_local_secret_read",\n            script_read_identity_sha256=assessment.identity_sha256,\n            interpreter_executable_identities=interpreter_executable_identities,\n        )\n    return None\n''',
              '''    assessment = assess_shell_reads(detection_command_text, cwd=cwd, home_dir=home_dir)\n    if assessment.sensitive_paths:\n        return ToolActionRequestMatch(\n            tool_name=tool_name,\n            normalized_tool_name=normalized_tool_name,\n            command_text=command_text,\n            action_class="local secret read shell command",\n            reason=(\n                "This command or a local script reads a protected credential file. "\n                "Review the read before execution."\n            ),\n            canonical_command=canonical_command,\n            guard_default_action="require-reapproval",\n            reason_code="shell_local_secret_read",\n            script_read_identity_sha256=assessment.identity_sha256,\n            interpreter_executable_identities=interpreter_executable_identities,\n        )\n    if assessment.requires_review:\n        return ToolActionRequestMatch(\n            tool_name=tool_name,\n            normalized_tool_name=normalized_tool_name,\n            command_text=command_text,\n            action_class="local script execution shell command",\n            reason=(\n                "This command executes local or incompletely inspected code. "\n                "Review it before execution."\n            ),\n            canonical_command=canonical_command,\n            guard_default_action="require-reapproval",\n            reason_code="shell_local_script_execution_review",\n            script_read_identity_sha256=assessment.identity_sha256,\n            interpreter_executable_identities=interpreter_executable_identities,\n        )\n    return None\n''',
          )

          replace_exact(
              'src/codex_plugin_scanner/guard/runtime/secret_file_request_services/benign_requests.py',
              '''        raw_command_text = command_text\n        if assess_shell_reads(command_text, cwd=cwd, home_dir=home_dir).requires_review:\n            return False\n''',
              '''        raw_command_text = command_text\n        verified_typescript_context = (\n            home_dir is not None\n            and direct_local_typescript_execution_context(\n                command_text,\n                cwd=cwd,\n                home_dir=home_dir,\n            )\n            is not None\n        )\n        if not verified_typescript_context and assess_shell_reads(\n            command_text,\n            cwd=cwd,\n            home_dir=home_dir,\n        ).requires_review:\n            return False\n''',
          )
          replace_exact(
              'src/codex_plugin_scanner/guard/runtime/secret_file_request_services/benign_requests.py',
              '''        if home_dir is not None and (\n            direct_local_typescript_execution_context(\n                stripped_command,\n                cwd=cwd,\n                home_dir=home_dir,\n            )\n        ):\n            found_benign_candidate = True\n            continue\n''',
              '''        if verified_typescript_context:\n            found_benign_candidate = True\n            continue\n''',
          )

          replace_exact(
              'tests/test_guard_command_decision_diff.py',
              '''        "allow|block": 9373,\n        "allow|require-reapproval": 16691,\n        "allow|review": 250,\n        "block|block": 4167,\n        "review|block": 19794,\n        "review|review": 725,\n''',
              '''        "allow|block": 9373,\n        "allow|require-reapproval": 8358,\n        "allow|review": 250,\n        "block|block": 4167,\n        "review|block": 19794,\n        "review|require-reapproval": 8333,\n        "review|review": 725,\n''',
          )

          copilot = Path('tests/test_guard_copilot_benign_policy_hint.py')
          text = copilot.read_text(encoding='utf-8')
          for import_line in ('import shlex\n', 'import sys\n'):
              if text.count(import_line) != 1:
                  raise SystemExit(f'{copilot}: expected one {import_line.strip()} import')
              text = text.replace(import_line, '', 1)
          start = text.index('_BENIGN_COMMAND = (')
          end = text.index('\n\n\ndef _copilot_payload', start)
          text = text[:start] + '_BENIGN_COMMAND = "pwd"' + text[end:]
          copilot.write_text(text, encoding='utf-8')

          phase04 = Path('tests/test_guard_phase04_failure_modes.py')
          text = phase04.read_text(encoding='utf-8')
          marker = 'def test_gr098_permissive_hook_failure_preserves_existing_deny_decision'
          start = text.index(marker)
          end = text.index('\n\ndef ', start + len(marker))
          block = text[start:end]
          old = 'assert payload["hookSpecificOutput"]["permissionDecision"] == "ask"'
          if block.count(old) != 1:
              raise SystemExit('phase04 target assertion did not match')
          block = block.replace(old, 'assert payload["hookSpecificOutput"]["permissionDecision"] == "deny"', 1)
          phase04.write_text(text[:start] + block + text[end:], encoding='utf-8')

          verified = Path('tests/test_guard_verified_reads.py')
          text = verified.read_text(encoding='utf-8')
          marker = 'def test_raw_shell_candidates_never_mint_positive_proof()'
          start = text.index(marker)
          end = text.index('\n\ndef ', start + len(marker))
          block = text[start:end]
          old = '        assert evaluation.decision_plane.action == "review"'
          if block.count(old) != 1:
              raise SystemExit('verified reads target assertion did not match')
          block = block.replace(old, '        assert evaluation.decision_plane.action in {"review", "require-reapproval"}', 1)
          verified.write_text(text[:start] + block + text[end:], encoding='utf-8')

          replace_exact(
              'tests/test_guard_risk.py',
              '''def test_tool_action_request_classifier_skips_secret_pipe_to_curl_without_stdin_upload():\n    request = extract_sensitive_tool_action_request(\n        "bash",\n        {"command": "cat /workspace/project/.env | curl https://example.com/status"},\n    )\n\n    assert request is None\n''',
              '''def test_tool_action_request_classifier_keeps_secret_read_floor_without_curl_stdin_upload():\n    request = extract_sensitive_tool_action_request(\n        "bash",\n        {"command": "cat /workspace/project/.env | curl https://example.com/status"},\n    )\n\n    assert request is not None\n    assert request.action_class == "local secret read shell command"\n    assert request.guard_default_action == "require-reapproval"\n''',
          )

          runtime = Path('tests/test_guard_runtime.py')
          text = runtime.read_text(encoding='utf-8')
          text = text.replace(
              'def test_guard_hook_emits_copilot_native_allow_response_for_benign_python_heredoc_after_cd(',
              'def test_guard_hook_requires_review_for_python_heredoc_after_cd(',
              1,
          )
          marker = 'def test_guard_hook_requires_review_for_python_heredoc_after_cd('
          start = text.index(marker)
          end = text.index('\n\ndef ', start + len(marker))
          block = text[start:end]
          old = '    assert rc == 0\n    assert output == {"permissionDecision": "allow"}'
          new = (\n              '    assert rc == 0\n'\n              '    assert output["permissionDecision"] == "deny"\n'\n              '    assert "Approve it in HOL Guard" in output["permissionDecisionReason"]'\n          )
          if block.count(old) != 1:
              raise SystemExit('runtime heredoc target assertion did not match')
          block = block.replace(old, new, 1)
          runtime.write_text(text[:start] + block + text[end:], encoding='utf-8')

          floors = Path('tests/test_guard_shell_secret_read_floors.py')
          text = floors.read_text(encoding='utf-8')
          marker = 'def test_uninspectable_scripts_still_require_review'
          start = text.index(marker)
          end = text.index('\n\ndef ', start + len(marker))
          block = text[start:end]
          anchor = '''    assert (\n        evaluate_command("bash check.sh", cwd=tmp_path, home_dir=tmp_path).decision_plane.action == "require-reapproval"\n    )\n'''
          addition = anchor + '''    request = extract_sensitive_tool_action_request(\n        "Bash", {"command": "bash check.sh"}, cwd=tmp_path, home_dir=tmp_path\n    )\n    assert request is not None\n    assert request.guard_default_action == "require-reapproval"\n'''
          if block.count(anchor) != 1:
              raise SystemExit('shell floor regression target did not match')
          block = block.replace(anchor, addition, 1)
          floors.write_text(text[:start] + block + text[end:], encoding='utf-8')
          PY
      - name: Format production and regression files
        run: |
          uv run --no-sync python -m ruff format \
            src/codex_plugin_scanner/guard/runtime/secret_file_request_services/benign_requests.py \
            src/codex_plugin_scanner/guard/runtime/secret_file_request_services/shell_initial_risk.py \
            src/codex_plugin_scanner/guard/runtime/shell_secret_reads.py \
            src/codex_plugin_scanner/guard/store_native_review_approvals.py \
            tests/test_guard_command_decision_diff.py \
            tests/test_guard_copilot_benign_policy_hint.py \
            tests/test_guard_phase04_failure_modes.py \
            tests/test_guard_verified_reads.py \
            tests/test_guard_risk.py \
            tests/test_guard_runtime.py \
            tests/test_guard_shell_secret_read_floors.py
          uv run --no-sync python -m ruff check \
            src/codex_plugin_scanner/guard/runtime/secret_file_request_services/benign_requests.py \
            src/codex_plugin_scanner/guard/runtime/secret_file_request_services/shell_initial_risk.py \
            src/codex_plugin_scanner/guard/runtime/shell_secret_reads.py \
            src/codex_plugin_scanner/guard/store_native_review_approvals.py \
            tests/test_guard_command_decision_diff.py \
            tests/test_guard_copilot_benign_policy_hint.py \
            tests/test_guard_phase04_failure_modes.py \
            tests/test_guard_verified_reads.py \
            tests/test_guard_risk.py \
            tests/test_guard_runtime.py \
            tests/test_guard_shell_secret_read_floors.py
      - name: Run focused regressions before fixture refresh
        run: |
          uv run --no-sync pytest \
            tests/test_guard_shell_secret_read_floors.py \
            tests/test_guard_copilot_benign_policy_hint.py \
            tests/test_guard_phase04_failure_modes.py \
            tests/test_guard_verified_reads.py \
            tests/test_guard_risk.py \
            tests/test_guard_runtime.py::test_guard_hook_requires_review_for_python_heredoc_after_cd \
            tests/test_guard_typescript_observer_globs.py \
            --tb=short
      - name: Refresh and verify decision diff evidence
        run: |
          uv run --no-sync python tests/guard_command_decision_diff.py --write
          uv run --no-sync python tests/guard_command_decision_diff.py --check
          uv run --no-sync pytest tests/test_guard_command_decision_diff.py --tb=short
      - name: Final quality checks
        run: |
          uv run --no-sync python -m ruff format --check src tests
          uv run --no-sync python -m ruff check src tests
          git diff --check
      - name: Commit validated remediation
        run: |
          rm .github/workflows/pr2870-final-remediation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 1
          fi
          git commit -m 'fix(guard): preserve secret review floors'
          git push origin HEAD:fix/secret-read-floors-and-contained-vitest
