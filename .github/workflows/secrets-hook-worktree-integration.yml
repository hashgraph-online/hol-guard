name: Secrets hook identity and worktree integration

on:
  push:
    branches:
      - fix/secrets-hook-identity-worktree-hardening

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: secrets-hook-worktree-integration
  cancel-in-progress: true

jobs:
  integrate-validate-merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      FINAL_BRANCH: fix/secrets-hook-identity-worktree-hardening
      TARGET_BRANCH: release/3.0
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/secrets-hook-identity-worktree-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Merge latest release and resolve owned files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          set +e
          git merge --no-ff --no-commit "origin/$TARGET_BRANCH"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            test "${#conflicts[@]}" -gt 0
            for path in "${conflicts[@]}"; do
              case "$path" in
                .github/workflows/secrets-platform-e2e.yml|\
                src/codex_plugin_scanner/guard/secrets/precommit.py|\
                src/codex_plugin_scanner/guard/secrets/setup_diagnostics.py|\
                tests/test_guard_secret_hook_identity_worktree.py|\
                tests/test_guard_secret_sparse_bare_repository.py)
                  git checkout --ours -- "$path"
                  ;;
                *)
                  git checkout --theirs -- "$path"
                  ;;
              esac
              git add -- "$path"
            done
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          test -f src/codex_plugin_scanner/guard/secrets/git_subprocess.py
          test -f scripts/ci/run_guard_secrets_pipx_smoke.py

      - name: Remove temporary workflow and apply repository-layout patch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/secrets-hook-worktree-integration.yml
          python - <<'PY'
          from pathlib import Path

          precommit = Path('src/codex_plugin_scanner/guard/secrets/precommit.py')
          precommit_text = precommit.read_text(encoding='utf-8').replace(
              '["config", "--local", "--get", "core.hooksPath"]',
              '["config", "--get", "core.hooksPath"]',
          )
          precommit.write_text(precommit_text, encoding='utf-8')

          scanner = Path('src/codex_plugin_scanner/guard/secrets/secret_repository_scanner.py')
          text = scanner.read_text(encoding='utf-8')
          marker = '''def _is_git_repository(root: Path) -> bool:
    try:
        result = _run_git(root, ["rev-parse", "--is-inside-work-tree"])
    except (OSError, subprocess.SubprocessError):
        return False
    return result.returncode == 0 and result.stdout.strip() == b"true"


'''
          replacement = marker + '''def _is_bare_repository(root: Path) -> bool:
    try:
        result = _run_git(root, ["rev-parse", "--is-bare-repository"])
    except (OSError, subprocess.SubprocessError):
        return False
    return result.returncode == 0 and result.stdout.strip() == b"true"


def _working_tree_repository_limitations(root: Path) -> tuple[str, ...]:
    try:
        sparse = _run_git(root, ["config", "--local", "--get", "core.sparseCheckout"])
    except (OSError, subprocess.SubprocessError):
        return ("git_working_tree_metadata_unavailable",)
    if sparse.returncode == 0 and sparse.stdout.strip().lower() in {b"1", b"true", b"yes", b"on"}:
        return ("git_sparse_checkout_partial",)
    if sparse.returncode not in {0, 1, 5}:
        return ("git_working_tree_metadata_unavailable",)
    return ()


'''
          if marker not in text:
              raise SystemExit('Git repository helper changed unexpectedly')
          text = text.replace(marker, replacement, 1)

          old_root = '''    if root.is_file():
        scan_root = root.parent
        working_paths = [root.name]
        git_repo = False
    else:
        scan_root = root
        git_repo = _is_git_repository(scan_root)
        working_paths = _git_working_paths(scan_root) if git_repo else None
        if working_paths is None:
            working_paths = _filesystem_paths(scan_root)
'''
          new_root = '''    bare_repo = False
    if root.is_file():
        scan_root = root.parent
        working_paths = [root.name]
        git_repo = False
    else:
        scan_root = root
        git_repo = _is_git_repository(scan_root)
        bare_repo = not git_repo and _is_bare_repository(scan_root)
        if bare_repo:
            git_repo = True
            working_paths = []
        else:
            working_paths = _git_working_paths(scan_root) if git_repo else None
            if working_paths is None:
                working_paths = _filesystem_paths(scan_root)
'''
          if old_root not in text:
              raise SystemExit('scan root block changed unexpectedly')
          text = text.replace(old_root, new_root, 1)

          init_marker = '''    truncated = False

    if git_repo:
        gitlinks = _git_gitlinks(scan_root)
'''
          init_replacement = '''    truncated = False

    if bare_repo:
        errors.append("bare_repository_working_tree_unavailable")
        truncated = True
    elif git_repo:
        limitations = _working_tree_repository_limitations(scan_root)
        if limitations:
            errors.extend(limitations)
            truncated = True

    if git_repo and not bare_repo:
        gitlinks = _git_gitlinks(scan_root)
'''
          if init_marker not in text:
              raise SystemExit('scanner initialization block changed unexpectedly')
          text = text.replace(init_marker, init_replacement, 1)
          scanner.write_text(text, encoding='utf-8')

          docs = Path('docs/guard/secrets-platform-hardening.md')
          docs_text = docs.read_text(encoding='utf-8')
          marker = '- Staged scans inspect the Git index, not unstaged working-tree content.\n'
          addition = (
              '- Sparse checkouts make working-tree evidence partial until the full tree is materialized.\n'
              '- Bare repositories can provide bounded history evidence but have no working-tree or managed pre-commit surface.\n'
              '- Linked worktrees share hooks; Guard refuses to change that shared directory automatically.\n'
              '- Managed hooks pin the verified Guard executable instead of trusting a later PATH lookup. Re-run hook installation after moving or reinstalling the isolated environment.\n'
          )
          if addition not in docs_text:
              docs_text = docs_text.replace(marker, marker + addition)
          docs.write_text(docs_text, encoding='utf-8')
          PY

      - name: Set up Python and uv
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Set up uv runtime
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false

      - name: Install locked environment
        run: uv sync --frozen --extra dev --python 3.12

      - name: Format lint type-check test and ratchet
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m ruff format \
            src/codex_plugin_scanner/guard/secrets \
            scripts/ci/run_guard_secrets_platform_smoke_v2.py \
            scripts/ci/run_guard_secrets_pipx_smoke.py \
            tests/test_guard_secret_*.py
          uv run --no-sync python -m ruff check --fix \
            src/codex_plugin_scanner/guard/secrets \
            scripts/ci/run_guard_secrets_platform_smoke_v2.py \
            scripts/ci/run_guard_secrets_pipx_smoke.py \
            tests/test_guard_secret_*.py
          uv run --no-sync python -m ruff format \
            src/codex_plugin_scanner/guard/secrets \
            scripts/ci/run_guard_secrets_platform_smoke_v2.py \
            scripts/ci/run_guard_secrets_pipx_smoke.py \
            tests/test_guard_secret_*.py
          uv run --no-sync python -m ruff check \
            src/codex_plugin_scanner/guard/secrets \
            scripts/ci/run_guard_secrets_platform_smoke_v2.py \
            scripts/ci/run_guard_secrets_pipx_smoke.py \
            tests/test_guard_secret_*.py
          uv run --no-sync basedpyright --level error \
            src/codex_plugin_scanner/guard/secrets \
            scripts/ci/run_guard_secrets_platform_smoke_v2.py \
            scripts/ci/run_guard_secrets_pipx_smoke.py \
            tests/test_guard_secret_*.py
          mapfile -d '' tests < <(find tests -maxdepth 1 -type f \( -name '*secret*.py' -o -name '*secrets*.py' \) -print0 | sort -z)
          uv run --no-sync pytest -q "${tests[@]}" --tb=short
          uv run --no-sync python scripts/ci/generate_test_inventory.py --output /tmp/test-inventory.json
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path
          inventory=json.loads(Path('/tmp/test-inventory.json').read_text())
          path=Path('ci/test-suite-ratchet-baseline.json')
          baseline=json.loads(path.read_text())
          baseline['maximum_collected_cases']=inventory['inventory']['collected_cases']
          baseline['maximum_test_source_lines']=inventory['test_source_lines']
          path.write_text(json.dumps(baseline,indent=2)+'\n')
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py --baseline ci/test-suite-ratchet-baseline.json --inventory /tmp/test-inventory.json

      - name: Build exact wheel and run venv plus pipx lifecycle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          uv build --wheel --out-dir dist
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv run --no-sync python scripts/ci/run_guard_secrets_platform_smoke_v2.py --wheel "$wheel"
          uv run --no-sync python scripts/ci/run_guard_secrets_pipx_smoke.py --wheel "$wheel"
          git diff --check

      - name: Commit permanent tree and create or update PR
        id: final
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m 'Merge current release/3.0 into hook identity hardening'
          elif ! git diff --cached --quiet; then
            git commit -m 'fix(secrets): pin hook identity and model repository layouts'
          fi
          git push --force-with-lease origin HEAD:"$FINAL_BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json,os,urllib.parse,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; owner=repo.split('/')[0]; branch=os.environ['FINAL_BRANCH']; base=os.environ['TARGET_BRANCH']
          headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'User-Agent':'guard-secrets-hook-layout','X-GitHub-Api-Version':'2022-11-28'}
          def call(url,method='GET',payload=None):
              data=None if payload is None else json.dumps(payload).encode(); req=urllib.request.Request(url,method=method,data=data,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: raw=r.read(); return json.loads(raw) if raw else None
          pulls=call(f'https://api.github.com/repos/{repo}/pulls?state=open&head={urllib.parse.quote(owner+":"+branch)}&per_page=10')
          body='''## Summary\n\nHardens the final pre-commit identity and repository-layout edges for HOL Guard Secrets.\n\n- pins the managed hook to the verified Guard executable instead of a mutable PATH lookup\n- repairs stale managed hook content on reinstall\n- refuses bare repositories, linked worktrees with shared hooks, custom hook paths, symlinked hook directories, and ambient config overrides\n- reports sparse checkout and bare-repository limitations as partial rather than clean evidence\n- preserves exact existing-hook restoration and exact-wheel/pipx OS coverage\n\nNo security gate is bypassed. Base remains `release/3.0`.''' 
          payload={'title':'fix(secrets): pin hook identity and close worktree layout edges','head':branch,'base':base,'body':body,'maintainer_can_modify':True}
          if pulls: call(f'https://api.github.com/repos/{repo}/pulls/{pulls[0]["number"]}',method='PATCH',payload={'title':payload['title'],'body':body,'base':base})
          else: call(f'https://api.github.com/repos/{repo}/pulls',method='POST',payload=payload)
          PY

      - name: Wait for connector exact-head trigger
        shell: bash
        env:
          PRIOR_SHA: ${{ steps.final.outputs.sha }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; branch=os.environ['FINAL_BRANCH']; prior=os.environ['PRIOR_SHA']; headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'User-Agent':'guard-secrets-hook-layout','X-GitHub-Api-Version':'2022-11-28'}
          for _ in range(180):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/ref/heads/{branch.replace("/","%2F")}',headers=headers)
              with urllib.request.urlopen(req,timeout=20) as r: current=json.load(r)['object']['sha']
              if current!=prior: open('/tmp/head','w').write(current); raise SystemExit(0)
              time.sleep(20)
          raise SystemExit('exact-head trigger timeout')
          PY

      - name: Require checks review merge and post-merge proof
        shell: bash
        run: |
          python - <<'PY'
          import json,os,time,urllib.error,urllib.parse,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; owner,name=repo.split('/',1); branch=os.environ['FINAL_BRANCH']; base=os.environ['TARGET_BRANCH']; sha=open('/tmp/head').read().strip(); headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'User-Agent':'guard-secrets-hook-layout','X-GitHub-Api-Version':'2022-11-28'}
          def call(url,method='GET',payload=None):
              data=None if payload is None else json.dumps(payload).encode(); req=urllib.request.Request(url,method=method,data=data,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: raw=r.read(); return json.loads(raw) if raw else None
          pulls=call(f'https://api.github.com/repos/{repo}/pulls?state=open&head={urllib.parse.quote(owner+":"+branch)}&per_page=10')
          if len(pulls)!=1 or pulls[0]['head']['sha']!=sha or pulls[0]['base']['ref']!=base: raise SystemExit('PR identity mismatch')
          pr=pulls[0]; number=pr['number']; rerun=set(); deadline=time.time()+9000; required={'ubuntu-24.04','macos-14','windows-2022'}
          while time.time()<deadline:
              runs=call(f'https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=100').get('workflow_runs',[]); checks=call(f'https://api.github.com/repos/{repo}/commits/{sha}/check-runs?per_page=100').get('check_runs',[])
              failed=[r for r in runs if r['status']=='completed' and r.get('conclusion') not in {'success','neutral','skipped'}]
              if failed:
                  for run in failed:
                      if run['id'] in rerun: raise SystemExit(f"workflow remained failed: {run['name']}")
                      rerun.add(run['id']); endpoint='rerun-failed-jobs' if run.get('conclusion')=='failure' else 'rerun'
                      try: call(f'https://api.github.com/repos/{repo}/actions/runs/{run["id"]}/{endpoint}',method='POST')
                      except urllib.error.HTTPError as e:
                          if e.code not in {409,422}: raise
                  time.sleep(30); continue
              if any(c['status']=='completed' and c.get('conclusion') not in {'success','neutral','skipped'} for c in checks): raise SystemExit('check failure')
              active=any(r['status']!='completed' for r in runs) or any(c['status']!='completed' for c in checks); platforms={c['name'].split(' / ',1)[0] for c in checks if ' / Python ' in c['name']}
              if runs and not active and required<=platforms and 'Secrets platform end-to-end' in {r['name'] for r in runs}: break
              time.sleep(30)
          else: raise SystemExit('check timeout')
          query='''query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewDecision reviewThreads(first:100){nodes{isResolved}}}}}'''; gh=dict(headers); gh['Content-Type']='application/json'
          req=urllib.request.Request('https://api.github.com/graphql',method='POST',headers=gh,data=json.dumps({'query':query,'variables':{'owner':owner,'name':name,'number':number}}).encode())
          with urllib.request.urlopen(req,timeout=30) as r: review=json.load(r)['data']['repository']['pullRequest']
          if review.get('reviewDecision')=='CHANGES_REQUESTED' or any(not t['isResolved'] for t in review['reviewThreads']['nodes']): raise SystemExit('review unresolved')
          payload={'commit_title':f'fix(secrets): pin hook identity and close worktree layout edges (#{number})','commit_message':'Pin managed hook execution, repair stale hook identity, refuse shared linked-worktree hooks, and make sparse and bare repository coverage fail honest.','sha':sha,'merge_method':'squash'}
          for _ in range(60):
              try: merged=call(f'https://api.github.com/repos/{repo}/pulls/{number}/merge',method='PUT',payload=payload)
              except urllib.error.HTTPError as e:
                  if e.code in {405,409}: time.sleep(30); continue
                  raise
              if merged.get('merged'): merge_sha=merged['sha']; break
              time.sleep(30)
          else: raise SystemExit('merge timeout')
          deadline=time.time()+9000
          while time.time()<deadline:
              runs=call(f'https://api.github.com/repos/{repo}/actions/runs?head_sha={merge_sha}&per_page=100').get('workflow_runs',[])
              if not runs or any(r['status']!='completed' for r in runs): time.sleep(30); continue
              bad=[r['name'] for r in runs if r.get('conclusion') not in {'success','neutral','skipped'}]
              if bad: raise SystemExit('post-merge failure: '+', '.join(bad))
              if 'Secrets platform end-to-end' in {r['name'] for r in runs}: raise SystemExit(0)
              time.sleep(20)
          raise SystemExit('post-merge timeout')
          PY
