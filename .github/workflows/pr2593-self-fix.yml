name: PR 2593 reconciliation fixer

on:
  push:
    branches:
      - chore/reconcile-main-into-release-3.0
    paths:
      - .github/workflows/pr2593-self-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: chore/reconcile-main-into-release-3.0
          fetch-depth: 0
      - name: Apply reconciliation fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/codex_plugin_scanner/guard/cli/update_commands.py",
              '        if installed_distribution is not None and installer != "desktop"\n',
              '        if installed_distribution is not None\n',
          )
          replace_once(
              "src/codex_plugin_scanner/guard/cli/update_commands.py",
              '            "status": "managed" if installer == "desktop" else "unavailable",\n',
              '            "status": "unavailable",\n',
          )

          replace_once(
              "src/codex_plugin_scanner/guard/daemon/manager.py",
              '        "HOME",\n        "LANG",\n',
              '        "HOME",\n        "HOL_GUARD_DESKTOP",\n        "HOL_GUARD_DESKTOP_RUNTIME_OWNER",\n        "HOL_GUARD_DESKTOP_VERSION",\n        "LANG",\n',
          )
          replace_once(
              "src/codex_plugin_scanner/guard/daemon/manager.py",
              '_GUARD_DAEMON_DESKTOP_ENV_KEYS = (\n    "HOL_GUARD_DESKTOP",\n    "HOL_GUARD_DESKTOP_RUNTIME_OWNER",\n    "HOL_GUARD_DESKTOP_VERSION",\n)\n',
              '_GUARD_DAEMON_DESKTOP_ENV_KEYS = ("HOL_GUARD_DESKTOP", "HOL_GUARD_DESKTOP_RUNTIME_OWNER", "HOL_GUARD_DESKTOP_VERSION")\n',
          )
          replace_once(
              "src/codex_plugin_scanner/guard/daemon/manager.py",
              '        env["PYINSTALLER_RESET_ENVIRONMENT"] = "1"\n        for key in _GUARD_DAEMON_DESKTOP_ENV_KEYS:\n',
              '        env["PYINSTALLER_RESET_ENVIRONMENT"] = "1"\n        env.setdefault("HOL_GUARD_DESKTOP", "1")\n        for key in _GUARD_DAEMON_DESKTOP_ENV_KEYS:\n',
          )

          replace_once(
              "src/codex_plugin_scanner/guard/store_extension_control_authority.py",
              '                view = self._read_extension_control_authority_locked(\n                    catalog_digest,\n                    migration_registry=registry,\n                )\n',
              '                self._require_compatible_extension_control_schema()\n                view = self._read_extension_control_authority_locked(catalog_digest, migration_registry=registry)\n',
          )
          replace_once(
              "src/codex_plugin_scanner/guard/store_extension_control_authority_support.py",
              'class _ExtensionControlAuthoritySupportMixin:\n    def _authority_key(self, *, required: bool) -> bytes | None:\n',
              'class _ExtensionControlAuthoritySupportMixin:\n    def _require_compatible_extension_control_schema(self) -> None:\n        with self._connect() as connection:\n            ensure_extension_control_authority_schema(connection)\n\n    def _authority_key(self, *, required: bool) -> bytes | None:\n',
          )
          PY
          git diff --check
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "Michael Kantor"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git add \
            src/codex_plugin_scanner/guard/cli/update_commands.py \
            src/codex_plugin_scanner/guard/daemon/manager.py \
            src/codex_plugin_scanner/guard/store_extension_control_authority.py \
            src/codex_plugin_scanner/guard/store_extension_control_authority_support.py
          git commit --signoff -m "fix(release): restore desktop and authority invariants"
          git push origin HEAD:chore/reconcile-main-into-release-3.0
