name: Prototype PR 2464 native Windows process inventory

on:
  push:
    branches:
      - fix/rust-daemon-edge-workflow-validation
    paths:
      - .github/workflows/tmp-fix-pr2464-windows-inventory.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype-pr-2464-windows-inventory
  cancel-in-progress: false

jobs:
  prototype:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/rust-daemon-edge-workflow-validation
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Prove bounded native process command-line discovery
        shell: python
        run: |
          from __future__ import annotations

          import ctypes
          import json
          import ntpath
          import os
          import sys
          from contextlib import suppress
          from ctypes import wintypes

          PROCESS_QUERY_LIMITED_INFORMATION = 0x00001000
          PROCESS_COMMAND_LINE_INFORMATION = 60
          MAX_PROCESS_COUNT = 65_536
          MAX_PATH_CHARS = 32_768
          MAX_COMMAND_LINE_BYTES = 1024 * 1024
          MAX_QUERY_BUFFER_BYTES = 128 * 1024

          class UnicodeString(ctypes.Structure):
              _fields_ = [
                  ("Length", wintypes.USHORT),
                  ("MaximumLength", wintypes.USHORT),
                  ("Buffer", ctypes.c_void_p),
              ]

          kernel32 = ctypes.WinDLL("kernel32", use_last_error=True)
          psapi = ctypes.WinDLL("psapi", use_last_error=True)
          ntdll = ctypes.WinDLL("ntdll", use_last_error=True)

          enum_processes = psapi.EnumProcesses
          enum_processes.argtypes = [
              ctypes.POINTER(wintypes.DWORD),
              wintypes.DWORD,
              ctypes.POINTER(wintypes.DWORD),
          ]
          enum_processes.restype = wintypes.BOOL

          open_process = kernel32.OpenProcess
          open_process.argtypes = [wintypes.DWORD, wintypes.BOOL, wintypes.DWORD]
          open_process.restype = wintypes.HANDLE

          query_image = kernel32.QueryFullProcessImageNameW
          query_image.argtypes = [
              wintypes.HANDLE,
              wintypes.DWORD,
              wintypes.LPWSTR,
              ctypes.POINTER(wintypes.DWORD),
          ]
          query_image.restype = wintypes.BOOL

          close_handle = kernel32.CloseHandle
          close_handle.argtypes = [wintypes.HANDLE]
          close_handle.restype = wintypes.BOOL

          query_process = ntdll.NtQueryInformationProcess
          query_process.argtypes = [
              wintypes.HANDLE,
              wintypes.ULONG,
              ctypes.c_void_p,
              wintypes.ULONG,
              ctypes.POINTER(wintypes.ULONG),
          ]
          query_process.restype = wintypes.LONG

          process_ids = (wintypes.DWORD * MAX_PROCESS_COUNT)()
          bytes_returned = wintypes.DWORD()
          assert enum_processes(
              process_ids,
              ctypes.sizeof(process_ids),
              ctypes.byref(bytes_returned),
          )
          assert bytes_returned.value % ctypes.sizeof(wintypes.DWORD) == 0
          process_count = bytes_returned.value // ctypes.sizeof(wintypes.DWORD)
          assert 0 < process_count < MAX_PROCESS_COUNT

          current_pid = os.getpid()
          current_name = ntpath.basename(sys.executable).lower()
          found_current = False
          candidate_count = 0
          command_line_bytes = 0
          failures: list[dict[str, object]] = []

          for raw_pid in process_ids[:process_count]:
              pid = int(raw_pid)
              if pid <= 0:
                  continue
              handle = open_process(PROCESS_QUERY_LIMITED_INFORMATION, False, pid)
              if not handle:
                  continue
              try:
                  image_buffer = ctypes.create_unicode_buffer(MAX_PATH_CHARS)
                  image_size = wintypes.DWORD(MAX_PATH_CHARS)
                  if not query_image(handle, 0, image_buffer, ctypes.byref(image_size)):
                      continue
                  image_name = ntpath.basename(image_buffer.value).lower()
                  if image_name != current_name:
                      continue
                  candidate_count += 1

                  required = wintypes.ULONG()
                  _ = query_process(
                      handle,
                      PROCESS_COMMAND_LINE_INFORMATION,
                      None,
                      0,
                      ctypes.byref(required),
                  )
                  if required.value < ctypes.sizeof(UnicodeString) or required.value > MAX_QUERY_BUFFER_BYTES:
                      failures.append({"pid": pid, "stage": "size", "required": required.value})
                      continue
                  raw_buffer = ctypes.create_string_buffer(required.value)
                  status = int(
                      query_process(
                          handle,
                          PROCESS_COMMAND_LINE_INFORMATION,
                          raw_buffer,
                          required.value,
                          ctypes.byref(required),
                      )
                  )
                  if status != 0:
                      failures.append({"pid": pid, "stage": "query", "status": status})
                      continue
                  value = ctypes.cast(raw_buffer, ctypes.POINTER(UnicodeString)).contents
                  raw_start = ctypes.addressof(raw_buffer)
                  raw_end = raw_start + ctypes.sizeof(raw_buffer)
                  buffer_start = int(value.Buffer or 0)
                  if (
                      value.Length <= 0
                      or value.Length % 2 != 0
                      or value.Length > value.MaximumLength
                      or buffer_start < raw_start
                      or buffer_start + value.Length > raw_end
                  ):
                      failures.append(
                          {
                              "pid": pid,
                              "stage": "unicode",
                              "length": int(value.Length),
                              "maximum": int(value.MaximumLength),
                              "buffer_in_range": raw_start <= buffer_start < raw_end,
                          }
                      )
                      continue
                  command_line = ctypes.wstring_at(buffer_start, value.Length // 2).strip()
                  encoded_size = len(command_line.encode("utf-8", errors="strict"))
                  command_line_bytes += encoded_size
                  assert command_line_bytes <= MAX_COMMAND_LINE_BYTES
                  if pid == current_pid:
                      found_current = bool(command_line)
                      print(
                          json.dumps(
                              {
                                  "current_pid": pid,
                                  "image_name": image_name,
                                  "command_line_bytes": encoded_size,
                                  "command_prefix": command_line[:500],
                              },
                              sort_keys=True,
                          )
                      )
              finally:
                  with suppress(OSError, TypeError, ValueError):
                      close_handle(handle)

          print(
              json.dumps(
                  {
                      "process_count": process_count,
                      "candidate_count": candidate_count,
                      "command_line_bytes": command_line_bytes,
                      "failure_count": len(failures),
                      "failures": failures[:20],
                      "found_current": found_current,
                  },
                  sort_keys=True,
              )
          )
          assert found_current
