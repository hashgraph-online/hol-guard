name: Dispatch PR 2593 CI

on:
  push:
    branches:
      - chore/reconcile-main-into-release-3.0
    paths:
      - .github/workflows/dispatch-pr-2593-ci.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: dispatch-pr-2593-ci
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remove dispatcher and run the full CI workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_BRANCH: chore/reconcile-main-into-release-3.0
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config commit.gpgsign false

          git rm .github/workflows/dispatch-pr-2593-ci.yml
          git -c commit.gpgsign=false commit \
            -m "ci: remove PR 2593 dispatcher" \
            -m "Signed-off-by: Michael Kantor <6068672+kantorcodes@users.noreply.github.com>"
          git push origin "HEAD:${PR_BRANCH}"

          payload="$(python -c 'import json, os; print(json.dumps({"ref": os.environ["PR_BRANCH"]}))')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            --data "${payload}"
