name: Restore current native command projections
description: Restore ignored resources without replacing public contribution records.
runs:
  using: composite
  steps:
    - name: Download matching native command projections
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: pytest-native-command-projections
        path: .
