name: Finalize Everyday Mode on release 3.2

on:
  push:
    branches:
      - feat/everyday-mode-r32-final

permissions:
  contents: write

concurrency:
  group: everyday-mode-r32-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out immutable branch head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Replay pinned completion patch
        shell: bash
        run: |
          set -euo pipefail
          source_branch='fix/everyday-mode-release-3.2-completion'
          source_sha='81fe59658da6d1c75342434f1e135d340463732e'
          git fetch --no-tags origin \
            "refs/heads/${source_branch}:refs/remotes/origin/${source_branch}"
          test "$(git rev-parse "origin/${source_branch}")" = "$source_sha"
          git show "$source_sha:.github/workflows/tmp-everyday-mode-release-32-completion.yml" \
            > "$RUNNER_TEMP/completion.yml"
          python - <<'PY'
          from pathlib import Path

          source = Path("/home/runner/work/_temp/completion.yml").read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == "PY")
          block = source[start:end]
          indent = min(len(line) - len(line.lstrip()) for line in block if line.strip())
          script = "\n".join(line[indent:] for line in block) + "\n"
          script = script.replace(
              "presentation_revision requires a presentation preference request.",
              "presentation_revision requires a presentation preference change.",
          )
          Path("/home/runner/work/_temp/apply-completion.py").write_text(script)
          PY
          python "$RUNNER_TEMP/apply-completion.py"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: '1.3.6'

      - name: Format and validate completion
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
          uv pip install 'ruff==0.15.17' 'pytest==9.0.3'
          targets=(
            src/codex_plugin_scanner/guard/presentation_mode.py
            src/codex_plugin_scanner/guard/presentation_migration.py
            src/codex_plugin_scanner/guard/config.py
            src/codex_plugin_scanner/guard/runtime/action_explanation_contract.py
            src/codex_plugin_scanner/guard/cli/commands_parser_desktop.py
            src/codex_plugin_scanner/guard/cli/commands_dispatch_desktop.py
            tests/test_guard_action_explanation_contract.py
            tests/test_guard_everyday_mode_completion.py
          )
          .venv/bin/ruff format "${targets[@]}"
          .venv/bin/ruff check --fix "${targets[@]}"
          .venv/bin/ruff check "${targets[@]}"
          .venv/bin/pytest -q \
            tests/test_guard_presentation_mode.py \
            tests/test_guard_action_explanation_contract.py \
            tests/test_guard_desktop_contract.py \
            tests/test_guard_everyday_mode_completion.py
          cd dashboard
          bun install --frozen-lockfile
          bun run test
          bun run build

      - name: Commit only verified product source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/everyday-mode-r32-finalize.yml
          git diff --check
          remaining_temp="$(
            git status --short --untracked-files=all |
              awk '{print $2}' |
              grep -E '^\.github/(workflows|everyday-payload)/' |
              grep -v '^\.github/workflows/everyday-mode-r32-finalize\.yml$' || true
          )"
          if [ -n "$remaining_temp" ]; then
            echo 'Temporary automation remained in the product diff:' >&2
            printf '%s\n' "$remaining_temp" >&2
            exit 1
          fi
          if find . -type f \( -name 'HOL_GUARD_EVERYDAY_MODE_PRD*' -o -name 'HOL_GUARD_EVERYDAY_MODE_TODO*' -o -name '*TAKEAWAY_PROMPT*' \) | grep -q .; then
            echo 'Private planning artifact found in product source.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: complete Everyday Mode presentation contracts'
          git push origin HEAD:feat/everyday-mode-r32-final
