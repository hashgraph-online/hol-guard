[workspace]
members = [
    "crates/guard-command",
    "crates/guard-contracts",
    "crates/guard-rules",
    "crates/guard-scanner",
    "crates/guard-secure-fs",
    "crates/guard-hook-core",
    "crates/guard-policy-snapshot",
    "crates/guard-rule-contract",
    "crates/guard-runtime",
    "crates/guard-runtime-windows-process",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
hex = "0.4.3"
getrandom = "0.3.3"
libc = "0.2.175"
nix = { version = "0.31.3", features = ["fs", "poll", "socket"] }
regex = "1.11.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
sysinfo = "=0.37.2"
thiserror = "2.0.16"
windows-permissions = "0.2.4"
winapi = "0.3.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
correctness = "deny"
suspicious = "deny"
