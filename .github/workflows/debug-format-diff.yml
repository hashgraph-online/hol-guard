name: Debug formatter diff

on:
  pull_request:
    paths:
      - "src/codex_plugin_scanner/guard/cli/update_subprocess.py"
      - ".github/workflows/debug-format-diff.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Install formatter
        run: python -m pip install --disable-pip-version-check ruff==0.15.17
      - name: Apply formatter and remove debug workflow
        run: |
          python -m ruff format src/codex_plugin_scanner/guard/cli/update_subprocess.py
          rm .github/workflows/debug-format-diff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/codex_plugin_scanner/guard/cli/update_subprocess.py .github/workflows/debug-format-diff.yml
          git diff --cached --check
          git commit -m "style(update): apply ruff formatter"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
