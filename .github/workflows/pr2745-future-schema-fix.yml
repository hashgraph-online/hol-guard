name: Apply PR 2745 future-schema write guard

on:
  push:
    branches:
      - feat/everyday-mode-r32-final

permissions:
  contents: write

concurrency:
  group: pr2745-future-schema-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/everyday-mode-r32-final
          fetch-depth: 0

      - name: Apply reviewed fix and regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          presentation_path = Path("src/codex_plugin_scanner/guard/presentation_settings.py")
          presentation = presentation_path.read_text(encoding="utf-8")
          function_start = presentation.index("def resolve_presentation_settings_update(")
          signature_end = presentation.index(") -> PresentationSettingsUpdate:", function_start)
          signature = presentation[function_start:signature_end]
          if "current_writable: bool" not in signature:
              revision_line = "    current_revision: int,\n"
              revision_at = presentation.index(revision_line, function_start, signature_end)
              insert_at = revision_at + len(revision_line)
              presentation = (
                  presentation[:insert_at]
                  + "    current_writable: bool = True,\n"
                  + presentation[insert_at:]
              )

          function_start = presentation.index("def resolve_presentation_settings_update(")
          next_function = presentation.index("\ndef apply_presentation_settings_update(", function_start)
          function_text = presentation[function_start:next_function]
          if "if changed and not current_writable:" not in function_text:
              block_start = presentation.index("    if requested:\n", function_start, next_function)
              return_start = presentation.index(
                  "    return PresentationSettingsUpdate(\n", block_start, next_function
              )
              validation = (
                  "    changed = requested and (mode != current_mode or explicit != current_explicit)\n"
                  "    if requested:\n"
                  "        expected_revision = payload.get(\"presentation_revision\")\n"
                  "        if expected_revision is not None and expected_revision != current_revision:\n"
                  "            raise ValueError(\n"
                  "                \"Presentation preference changed on another surface. Reload settings and try again.\"\n"
                  "            )\n"
                  "        if changed and not current_writable:\n"
                  "            raise ValueError(\n"
                  "                \"Presentation settings use a newer schema and cannot be changed by this Guard version.\"\n"
                  "            )\n"
              )
              presentation = presentation[:block_start] + validation + presentation[return_start:]

          function_start = presentation.index("def resolve_presentation_settings_update(")
          next_function = presentation.index("\ndef apply_presentation_settings_update(", function_start)
          function_text = presentation[function_start:next_function]
          old_changed = "        changed=requested and (mode != current_mode or explicit != current_explicit),\n"
          if old_changed in function_text:
              changed_at = presentation.index(old_changed, function_start, next_function)
              presentation = (
                  presentation[:changed_at]
                  + "        changed=changed,\n"
                  + presentation[changed_at + len(old_changed):]
              )
          if presentation.count("current_writable: bool = True") != 1:
              raise SystemExit("presentation write guard parameter was not applied exactly once")
          if presentation.count("if changed and not current_writable:") != 1:
              raise SystemExit("presentation write guard was not applied exactly once")
          ast.parse(presentation, filename=str(presentation_path))
          presentation_path.write_text(presentation, encoding="utf-8")

          config_path = Path("src/codex_plugin_scanner/guard/config.py")
          config = config_path.read_text(encoding="utf-8")
          update_start = config.index("def update_guard_settings(")
          call_start = config.index("    presentation_update = resolve_presentation_settings_update(\n", update_start)
          call_end = config.index("    )\n", call_start) + len("    )\n")
          call = config[call_start:call_end]
          if "current_writable=" not in call:
              revision_line = "        current_revision=current_config.presentation_revision,\n"
              revision_at = config.index(revision_line, call_start, call_end)
              insert_at = revision_at + len(revision_line)
              writable_argument = (
                  "        current_writable=(\n"
                  "            current_config.presentation_diagnostic\n"
                  "            != UNSUPPORTED_PRESENTATION_SCHEMA_DIAGNOSTIC\n"
                  "        ),\n"
              )
              config = config[:insert_at] + writable_argument + config[insert_at:]
          if config.count("current_writable=(") != 1:
              raise SystemExit("config write guard argument was not applied exactly once")
          ast.parse(config, filename=str(config_path))
          config_path.write_text(config, encoding="utf-8")

          test_path = Path("tests/test_guard_presentation_mode.py")
          tests = test_path.read_text(encoding="utf-8")
          changed_write_assertion = (
              "    before = config_path.read_text(encoding=\"utf-8\")\n"
              "    with pytest.raises(ValueError, match=\"newer schema\"):\n"
              "        update_guard_settings(\n"
              "            guard_home,\n"
              "            {\n"
              "                \"presentation_mode\": \"technical\",\n"
              "                \"presentation_revision\": current.presentation_revision,\n"
              "            },\n"
              "            skip_approval_gate=True,\n"
              "        )\n"
              "    assert config_path.read_text(encoding=\"utf-8\") == before\n"
          )
          if "with pytest.raises(ValueError, match=\"newer schema\")" not in tests:
              test_end = tests.index("\n\ndef test_revision_only_write_is_rejected")
              tests = tests[:test_end] + "\n" + changed_write_assertion + tests[test_end:]
          if tests.count("with pytest.raises(ValueError, match=\"newer schema\")") != 1:
              raise SystemExit("future-schema changed-write regression was not applied exactly once")
          ast.parse(tests, filename=str(test_path))
          test_path.write_text(tests, encoding="utf-8")

          baseline_path = Path("ci/test-suite-ratchet-baseline.json")
          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
          if baseline.get("maximum_collected_cases") != 16455:
              raise SystemExit(f"unexpected test-count ratchet: {baseline}")
          if baseline.get("maximum_test_source_lines") not in {354853, 354864}:
              raise SystemExit(f"unexpected source-line ratchet: {baseline}")
          baseline["maximum_test_source_lines"] = 354864
          baseline_path.write_text(json.dumps(baseline, indent=2) + "\n", encoding="utf-8")

          Path(".github/workflows/pr2745-future-schema-fix.yml").unlink()
          PY

          python -m compileall -q \
            src/codex_plugin_scanner/guard/config.py \
            src/codex_plugin_scanner/guard/presentation_settings.py \
            tests/test_guard_presentation_mode.py
          git diff --check
          git diff --exit-code -- .github/workflows/pr2745-future-schema-fix.yml >/dev/null || true

      - name: Commit fix to the existing PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Michael Kantor"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git add \
            src/codex_plugin_scanner/guard/config.py \
            src/codex_plugin_scanner/guard/presentation_settings.py \
            tests/test_guard_presentation_mode.py \
            ci/test-suite-ratchet-baseline.json \
            .github/workflows/pr2745-future-schema-fix.yml
          git diff --cached --check
          git commit -m "fix: preserve unsupported presentation schemas"
          git push origin HEAD:feat/everyday-mode-r32-final
