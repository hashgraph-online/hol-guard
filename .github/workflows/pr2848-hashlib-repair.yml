name: PR 2848 hashlib repair

on:
  push:
    branches:
      - chore/sync-main-into-release-3.2-20260907

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: chore/sync-main-into-release-3.2-20260907
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Restore hashlib import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_guard_surface_server.py')
          text = path.read_text(encoding='utf-8')
          old = 'import base64\nimport json\n'
          new = 'import base64\nimport hashlib\nimport json\n'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile tests/test_guard_surface_server.py
      - name: Commit repair and remove helper
        run: |
          rm .github/workflows/pr2848-hashlib-repair.yml
          git config user.name 'Michael Kantor'
          git config user.email '6068672+kantorcodes@users.noreply.github.com'
          git add tests/test_guard_surface_server.py .github/workflows/pr2848-hashlib-repair.yml
          git diff --cached --check
          git commit -m 'test: restore surface server hashlib import'
          git push origin HEAD:chore/sync-main-into-release-3.2-20260907
