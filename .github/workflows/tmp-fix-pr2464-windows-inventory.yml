          uv run --no-sync ruff format \
            src/codex_plugin_scanner/guard/windows_processes.py \
            src/codex_plugin_scanner/guard/daemon/manager.py \
            tests/test_windows_processes.py \
            tests/test_guard_daemon_manager.py
          uv run --no-sync ruff check \
            src/codex_plugin_scanner/guard/windows_processes.py \
            src/codex_plugin_scanner/guard/daemon/manager.py \
            tests/test_windows_processes.py \
            tests/test_guard_daemon_manager.py
          uv run --no-sync ruff format --check \
            src/codex_plugin_scanner/guard/windows_processes.py \
            src/codex_plugin_scanner/guard/daemon/manager.py \
            tests/test_windows_processes.py \
            tests/test_guard_daemon_manager.py
          uv run --no-sync basedpyright --level error \
            src/codex_plugin_scanner/guard/windows_processes.py \
            src/codex_plugin_scanner/guard/daemon/manager.py

          uv run --no-sync pytest -q \
            tests/test_windows_processes.py \
            tests/test_guard_daemon_manager.py \
            tests/test_native_runtime_admission.py \
            tests/test_daemon_bounded_http.py \
            tests/test_rust_daemon_edge_hardening_contracts.py \
            --tb=short

          cargo fmt --manifest-path rust/Cargo.toml --all --check
          cargo clippy --manifest-path rust/Cargo.toml --locked --workspace --all-targets -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --locked --workspace --all-targets

          uv run --no-sync python scripts/ci/code_quality_audit.py \
            --root . \
            --baseline ci/code-quality-baseline.json \
            --json-output code-quality-audit.json
          uv run --no-sync python scripts/ci/test_inventory.py --output test-inventory.json
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory test-inventory.json
          uv run --no-sync python scripts/ci/rust_migration_tree_hygiene.py
          rm -f code-quality-audit.json test-inventory.json

          git diff --check
          test ! -e .github/workflows/tmp-execute-pr2464-repair.yml
          test ! -e .github/workflows/tmp-fix-pr2464-windows-inventory.yml
          test ! -e .github/workflows/tmp-patch-pr2464-repair-v2.yml
          git add -A
          git diff --cached --check
          git status --short
          git config user.name 'Michael Kantor'
          git config user.email '6068672+kantorcodes@users.noreply.github.com'
          git commit --signoff -m 'fix(daemon): use native Windows process inventory'

