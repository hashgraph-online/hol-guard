name: Everyday Mode finalize EVM 001-100

on:
  push:
    branches:
      - feat/everyday-mode-001-100

permissions:
  contents: write

concurrency:
  group: everyday-mode-finalize-001-100
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out feature branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/everyday-mode-001-100
          fetch-depth: 0
          persist-credentials: true
      - name: Reconcile current release 3.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin release/3.0
          git merge --no-edit -X ours origin/release/3.0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
      - name: Install Python dependencies
        run: uv sync --frozen --extra dev --python 3.12
      - name: Refresh source-bound decision evidence
        run: |
          set -euo pipefail
          uv run --no-sync python tests/guard_command_decision_diff.py --write
          uv run --no-sync python tests/guard_command_decision_diff.py --check
      - name: Validate Core Everyday contracts
        run: |
          set -euo pipefail
          uv run --no-sync pytest -q tests/test_guard_presentation_mode.py tests/test_guard_action_explanation_contract.py tests/test_guard_desktop_contract.py
          uv run --no-sync ruff check src/codex_plugin_scanner/guard/presentation_mode.py src/codex_plugin_scanner/guard/runtime/action_explanation_contract.py tests/test_guard_presentation_mode.py tests/test_guard_action_explanation_contract.py
          uv run --no-sync basedpyright --level error src/codex_plugin_scanner/guard/presentation_mode.py src/codex_plugin_scanner/guard/runtime/action_explanation_contract.py
      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: '1.2.22'
      - name: Validate dashboard
        working-directory: dashboard
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run test
          bun run build
      - name: Remove one-shot workflow and push
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/everyday-mode-finalize-001-100.yml
          git add tests/fixtures/guard-command-corpus/decision-diff-report.json
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: reconcile Everyday Mode foundation with release 3.0"
          fi
          git push origin HEAD:feat/everyday-mode-001-100
