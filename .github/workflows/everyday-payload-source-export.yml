name: Export Everyday Mode payload source

on:
  push:
    branches:
      - tmp/everyday-payload-export-20260903

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out immutable trigger commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Archive payload bytes
        shell: bash
        run: tar -czf "$RUNNER_TEMP/everyday-payload.tar.gz" .github/everyday-payload
      - name: Upload payload source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: everyday-payload-source-${{ github.sha }}
          path: ${{ runner.temp }}/everyday-payload.tar.gz
          retention-days: 1
          if-no-files-found: error
