name: Release 3.2 CLI artifact refresh

on:
  push:
    branches:
      - feat/3.2-common-cli-extensions

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/3.2-common-cli-extensions
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false

      - name: Install locked development environment
        run: uv sync --frozen --extra dev --python 3.12

      - name: Validate focused command coverage
        run: |
          uv run --no-sync pytest -q \
            tests/test_guard_command_common_cli_extensions.py \
            tests/test_guard_command_common_cli_gaps.py \
            tests/test_guard_command_cloud_gcp_batch_2.py

      - name: Refresh deterministic command evidence
        run: uv run --no-sync python tests/guard_command_decision_diff.py --write

      - name: Refresh registry count ratchet
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path

          from codex_plugin_scanner.guard.runtime.command_extensions import command_extensions_payload

          root = Path.cwd()
          payload = command_extensions_payload()
          rule_count = sum(extension["rule_count"] for extension in payload["extensions"])
          test_path = root / "tests" / "test_guard_command_extensions.py"
          text = test_path.read_text(encoding="utf-8")
          needle = 'assert sum(extension["rule_count"] for extension in payload["extensions"]) == 147'
          replacement = f'assert sum(extension["rule_count"] for extension in payload["extensions"]) == {rule_count}'
          if text.count(needle) != 1:
              raise SystemExit("registry rule-count ratchet assertion not found exactly once")
          test_path.write_text(text.replace(needle, replacement, 1), encoding="utf-8")
          print(f"refreshed registry rule-count ratchet to {rule_count}")
          PY

      - name: Refresh managed-controls catalog projection vector
        run: |
          uv run --no-sync python - <<'PY'
          import json
          import re
          from pathlib import Path

          from codex_plugin_scanner.guard.managed_controls_policy_bundle import (
              signed_cloud_extension_projection_digest,
              signed_cloud_extension_projection_json,
          )
          from codex_plugin_scanner.guard.runtime.extension_catalog_sync import build_builtin_extension_catalog_wire
          from tests.managed_controls_activation_support import parse_managed_bundle

          root = Path.cwd()
          contracts = root / "contracts" / "managed-controls" / "v1"
          source_name = "policy-bundle-v2-extension-signature-vector.json"
          source = json.loads((contracts / source_name).read_text(encoding="utf-8"))
          bundle = source["bundle"]
          catalog_digest = build_builtin_extension_catalog_wire(
              guard_version="test",
              generated_at="2026-08-25T12:00:00Z",
          )["catalogDigest"]
          parsed = parse_managed_bundle(bundle)
          canonical_projection = signed_cloud_extension_projection_json(parsed, catalog_digest=catalog_digest)
          projection_digest = signed_cloud_extension_projection_digest(parsed, catalog_digest=catalog_digest)
          vector = {
              "schemaVersion": "guard.signed-cloud-extension-projection-vector.v1",
              "sourceBundleVector": source_name,
              "catalogDigest": catalog_digest,
              "canonicalProjectionJson": canonical_projection,
              "expectedExtensionProjectionDigest": projection_digest,
          }
          vector_path = contracts / "extension-projection-digest-vector.json"
          vector_path.write_text(json.dumps(vector, indent=2, sort_keys=False) + "\n", encoding="utf-8")

          test_path = root / "tests" / "test_policy_bundle_delivery_runtime.py"
          text = test_path.read_text(encoding="utf-8")
          text = re.sub(
              r'^_GUARD_RELEASE_CATALOG_DIGEST = "[0-9a-f]{64}"$',
              f'_GUARD_RELEASE_CATALOG_DIGEST = "{catalog_digest}"',
              text,
              flags=re.MULTILINE,
          )
          text = re.sub(
              r'^_GUARD_RELEASE_PROJECTION_DIGEST = "sha256:[0-9a-f]{64}"$',
              f'_GUARD_RELEASE_PROJECTION_DIGEST = "{projection_digest}"',
              text,
              flags=re.MULTILINE,
          )
          test_path.write_text(text, encoding="utf-8")
          PY

      - name: Verify regenerated evidence
        run: |
          uv run --no-sync python tests/guard_command_decision_diff.py --check
          uv run --no-sync pytest -q \
            tests/test_guard_command_common_cli_extensions.py \
            tests/test_guard_command_common_cli_gaps.py \
            tests/test_guard_command_extensions.py::test_command_extension_registry_is_deterministic_and_complete \
            tests/test_policy_bundle_delivery_runtime.py::test_signed_cloud_extension_projection_matches_shared_vector

      - name: Commit generated evidence and remove refresh workflow
        run: |
          digest="$(uv run --no-sync python tests/guard_command_decision_diff.py --metrics | uv run --no-sync python -c 'import json,sys; print(json.load(sys.stdin)["report_framed_sha256"])')"
          git rm .github/workflows/release-32-cli-artifact-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tests/fixtures/guard-command-corpus/decision-diff-report.json \
            contracts/managed-controls/v1/extension-projection-digest-vector.json \
            tests/test_policy_bundle_delivery_runtime.py \
            tests/test_guard_command_extensions.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(commands): refresh release 3.2 generated evidence' -m "Decision-Diff-Framed-SHA256: ${digest}"
          git push origin HEAD:feat/3.2-common-cli-extensions
