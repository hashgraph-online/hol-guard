name: Restore exact runtime test executables
description: Reuse compilation only; both runtime partitions still execute their tests.
outputs:
  cache-hit:
    description: Whether the complete exact-input archive was restored.
    value: ${{ steps.archive.outputs.cache-hit }}
  cache-primary-key:
    description: Exact archive key, for the trusted main writer only.
    value: ${{ steps.archive.outputs.cache-primary-key }}
runs:
  using: composite
  steps:
    - name: Stage the native trust inputs before hashing
      shell: bash
      run: python3 scripts/refresh_extension_artifacts.py --trust-only
    - name: Identify the runtime test build environment
      id: environment
      shell: bash
      run: |
        echo "image=${ImageOS:?}" >> "$GITHUB_OUTPUT"
        python3 -m scripts.ci.native_cache_environment >> "$GITHUB_OUTPUT"
    - name: Restore the exact runtime test archive
      id: archive
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ runner.temp }}/runtime-test-archive.tar.zst
        # No prefix fallback: source, compiler, profile and runner must all match.
        # Scripts and contracts cover build-time includes outside the Rust tree.
        # Helper imports can create timestamp-bearing bytecode before this step.
        # Neither those files nor Cargo outputs identify the authored inputs.
        key: runtime-test-archive-v2-${{ runner.arch }}-${{ steps.environment.outputs.image }}-${{ steps.environment.outputs.compiler-env }}-lto-${{ env.CARGO_PROFILE_RELEASE_LTO }}-cgu-${{ env.CARGO_PROFILE_RELEASE_CODEGEN_UNITS }}-${{ hashFiles('rust/**', 'contributions/**', 'contracts/**', 'spec/**', 'tests/fixtures/**', 'src/codex_plugin_scanner/guard/contracts/**', '.cargo/**', '.github/actions/setup-rust/**', '.github/actions/restore-runtime-tests/**', '.github/workflows/ci.yml', 'scripts/**', '!**/__pycache__/**', '!rust/target/**') }}
