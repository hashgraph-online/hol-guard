name: Warm native CI caches

on:
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'contributions/**'
      - 'contracts/**'
      - 'spec/**'
      - '.cargo/**'
      - 'src/codex_plugin_scanner/guard/contracts/**'
      - 'scripts/refresh_extension_artifacts.py'
      - 'scripts/ci/native_cache_environment.py'
      - 'scripts/build_native_command_program.py'
      - 'scripts/ci/verify_native_command_program.py'
      - '.github/actions/setup-rust/**'
      - '.github/actions/ci-job-native-command-build/**'
      - '.github/actions/ci-job-macos-native-runtime/**'
      - '.github/actions/ci-job-windows-native-runtime/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/native-ci-cache-warm.yml'

permissions:
  contents: read

# Finish the current warm build and retain only the latest pending push.
# Do not wait for the full main coverage and analysis workflow to finish.
concurrency:
  group: native-ci-cache-warm-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_PROFILE_RELEASE_LTO: 'false'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: native-ci-build-${{ github.sha }}-linux
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-job-native-command-build

  macos:
    runs-on: macos-latest
    # Matches ci.yml macos-native-runtime (25): the warmer must finish the same
    # cold crate-graph compile to seed the namespace on main.
    timeout-minutes: 25
    concurrency:
      group: native-ci-build-${{ github.sha }}-macos
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-job-macos-native-runtime

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    concurrency:
      group: native-ci-build-${{ github.sha }}-windows
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-job-windows-native-runtime
