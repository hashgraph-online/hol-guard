name: Rust authority ownership

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-authority-ownership-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: rust
          shared-key: authority
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Enforce permanent source ownership
        env:
          OWNERSHIP_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          args=(--root . --json rust-authority-ownership.json)
          if [[ -n "$OWNERSHIP_BASE_REF" ]]; then
            args+=(--base-ref "$OWNERSHIP_BASE_REF")
          fi
          uv run --no-sync python scripts/ci/rust_authority_ownership_gate.py "${args[@]}"
      - name: Enforce native approval contract ownership
        run: uv run --no-sync python scripts/ci/native_approval_contract_gate.py --root .
      - name: Reject production Python semantic hook reachability
        run: uv run --no-sync python scripts/ci/python_hook_semantic_callgraph_gate.py --root .
      - name: Enforce native receipt persistence contract at exact HEAD
        run: uv run --no-sync python scripts/ci/native_receipt_persistence_gate.py --root . --json native-receipt-persistence.json
      - name: Enforce Python capability cleanup ownership
        run: |
          uv run --no-sync python scripts/ci/python_capability_cleanup_gate.py \
            --root . --json python-capability-cleanup.json
      - name: Prove excluded Python module is absent from the built wheel
        run: |
          PACKAGE_ARTIFACT_DIR=$(mktemp -d)
          uv build --wheel --sdist --out-dir "$PACKAGE_ARTIFACT_DIR"
          BUILT_WHEEL=$(find "$PACKAGE_ARTIFACT_DIR" -maxdepth 1 -name '*.whl' -print -quit)
          BUILT_SDIST=$(find "$PACKAGE_ARTIFACT_DIR" -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$BUILT_WHEEL"
          test -n "$BUILT_SDIST"
          uv run --no-sync python scripts/ci/python_capability_cleanup_gate.py \
            --root . --artifact "$BUILT_WHEEL" --json python-capability-cleanup-wheel.json
           uv run --no-sync python scripts/ci/python_capability_cleanup_gate.py \
             --root . --artifact "$BUILT_SDIST" --json python-capability-cleanup-sdist.json
      - name: Compile and lint complete Rust workspace
        id: native_contract_build
        env:
          HOL_GUARD_BUILD_SHA: ${{ github.sha }}
        run: |
          cargo metadata --manifest-path rust/Cargo.toml --locked --format-version 1 --no-deps >/dev/null
          cargo fmt --manifest-path rust/Cargo.toml --all --check
          cargo clippy --manifest-path rust/Cargo.toml --locked --workspace --all-targets -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --locked --workspace --all-targets
          VERSION=$(uv run --no-sync python scripts/sync_repo_version.py --check)
          export HOL_GUARD_PACKAGE_VERSION="$VERSION"
          cargo build --manifest-path rust/Cargo.toml --locked --release -p hol-guard-runtime
          rust/target/release/hol-guard-runtime self-test --json
      - name: Require source-defined Python and native vector parity
        if: ${{ !cancelled() && steps.native_contract_build.outcome == 'success' }}
        timeout-minutes: 10
        env:
          PYTEST_ADDOPTS: ""
          HOL_GUARD_BUILD_SHA: ${{ github.sha }}
        run: |
          mkdir -p artifacts/native-policy-vector-parity
          rm -f artifacts/native-policy-vector-parity/results.xml
          pytest_status=0
          uv run --no-sync pytest -o addopts=--strict-markers -q \
            tests/test_native_policy_vector_source_parity.py \
            --junitxml=artifacts/native-policy-vector-parity/results.xml || pytest_status=$?
          validator_status=0
          uv run --no-sync python - <<'PY' || validator_status=$?
          import json
          import xml.etree.ElementTree as ET

          cases = list(ET.parse("artifacts/native-policy-vector-parity/results.xml").getroot().iter("testcase"))
          observed = [{
              "classname": case.attrib.get("classname"),
              "name": case.attrib.get("name"),
              "nonpass": [child.tag for child in case if child.tag in {"failure", "error", "skipped"}],
          } for case in cases]
          print(json.dumps({"nativePolicyVectorParityCases": observed}, sort_keys=True))
          assert len(observed) == 1, "Expected exactly one source/native parity case"
          assert observed[0] == {
              "classname": "tests.test_native_policy_vector_source_parity",
              "name": "test_source_defined_native_policy_vectors_match_actual_python",
              "nonpass": [],
          }, "Source/native parity case did not complete successfully"
          PY
          if [[ "$pytest_status" -ne 0 ]]; then
            exit "$pytest_status"
          fi
          exit "$validator_status"
      - name: Run compiled PreToolUse adversarial integration
        run: |
          uv run --no-sync python scripts/ci/rust_pretool_authority_integration.py \
            --runtime rust/target/release/hol-guard-runtime \
            --json rust-pretool-authority.json
      - name: Run compiled PostToolUse adversarial integration
        run: |
          uv run --no-sync python scripts/ci/rust_posttool_failclosed_integration.py \
            --runtime rust/target/release/hol-guard-runtime \
            --json rust-posttool-authority.json
      - name: Run resident differential and mutation integration
        env:
          HOL_GUARD_NATIVE: force
          HOL_GUARD_NATIVE_BINARY: ${{ github.workspace }}/rust/target/release/hol-guard-runtime
        run: |
          uv run --no-sync pytest -q \
            ci/native_runtime/test_command_model_resident.py \
            ci/native_runtime/test_guard_native_runtime_binary.py \
            ci/native_runtime/test_guard_native_runtime_differential.py \
            ci/native_runtime/test_guard_native_runtime_mutation_differential.py \
            --tb=short
      - name: Enforce native performance
        id: native_performance
        env:
          HOL_GUARD_NATIVE: force
          HOL_GUARD_NATIVE_BINARY: ${{ github.workspace }}/rust/target/release/hol-guard-runtime
        run: |
          uv run --no-sync python scripts/bench_guard_native_release_gate.py \
            --runtime "$HOL_GUARD_NATIVE_BINARY" \
            --warm-iterations 30 --cold-iterations 2 \
            --json rust-authority-performance.json --enforce
      - name: Record separate warm-phase diagnostics
        if: ${{ failure() && steps.native_performance.outcome == 'failure' }}
        continue-on-error: true
        env:
          HOL_GUARD_NATIVE: force
          HOL_GUARD_NATIVE_BINARY: ${{ github.workspace }}/rust/target/release/hol-guard-runtime
        run: |
          uv run --no-sync python scripts/diagnose_guard_native_warm_phases.py \
            --runtime "$HOL_GUARD_NATIVE_BINARY" \
            --warm-iterations 30 \
            --json rust-authority-performance-phases.json
      - name: Run installed native-wheel execution proof
        env:
          HOL_GUARD_NATIVE: force
          HOL_GUARD_NATIVE_BINARY: ${{ github.workspace }}/rust/target/release/hol-guard-runtime
        run: |
          uv run --no-sync pytest -q ci/native_runtime/test_native_hol_guard_wheel.py --tb=short
      - name: Require exact managed, origin, and retirement resident contracts
        if: ${{ !cancelled() && steps.native_contract_build.outcome == 'success' }}
        timeout-minutes: 20
        run: uv run --no-sync python scripts/ci/native_resident_contract.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rust-authority-ownership-evidence
          path: |
            rust-authority-ownership.json
            rust-pretool-authority.json
            rust-posttool-authority.json
            rust-authority-performance.json
            rust-authority-performance-phases.json
            native-receipt-persistence.json
            python-capability-cleanup.json
            python-capability-cleanup-wheel.json
            python-capability-cleanup-sdist.json
            artifacts/native-managed-resident/
            artifacts/native-sensitive-resident/
            artifacts/native-installation-retirement/
            artifacts/native-policy-vector-parity/
          if-no-files-found: error
          retention-days: 30

  policy-source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
        partition: ["policy", "maintenance"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: false
      - name: Prepare owned contract interpreter
        run: python -I scripts/ci/policy_contract_interpreter.py prepare
      - run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - name: Verify owned contract interpreter
        run: python -I scripts/ci/policy_contract_interpreter.py verify
      - name: Check policy source contracts
        run: bash scripts/ci/policy_source_contract.sh '${{ matrix.python }}' '${{ matrix.partition }}'
