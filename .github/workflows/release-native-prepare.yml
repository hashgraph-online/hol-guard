name: Prepare trusted release compilation
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-native-prepare.yml
      - scripts/release/prepared_native.py
      - scripts/release/native_cache_key.py
      - scripts/ci/native_cache_environment.py
      - rust/**
      - contracts/**
      - contributions/command-sources/**
      - contributions/mcp-servers/**
      - pyproject.toml
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      version:
        required: true
        type: string
      fast_codegen:
        description: Alpha-only per-crate codegen; the version must be a canonical alpha.
        required: false
        type: boolean
        default: false
permissions:
  contents: read
# Main pushes prepare exact-source binaries as well as compiler objects.
# A newer main push replaces a superseded warm run, while publish calls keep
# their own workflow group and validate the requested source and version.
concurrency:
  group: ${{ github.event_name == 'push' && format('release-native-prepare-{0}', github.ref) || format('release-native-prepare-call-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  compile:
    name: Compile release (${{ matrix.target }})
    # Pull requests reach this job only as a labeled same-repository canary call from
    # publish.yml. Their caches stay read-only (see save-if and SCCACHE_GHA_RW_MODE).
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    concurrency:
      # Stable publish calls and main preparation share work for one source and
      # target. Alpha/canary versions keep separate groups and cache identities.
      group: release-native-build-${{ inputs.source_sha || github.sha }}-${{ matrix.target }}-${{ (inputs.fast_codegen == true || github.event_name == 'pull_request') && inputs.version || 'release' }}
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            suffix: ''
          # Intel binaries are cross-compiled on Apple silicon; the native
          # macos-15-intel wheel job self-tests and verifies them before packaging.
          - runner: macos-15
            target: x86_64-apple-darwin
            suffix: ''
            cross: true
          - runner: macos-15
            target: aarch64-apple-darwin
            suffix: ''
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
            rustflags: -C link-arg=/Brepro
          # Windows ARM64 binaries are cross-compiled on x64; the native
          # windows-11-arm wheel job self-tests and verifies them before packaging.
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            suffix: .exe
            rustflags: -C link-arg=/Brepro
            cross: true
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      VERSION: ${{ inputs.version }}
      FAST_CODEGEN: ${{ inputs.fast_codegen == true }}
      # Only the Windows alpha builds lower workspace opt-level: they are the
      # slowest targets. Keep level 1 optimization because unoptimized
      # workspace code bloats the runtime.
      # Dependencies keep the release profile either way.
      ALPHA_WORKSPACE_OPT_LEVEL: ${{ endsWith(matrix.target, '-pc-windows-msvc') && '1' || '' }}
      RUST_TARGET: ${{ matrix.target }}
      RUSTFLAGS: ${{ matrix.rustflags }}
      CROSS_COMPILED: ${{ matrix.cross == true }}
      # PR canaries build no Windows ARM64 wheel, so that leg skips its compile. A matrix
      # exclude cannot remove include-only legs, so the heavy steps check this instead.
      UNSHIPPED_TARGET: ${{ github.event_name == 'pull_request' && matrix.target == 'aarch64-pc-windows-msvc' }}
      PR_CANARY: ${{ github.event_name == 'pull_request' }}
      RUNTIME: rust/target/${{ matrix.target }}/release/hol-guard-runtime${{ matrix.suffix }}
      SOURCE_COMPILER: rust/target/${{ matrix.target }}/release/guard-command-source${{ matrix.suffix }}
      HOL_GUARD_APPROVAL_ENROLLMENT_ROOT_HEX: ${{ vars.HOL_GUARD_APPROVAL_ENROLLMENT_ROOT_HEX }}
      HOL_GUARD_APPROVAL_ENROLLMENT_ROOT_FINGERPRINT_HEX: ${{ vars.HOL_GUARD_APPROVAL_ENROLLMENT_ROOT_FINGERPRINT_HEX }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.9.26'
          enable-cache: true
      - name: Bind exact source and version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          BASE_VERSION=$(uv run --no-project --with packaging==25.0 python scripts/sync_repo_version.py --check)
          RELEASE_VERSION="${VERSION:-$BASE_VERSION}"
          if [[ "$RELEASE_VERSION" != "$BASE_VERSION" ]]; then
            # Releases accept only canonical alphas; PR canaries only a dev release of the source version.
            if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(a[1-9][0-9]*)?$ ]] &&
              ! [[ "${PR_CANARY:-}" == "true" && "$RELEASE_VERSION" =~ ^${BASE_VERSION//./\\.}\.dev[0-9]+$ ]]; then
              echo "Version $RELEASE_VERSION is neither a canonical alpha nor this PR canary's dev release" >&2
              exit 1
            fi
            uv run --no-project --with packaging==25.0 python scripts/sync_repo_version.py --version "$RELEASE_VERSION"
          fi
          while IFS= read -r changed_path; do
            case "$changed_path" in
              pyproject.toml|src/codex_plugin_scanner/version.py|uv.lock) ;;
              *) echo "Version stamping changed an unexpected file" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only)
          echo "VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "HOL_GUARD_PACKAGE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "HOL_GUARD_BUILD_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
      - name: Verify release enrollment root
        run: python scripts/ci/native_approval_contract_gate.py --root . --require-release-root
      - name: Identify exact release binaries
        id: native-identity
        if: env.UNSHIPPED_TARGET != 'true'
        shell: bash
        run: |
          identity="$(python -m scripts.release.native_cache_key)"
          echo "build-id=$identity" >> "$GITHUB_OUTPUT"
          echo "PREPARED_NATIVE_BUILD_ID=$identity" >> "$GITHUB_ENV"
      - name: Restore exact release binaries
        id: native-cache
        if: env.UNSHIPPED_TARGET != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: prepared-native
          # No fallback: a source, version, target, root, image or flag change
          # requires fresh binaries. The existing cleanup retains this family.
          key: release-native-binaries-v1-${{ matrix.target }}-${{ inputs.fast_codegen == true && 'fast' || 'release' }}-${{ steps.native-identity.outputs.build-id }}
      - name: Verify restored native release inputs
        if: env.UNSHIPPED_TARGET != 'true' && steps.native-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release/prepared_native.py install --directory prepared-native
          if [[ "$CROSS_COMPILED" != "true" ]]; then
            python scripts/build_native_command_program.py --compiler "$SOURCE_COMPILER"
            "$RUNTIME" self-test --json
          fi
      - name: Install pinned Rust target
        if: env.UNSHIPPED_TARGET != 'true' && steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustup target add "$RUST_TARGET"
      - name: Install Linux static toolchain
        if: runner.os == 'Linux' && steps.native-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      - name: Cache trusted release compilation
        if: env.UNSHIPPED_TARGET != 'true' && steps.native-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: release-native-v1${{ inputs.fast_codegen == true && '-fast' || '' }}
          workspaces: rust
          shared-key: release-${{ matrix.target }}
          # Fresh checkouts reset source mtimes, so cached workspace crates are
          # always stale; content-addressed sccache below covers them instead.
          cache-workspace-crates: false
          cache-bin: false
          # Fast-profile dependencies have their own cache key, which only authorized
          # main alpha dispatches (never pull requests) may populate.
          save-if: ${{ (github.event_name == 'push' || inputs.fast_codegen == true) && github.ref == 'refs/heads/main' }}
      - name: Install content-addressed compiler cache
        if: env.UNSHIPPED_TARGET != 'true' && steps.native-cache.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.18.0
      - name: Compile canonical release inputs
        if: env.UNSHIPPED_TARGET != 'true' && steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          # Only workspace members are wrapped; third-party crates come from rust-cache.
          RUSTC_WORKSPACE_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: 'on'
          # Fast alpha objects differ from fat-LTO ones, so they keep a separate namespace.
          SCCACHE_GHA_VERSION: ${{ inputs.fast_codegen == true && 'release-native-fast-v1' || 'release-native-v1' }}
          # Only trusted main pushes and authorized main alpha dispatches may write;
          # every other run is read-only.
          SCCACHE_GHA_RW_MODE: ${{ ((github.event_name == 'push' || inputs.fast_codegen == true) && github.ref == 'refs/heads/main') && 'READ_WRITE' || 'READ_ONLY' }}
          SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
        run: |
          set -euo pipefail
          # Per-crate codegen makes larger binaries that are allowed only in alpha
          # prereleases (GitHub release assets, never PyPI); refuse any other version.
          [[ "$FAST_CODEGEN" != "true" ]] || [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+a[1-9][0-9]*$ ]]
          [[ "$FAST_CODEGEN" != "true" ]] || export CARGO_PROFILE_RELEASE_LTO=false CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
          cargo_config=()
          if [[ "$FAST_CODEGEN" == "true" && -n "$ALPHA_WORKSPACE_OPT_LEVEL" ]]; then
            python scripts/release/workspace_opt_profile.py --opt-level "$ALPHA_WORKSPACE_OPT_LEVEL" --output "$RUNNER_TEMP/alpha-workspace-profile.toml"
            cargo_config=(--config "$RUNNER_TEMP/alpha-workspace-profile.toml")
          fi
          # One invocation keeps nix feature unification identical for both binaries,
          # so shared workspace crates compile once. The generator only writes files
          # that no build script reads, so it can verify the finished compiler.
          cargo build --manifest-path rust/Cargo.toml --locked --release --target "$RUST_TARGET" -p hol-guard-runtime -p guard-command --bin hol-guard-runtime --bin guard-command-source ${cargo_config[@]+"${cargo_config[@]}"}
          if [[ "$CROSS_COMPILED" != "true" ]]; then
            python scripts/build_native_command_program.py --compiler "$SOURCE_COMPILER"
            "$RUNTIME" self-test --json
          fi
          python scripts/release/prepared_native.py pack --directory prepared-native
          "$SCCACHE_PATH" --show-stats
      - name: Save verified release binaries
        if: >-
          env.UNSHIPPED_TARGET != 'true' &&
          steps.native-cache.outputs.cache-hit != 'true' &&
          (github.event_name == 'push' || inputs.fast_codegen == true) &&
          github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: prepared-native
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Upload exact-run binaries
        if: >-
          env.UNSHIPPED_TARGET != 'true' &&
          (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-native-${{ matrix.target }}
          path: prepared-native/*
          if-no-files-found: error
          retention-days: 3
