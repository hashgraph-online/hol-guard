name: Apply PR 2745 config size fix

on:
  push:
    branches:
      - feat/everyday-mode-r32-final

permissions:
  contents: write

concurrency:
  group: pr2745-config-size-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/everyday-mode-r32-final
          fetch-depth: 1

      - name: Keep config within the existing quality ratchet
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/codex_plugin_scanner/guard/config.py")
          content = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "    UNSUPPORTED_PRESENTATION_SCHEMA_DIAGNOSTIC,\n",
                  "    UNSUPPORTED_PRESENTATION_SCHEMA_DIAGNOSTIC as _UNSUPPORTED_SCHEMA,\n",
              ),
              (
                  """        current_writable=(
                      current_config.presentation_diagnostic
                      != UNSUPPORTED_PRESENTATION_SCHEMA_DIAGNOSTIC
                  ),
          """,
                  "        current_writable=current_config.presentation_diagnostic != _UNSUPPORTED_SCHEMA,\n",
              ),
              (
                  '    """Persist safe local Guard settings to config.toml and return the updated config."""\n\n    if not skip_approval_gate:\n',
                  '    """Persist safe local Guard settings to config.toml and return the updated config."""\n    if not skip_approval_gate:\n',
              ),
          ]
          for old, new in replacements:
              if content.count(old) != 1:
                  raise SystemExit(f"expected one exact replacement, found {content.count(old)}")
              content = content.replace(old, new, 1)

          if len(content.splitlines()) != 1481:
              raise SystemExit(f"unexpected config.py line count: {len(content.splitlines())}")
          path.write_text(content, encoding="utf-8")
          Path(".github/workflows/pr2745-config-size-fix.yml").unlink()
          PY
          python -m py_compile src/codex_plugin_scanner/guard/config.py
          git diff --check

      - name: Commit to the existing PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Michael Kantor"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git add src/codex_plugin_scanner/guard/config.py .github/workflows/pr2745-config-size-fix.yml
          git commit -m "refactor: keep config within quality ratchet"
          git push origin HEAD:feat/everyday-mode-r32-final
