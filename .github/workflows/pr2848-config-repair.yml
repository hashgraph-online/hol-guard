name: PR 2848 config repair

on:
  push:
    branches:
      - chore/sync-main-into-release-3.2-20260907

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: chore/sync-main-into-release-3.2-20260907
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Restore release presentation write invariants
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/codex_plugin_scanner/guard/config.py')
          text = path.read_text(encoding='utf-8')

          old = '''from .presentation_mode import (\n    PRESENTATION_SCHEMA_VERSION,\n    coerce_persisted_presentation_mode,\n    coerce_presentation_mode_write,\n)\nfrom .protection_posture import (\n'''
          new = '''from .presentation_mode import (\n    PRESENTATION_SCHEMA_VERSION,\n    UNSUPPORTED_PRESENTATION_SCHEMA_DIAGNOSTIC,\n    coerce_persisted_presentation_mode,\n    coerce_presentation_mode_write,\n)\nfrom .presentation_settings import (\n    PRESENTATION_SETTING_INPUT_KEYS,\n    apply_presentation_settings_update,\n    resolve_presentation_settings_update,\n)\nfrom .protection_posture import (\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '            "writable": True,\n'
          new = '            "writable": presentation_writable,\n'
          assert old in text
          text = text.replace(old, new, 1)

          start_marker = '    presentation_keys = {\n'
          end_marker = '    switching_to_custom_without_overrides = (\n'
          start = text.index(start_marker, text.index('def _update_guard_settings_locked('))
          end = text.index(end_marker, start)
          replacement = '''    presentation_update = resolve_presentation_settings_update(\n        payload,\n        current_mode=coerce_presentation_mode_write(current_config.presentation_mode),\n        current_explicit=current_config.presentation_mode_explicit,\n        current_revision=current_config.presentation_revision,\n        current_writable=current_config.presentation_diagnostic != UNSUPPORTED_PRESENTATION_SCHEMA_DIAGNOSTIC,\n    )\n'''
          text = text[:start] + replacement + text[end:]

          old = '''        if key in presentation_keys:\n            if presentation_change:\n                next_payload[key] = coerced_presentation[key]\n            continue\n        next_payload[key] = _coerce_editable_setting(key, value)\n    if presentation_change:\n        next_payload["presentation_mode_explicit"] = True\n        next_payload["presentation_schema_version"] = PRESENTATION_SCHEMA_VERSION\n        next_payload["presentation_revision"] = current_config.presentation_revision + 1\n'''
          new = '''        if key in PRESENTATION_SETTING_INPUT_KEYS:\n            continue\n        next_payload[key] = _coerce_editable_setting(key, value)\n    apply_presentation_settings_update(\n        next_payload, presentation_update, current_revision=current_config.presentation_revision\n    )\n'''
          assert old in text
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile src/codex_plugin_scanner/guard/config.py src/codex_plugin_scanner/guard/cli/commands_dispatch_desktop.py src/codex_plugin_scanner/guard/cli/commands_parser_desktop.py
      - name: Commit repair and remove helper workflow
        run: |
          rm .github/workflows/pr2848-config-repair.yml
          git config user.name 'Michael Kantor'
          git config user.email '6068672+kantorcodes@users.noreply.github.com'
          git add src/codex_plugin_scanner/guard/config.py .github/workflows/pr2848-config-repair.yml
          git diff --cached --check
          git commit -m 'fix: preserve presentation schema write boundary'
          git push origin HEAD:chore/sync-main-into-release-3.2-20260907
