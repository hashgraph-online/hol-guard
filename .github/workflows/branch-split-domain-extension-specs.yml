name: Branch split domain extension specs

on:
  push:
    branches:
      - fix/docker-kubernetes-command-coverage
    paths:
      - .github/workflows/branch-split-domain-extension-specs.yml

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/docker-kubernetes-command-coverage
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Split extension specs out of rule module
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path

          source = Path("src/codex_plugin_scanner/guard/runtime/command_domain_extensions.py")
          text = source.read_text(encoding="utf-8")
          marker = "\n\nDOMAIN_COMMAND_EXTENSION_SPECS = (\n"
          if marker not in text:
              raise SystemExit("domain extension spec marker missing")
          prefix, specs = text.split(marker, 1)
          old_import = "from .command_extension_specs import CommandExtensionSpec\n"
          new_import = "from .command_domain_extension_specs import DOMAIN_COMMAND_EXTENSION_SPECS\n"
          if old_import not in prefix:
              raise SystemExit("CommandExtensionSpec import missing")
          prefix = prefix.replace(old_import, new_import, 1)
          source.write_text(prefix.rstrip() + "\n", encoding="utf-8")

          target = Path("src/codex_plugin_scanner/guard/runtime/command_domain_extension_specs.py")
          target.write_text(
              '"""Metadata for infrastructure command extensions."""\n\n'
              "from __future__ import annotations\n\n"
              "from .command_extension_specs import CommandExtensionSpec\n\n\n"
              "DOMAIN_COMMAND_EXTENSION_SPECS = (\n"
              + specs,
              encoding="utf-8",
          )
          PY
          uv run --no-sync ruff format \
            src/codex_plugin_scanner/guard/runtime/command_domain_extensions.py \
            src/codex_plugin_scanner/guard/runtime/command_domain_extension_specs.py
          uv run --no-sync ruff check \
            src/codex_plugin_scanner/guard/runtime/command_domain_extensions.py \
            src/codex_plugin_scanner/guard/runtime/command_domain_extension_specs.py
          uv run --no-sync pytest -q \
            tests/test_guard_command_permission_catalog.py \
            tests/test_guard_extension_control_catalog_detail.py \
            tests/test_guard_command_container_kubernetes_common_extensions.py \
            tests/test_guard_command_common_extension_regressions.py
      - name: Commit split and remove temporary workflow
        run: |
          rm .github/workflows/branch-split-domain-extension-specs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/codex_plugin_scanner/guard/runtime/command_domain_extensions.py \
            src/codex_plugin_scanner/guard/runtime/command_domain_extension_specs.py \
            .github/workflows/branch-split-domain-extension-specs.yml
          git commit -m "refactor: split command domain extension metadata"
          git push origin HEAD:fix/docker-kubernetes-command-coverage
