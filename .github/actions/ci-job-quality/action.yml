name: CI quality
description: Run the quality checks inside the existing CI job.
runs:
  using: composite
  steps:
  - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
    with:
      python-version: '3.12'
  - name: Require authored contribution trust before preparation
    run: python scripts/refresh_extension_artifacts.py --check-trust
    shell: bash
  - name: Set up uv
    id: setup-uv-primary
    continue-on-error: true
    uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
    with:
      version: 0.9.26
      enable-cache: true
      cache-dependency-glob: ${{ env.CI_UV_CACHE_DEPENDENCY_GLOB }}
      save-cache: false
  - name: Retry uv setup after transient download failure
    if: steps.setup-uv-primary.outcome == 'failure'
    uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
    with:
      version: 0.9.26
      enable-cache: true
      cache-dependency-glob: ${{ env.CI_UV_CACHE_DEPENDENCY_GLOB }}
      save-cache: false
  - name: Enforce native approval contract before release
    # Stable publication runs this gate with --require-release-root against the release source,
    # so a violation merged to main can only be fixed by a newer release. Catch it on the PR.
    run: python scripts/ci/native_approval_contract_gate.py --root .
    shell: bash
  - run: uv sync --frozen --extra dev --python 3.12
    shell: bash
  - name: Validate harness version coverage manifest
    # Release PRs must not ship coverage records bound to another Guard build.
    run: |
      args=()
      if [[ "${HEAD_REF}" == release-please--* ]]; then args+=(--release); fi
      uv run --no-sync python scripts/ci/validate_harness_version_coverage.py "${args[@]}"
    shell: bash
    env:
      HEAD_REF: ${{ github.head_ref }}
  - name: Publish exact test-body duplicate candidates
    run: |
      uv run --no-sync python scripts/ci/test_duplicate_candidates.py \
        --output test-duplicate-candidates.json
      cat test-duplicate-candidates.json
    shell: bash
  - name: Lint production sources
    run: |
      uv run --no-sync python -m ruff check \
        tests/test_fleet_posture_builder.py \
        tests/test_runner_sync_payload.py \
        tests/test_guard_approval_extension_recommendation.py \
        scripts/ci/normalize_rust_toolchains.py \
        tests/test_ci_rust_toolchain_cache.py \
        tests/test_ci_native_evaluator_fast_path.py \
        scripts/ci/native_approval_contract_gate.py \
        tests/test_ci_native_approval_workflow.py \
        tests/test_policy_bundle_crate_boundary.py \
        tests/test_ci_command_source_inputs_manifest.py \
        tests/test_ci_macos_gate_shards.py \
        tests/test_ci_windows_sccache_readiness.py \
        tests/test_ci_required_aggregate.py \
        tests/test_ci_rust_preflight.py \
        tests/test_ci_rust_test_warm.py \
        tests/test_ci_runtime_test_archive.py \
        tests/test_ci_pytest_shard.py \
        tests/test_ci_pytest_shard_plan.py \
        tests/test_ci_quality_feedback.py \
        tests/test_native_regression_shard.py \
        tests/test_guard_gauntlet_ci.py \
        tests/test_guard_gauntlet_session_folder.py \
        tests/release_workflow_helpers.py \
        tests/test_alpha_fast_native_release.py \
        tests/test_ci_speed_contracts.py \
        tests/test_installed_canary_workflow.py \
        tests/test_pr_testpypi_canary_workflow.py \
        tests/test_publish_target_lanes.py \
        tests/test_release_compiler_cache.py \
        tests/test_release_critical_path.py \
        tests/test_release_native_binary_cache.py \
        tests/test_release_please_workflow.py \
        tests/test_release_publication_workflow.py \
        tests/test_release_train_workflow.py \
        tests/test_unpublished_alpha_reservation.py \
        src/ \
        scripts/build_native_command_program.py \
        scripts/ci/run_projection_shard.py \
        scripts/ci/verify_native_command_program.py \
        scripts/core_command_build_inputs.py \
        scripts/native_directory_inventory.py \
        scripts/native_projection_inventory.py \
        scripts/prepare_extension_directory.py \
        tests/test_ci_projection_shard.py \
        tests/test_native_projection_inventory.py \
        tests/test_native_projection_descriptor_destinations.py \
        tests/test_guard_durable_io.py \
        tests/test_guard_managed_install_context.py \
        tests/test_guard_private_file_io.py \
        tests/test_native_offline_cache.py \
        tests/offline_resource_census.py \
        tests/offline_data_fixture.py \
        tests/test_offline_resource_census.py \
        tests/test_offline_data_fixture.py \
        scripts/ci/pytest_duration_report.py \
        tests/test_ci_pytest_duration_report.py \
        tests/test_native_policy_test_support.py \
        tests/test_ci_native_evaluator_cache.py \
        tests/test_cursor_native_bridge.py \
        tests/test_grok_native_bridge.py \
        tests/test_frozen_windows_daemon_bootstrap.py \
        tests/test_frozen_windows_daemon_cleanup_diagnostics.py \
        tests/test_native_approval_gate_bridge.py \
        tests/test_native_review_allow_hint.py \
        tests/test_ci_quality_marker_scan.py
      uv run --no-sync python -m ruff check \
        scripts/release/native_artifact.py \
        scripts/release/prepared_native.py \
        tests/test_release_native_artifact.py
    shell: bash
  - name: Check formatting for production sources
    run: |
      uv run --no-sync python -m ruff format --check \
        tests/test_fleet_posture_builder.py \
        tests/test_runner_sync_payload.py \
        tests/test_guard_approval_extension_recommendation.py \
        scripts/ci/normalize_rust_toolchains.py \
        tests/test_ci_rust_toolchain_cache.py \
        tests/test_ci_native_evaluator_fast_path.py \
        scripts/ci/native_approval_contract_gate.py \
        tests/test_ci_native_approval_workflow.py \
        tests/test_policy_bundle_crate_boundary.py \
        tests/test_ci_command_source_inputs_manifest.py \
        tests/test_ci_macos_gate_shards.py \
        tests/test_ci_windows_sccache_readiness.py \
        tests/test_ci_required_aggregate.py \
        tests/test_ci_rust_preflight.py \
        tests/test_ci_rust_test_warm.py \
        tests/test_ci_runtime_test_archive.py \
        tests/test_ci_pytest_shard.py \
        tests/test_ci_pytest_shard_plan.py \
        tests/test_ci_quality_feedback.py \
        tests/test_native_regression_shard.py \
        tests/test_guard_gauntlet_ci.py \
        tests/test_guard_gauntlet_session_folder.py \
        tests/release_workflow_helpers.py \
        tests/test_alpha_fast_native_release.py \
        tests/test_ci_speed_contracts.py \
        tests/test_installed_canary_workflow.py \
        tests/test_pr_testpypi_canary_workflow.py \
        tests/test_publish_target_lanes.py \
        tests/test_release_compiler_cache.py \
        tests/test_release_critical_path.py \
        tests/test_release_native_binary_cache.py \
        tests/test_release_please_workflow.py \
        tests/test_release_publication_workflow.py \
        tests/test_release_train_workflow.py \
        tests/test_unpublished_alpha_reservation.py \
        src/ \
        scripts/build_native_command_program.py \
        scripts/ci/run_projection_shard.py \
        scripts/ci/verify_native_command_program.py \
        scripts/core_command_build_inputs.py \
        scripts/native_directory_inventory.py \
        scripts/native_projection_inventory.py \
        scripts/prepare_extension_directory.py \
        tests/test_ci_projection_shard.py \
        tests/test_native_projection_inventory.py \
        tests/test_native_projection_descriptor_destinations.py \
        tests/test_guard_durable_io.py \
        tests/test_guard_managed_install_context.py \
        tests/test_guard_private_file_io.py \
        tests/test_native_offline_cache.py \
        tests/offline_resource_census.py \
        tests/offline_data_fixture.py \
        tests/test_offline_resource_census.py \
        tests/test_offline_data_fixture.py \
        scripts/ci/pytest_duration_report.py \
        tests/test_ci_pytest_duration_report.py \
        tests/test_native_policy_test_support.py \
        tests/test_ci_native_evaluator_cache.py \
        tests/test_cursor_native_bridge.py \
        tests/test_grok_native_bridge.py \
        tests/test_frozen_windows_daemon_bootstrap.py \
        tests/test_frozen_windows_daemon_cleanup_diagnostics.py \
        tests/test_native_approval_gate_bridge.py \
        tests/test_native_review_allow_hint.py \
        tests/test_ci_quality_marker_scan.py
      if ! uv run --no-sync python -m ruff format --check \
        scripts/release/native_artifact.py \
        scripts/release/prepared_native.py \
        tests/test_release_native_artifact.py; then
        uv run --no-sync python -m ruff format --diff \
          scripts/release/native_artifact.py \
          scripts/release/prepared_native.py \
          tests/test_release_native_artifact.py || true
        exit 1
      fi
    shell: bash
  - run: uv run --no-sync basedpyright --level error
    shell: bash
  - name: Dead-code scan (L329)
    run: uv run --no-sync python -m ruff check src/codex_plugin_scanner/guard/ --select=F401,F811,F841
    shell: bash
  - name: TODO/FIXME scan (L330)
    run: |
      test -d src/codex_plugin_scanner/guard/
      count=$(
        { grep -rn "TODO\|FIXME\|HACK\|XXX" src/codex_plugin_scanner/guard/ --include="*.py" || [ "$?" -eq 1 ]; } |
        { grep -v "# type: ignore" || [ "$?" -eq 1 ]; } |
        wc -l | tr -d ' '
      )
      echo "Guard TODO/FIXME count: $count"
      if [ "$count" -gt "0" ]; then
        grep -rn "TODO\|FIXME\|HACK\|XXX" src/codex_plugin_scanner/guard/ --include="*.py" | grep -v "# type: ignore"
        exit 1
      fi
    shell: bash
