name: CI scheduling-sensitive
description: Run the scheduling-sensitive checks inside the existing CI job.
inputs:
  python-version:
    description: Explicit python-version from the calling job.
    required: true
runs:
  using: composite
  steps:
  - uses: ./.github/actions/setup-ci-python
    with:
      python-version: ${{ inputs.python-version }}
      cache-dependency-glob: ${{ env.CI_UV_CACHE_DEPENDENCY_GLOB }}
  - name: Download native command evaluators
    uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
    with:
      name: pytest-native-command-evaluators
      path: rust/target/release
  - name: Download matching native command projections
    uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
    with:
      name: pytest-native-command-projections
      path: .
  - name: Bind the compiled native runtime
    run: |
      chmod 0755 rust/target/release/hol-guard-runtime rust/target/release/guard-command-source
      echo "HOL_GUARD_NATIVE_BINARY=$GITHUB_WORKSPACE/rust/target/release/hol-guard-runtime" >> "$GITHUB_ENV"
    shell: bash
  - name: Run scheduling-sensitive tests untraced
    run: uv run --no-sync pytest tests/test_guard_extension_control_recovery.py tests/test_guard_sandbox.py tests/test_guard_js_lockfile_resolution_phase11.py
      tests/test_guard_runtime_hook_scheduler.py tests/test_guard_hook_process_runner.py::test_scheduler_and_runner_complete_48_routine_reviews_without_capacity_denial
      tests/test_guard_daemon_storage_liveness.py::test_locked_storage_hook_burst_fails_safe_without_stranding_daemon tests/test_guard_approval_store_scale.py::TestQueueScaleTargets::test_listing_first_queue_page_with_100k_rows_stays_under_100ms
      tests/test_guard_continuation_contract.py tests/test_guard_approval_store_scale.py::TestQueueScaleTargets::test_listing_queue_page_without_totals_stays_under_50ms_with_100k_rows
      tests/test_guard_approval_store_scale.py::TestQueueScaleTargets::test_resolving_one_request_with_100k_rows_stays_under_100ms
      'tests/test_guard_daemon_acceptance.py::test_packaged_correctness_workloads[pi-240-24]' 'tests/test_guard_daemon_acceptance.py::test_packaged_correctness_workloads[pi-480-two-client-24]'
      'tests/test_guard_daemon_acceptance.py::test_packaged_correctness_workloads[pi-960-four-client-8]' 'tests/test_guard_daemon_acceptance.py::test_packaged_correctness_workloads[mixed-harness-fairness]' tests/test_guard_omp_fast_path_regression.py::test_omp_post_tool_read_burst_uses_resident_scanner
      tests/test_guard_daemon_cli.py::TestDaemonStatusCommand::test_status_does_not_wait_for_guard_database_writer
      tests/test_codex_hook_repair_native_binding.py::test_real_configured_hook_native_protection_commits_repair
      tests/test_guard_gauntlet_parallel.py::test_interrupt_during_spawn_still_reaps_the_started_worker
      tests/test_guard_gauntlet_parallel.py::test_signal_during_cleanup_grace_still_force_kills
      'tests/test_guard_runtime.py::test_runtime_hook_saved_v1_allow_matches_every_scope_in_actual_evaluator[artifact]'
      'tests/test_guard_runtime.py::test_runtime_hook_saved_v1_allow_matches_every_scope_in_actual_evaluator[workspace]'
      'tests/test_guard_runtime.py::test_runtime_hook_saved_v1_allow_matches_every_scope_in_actual_evaluator[publisher]'
      'tests/test_guard_runtime.py::test_runtime_hook_saved_v1_allow_matches_every_scope_in_actual_evaluator[harness]'
      'tests/test_guard_runtime.py::test_runtime_hook_saved_v1_allow_matches_every_scope_in_actual_evaluator[global]'
      tests/test_guard_runtime.py::test_runtime_hook_integrity_rejection_outranks_valid_exact_one_shot_allow
      'tests/test_guard_surface_server.py::TestGuardSurfaceServer::test_guard_daemon_pi_hook_endpoint_returns_blocked_runtime_review_payload'
      tests/test_guard_headless_daemon_api.py::test_supply_chain_package_firewall_paid_install_and_test_roundtrip
      tests/test_guard_shim_intercept_proofs.py::test_daemon_package_shim_test_uses_projected_shell_profile_path
      tests/test_guard_continuation_runtime.py::test_codex_app_server_result_is_bounded_and_opaque
      tests/test_guard_command_corpus.py::test_full_native_evaluation_matches_contract_and_reports_original_oracle_differences
      tests/test_guard_policy_integrity.py::test_trust_backend_check_uses_spawn_from_concurrent_threads
      tests/test_guard_daemon_stress_script.py::test_daemon_stress_gate_keeps_fresh_process_alive_with_populated_store
      tests/test_guard_command_activity_rollups.py::test_rebuild_reconciles_one_hundred_thousand_rows_and_analytics_stays_under_50ms
      tests/test_codex_daemon_hook_bridge.py::test_bridge_real_daemon_prefers_payload_cwd_for_verified_git_fetch
      tests/test_codex_daemon_hook_bridge.py::test_bridge_real_daemon_denies_unproven_github_content_reads
      tests/test_guard_update_artifact.py::test_windows_regular_descriptor_uses_bound_handle_without_cross_api_path_stat
      tests/test_rust_io_ownership_gate.py::test_gate_inventories_reachable_io_and_passes_current_sources --tb=short
    shell: bash
  - name: Run extended reconnect soak without tracing
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    shell: bash
    run: uv run --no-sync pytest tests/test_guard_cloud_review_runtime_recovery.py::test_cloud_review_worker_survives_ten_thousand_recurring_disconnects --tb=short
