name: Temporary Windows CI repair

on:
  push:
    branches:
      - fix/native-runtime-process-lifecycle
    paths:
      - .github/workflows/temporary-windows-ci-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/native-runtime-process-lifecycle
          fetch-depth: 0
      - name: Apply guarded Windows test repairs
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > /tmp/windows-ci-repair.py
          python /tmp/windows-ci-repair.py
      - name: Format and commit repairs
        shell: bash
        run: |
          rm .github/workflows/temporary-windows-ci-repair.yml
          cargo fmt --manifest-path rust/Cargo.toml --all
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ci): harden Windows runtime test fixtures"
          git push origin HEAD:fix/native-runtime-process-lifecycle
