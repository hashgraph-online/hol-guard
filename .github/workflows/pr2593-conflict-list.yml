name: PR 2593 conflict list

on:
  push:
    branches:
      - chore/reconcile-main-into-release-3.0
    paths:
      - .github/workflows/pr2593-conflict-list.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: chore/reconcile-main-into-release-3.0
          fetch-depth: 0
      - name: List conflicts
        shell: bash
        run: |
          git fetch origin release/3.0
          set +e
          git merge --no-commit --no-ff origin/release/3.0 >/dev/null 2>&1
          status=$?
          set -e
          conflicts="$(git diff --name-only --diff-filter=U | paste -sd ',' -)"
          echo "MERGE_STATUS=$status CONFLICTS=$conflicts"
          if [ "$status" -ne 0 ]; then git merge --abort; fi
