name: Paseo main source inspection
on:
  push:
    branches: [inspect/paseo-main-ci-source]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive exact reviewed source and base
        run: |
          mkdir -p inspection
          git archive --format=tar.gz --output=inspection/paseo-main-head.tar.gz 11d09bb2be53923dff4981181eacf7da9402dcae
          git archive --format=tar.gz --output=inspection/paseo-main-base.tar.gz 7321a98fda6add267318df8af7ecab1a9a9003ab
          git show 11d09bb2be53923dff4981181eacf7da9402dcae:.github/workflows/rust-authority-ownership.yml > inspection/ownership-workflow.yml
          git ls-tree -r --name-only 11d09bb2be53923dff4981181eacf7da9402dcae scripts/ci ci > inspection/audit-paths.txt
          sha256sum inspection/*.tar.gz > inspection/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paseo-main-source-inspection
          path: inspection/
          retention-days: 1
          if-no-files-found: error
