name: Apply pipx updater argv compatibility fix

on:
  pull_request:
    paths:
      - "src/codex_plugin_scanner/guard/cli/update_subprocess.py"
      - ".github/workflows/debug-pipx-argv-compat.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Apply compatibility patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/codex_plugin_scanner/guard/cli/update_subprocess.py")
          text = path.read_text(encoding="utf-8")

          old_bootstrap = '''_TRUSTED_MODULE_BOOTSTRAP = (
              "import json,runpy,sys; "
              "import_paths=json.loads(sys.argv.pop(1)); "
              "extra_import_paths=json.loads(sys.argv.pop(1)); "
              "module=sys.argv.pop(1); "
              "sys.path[:0]=import_paths; "
              "sys.path.extend(extra_import_paths); "
              "sys.argv[0]=module; "
              "runpy.run_module(module, run_name='__main__', alter_sys=True)"
          )'''
          new_bootstrap = '''_TRUSTED_MODULE_BOOTSTRAP = (
              "import json,runpy,sys; "
              "import_paths=json.loads(sys.argv.pop(1)); "
              "extra_import_paths=json.loads(sys.argv.pop(1)) if sys.argv[1].startswith('[') else []; "
              "module=sys.argv.pop(1); "
              "sys.path[:0]=import_paths; "
              "sys.path.extend(extra_import_paths); "
              "sys.argv[0]=module; "
              "runpy.run_module(module, run_name='__main__', alter_sys=True)"
          )'''

          old_command = '''        return [
              str(self.python.launch_path),
              *_trusted_python_flags(),
              "-S",
              "-c",
              _TRUSTED_MODULE_BOOTSTRAP,
              self._python_import_paths_json(),
              json.dumps(extra_import_paths, separators=(",", ":")),
              module,
              *args,
          ]'''
          new_command = '''        command = [
              str(self.python.launch_path),
              *_trusted_python_flags(),
              "-S",
              "-c",
              _TRUSTED_MODULE_BOOTSTRAP,
              self._python_import_paths_json(),
          ]
          if extra_import_paths:
              command.append(json.dumps(extra_import_paths, separators=(",", ":")))
          return [*command, module, *args]'''

          if old_bootstrap not in text:
              raise SystemExit("trusted module bootstrap block not found")
          if old_command not in text:
              raise SystemExit("python_module_command block not found")
          text = text.replace(old_bootstrap, new_bootstrap, 1).replace(old_command, new_command, 1)
          path.write_text(text, encoding="utf-8")
          PY
          python -m pip install --disable-pip-version-check ruff==0.15.17
          python -m ruff format src/codex_plugin_scanner/guard/cli/update_subprocess.py
          rm .github/workflows/debug-pipx-argv-compat.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/codex_plugin_scanner/guard/cli/update_subprocess.py .github/workflows/debug-pipx-argv-compat.yml
          git diff --cached --check
          git commit -m "fix(update): preserve updater argv without shared pip"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
