name: Finalize PR 2464 Windows process inventory

"on":
  pull_request:
    branches:
      - release/3.0
    paths:
      - .github/workflows/tmp-fix-pr2464-windows-inventory.yml

permissions:
  contents: write

concurrency:
  group: finalize-pr-2464-windows-process-inventory
  cancel-in-progress: true

jobs:
  finalize:
    if: >-
      github.repository == 'hashgraph-online/hol-guard' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/rust-daemon-edge-workflow-validation' &&
      github.event.pull_request.base.ref == 'release/3.0'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/rust-daemon-edge-workflow-validation
          fetch-depth: 2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Install Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
      - name: Apply, validate, and commit the deterministic repair
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          branch='fix/rust-daemon-edge-workflow-validation'
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          remote_sha=$(git ls-remote --exit-code origin "refs/heads/${branch}" | awk '{print $1}')
          test "$remote_sha" = "$EXPECTED_HEAD_SHA"

          test "$(git hash-object scripts/ci/tmp_pr2464_patch_00.py.part)" = 13c781ea0d1bb773d99a97045ab22b4f1dc3b422
          test "$(git hash-object scripts/ci/tmp_pr2464_patch_01.py.part)" = daa166f464087730fb279c734e45de9dedf29d2b
          test "$(git hash-object scripts/ci/tmp_pr2464_patch_02.py.part)" = 4f465e6337b463899acc6e21b9702b5ae04c8109
          test "$(git hash-object scripts/ci/tmp_pr2464_patch_03.py.part)" = 10ad13e956a3ec18adab46611a614df5ebf95088
          patch_file="$RUNNER_TEMP/pr2464-patch.py"
          cat scripts/ci/tmp_pr2464_patch_*.py.part > "$patch_file"
          python -m py_compile "$patch_file"
          python "$patch_file"
          python - <<'PY'
          from pathlib import Path

          path = Path("rust/crates/guard-secure-fs/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          old = '''fn source_shape_allowed(path: &Path, parts: &[String]) -> bool {
              if parts
                  .iter()
                  .any(|part| SOURCE_INSPECTION_PARTS.contains(&part.as_str()))
              {
                  return true;
              }
              if path
                  .file_name()
                  .and_then(|value| value.to_str())
                  .is_some_and(|name| {
                      let lowered = name.to_ascii_lowercase();
                      BENIGN_SOURCE_DOTFILES.contains(&lowered.as_str())
                  })
              {
                  return true;
              }
              path.extension()
                  .and_then(|value| value.to_str())
                  .map(str::to_ascii_lowercase)
                  .is_some_and(|suffix| SOURCE_EXTENSIONS.contains(&suffix.as_str()))
          }
          '''
          new = '''fn source_shape_allowed(path: &Path, parts: &[String]) -> bool {
              parts
                  .iter()
                  .any(|part| SOURCE_INSPECTION_PARTS.contains(&part.as_str()))
                  || path
                      .file_name()
                      .and_then(|value| value.to_str())
                      .is_some_and(|name| {
                          let lowered = name.to_ascii_lowercase();
                          BENIGN_SOURCE_DOTFILES.contains(&lowered.as_str())
                      })
                  || path
                      .extension()
                      .and_then(|value| value.to_str())
                      .map(str::to_ascii_lowercase)
                      .is_some_and(|suffix| SOURCE_EXTENSIONS.contains(&suffix.as_str()))
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected one source_shape_allowed helper, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync ruff format \
            src/codex_plugin_scanner/guard/windows_processes.py \
            src/codex_plugin_scanner/guard/daemon/manager.py \
            src/codex_plugin_scanner/guard/daemon/bounded_http.py \
            tests/test_windows_processes.py \
            tests/test_guard_daemon_manager.py
          uv run --no-sync ruff check --fix \
            src/codex_plugin_scanner/guard/windows_processes.py \
            src/codex_plugin_scanner/guard/daemon/manager.py \
            src/codex_plugin_scanner/guard/daemon/bounded_http.py \
            tests/test_windows_processes.py \
            tests/test_guard_daemon_manager.py
          uv run --no-sync ruff format --check \
            src/codex_plugin_scanner/guard/windows_processes.py \
            src/codex_plugin_scanner/guard/daemon/manager.py \
            src/codex_plugin_scanner/guard/daemon/bounded_http.py \
            tests/test_windows_processes.py \
            tests/test_guard_daemon_manager.py
          uv run --no-sync basedpyright --level error \
            src/codex_plugin_scanner/guard/windows_processes.py \
            src/codex_plugin_scanner/guard/daemon/manager.py \
            src/codex_plugin_scanner/guard/daemon/bounded_http.py

          uv run --no-sync pytest -q \
            tests/test_windows_processes.py \
            tests/test_guard_daemon_manager.py \
            tests/test_native_runtime_admission.py \
            tests/test_daemon_bounded_http.py \
            tests/test_rust_daemon_edge_hardening_contracts.py \
            --tb=short

          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo fmt --manifest-path rust/Cargo.toml --all --check
          cargo clippy --manifest-path rust/Cargo.toml --locked --workspace --all-targets -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --locked --workspace --all-targets

          temp_sources="$RUNNER_TEMP/pr2464-temp-sources"
          mkdir -p "$temp_sources"
          cp .github/workflows/tmp-fix-pr2464-windows-inventory.yml "$temp_sources/workflow.yml"
          for part in scripts/ci/tmp_pr2464_patch_*.py.part; do
            cp "$part" "$temp_sources/$(basename "$part")"
          done
          rm -f .github/workflows/tmp-fix-pr2464-windows-inventory.yml
          rm -f scripts/ci/tmp_pr2464_patch_*.py.part
          uv run --no-sync python scripts/ci/code_quality_audit.py \
            --root . \
            --baseline ci/code-quality-baseline.json \
            --json-output code-quality-audit.json
          uv run --no-sync python scripts/ci/test_inventory.py --output test-inventory.json
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory test-inventory.json
          uv run --no-sync python scripts/ci/rust_migration_tree_hygiene.py
          mv "$temp_sources/workflow.yml" .github/workflows/tmp-fix-pr2464-windows-inventory.yml
          for part in "$temp_sources"/tmp_pr2464_patch_*.py.part; do
            mv "$part" scripts/ci/"$(basename "$part")"
          done
          rm -f code-quality-audit.json test-inventory.json

          git diff --check
          git add \
            src/codex_plugin_scanner/guard/windows_processes.py \
            src/codex_plugin_scanner/guard/daemon/manager.py \
            src/codex_plugin_scanner/guard/daemon/bounded_http.py \
            tests/test_windows_processes.py \
            tests/test_guard_daemon_manager.py \
            rust/crates/guard-runtime/src/main.rs \
            rust/crates/guard-secure-fs/src/lib.rs
          git diff --cached --check
          git diff --exit-code -- .github/workflows
          git diff --exit-code -- scripts/ci/tmp_pr2464_patch_00.py.part
          git diff --exit-code -- scripts/ci/tmp_pr2464_patch_01.py.part
          git diff --exit-code -- scripts/ci/tmp_pr2464_patch_02.py.part
          git diff --exit-code -- scripts/ci/tmp_pr2464_patch_03.py.part
          git status --short
          git config user.name 'Michael Kantor'
          git config user.email '6068672+kantorcodes@users.noreply.github.com'
          git commit --signoff -m 'fix(daemon): harden cross-platform process handling'

          remote_sha=$(git ls-remote --exit-code origin "refs/heads/${branch}" | awk '{print $1}')
          test "$remote_sha" = "$EXPECTED_HEAD_SHA"
          git push origin "HEAD:refs/heads/${branch}"
