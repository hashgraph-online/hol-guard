name: Wake Desktop Core stable feed

on:
  issues:
    types: [opened]
  push:
    branches:
      - main
    paths:
      # Test-only changes are validated in PR CI without waking release producers.
      - .github/workflows/wake-desktop-core-alpha-feed.yml
      - scripts/release/wake_desktop_core_feeds.py
  pull_request:
    paths:
      - .github/workflows/wake-desktop-core-alpha-feed.yml
      - scripts/release/wake_desktop_core_feeds.py
      - tests/test_wake_desktop_core_feeds.py
      - tests/test_core_feed_publication_handoff.py

permissions:
  contents: read

concurrency:
  group: wake-desktop-core-stable-feed
  cancel-in-progress: false

jobs:
  wake:
    name: Dispatch Desktop Core stable feed
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'issues' &&
       (github.event.issue.author_association == 'OWNER' ||
        github.event.issue.author_association == 'MEMBER' ||
        github.event.issue.author_association == 'COLLABORATOR') &&
       startsWith(github.event.issue.title, '[desktop-core-feed]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out trusted wake automation
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Dispatch feed producer
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/release/wake_desktop_core_feeds.py
