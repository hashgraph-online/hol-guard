name: PR 2745 source snapshot

on:
  push:
    branches:
      - feat/everyday-mode-r32-final

permissions:
  contents: read

concurrency:
  group: pr2745-source-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/everyday-mode-r32-final
          persist-credentials: false
          fetch-depth: 1
      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=.venv --exclude=node_modules -czf /tmp/pr2745-source.tar.gz .
          sha256sum /tmp/pr2745-source.tar.gz > /tmp/pr2745-source.tar.gz.sha256
      - name: Upload source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr2745-source-${{ github.sha }}
          path: |
            /tmp/pr2745-source.tar.gz
            /tmp/pr2745-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
