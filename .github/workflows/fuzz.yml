name: Fuzzing

on:
  pull_request:
    branches: [main]
    # The Atheris harnesses fuzz the Python package; pushes to main and the
    # weekly campaign still fuzz every revision.
    paths:
      - "src/**"
      - "fuzzers/**"
      - ".clusterfuzzlite/**"
      - ".github/workflows/fuzz.yml"
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      rust_fuzz_seconds:
        description: "Seconds to fuzz each Rust target"
        required: false
        default: "600"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code-change:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: google/clusterfuzzlite/actions/build_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c
        with:
          language: python
          sanitizer: address
      - uses: google/clusterfuzzlite/actions/run_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: code-change
          sanitizer: address
          fuzz-seconds: 60
          output-sarif: true

  batch:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 40 || 5 }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: google/clusterfuzzlite/actions/build_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c
        with:
          language: python
          sanitizer: address
      - uses: google/clusterfuzzlite/actions/run_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: batch
          sanitizer: address
          # Keep the full campaign on its weekly/manual lane; each commit still fuzzes.
          fuzz-seconds: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 1800 || 60 }}
          output-sarif: true

  rust:
    # libFuzzer needs a nightly compiler and a sanitizer build, and a campaign
    # is worth minutes per target, so no pull request pays for this lane. A
    # pull request replays the committed corpus instead, as an ordinary test in
    # the Rust suite (`guard-runtime`'s `fuzz_entry` tests).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - resident_frame
          - command_request
          - shell_command
          - scanner_text
          - python_json
          - prompt_text
          - contained_path
          - registry_response
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Install the nightly toolchain libFuzzer needs
        run: rustup toolchain install nightly --profile minimal --component rust-src
      - name: Cache the Cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: rust/fuzz
          key: cargo-fuzz
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz ${{ matrix.target }}
        working-directory: rust/fuzz
        env:
          FUZZ_SECONDS: ${{ inputs.rust_fuzz_seconds || '600' }}
        run: |
          set -euo pipefail
          case "$FUZZ_SECONDS" in
            '' | *[!0-9]*)
              echo "rust_fuzz_seconds must be a whole number of seconds, got '$FUZZ_SECONDS'" >&2
              exit 1
              ;;
          esac
          # The job is cancelled at its own timeout, and a cancelled job never
          # reaches the upload below, so a campaign asked to outlive the budget
          # would throw away the crash it found. Stop inside the budget, leaving
          # the toolchain install and the sanitizer build their share of it.
          budget=2100
          if [ "$FUZZ_SECONDS" -gt "$budget" ]; then
            echo "Capping the campaign at ${budget}s so a crash still reaches the artifact."
            FUZZ_SECONDS="$budget"
          fi
          cargo +nightly fuzz run "${{ matrix.target }}" -- \
            -max_total_time="$FUZZ_SECONDS" \
            -timeout=25 \
            -rss_limit_mb=4096 \
            -print_final_stats=1
      # A crashing input is the whole point of the lane: keep it so it can be
      # committed as a seed, which is what makes every later pull request
      # replay the bug on the stable toolchain.
      - name: Upload the crashing inputs
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-fuzz-artifacts-${{ matrix.target }}
          path: rust/fuzz/artifacts
          if-no-files-found: ignore
