[package]
name = "guard-command-build"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"
publish = false
autobins = false
autotests = false
autoexamples = false
autobenches = false

# Build-dependency only. Compile the exact production compiler implementation,
# but without its packaged default. No copied lowering or admission algorithm.
[lib]
path = "../guard-command/src/lib.rs"
test = false
doctest = false
bench = false

[dependencies]
base64 = "=0.22.1"
mailparse = "=0.17.0"
guard-secure-fs = { path = "../guard-secure-fs" }
guard-contracts = { path = "../guard-contracts" }
guard-runtime-windows-process = { path = "../guard-runtime-windows-process" }
regex = "1.11.2"
fancy-regex = "0.19"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
hex = "0.4.3"
idna = "1.0.3"
percent-encoding = "2.3.1"
toml = "0.9.5"
roxmltree = "0.20.0"
getrandom = "0.3.3"
ring = "0.17.14"
rsa = "0.9.8"
base64ct = "1.6.0"

[build-dependencies]
sha2 = "0.10.9"

# Do not run the production test harness a second time against a bootstrap
# library that intentionally has no default program. guard-command owns it.
[workspace]
