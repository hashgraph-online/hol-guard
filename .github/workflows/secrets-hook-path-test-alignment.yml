name: Secrets hook PATH regression alignment

on:
  push:
    branches:
      - fix/secrets-hook-identity-worktree-hardening

permissions:
  contents: write

concurrency:
  group: secrets-hook-path-test-alignment
  cancel-in-progress: true

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/secrets-hook-identity-worktree-hardening
          fetch-depth: 0
          persist-credentials: true
      - name: Align PATH-loss assertion with pinned executable behavior
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_guard_secret_platform_hardening.py')
          text = path.read_text(encoding='utf-8')
          old = '    assert "could not find the hol-guard executable" in result.stderr\n'
          new = (
              '    assert "git_staged_enumeration_failed" in result.stderr\n'
              '    assert "pinned Guard executable is unavailable" not in result.stderr\n'
          )
          if old not in text:
              raise SystemExit('old missing-PATH assertion was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/secrets-hook-path-test-alignment.yml
          git add tests/test_guard_secret_platform_hardening.py
          git commit -m 'test(secrets): assert pinned hook survives PATH loss'
          git push origin HEAD:fix/secrets-hook-identity-worktree-hardening
