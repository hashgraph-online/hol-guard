name: Patch PR 2464 repair workflow

on:
  push:
    branches:
      - fix/rust-daemon-edge-workflow-validation
    paths:
      - .github/workflows/tmp-patch-pr2464-repair.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-pr-2464-repair
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/rust-daemon-edge-workflow-validation
          fetch-depth: 2
      - name: Fix regex replacement handling
        shell: bash
        run: |
          set -euo pipefail
          branch='fix/rust-daemon-edge-workflow-validation'
          remote_sha=$(git ls-remote --exit-code origin "refs/heads/${branch}" | awk '{print $1}')
          test "$remote_sha" = "$GITHUB_SHA"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/tmp-fix-pr2464-windows-inventory.yml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'inventory_pattern.subn(inventory_replacement, text, count=1)': 'inventory_pattern.subn(lambda _match: inventory_replacement, text, count=1)',
              'pid_pattern.subn(pid_replacement, text, count=1)': 'pid_pattern.subn(lambda _match: pid_replacement, text, count=1)',
              'pid_test_pattern.subn(pid_test_replacement, text, count=1)': 'pid_test_pattern.subn(lambda _match: pid_test_replacement, text, count=1)',
              'inventory_test_pattern.subn(inventory_test_replacement, text, count=1)': 'inventory_test_pattern.subn(lambda _match: inventory_test_replacement, text, count=1)',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise RuntimeError(f'unexpected repair-workflow anchor count: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/tmp-patch-pr2464-repair.yml
          git diff --check
          git add -A
          git diff --cached --check
          git config user.name 'Michael Kantor'
          git config user.email '6068672+kantorcodes@users.noreply.github.com'
          git commit --signoff -m 'ci: fix PR 2464 repair workflow'
          git push origin "HEAD:refs/heads/${branch}"
