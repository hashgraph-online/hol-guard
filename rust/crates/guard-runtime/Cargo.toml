[package]
name = "hol-guard-runtime"
version = "3.16.3"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "hol-guard-runtime"
path = "src/main.rs"

[dependencies]
guard-command = { path = "../guard-command" }
guard-contracts = { path = "../guard-contracts" }
guard-hook-core = { path = "../guard-hook-core" }
guard-policy-snapshot = { path = "../guard-policy-snapshot" }
guard-rule-contract = { path = "../guard-rule-contract" }
guard-runtime-windows-process = { path = "../guard-runtime-windows-process" }
getrandom.workspace = true
hex.workspace = true
fs2.workspace = true
libc.workspace = true
ring.workspace = true
rusqlite.workspace = true
guard-secure-fs = { path = "../guard-secure-fs" }
serde.workspace = true
serde_json.workspace = true
aes.workspace = true
base64ct.workspace = true
cbc.workspace = true
hmac.workspace = true
sha2.workspace = true
sha1.workspace = true
pbkdf2.workspace = true
scrypt.workspace = true
base32ct.workspace = true
sysinfo.workspace = true
guard-archive = { version = "0.1.0", path = "../guard-archive" }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "resource", "socket", "net", "user"] }

[target.'cfg(target_os = "macos")'.dependencies]
guard-seatbelt = { path = "../guard-seatbelt" }
libproc = "0.14.11"
security-framework = "3.7.0"

[target.'cfg(windows)'.dependencies]
windows-permissions.workspace = true

[target.'cfg(all(unix, target_os = "linux"))'.dependencies]
seccompiler = "0.5.0"

[lints]
workspace = true
