name: Rust runtime

on:
  push:
    branches: [release/3.0]
    paths:
      - "rust/**"
      - "src/codex_plugin_scanner/guard/native_runtime.py"
      - "src/codex_plugin_scanner/guard/daemon/hook_worker.py"
      - "tests/test_guard_native_runtime.py"
      - ".github/workflows/rust-runtime.yml"
  pull_request:
    branches: [release/3.0]
    paths:
      - "rust/**"
      - "src/codex_plugin_scanner/guard/native_runtime.py"
      - "src/codex_plugin_scanner/guard/daemon/hook_worker.py"
      - "tests/test_guard_native_runtime.py"
      - ".github/workflows/rust-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
      - name: Verify dependency lock
        working-directory: rust
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - name: Normalize formatting for compiler gates
        working-directory: rust
        run: |
          cargo fmt --all
          git diff --check
          cargo fmt --all --check
      - name: Lint
        working-directory: rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        working-directory: rust
        run: cargo test --locked --workspace --all-targets
      - name: Release build
        working-directory: rust
        env:
          HOL_GUARD_BUILD_SHA: ${{ github.sha }}
        run: cargo build --locked --release -p hol-guard-runtime
      - name: Runtime self-test
        run: rust/target/release/hol-guard-runtime self-test --json

  python-facade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run --no-sync python -m ruff check src/codex_plugin_scanner/guard/native_runtime.py tests/test_guard_native_runtime.py
      - run: uv run --no-sync python -m ruff format --check src/codex_plugin_scanner/guard/native_runtime.py
      - run: uv run --no-sync pytest tests/test_guard_native_runtime.py tests/test_guard_hook_process_deadline_contract.py --tb=short
