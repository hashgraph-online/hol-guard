name: Export Everyday Mode fixture inputs

on:
  push:
    branches:
      - tmp/everyday-r32-fixture-export-20260903

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: everyday-r32-fixture-inputs-${{ github.sha }}
          path: src/codex_plugin_scanner/guard/runtime/action_explanation_contract.py
          retention-days: 1
          if-no-files-found: error
