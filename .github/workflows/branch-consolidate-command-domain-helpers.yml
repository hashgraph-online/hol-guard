name: Consolidate command-domain helpers

on:
  push:
    branches:
      - fix/docker-kubernetes-command-coverage

permissions:
  contents: write

concurrency:
  group: consolidate-command-domain-helpers
  cancel-in-progress: true

jobs:
  consolidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Consolidate duplicate helpers
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path

          common_path = Path("src/codex_plugin_scanner/guard/runtime/command_common_extension_helpers.py")
          common = common_path.read_text(encoding="utf-8")
          if "required_flags_in_all_arguments: bool = False" not in common.split("def flag_variant(", 1)[1].split(") -> CommandSafeVariant:", 1)[0]:
              common = common.replace(
                  "def _variant_leaf(matcher: ExecutableMatcher, required_flags: frozenset[str]) -> ExecutableMatcher:\n",
                  "def _variant_leaf(\n"
                  "    matcher: ExecutableMatcher,\n"
                  "    required_flags: frozenset[str],\n"
                  "    *,\n"
                  "    required_flags_in_all_arguments: bool = False,\n"
                  "    fail_secure_unknown_options: bool = False,\n"
                  ") -> ExecutableMatcher:\n",
                  1,
              )
              common = common.replace(
                  "        required_flags_in_all_arguments=matcher.required_flags_in_all_arguments,\n"
                  "        fail_secure_unknown_options=matcher.fail_secure_unknown_options,\n",
                  "        required_flags_in_all_arguments=(\n"
                  "            matcher.required_flags_in_all_arguments or required_flags_in_all_arguments\n"
                  "        ),\n"
                  "        fail_secure_unknown_options=matcher.fail_secure_unknown_options or fail_secure_unknown_options,\n",
                  1,
              )
              common = common.replace(
                  "    required_flags: frozenset[str],\n"
                  ") -> CommandSafeVariant:\n"
                  "    \"\"\"Create a rule-local safe variant without dropping matcher constraints.\"\"\"\n",
                  "    required_flags: frozenset[str],\n"
                  "    required_flags_in_all_arguments: bool = False,\n"
                  "    fail_secure_unknown_options: bool = False,\n"
                  ") -> CommandSafeVariant:\n"
                  "    \"\"\"Create a rule-local safe variant without dropping matcher constraints.\"\"\"\n",
                  1,
              )
              common = common.replace(
                  "        variant_matcher: CommandMatcher = _variant_leaf(matcher, required_flags)\n",
                  "        variant_matcher: CommandMatcher = _variant_leaf(\n"
                  "            matcher,\n"
                  "            required_flags,\n"
                  "            required_flags_in_all_arguments=required_flags_in_all_arguments,\n"
                  "            fail_secure_unknown_options=fail_secure_unknown_options,\n"
                  "        )\n",
                  1,
              )
              common = common.replace(
                  "            _variant_leaf(child, required_flags) for child in matcher.matchers if isinstance(child, ExecutableMatcher)\n",
                  "            _variant_leaf(\n"
                  "                child,\n"
                  "                required_flags,\n"
                  "                required_flags_in_all_arguments=required_flags_in_all_arguments,\n"
                  "                fail_secure_unknown_options=fail_secure_unknown_options,\n"
                  "            )\n"
                  "            for child in matcher.matchers\n"
                  "            if isinstance(child, ExecutableMatcher)\n",
                  1,
              )
          common = common.replace("    example_command: str,\n    severity: CommandRuleSeverity = \"high\",\n", "    example_command: str | None = None,\n    severity: CommandRuleSeverity = \"high\",\n", 1)
          common_path.write_text(common, encoding="utf-8")

          domain_path = Path("src/codex_plugin_scanner/guard/runtime/command_domain_extensions.py")
          domain = domain_path.read_text(encoding="utf-8")
          if "def _executable_matcher(" in domain:
              domain = domain.replace(
                  "from .command_container_common_extensions import CONTAINER_COMMON_COMMAND_RULES\n",
                  "from .command_common_extension_helpers import (\n"
                  "    executable_matcher as _executable_matcher,\n"
                  "    flag_variant,\n"
                  "    help_variant as _help_variant,\n"
                  "    kubernetes_dry_run_variant,\n"
                  "    rule as _rule,\n"
                  ")\n"
                  "from .command_container_common_extensions import CONTAINER_COMMON_COMMAND_RULES\n",
                  1,
              )
              old_import = '''from .command_rules import (
    AnyMatcher,
    CommandRuleSeverity,
    CommandSafetyRule,
    CommandSafeVariant,
    ExecutableMatcher,
)
'''
              if old_import not in domain:
                  raise SystemExit("command_rules import block changed unexpectedly")
              domain = domain.replace(old_import, "from .command_rules import AnyMatcher\n", 1)
              domain = domain.replace("_EMPTY_STRING_SET: frozenset[str] = frozenset()\n_EMPTY_OPTION_REQUIREMENTS: tuple[tuple[str, frozenset[str]], ...] = ()\n\n\n", "", 1)
              helpers_start = domain.index("def _executable_matcher(")
              helpers_end = domain.index("_DOCKER_SYSTEM_PRUNE =", helpers_start)
              domain = domain[:helpers_start] + domain[helpers_end:]

              force_start = domain.index("_DOCKER_FORCE_REMOVE =")
              force_end = domain.index("_DOCKER_PRIVILEGED_RUN =", force_start)
              force_block = '''_DOCKER_FORCE_REMOVE = AnyMatcher(
    matchers=tuple(
        _executable_matcher(
            _DOCKER_EXECUTABLES,
            *subcommands,
            required_flags=frozenset({flag}),
            leading_options_with_values=_DOCKER_GLOBAL_OPTIONS,
            interspersed_flags=_DOCKER_GLOBAL_FLAGS,
        )
        for subcommands in (("rm",), ("container", "rm"))
        for flag in ("--force", "-f")
    )
)
'''
              domain = domain[:force_start] + force_block + domain[force_end:]
              domain = domain.replace("_help_variant_for_any(", "_help_variant(")
              domain = domain.replace(
                  '_kubernetes_dry_run_variant("delete"),',
                  'kubernetes_dry_run_variant(_KUBECTL_DELETE, "Kubernetes delete preview"),',
                  1,
              )
              domain = domain.replace(
                  '_kubernetes_dry_run_variant("drain"),',
                  'kubernetes_dry_run_variant(_KUBECTL_DRAIN, "Kubernetes drain preview"),',
                  1,
              )
              domain = domain.replace(
                  '_helm_dry_run_variant("uninstall", "Helm uninstall preview"),',
                  'flag_variant(\n'
                  '                _HELM_UNINSTALL,\n'
                  '                variant_id="dry-run",\n'
                  '                title="Helm uninstall preview",\n'
                  '                required_flags=frozenset({"--dry-run"}),\n'
                  '                required_flags_in_all_arguments=True,\n'
                  '                fail_secure_unknown_options=True,\n'
                  '            ),',
                  1,
              )

              pulumi_end_marker = '''_PULUMI_DESTROY = _executable_matcher(
    frozenset({"pulumi"}),
    "destroy",
    leading_options_with_values=_PULUMI_GLOBAL_OPTIONS,
)
'''
              if pulumi_end_marker not in domain:
                  raise SystemExit("Pulumi matcher block not found")
              domain = domain.replace(
                  pulumi_end_marker,
                  pulumi_end_marker
                  + '_INFRASTRUCTURE_DESTROY = AnyMatcher(\n'
                  + '    matchers=(_TERRAFORM_DESTROY, _TERRAFORM_APPLY_DESTROY, _PULUMI_DESTROY)\n'
                  + ')\n',
                  1,
              )
              domain = domain.replace(
                  "        matcher=AnyMatcher(matchers=(_TERRAFORM_DESTROY, _TERRAFORM_APPLY_DESTROY, _PULUMI_DESTROY)),\n",
                  "        matcher=_INFRASTRUCTURE_DESTROY,\n",
                  1,
              )
              infra_start = domain.index('        safe_variants=(\n', domain.index('rule_id="command.infrastructure-as-code.destroy"'))
              infra_end = domain.index("\n        ),\n    ),\n    *CONTAINER_COMMON_COMMAND_RULES", infra_start) + len("\n        ),")
              infra_safe = '''        safe_variants=(
            _help_variant(_INFRASTRUCTURE_DESTROY),
            flag_variant(
                _PULUMI_DESTROY,
                variant_id="preview-only",
                title="Pulumi destroy preview",
                required_flags=frozenset({"--preview-only"}),
            ),
        ),'''
              domain = domain[:infra_start] + infra_safe + domain[infra_end:]
              domain_path.write_text(domain, encoding="utf-8")
          PY
      - name: Format and validate consolidation
        run: |
          uv run --no-sync ruff format \
            src/codex_plugin_scanner/guard/runtime/command_common_extension_helpers.py \
            src/codex_plugin_scanner/guard/runtime/command_domain_extensions.py
          uv run --no-sync ruff check \
            src/codex_plugin_scanner/guard/runtime/command_common_extension_helpers.py \
            src/codex_plugin_scanner/guard/runtime/command_domain_extensions.py
          uv run --no-sync basedpyright \
            src/codex_plugin_scanner/guard/runtime/command_common_extension_helpers.py \
            src/codex_plugin_scanner/guard/runtime/command_domain_extensions.py
          uv run --no-sync pytest -q \
            tests/test_guard_command_common_extension_regressions.py \
            tests/test_guard_command_container_kubernetes_common_extensions.py \
            tests/test_guard_command_permission_catalog.py \
            tests/test_guard_extension_control_catalog_detail.py
          test "$(wc -l < src/codex_plugin_scanner/guard/runtime/command_domain_extensions.py)" -le 500
          ! grep -q '^def _executable_matcher' src/codex_plugin_scanner/guard/runtime/command_domain_extensions.py
          ! grep -q '^def _help_variant' src/codex_plugin_scanner/guard/runtime/command_domain_extensions.py
          ! grep -q '^def _rule' src/codex_plugin_scanner/guard/runtime/command_domain_extensions.py
      - name: Commit consolidation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          remote_sha="$(git ls-remote origin refs/heads/fix/docker-kubernetes-command-coverage | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git config user.name "Michael Kantor"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git add \
            src/codex_plugin_scanner/guard/runtime/command_common_extension_helpers.py \
            src/codex_plugin_scanner/guard/runtime/command_domain_extensions.py
          git commit -m "refactor: reuse shared command extension helpers"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push origin HEAD:fix/docker-kubernetes-command-coverage
