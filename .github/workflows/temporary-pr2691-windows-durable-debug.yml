name: Temporary PR 2691 Windows full-path rename validation

on:
  push:
    branches:
      - tmp/pr2691-windows-durable-debug-20260902
    paths:
      - .github/workflows/temporary-pr2691-windows-durable-debug.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: tmp/pr2691-windows-durable-debug-20260902
          persist-credentials: false
      - name: Validate full-path atomic rename
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          @'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one replacement target, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          state_windows = Path('rust/crates/guard-runtime/src/resident_state_windows.rs')
          replace_once(
              state_windows,
              '''    SetNamedSecurityInfo(
                  path.as_os_str(),
                  SeObjectType::SE_FILE_OBJECT,
                  SecurityInformation::Dacl | SecurityInformation::ProtectedDacl,
                  None,
                  None,
                  Some(dacl),
                  None,
              )
          ''',
              '''    SetNamedSecurityInfo(
                  path.as_os_str(),
                  SeObjectType::SE_FILE_OBJECT,
                  SecurityInformation::Dacl
                      | SecurityInformation::Owner
                      | SecurityInformation::ProtectedDacl,
                  Some(owner.as_ref()),
                  None,
                  Some(dacl),
                  None,
              )
          ''',
          )

          private_files = Path('rust/crates/guard-runtime-windows-process/src/private_files.rs')
          old = '''pub(super) fn rename_into_directory(
              binding: &super::directory_binding::PrivateDirectoryBinding,
              source: &std::fs::File,
              destination: &OsStr,
          ) -> io::Result<()> {
              let name = destination.encode_wide().collect::<Vec<_>>();
              if name.is_empty() || name.contains(&0) {
                  return Err(io::Error::new(
                      io::ErrorKind::InvalidInput,
                      "private destination name is invalid",
                  ));
              }
              let header_size = size_of::<FILE_RENAME_INFO>() - size_of::<u16>();
              let byte_count = name
                  .len()
                  .checked_mul(size_of::<u16>())
                  .ok_or_else(|| io::Error::new(io::ErrorKind::InvalidInput, "private name is too long"))?;
              let buffer_size = header_size
                  .checked_add(byte_count)
                  .ok_or_else(|| io::Error::new(io::ErrorKind::InvalidInput, "private name is too long"))?;
              let mut buffer = vec![0u8; buffer_size];
              // SAFETY: The buffer is sized to include the fixed header and the exact
              // UTF-16 payload expected by FILE_RENAME_INFO.
              unsafe {
                  let info = buffer.as_mut_ptr() as *mut FILE_RENAME_INFO;
                  (*info).ReplaceIfExists = TRUE;
                  (*info).RootDirectory = binding.handle().as_raw_handle() as HANDLE;
                  (*info).FileNameLength = byte_count as DWORD;
                  std::ptr::copy_nonoverlapping(
                      name.as_ptr() as *const u8,
                      buffer.as_mut_ptr().add(header_size),
                      byte_count,
                  );
              }
              // SAFETY: `source` is a live DELETE-capable handle and `buffer` remains
              // valid for the synchronous rename call.
              if unsafe {
                  SetFileInformationByHandle(
                      source.as_raw_handle() as HANDLE,
                      FileRenameInfo,
                      buffer.as_ptr() as *mut _,
                      buffer_size as DWORD,
                  )
              } == FALSE
              {
                  return Err(io::Error::last_os_error());
              }
              Ok(())
          }
          '''
          new = '''pub(super) fn rename_into_directory(
              binding: &super::directory_binding::PrivateDirectoryBinding,
              source: &std::fs::File,
              destination: &OsStr,
          ) -> io::Result<()> {
              let destination_path = binding.path().join(destination);
              let mut name = destination_path.as_os_str().encode_wide().collect::<Vec<_>>();
              if name.is_empty() || name.contains(&0) {
                  return Err(io::Error::new(
                      io::ErrorKind::InvalidInput,
                      "private destination name is invalid",
                  ));
              }
              let byte_count = name
                  .len()
                  .checked_mul(size_of::<u16>())
                  .ok_or_else(|| io::Error::new(io::ErrorKind::InvalidInput, "private name is too long"))?;
              name.push(0);
              let filename_offset = std::mem::offset_of!(FILE_RENAME_INFO, FileName);
              let payload_size = name
                  .len()
                  .checked_mul(size_of::<u16>())
                  .ok_or_else(|| io::Error::new(io::ErrorKind::InvalidInput, "private name is too long"))?;
              let buffer_size = filename_offset
                  .checked_add(payload_size)
                  .ok_or_else(|| io::Error::new(io::ErrorKind::InvalidInput, "private name is too long"))?;
              let word_size = size_of::<usize>();
              let allocation_size = buffer_size
                  .checked_add(word_size - 1)
                  .ok_or_else(|| io::Error::new(io::ErrorKind::InvalidInput, "private name is too long"))?;
              let mut buffer = vec![0usize; allocation_size / word_size];
              let buffer_ptr = buffer.as_mut_ptr() as *mut u8;
              // SAFETY: `Vec<usize>` provides at least the alignment required by
              // FILE_RENAME_INFO on Windows. The allocation includes the full
              // absolute UTF-16 path and its trailing NUL; FileNameLength excludes
              // that terminator as required by SetFileInformationByHandle.
              unsafe {
                  let info = buffer_ptr as *mut FILE_RENAME_INFO;
                  (*info).ReplaceIfExists = TRUE;
                  (*info).RootDirectory = null_mut();
                  (*info).FileNameLength = byte_count as DWORD;
                  std::ptr::copy_nonoverlapping(
                      name.as_ptr() as *const u8,
                      buffer_ptr.add(filename_offset),
                      payload_size,
                  );
              }
              // SAFETY: `source` is a live DELETE-capable handle and `buffer`
              // remains valid for this synchronous rename call.
              if unsafe {
                  SetFileInformationByHandle(
                      source.as_raw_handle() as HANDLE,
                      FileRenameInfo,
                      buffer_ptr as *mut _,
                      buffer_size as DWORD,
                  )
              } == FALSE
              {
                  return Err(io::Error::last_os_error());
              }
              Ok(())
          }
          '''
          replace_once(private_files, old, new)

          lease_tests = Path('rust/crates/guard-runtime/src/managed_resident_lease_tests.rs')
          replace_once(
              lease_tests,
              '''        let mut file = crate::resident_state::private_file(path, true, private_root).unwrap();
          ''',
              '''        let mut file = crate::resident_state::private_file(path, false, private_root).unwrap();
          ''',
          )
          '@ | python -

          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo clippy --manifest-path rust/Cargo.toml --locked --workspace --all-targets -- -D warnings
          $env:RUST_BACKTRACE = '1'
          cargo test --manifest-path rust/Cargo.toml --locked -p hol-guard-runtime --bin hol-guard-runtime approval::approval_v4::tests::ed25519_assertion_validates_and_persists_counter_zero_and_one -- --nocapture --test-threads=1
          cargo test --manifest-path rust/Cargo.toml --locked -p hol-guard-runtime --bin hol-guard-runtime managed_resident::restart_budget::tests::repeated_updates_replace_budget_without_leaving_temporary_state -- --nocapture --test-threads=1
          cargo test --manifest-path rust/Cargo.toml --locked -p hol-guard-runtime --bin hol-guard-runtime policy_store::policy_store_persistence::windows_recovery_tests::authority_recovery_replaces_only_valid_private_backup -- --nocapture --test-threads=1
          cargo test --manifest-path rust/Cargo.toml --locked -p hol-guard-runtime --bin hol-guard-runtime managed_resident::lease::tests::dropping_owned_malformed_lease_removes_the_owned_artifact -- --nocapture --test-threads=1
          cargo test --manifest-path rust/Cargo.toml --locked --workspace --all-targets
