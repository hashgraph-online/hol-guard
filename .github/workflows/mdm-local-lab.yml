name: MDM local conformance lab

on:
  pull_request:
    paths:
      - ".github/workflows/mdm-local-lab.yml"
      - ".github/actions/setup-rust/**"
      - "rust/Cargo.lock"
      - "rust/crates/guard-contracts/src/policy_bundle_*.rs"
      - "rust/crates/guard-runtime/src/policy_bundle_*.rs"
      - "rust/crates/guard-runtime/src/resident_*.rs"
      - "scripts/mdm/**"
      - "src/codex_plugin_scanner/guard/mdm/**"
      - "src/codex_plugin_scanner/guard/*policy_bundle*.py"
      - "tests/test_guard_mdm_*.py"
      - "tests/test_guard_self_protection_schemas.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            suites: ""
          - os: macos-14
            suites: ""
          - os: windows-2022
            suites: "--suite adapter-contract --suite enterprise-network"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          enable-cache: true
      - run: uv sync --python 3.12 --extra dev --frozen
      - uses: ./.github/actions/stage-command-projections
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: mdm-local-lab-native
      # Managed policy keyrings and policy bundle snapshots are decided by the
      # resident runtime, which fails closed when no binary is bound.
      - name: Build and bind the native runtime
        shell: bash
        run: |
          cargo build --manifest-path rust/Cargo.toml --locked --release -p hol-guard-runtime --bin hol-guard-runtime
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            suffix=".exe"
          fi
          echo "HOL_GUARD_NATIVE_BINARY=$GITHUB_WORKSPACE/rust/target/release/hol-guard-runtime$suffix" >> "$GITHUB_ENV"
          echo "HOL_GUARD_NATIVE_REGRESSION=1" >> "$GITHUB_ENV"
      - run: uv run --python 3.12 --no-sync python scripts/mdm/run-local-lab.py --json --output mdm-local-conformance.json ${{ matrix.suites }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mdm-local-conformance-${{ matrix.os }}
          path: mdm-local-conformance.json
          if-no-files-found: warn
          retention-days: 30
