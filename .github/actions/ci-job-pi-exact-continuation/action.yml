name: CI pi-exact-continuation
description: Run the pi-exact-continuation checks inside the existing CI job.
runs:
  using: composite
  steps:
  - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
    with:
      node-version: 22.22.2
      cache: npm
      cache-dependency-path: ci/pi-exact-continuation/package-lock.json
  - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
    with:
      bun-version: 1.3.14
  - name: Install reviewed npm toolchain
    shell: bash
    run: |
      npm_root="$RUNNER_TEMP/pi-npm-toolchain"
      npm install --prefix "$npm_root" npm@12.0.0 --ignore-scripts --no-audit --no-fund
      echo "$npm_root/node_modules/.bin" >> "$GITHUB_PATH"
  - uses: ./.github/actions/setup-ci-python
    with:
      python-version: ${{ env.CI_PYTHON_VERSION }}
      cache-dependency-glob: ${{ env.CI_UV_CACHE_DEPENDENCY_GLOB }}
  - name: Stage isolated SDK prefix
    shell: bash
    run: |
      sdk_root="$RUNNER_TEMP/hol-guard-pi-exact-continuation-sdk"
      mkdir -p "$sdk_root"
      cp ci/pi-exact-continuation/package.json ci/pi-exact-continuation/package-lock.json "$sdk_root/"
      echo "PI_EXACT_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
  - name: Install exact Pi and OMP packages without lifecycle scripts
    shell: bash
    working-directory: ${{ env.PI_EXACT_SDK_ROOT }}
    run: |
      npm ci --ignore-scripts --no-audit --no-fund
  - name: Run actual SDK continuation module with zero-skip enforcement
    shell: bash
    run: |
      uv run --no-sync python scripts/ci/verify_pi_exact_continuation.py \
        --lock ci/pi-exact-continuation/package-lock.json \
        --prefix "$PI_EXACT_SDK_ROOT" \
        --junitxml "$RUNNER_TEMP/pi-exact-continuation-junit.xml"
  - name: Upload actual SDK continuation JUnit report
    if: always()
    uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
    with:
      name: pi-exact-continuation-junit
      path: ${{ runner.temp }}/pi-exact-continuation-junit.xml
      if-no-files-found: warn
