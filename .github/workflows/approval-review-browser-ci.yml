name: Approval review browser CI

on:
  pull_request:
    branches: [main]
    paths:
      - dashboard/**
      - src/codex_plugin_scanner/guard/daemon/static/**
      - tests/fixtures/native-review-action-envelope.json
      - .github/workflows/approval-review-browser-ci.yml

permissions:
  contents: read

concurrency:
  group: approval-review-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  approval-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install dashboard and Chromium dependencies
        working-directory: dashboard
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bunx playwright install --with-deps chromium

      - name: Verify native review contract and build dashboard
        working-directory: dashboard
        run: |
          bun src/native-review-contract.test.ts
          bun run build

      - name: Verify approval details and password/Authenticator Enter submission
        working-directory: dashboard
        run: bunx playwright test e2e/approval-scope-ui.spec.ts --project chromium
