name: CI cross-platform
description: Run the cross-platform checks inside the existing CI job.
inputs:
  python-version:
    description: Explicit python-version from the calling job.
    required: true
runs:
  using: composite
  steps:
  - name: Download this run's current command projections
    uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
    with:
      name: pytest-native-command-projections
      path: .
  - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
    with:
      python-version: ${{ inputs.python-version }}
  - name: Set up uv
    id: setup-uv-primary
    continue-on-error: true
    uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
    with:
      version: 0.9.26
      enable-cache: true
      cache-dependency-glob: ${{ env.CI_UV_CACHE_DEPENDENCY_GLOB }}
      save-cache: false
  - name: Retry uv setup after transient download failure
    if: steps.setup-uv-primary.outcome == 'failure'
    uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
    with:
      version: 0.9.26
      enable-cache: true
      cache-dependency-glob: ${{ env.CI_UV_CACHE_DEPENDENCY_GLOB }}
      save-cache: false
  - run: uv sync --frozen --no-dev --group ci-test --python ${{ inputs.python-version }}
    shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
  - name: Run cross-platform Guard regressions
    run: uv run --no-sync pytest tests/test_cli.py tests/test_verification.py tests/test_action_runner.py --tb=short
    shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
  - uses: ./.github/actions/setup-rust
    if: runner.os == 'macOS'
  - name: Build the native runtime for skill-directory identity on macOS
    if: runner.os == 'macOS'
    shell: bash
    run: |
      cargo build --manifest-path rust/Cargo.toml --locked --release -p hol-guard-runtime --bin hol-guard-runtime
      echo "HOL_GUARD_NATIVE_BINARY=$GITHUB_WORKSPACE/rust/target/release/hol-guard-runtime" >> "$GITHUB_ENV"
      echo "HOL_GUARD_NATIVE_REGRESSION=1" >> "$GITHUB_ENV"
  - name: Run cross-platform skill-directory identity regressions
    # macOS serves identity from the native runtime built above; Windows has no
    # native op and uses the portable Python implementation.
    run: uv run --no-sync pytest tests/test_guard_skill_directory_identity.py
      tests/test_guard_skill_directory_identity_discovery.py tests/test_guard_skill_directory_identity_downstream.py tests/test_guard_skill_directory_identity_links.py
      tests/test_guard_skill_directory_identity_vectors.py
      tests/test_guard_consumer_skill_directory_identity.py tests/test_guard_runner_skill_directory_identity.py tests/test_gemini_adapter.py
      tests/test_gemini_skill_directory_identity.py tests/test_antigravity_adapter.py tests/test_guard_aibom_detection.py
      tests/test_guard_aibom_content_upload_batches.py tests/test_guard_aibom_skill_directory_identity.py --tb=short
    shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
  - name: Run Windows Codex hook process-tree regressions
    if: runner.os == 'Windows'
    run: uv run --no-sync pytest tests/test_codex_hook_fallback_isolation.py -k "isolated_process_timeout_kills_descendants
      or isolated_process_closes_descendant_held_pipes_after_parent_exit" --tb=short
    shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
  - name: Build and exercise packaged Windows Core daemon gate
    if: runner.os == 'Windows'
    shell: pwsh
    run: |
      $ErrorActionPreference = 'Stop'
      $PSNativeCommandUseErrorActionPreference = $true
      $dist = Join-Path $env:RUNNER_TEMP "hol-guard-frozen"
      $work = Join-Path $env:RUNNER_TEMP "hol-guard-frozen-work"
      $spec = Join-Path $env:RUNNER_TEMP "hol-guard-frozen-spec"
      $versionFile = Join-Path $env:RUNNER_TEMP "hol-guard-version-info.txt"
      New-Item -ItemType Directory -Force -Path $dist, $work, $spec | Out-Null
      uv sync --frozen --no-dev --group ci-test --extra mdm-build --python ${{ inputs.python-version }}
      $version = (uv run --no-sync python scripts/sync_repo_version.py --check).Trim()
      uv run --no-sync python scripts/mdm/windows/write-version-info.py `
        --version $version --output $versionFile
      uv run --no-sync python -I scripts/release/stage_guard_cloud_review_artifacts.py `
        --source-root (Get-Location).Path
      if ($LASTEXITCODE -ne 0) {
        throw "Staging Guard cloud review artifacts failed with exit code $LASTEXITCODE"
      }
      uv run --no-sync pyinstaller --clean --noconfirm --onedir --name hol-guard `
        --collect-submodules codex_plugin_scanner --collect-data codex_plugin_scanner `
        --version-file $versionFile `
        --distpath $dist --workpath $work --specpath $spec `
        scripts/mdm/hol-guard-entry.py
      if ($LASTEXITCODE -ne 0) {
        throw "PyInstaller failed with exit code $LASTEXITCODE"
      }
      $env:HOL_GUARD_FROZEN_TEST_EXECUTABLE = Join-Path $dist "hol-guard/hol-guard.exe"
      if (-not (Test-Path -LiteralPath $env:HOL_GUARD_FROZEN_TEST_EXECUTABLE -PathType Leaf)) {
        throw "Frozen hol-guard executable was not produced"
      }
      uv run --no-sync pytest tests/test_frozen_windows_daemon_bootstrap.py --tb=short
