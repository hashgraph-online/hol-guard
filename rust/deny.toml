# Supply-chain gates for the Rust workspace, run by `cargo deny` in CI.
#
# Guard's runtime is the component that decides what a harness may do, so its
# dependency set is part of the security boundary: an advisory, an unexpected
# registry or a second copy of a crate all change what ships in the binary that
# makes those decisions. Every check below fails the build rather than warning,
# and the exceptions are listed by name so they stay visible.

[graph]
# Tier 1 targets. A crate that only ever builds for some other platform does not
# need to clear these gates.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "aarch64-unknown-linux-musl",
]
all-features = true

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
# A yanked version is a signal from the publisher that the release should not be
# used. For a security runtime that is an error, not a note.
yanked = "deny"
unmaintained = "all"
# An entry here needs the advisory id and the reason the code path does not
# reach us.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "the Marvin attack recovers a key from the timing of RSA private-key operations; Guard only ever verifies signatures with rsa, so no private key and no decryption reaches the crate outside its own tests, and the advisory has no fixed release" },
    { id = "RUSTSEC-2026-0459", reason = "the stale-page read needs a crafted -wal file planted beside a database the victim opens; every database Guard opens is its own store inside the Guard home, so planting one needs write access to the Guard home, which already lets the writer change the store directly. The fixed libsqlite3-sys 0.39 ships with rusqlite 0.41, which needs rustc 1.89, above the workspace's 1.88 toolchain" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant is marked unmaintained because zbus 6 absorbed it as its wire module, with no known vulnerability. It reaches Guard only through secret-service 5, the Linux Secret Service client the policy-integrity key mint uses, which still depends on zbus 5. Remove this entry once secret-service moves to zbus 6" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is marked unmaintained because zbus 6 absorbed it as its names module, with no known vulnerability. It reaches Guard only through secret-service 5 and zbus 5, the Linux Secret Service client the policy-integrity key mint uses. Remove this entry once secret-service moves to zbus 6" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is marked unmaintained because zbus 6 provides its derive macros, with no known vulnerability. It is a build-time proc macro reached only through secret-service 5 and zbus 5, the Linux Secret Service client the policy-integrity key mint uses. Remove this entry once secret-service moves to zbus 6" },
    { id = "RUSTSEC-2026-0543", reason = "chrono is marked unmaintained, with no known vulnerability. oauth2 5 needs it for the timestamps in its token responses, and no oauth2 release drops it yet. guard-runtime also uses it directly, for the local calendar day the usage meter files each model request under, since the standard library cannot read the local time zone. Remove this entry once oauth2 moves to jiff or time and the usage meter moves with it" },
]

[licenses]
# Permissive licenses only, matching the workspace's own Apache-2.0 terms. Guard
# ships these crates inside a redistributed binary, so a copyleft obligation
# would reach the whole runtime.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# Build scripts run on the machine that produces the shipped binary, so their
# dependencies are in scope. Test-only crates are not.
include-build = true
include-dev = false
confidence-threshold = 0.93

[bans]
# A second copy of a crate means two versions of the same logic in one binary,
# and an advisory fixed in one of them is not fixed in the other. New duplicates
# fail; the ones already in the tree are listed below so they stay countable.
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true

deny = [
    # Guard's runtime speaks TLS through rustls. Linking a system TLS stack
    # would move certificate verification out of the build we reproduce and
    # into whatever the host happens to ship.
    { crate = "openssl", reason = "the runtime uses rustls; a system TLS stack is not reproducible across the platforms Guard ships" },
    { crate = "openssl-sys", reason = "pulls in the system OpenSSL that rustls exists to avoid" },
    { crate = "native-tls", reason = "delegates certificate verification to the host TLS stack" },
]

# Each entry is a duplicate that exists in the current lock file. Removing one of
# these lines is the way to record that the duplicate is gone; adding a line
# needs a reason the two versions cannot be unified yet.
skip = [
    { crate = "aes@0.8.4", reason = "Guard is on the RustCrypto 0.10 line; the Linux keyring client's encrypted Secret Service session uses the 0.11 line" },
    { crate = "base64@0.22.1", reason = "transitive, pending the dependents that still pin 0.22" },
    { crate = "bitflags@1.3.2", reason = "transitive, dependents still on the 1.x API" },
    { crate = "block-buffer@0.10.4", reason = "Guard is on the RustCrypto 0.10 line; cigar-context uses the 0.11 line" },
    { crate = "block-padding@0.3.3", reason = "Guard is on the RustCrypto 0.10 line; the Linux keyring client's encrypted Secret Service session uses the 0.11 line" },
    { crate = "cbc@0.1.2", reason = "Guard is on the RustCrypto 0.10 line; the Linux keyring client's encrypted Secret Service session uses the 0.11 line" },
    { crate = "cipher@0.4.4", reason = "Guard is on the RustCrypto 0.10 line; the Linux keyring client's encrypted Secret Service session uses the 0.11 line" },
    { crate = "const-oid@0.9.6", reason = "Guard is on the RustCrypto 0.10 line; cigar-context uses the 0.11 line" },
    { crate = "cpufeatures@0.2.17", reason = "Guard is on the RustCrypto 0.10 line; cigar-context uses the 0.11 line" },
    { crate = "crypto-common@0.1.7", reason = "Guard is on the RustCrypto 0.10 line; cigar-context uses the 0.11 line" },
    { crate = "digest@0.10.7", reason = "Guard is on the RustCrypto 0.10 line; cigar-context uses the 0.11 line" },
    { crate = "fancy-regex@0.16.2", reason = "transitive, pending a dependent upgrade" },
    { crate = "getrandom@0.2.17", reason = "transitive, dependents still on the 0.2 API" },
    { crate = "getrandom@0.3.4", reason = "transitive, dependents still on the 0.3 API" },
    { crate = "hmac@0.12.1", reason = "Guard is on the RustCrypto 0.10 line; cigar-context uses the 0.11 line" },
    { crate = "inout@0.1.4", reason = "Guard is on the RustCrypto 0.10 line; the Linux keyring client's encrypted Secret Service session uses the 0.11 line" },
    { crate = "roxmltree@0.20.0", reason = "transitive, pending a dependent upgrade" },
    { crate = "serde_spanned@0.6.9", reason = "transitive through the toml 0.8 line" },
    { crate = "sha2@0.10.9", reason = "Guard is on the RustCrypto 0.10 line; cigar-context uses the 0.11 line" },
    { crate = "shlex@1.3.0", reason = "transitive, dependents still on the 1.x API" },
    { crate = "syn@2.0.119", reason = "transitive, proc-macro dependents still on syn 2" },
    { crate = "thiserror@1.0.69", reason = "transitive, dependents still on the 1.x API" },
    { crate = "thiserror-impl@1.0.69", reason = "paired with thiserror 1.x" },
    { crate = "toml@0.8.23", reason = "transitive, pending a dependent upgrade" },
    { crate = "toml_datetime@0.6.11", reason = "transitive through the toml 0.8 line" },
    { crate = "toml_datetime@0.7.5+spec-1.1.0", reason = "the toml 0.9 line guard-command-build reads its manifests with; proc-macro-crate, a build dependency of the Linux keyring client's zbus macros, uses the 1.x line" },
    { crate = "toml_edit@0.22.27", reason = "the line guard-runtime edits harness configs with; proc-macro-crate, a build dependency of the Linux keyring client's zbus macros, uses 0.25" },
    { crate = "windows-link@0.1.3", reason = "transitive through the older windows-sys line" },
    { crate = "windows-sys@0.52.0", reason = "transitive, dependents still on the 0.52 API" },
    { crate = "winnow@0.7.15", reason = "transitive through the toml 0.8 line" },
]

[sources]
# Everything comes from crates.io. A git dependency would make the build depend
# on a branch someone can move after review.
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
