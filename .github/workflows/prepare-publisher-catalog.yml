name: Prepare publisher catalog

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/prepare-publisher-catalog.yml

permissions: {}

jobs:
  prepare:
    if: >-
      github.repository_id == '1194748811' &&
      github.event.pull_request.number == 2835 &&
      github.event.pull_request.user.id == 6068672 &&
      github.event.pull_request.head.repo.id == 1194748811 &&
      github.event.pull_request.head.ref == 'feat/extension-publisher-profiles'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - name: Store the verified JSON representation without changing any ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64
          import hashlib
          import json
          import os
          import urllib.request

          root = 'https://api.github.com/repos/hashgraph-online/hol-guard'
          revision = '87b03651d2d305d847814b78128870bc1903488d'
          expected = 'f7215b77b4dc96dba9c92990ebc8633279d22065eab2b49c98b94caa83d8ea8d'
          def request(path, payload=None):
              body = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(root + path, data=body, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(req, timeout=20) as response:
                  data = response.read(1500000)
                  assert response.read(1) == b'', 'Response exceeds the size limit'
                  return json.loads(data)
          original = request('/contents/docs/guard/extensions/catalog.v1.json?ref=' + revision)
          assert original['type'] == 'file' and original['encoding'] == 'base64'
          value = json.loads(base64.b64decode(original['content']))
          assert value['schemaVersion'] == 'guard.extension-directory.v1'
          for entry in value['entries']:
              entry['tagline'] = entry['tagline'].rstrip()
          content = json.dumps(value, ensure_ascii=True, sort_keys=True, separators=(',', ':')) + '\n'
          digest = hashlib.sha256(content.encode()).hexdigest()
          assert digest == expected, 'Generated bytes differ from the tested artifact'
          blob = request('/git/blobs', {'content': content, 'encoding': 'utf-8'})
          print(json.dumps({'blobSha': blob['sha'], 'sha256': digest, 'bytes': len(content.encode())}))
