[package]
name = "gauntlet-worker-state"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Durable one-time reservation boundary for the future Gauntlet Linux worker"

[[bin]]
name = "gauntlet-vm-worker-shadow"
path = "src/bin/gauntlet-vm-worker-shadow.rs"

[[bin]]
name = "gauntlet-controller-shadow"
path = "src/bin/gauntlet-controller-shadow.rs"

[[bin]]
name = "gauntlet-sdk-tap-child"
path = "src/bin/gauntlet-sdk-tap-child.rs"

[dependencies]
gauntlet-contracts = { path = "../gauntlet-contracts" }
gauntlet-evidence = { path = "../gauntlet-evidence" }
libc = "=0.2.191"
pep508_rs = "=0.9.2"
ring = "=0.17.14"
rustix = { version = "=1.1.5", features = ["event", "fs", "process", "time"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
sha2 = "=0.10.9"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
gauntlet-host-state = { path = "../gauntlet-host-state" }
tempfile = "=3.27.0"
