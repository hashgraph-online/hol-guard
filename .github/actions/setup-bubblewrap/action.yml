name: Set up verified bubblewrap
description: Reuse the pinned Ubuntu sandbox binary without caching host policy state.
runs:
  using: composite
  steps:
    - name: Identify the sandbox build platform
      id: platform
      shell: bash
      run: echo "image=${ImageOS:?}-${ImageVersion:?}" >> "$GITHUB_OUTPUT"
    - name: Restore the exact sandbox build
      id: cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ runner.temp }}/bubblewrap-build
        key: bubblewrap-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.platform.outputs.image }}-${{ hashFiles('ci/containment/install-bubblewrap.sh', '.github/actions/setup-bubblewrap/action.yml') }}
    - name: Install and verify the sandbox and host policy
      shell: bash
      env:
        BWRAP_BUILD_CACHE_DIR: ${{ runner.temp }}/bubblewrap-build
        BWRAP_BUILD_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      run: bash ci/containment/install-bubblewrap.sh
    - name: Save the verified sandbox build
      if: steps.cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ runner.temp }}/bubblewrap-build
        key: ${{ steps.cache.outputs.cache-primary-key }}
