name: Finalize Everyday Mode review fixes

on:
  push:
    branches:
      - feat/everyday-mode-r32-final

permissions:
  contents: write

concurrency:
  group: everyday-mode-r32-finalizer
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply final reviewed patch
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 --decode | gzip --decompress > "$RUNNER_TEMP/final.patch"
          git apply --check "$RUNNER_TEMP/final.patch"
          git apply "$RUNNER_TEMP/final.patch"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: '1.3.6'

      - name: Validate final source
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
          python_targets=(
            src/codex_plugin_scanner/guard/config.py
            src/codex_plugin_scanner/guard/presentation_mode.py
            src/codex_plugin_scanner/guard/presentation_settings.py
            src/codex_plugin_scanner/guard/cli/commands_dispatch_desktop.py
            src/codex_plugin_scanner/guard/cli/desktop_presentation.py
            src/codex_plugin_scanner/guard/runtime/action_explanation_contract.py
            src/codex_plugin_scanner/guard/runtime/action_explanation_cloud.py
            tests/test_guard_presentation_mode.py
            tests/test_guard_everyday_mode_completion.py
            tests/test_guard_desktop_dashboard_session.py
            tests/test_guard_action_explanation_contract.py
          )
          uv run --no-sync python -m ruff format "${python_targets[@]}"
          uv run --no-sync python -m ruff check --fix "${python_targets[@]}"
          uv run --no-sync python -m ruff check "${python_targets[@]}"
          uv run --no-sync pytest -q \
            tests/test_guard_presentation_mode.py \
            tests/test_guard_everyday_mode_completion.py \
            tests/test_guard_desktop_dashboard_session.py \
            tests/test_guard_desktop_contract.py \
            tests/test_guard_action_explanation_contract.py
          uv run --no-sync python scripts/ci/code_quality_audit.py \
            --root . --baseline ci/code-quality-baseline.json
          uv run --no-sync python scripts/ci/test_inventory.py \
            --output "$RUNNER_TEMP/test-inventory.json"
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory "$RUNNER_TEMP/test-inventory.json"
          (
            cd dashboard
            bun install --frozen-lockfile
            bun run test
            bun run build
          )
          git diff --check

      - name: Commit final source and remove finalizer
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/everyday-mode-r32-review-fixes.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: finalize Everyday Mode review fixes'
          git push origin HEAD:feat/everyday-mode-r32-final
