name: Everyday presentation contracts

on:
  pull_request:
    branches: [release/3.2]
  push:
    branches: [release/3.2, 'fix/everyday-r32-*']

permissions:
  contents: read

concurrency:
  group: everyday-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Record exact candidate source
        run: |
          mkdir -p "$RUNNER_TEMP/everyday-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/everyday-evidence/commit.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/everyday-evidence/source.tar.gz" HEAD
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --python 3.12
      - name: Run presentation and explanation contracts
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync pytest -q tests/test_guard_*explanation*.py tests/test_guard_presentation_mode.py tests/test_guard_everyday*.py --junitxml="$RUNNER_TEMP/everyday-evidence/contracts.xml"
      - name: Preserve candidate and test evidence
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: everyday-core-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/everyday-evidence/
          retention-days: 7
          if-no-files-found: error
