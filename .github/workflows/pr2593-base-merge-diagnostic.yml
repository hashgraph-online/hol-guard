name: PR 2593 base merge diagnostic

on:
  push:
    branches:
      - chore/reconcile-main-into-release-3.0
    paths:
      - .github/workflows/pr2593-base-merge-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: chore/reconcile-main-into-release-3.0
          fetch-depth: 0
      - name: Inspect merge
        shell: bash
        run: |
          git fetch origin release/3.0
          set +e
          git merge --no-commit --no-ff origin/release/3.0
          status=$?
          set -e
          echo "merge_status=$status"
          echo "conflicts_begin"
          git diff --name-only --diff-filter=U
          echo "conflicts_end"
          if [ "$status" -ne 0 ]; then
            echo "combined_diff_begin"
            git diff --cc --no-ext-diff
            echo "combined_diff_end"
            git merge --abort
          fi
