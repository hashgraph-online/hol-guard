name: Everyday quality push verifier

on:
  push:
    branches:
      - fix/everyday-mode-live-release-3.2-20260908

permissions:
  contents: write

jobs:
  refactor-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/everyday-mode-live-release-3.2-20260908
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
      - name: Apply Everyday quality refactor
        run: |
          python .github/everyday_quality_fix.py
          rm .github/everyday_quality_fix.py
          rm .github/workflows/everyday-quality-fix.yml
          rm .github/workflows/everyday-quality-push.yml
      - name: Install dependencies
        run: uv sync --frozen --extra dev --python 3.12
      - name: Format and lint refactor
        run: |
          uv run --no-sync ruff check --fix src/codex_plugin_scanner/guard/runtime/action_explanation_semantics.py src/codex_plugin_scanner/guard/runtime/action_explanation_projection.py src/codex_plugin_scanner/guard/runtime/action_explanation_rule_kinds.py tests/test_guard_action_explanation_projection.py
          uv run --no-sync ruff format src/codex_plugin_scanner/guard/runtime/action_explanation_semantics.py src/codex_plugin_scanner/guard/runtime/action_explanation_projection.py src/codex_plugin_scanner/guard/runtime/action_explanation_rule_kinds.py tests/test_guard_action_explanation_projection.py
          uv run --no-sync ruff check --output-format concise src/codex_plugin_scanner/guard/runtime/action_explanation_semantics.py src/codex_plugin_scanner/guard/runtime/action_explanation_projection.py src/codex_plugin_scanner/guard/runtime/action_explanation_rule_kinds.py tests/test_guard_action_explanation_projection.py
          git diff --check
      - name: Verify Everyday behavior and structural quality
        run: |
          uv run --no-sync pytest tests/test_guard_action_explanation_projection.py tests/test_guard_everyday_live_wiring.py --tb=short
          uv run --no-sync python scripts/ci/code_quality_audit.py --root . --baseline ci/code-quality-baseline.json --json-output code-quality-audit.json
      - name: Regenerate source-bound decision evidence
        run: |
          uv run --no-sync python tests/guard_command_decision_diff.py --write
          uv run --no-sync python tests/guard_command_decision_diff.py --check
      - name: Commit verified refactor
        run: |
          git add src/codex_plugin_scanner/guard/runtime/action_explanation_semantics.py src/codex_plugin_scanner/guard/runtime/action_explanation_projection.py src/codex_plugin_scanner/guard/runtime/action_explanation_rule_kinds.py tests/test_guard_action_explanation_projection.py tests/fixtures/guard-command-corpus/decision-diff-report.json .github/everyday_quality_fix.py .github/workflows/everyday-quality-fix.yml .github/workflows/everyday-quality-push.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(guard): simplify Everyday explanation semantics"
          git push origin HEAD:fix/everyday-mode-live-release-3.2-20260908
