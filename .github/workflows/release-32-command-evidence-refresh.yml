name: Release 3.2 command evidence refresh

on:
  push:
    branches:
      - fix/3.2-command-review-followup

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/3.2-command-review-followup
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false

      - name: Install locked development environment
        run: uv sync --frozen --extra dev --python 3.12

      - name: Refresh deterministic command evidence
        run: uv run --no-sync python tests/guard_command_decision_diff.py --write

      - name: Verify refreshed command evidence
        run: uv run --no-sync python tests/guard_command_decision_diff.py --check

      - name: Commit evidence and remove one-shot workflow
        run: |
          digest="$(uv run --no-sync python tests/guard_command_decision_diff.py --metrics | uv run --no-sync python -c 'import json,sys; print(json.load(sys.stdin)["report_framed_sha256"])')"
          git rm .github/workflows/release-32-command-evidence-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/fixtures/guard-command-corpus/decision-diff-report.json
          git commit -m 'test(commands): refresh release 3.2 decision evidence' -m "Decision-Diff-Framed-SHA256: ${digest}"
          git push origin HEAD:fix/3.2-command-review-followup
