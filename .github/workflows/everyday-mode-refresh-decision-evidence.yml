name: Refresh Everyday Mode decision evidence

on:
  push:
    branches:
      - feat/everyday-mode-r32-final

permissions:
  contents: write

concurrency:
  group: everyday-mode-decision-evidence
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'

      - name: Refresh deterministic decision evidence
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync python tests/guard_command_decision_diff.py --write
          uv run --no-sync python tests/guard_command_decision_diff.py --check
          git diff --check

      - name: Commit refreshed evidence and remove generator
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/everyday-mode-refresh-decision-evidence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/fixtures/guard-command-corpus/decision-diff-report.json .github/workflows/everyday-mode-refresh-decision-evidence.yml
          if git diff --cached --quiet; then
            echo 'No evidence refresh needed.'
            exit 0
          fi
          git commit -m 'test: refresh Everyday Mode decision evidence'
          git push origin HEAD:feat/everyday-mode-r32-final
