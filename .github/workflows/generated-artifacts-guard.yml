name: generated-artifacts-guard
on:
  pull_request:

permissions:
  contents: read

jobs:
  regen-owned-paths:
    runs-on: ubuntu-24.04
    # Only the regen workflow's own artifact PRs may touch generated paths;
    # every other PR must leave them to post-merge regen. A fork cannot claim
    # the exemption since it requires a same-repo regen/artifacts-* branch.
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'regen/artifacts-') && github.event.pull_request.user.login == vars.GUARD_AUTOMATION_LOGIN) }}
    steps:
      - name: Reject changes to regen-owned generated paths
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.label }}
        run: |
          set -euo pipefail
          owned='^contracts/extensions/(native-command-program|command-catalog)\.v1\.json$'
          owned+='|^contracts/managed-controls/v1/(extension-projection-digest-vector|policy-bundle-v2-extension-signature-vector)\.json$'
          owned+='|^docs/guard/extensions/(README\.md|catalog\.v[12]\.json)$'
          owned+='|^src/codex_plugin_scanner/guard/contracts/data/extensions/'
          owned+='|^src/codex_plugin_scanner/guard/contracts/data/mcp_servers/'
          owned+='|^tests/fixtures/extension-controls/catalog-baseline\.v1\.json$'
          owned+='|^tests/fixtures/guard-command-corpus/decision-diff-report\.(json|framed-sha256)$'
          owned+='|^tests/test_guard_extension_trust\.py$'
          owned+='|^tests/test_policy_bundle_delivery_runtime\.py$'
          files=$(gh api --paginate "repos/${GH_REPO}/compare/${BASE}...${HEAD}" \
            --jq '.files[].filename')
          changed=$(printf '%s\n' "${files}" | grep -E "${owned}" || [ $? -eq 1 ])
          if [ -n "${changed}" ]; then
            printf '%s\n' "::error::This PR modifies paths owned by the extension-artifact-regen workflow. Generated artifacts are regenerated on main after merge — drop them from this diff:" "${changed}"
            exit 1
          fi
