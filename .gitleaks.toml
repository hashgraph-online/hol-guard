# Audited synthetic test vectors and immutable source-file digests only.
# Every exception requires both the exact file and exact fixture source bytes.
# Default detection rules, entropy thresholds and scan scope remain unchanged.
title = "HOL Guard audited test vectors"

[extend]
useDefault = true

[[rules]]
id = "aws-access-token"

[[rules.allowlists]]
description = "Audited synthetic scanner or cryptographic interoperability test vector"
condition = "AND"
regexTarget = "line"
paths = ['''(?:^|/)rust/crates/guard\-scanner/src/staged_scanner\.rs$''', '''(?:^|/)rust/crates/guard\-command/tests/pretool_omp_tracked_search\.rs$''']
regexes = [
  '''^[\t\r\n ]*std::fs::write\(dir\.join\("\.env"\), "AWS_ACCESS_KEY_ID=AKIAIOSFODNN7REALKEY\\n"\)\.unwrap\(\);[\t\r\n ]*$''',
  '''^[\t\r\n ]*&\[\("\.env", "AWS_ACCESS_KEY_ID=AKIAIOSFODNN7REALKEY\\n"\)\],[\t\r\n ]*$''',
]

[[rules]]
id = "curl-auth-header"

[[rules.allowlists]]
description = "Audited synthetic scanner or cryptographic interoperability test vector"
condition = "AND"
regexTarget = "line"
paths = ['''(?:^|/)tests/fixtures/guard\-red\-team/benign\-docs\-fake\-token\.py$''']
regexes = [
  '''^[\t\r\n ]*curl \-H "Authorization: Bearer hol\-fake\-docs\-token\-example\-0000" \\\\[\t\r\n ]*$''',
]

[[rules.allowlists]]
description = "Synthetic bearer token recorded in the hook adapter parity vectors, not a credential"
condition = "AND"
regexTarget = "secret"
paths = ['''(?:^|/)rust/crates/guard\-command/testdata/hook_adapter_vectors\.json$''']
regexes = [
  '''^abcdefghijkl12345$''',
]

