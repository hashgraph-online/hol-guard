name: Paseo current source inspection
on:
  push:
    branches: [inspect/paseo-main-ci-source]
permissions:
  contents: read
concurrency:
  group: paseo-isolated-validation
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false
      - name: Export exact source and offline test dependencies
        run: |
          set -euo pipefail
          mkdir -p inspection/wheels
          git archive --format=tar.gz --output=inspection/head.tar.gz ba7aaa37c6145a3bc668191bf8d6a6067ead2dbf
          git checkout --detach ba7aaa37c6145a3bc668191bf8d6a6067ead2dbf
          uv export --frozen --no-dev --no-emit-project --no-hashes > inspection/requirements.txt
          python -m pip download --dest inspection/wheels -r inspection/requirements.txt pytest
          git ls-tree -r HEAD > inspection/git-tree.txt
          sha256sum inspection/head.tar.gz > inspection/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paseo-current-source-and-dependencies
          path: inspection/
          retention-days: 1
          if-no-files-found: error
