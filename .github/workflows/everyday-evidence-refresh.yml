name: Everyday evidence refresh

on:
  push:
    branches:
      - fix/everyday-mode-live-release-3.2-20260908

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/everyday-mode-live-release-3.2-20260908
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
      - name: Generate reviewed decision evidence
        run: |
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync python tests/guard_command_decision_diff.py
          uv run --no-sync python tests/guard_command_decision_diff.py --check
      - name: Commit generated evidence and self-remove
        run: |
          rm .github/workflows/everyday-evidence-refresh.yml
          git add tests/fixtures/guard-command-corpus/decision-diff-report.json .github/workflows/everyday-evidence-refresh.yml
          if git diff --cached --quiet; then
            echo "No generated evidence change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(ci): refresh Everyday decision evidence"
          git push origin HEAD:fix/everyday-mode-live-release-3.2-20260908
