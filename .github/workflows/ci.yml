name: CI
on:
  push:
    branches: [main, release/3.0, release/3.1, release/3.2]
  pull_request:
    branches: [main, release/3.0, release/3.2]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  CI_PYTHON_VERSION: "3.12.14"
  CI_PYTEST_COVERAGE_SHARDS: "192"
  UV_HTTP_TIMEOUT: "300"
  CI_UV_CACHE_DEPENDENCY_GLOB: |
    pyproject.toml
    uv.lock
    requirements.txt
    docker-requirements.txt

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Main is the source of truth: queue its runs instead of cancelling an
  # in-flight run on every push, so a main run can actually finish green.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Trusted change planner (shadow mode): computes which lanes the diff requires.
  # Runs on PRs only; the diff is taken from the strict PR merge parent so a
  # contributor cannot influence the base. Output feeds the `hol-guard /
  # required` aggregate; nothing is skipped in shadow mode.
  plan:
    name: plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      lanes: ${{ steps.plan.outputs.lanes || steps.plan_fallback.outputs.lanes }}
      data_only: ${{ steps.plan.outputs.data_only || steps.plan_fallback.outputs.data_only }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.CI_PYTHON_VERSION }}
      - name: Extract trusted planner from the base revision
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        # The merge-commit checkout is PR-controlled, so a contribution could
        # rewrite scripts/ci/plan_changes.py to emit data_only=true (CWE-807).
        # Resolve the strict merge parent, then execute the planner files from
        # that trusted revision only. If the base has no planner, the PR is
        # introducing it, which is definitionally not a data-only change:
        # emit a conservative full plan without running the untrusted copy.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            # Push runs post-merge main code, which is trusted by review. The
            # base is the push's before-SHA (server-side, not contributor input).
            BASE="${{ github.event.before }}"
            HEAD="$GITHUB_SHA"
            if ! printf '%s' "$BASE" | grep -Eq '^[0-9a-f]{40}$'; then
              # First push / branch create has no before-SHA: full plan.
              printf '{"base":"","head":"%s","lanes":["full"],"data_only":false,"escalate_reason":"no-push-base","changed":[]}\n' "$HEAD" > ci-plan.json
              echo "PLAN_READY=1" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "PLAN_BASE_SHA=$BASE" >> "$GITHUB_ENV"
            echo "PLAN_HEAD_SHA=$HEAD" >> "$GITHUB_ENV"
            echo "PLANNER_DIR=$PWD" >> "$GITHUB_ENV"
            exit 0
          fi
          # Require the exact two-parent PR merge; an ambiguous checkout plans full.
          PARENTS=$(git rev-list --parents -n 1 "$GITHUB_SHA" | wc -w)
          HEAD="${{ github.event.pull_request.head.sha }}"
          if [ "$PARENTS" -ne 3 ]; then
            printf '{"base":"","head":"%s","lanes":["full"],"data_only":false,"escalate_reason":"ambiguous-merge","changed":[]}\n' "$HEAD" > ci-plan.json
            echo "PLAN_READY=1" >> "$GITHUB_ENV"
            exit 0
          fi
          BASE=$(git log -1 --format=%P "$GITHUB_SHA" | awk '{print $1}')
          echo "PLAN_BASE_SHA=$BASE" >> "$GITHUB_ENV"
          echo "PLAN_HEAD_SHA=$HEAD" >> "$GITHUB_ENV"
          mkdir -p trusted/scripts/ci
          introduced=0
          for f in scripts/ci/plan_changes.py scripts/ci/pr_merge_base.py scripts/ci/__init__.py scripts/__init__.py; do
            if git cat-file -e "$BASE:$f" 2>/dev/null; then
              git show "$BASE:$f" > "trusted/$f"
            elif [ "$f" = "scripts/ci/plan_changes.py" ]; then
              introduced=1
              echo "planner absent at trusted base; forcing full plan"
              printf '{"base":"%s","head":"%s","lanes":["full"],"data_only":false,"escalate_reason":"planner-introduced","changed":[]}\n' "$BASE" "$HEAD" > ci-plan.json
              echo "PLAN_READY=1" >> "$GITHUB_ENV"
            else
              : > "trusted/$f"
            fi
          done
          if [ "$introduced" = 0 ]; then
            echo "PLANNER_DIR=$PWD/trusted" >> "$GITHUB_ENV"
          fi
      - name: Fallback plan for a planner-introducing PR
        id: plan_fallback
        if: github.event_name == 'pull_request' && env.PLAN_READY == '1'
        run: |
          cat ci-plan.json
          echo "lanes=full" >> "$GITHUB_OUTPUT"
          echo "data_only=false" >> "$GITHUB_OUTPUT"
      - name: Compute change plan
        id: plan
        if: env.PLAN_READY != '1'
        env:
          PLAN_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python "${PLANNER_DIR:?trusted planner dir unset}/scripts/ci/plan_changes.py" --root "$PWD" --base "${PLAN_BASE_SHA:-}" --head "${PLAN_HEAD_SHA:-}" --output ci-plan.json
          LANES=$(python -c "import json;print(' '.join(json.load(open('ci-plan.json'))['lanes']))")
          DATA_ONLY=$(python -c "import json;print(str(json.load(open('ci-plan.json'))['data_only']).lower())")
          echo "lanes=$LANES" >> "$GITHUB_OUTPUT"
          echo "data_only=$DATA_ONLY" >> "$GITHUB_OUTPUT"
      - name: Upload ci-plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-plan
          path: ci-plan.json
          if-no-files-found: error
          retention-days: 7

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-job-quality

  # Rust validation is required, but is not on the artifact/Python fan-out critical path.
  native-workspace:
    name: Rust workspace (${{ matrix.check }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [clippy, test]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Configure the checked optimized test profile
        if: matrix.check == 'test'
        run: |
          echo "CARGO_PROFILE_TEST_OPT_LEVEL=1" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_DEBUG_ASSERTIONS=true" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_OVERFLOW_CHECKS=true" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-workspace-${{ matrix.check }}
          components: clippy
      - name: Validate the locked Rust workspace
        env:
          CARGO_CHECK: ${{ matrix.check }}
        run: |
          case "$CARGO_CHECK" in
            clippy)
              mkdir -p clippy-report
              if cargo clippy --manifest-path rust/Cargo.toml --locked --workspace --all-targets --message-format=json -- -D warnings > clippy-report/clippy.jsonl; then
                :
              else
                clippy_status=$?
                if ! python3 -m scripts.ci.clippy_report diagnostics; then
                  echo "Unable to render Clippy diagnostics" >&2
                fi
                exit "$clippy_status"
              fi
              ;;
            test)
              nextest_bin="$(python3 scripts/ci/install_nextest.py)"
              PATH="$nextest_bin:$PATH" cargo nextest run --manifest-path rust/Cargo.toml --locked --workspace --all-targets \
                --test-threads 4 --retries 0 --no-fail-fast
              ;;
            *) echo "Unsupported workspace check" >&2; exit 64 ;;
          esac
      - name: Bind successful strict Clippy report
        if: matrix.check == 'clippy'
        run: python3 -m scripts.ci.clippy_report bind
      - name: Upload successful strict Clippy report
        if: matrix.check == 'clippy'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clippy-report-${{ github.run_attempt }}
          path: clippy-report/
          if-no-files-found: error
          retention-days: 1

  native-command-evaluators:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: pytest-native-command
          components: rustfmt
      - name: Check native formatting before compilation
        run: cargo fmt --manifest-path rust/Cargo.toml --all --check
      - name: Install content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.18.0
      - name: Build native command evaluators once for pytest shards
        env:
          # Content-addressed cache survives fresh checkout mtimes; third-party
          # crates still come from rust-cache, workspace members from sccache.
          RUSTC_WORKSPACE_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: 'on'
          SCCACHE_GHA_VERSION: pytest-native-command
          SCCACHE_GHA_RW_MODE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'READ_WRITE' || 'READ_ONLY' }}
          SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
        run: |
          python3 scripts/refresh_extension_artifacts.py --trust-only
          cargo build --manifest-path rust/Cargo.toml --locked --release -p guard-command -p hol-guard-runtime --bin guard-command-source --bin hol-guard-runtime
          "$SCCACHE_PATH" --show-stats
      - name: Check sizes of the existing native build
        run: python3 scripts/ci/check_wheel_size.py --native-dir rust/target/release --platform manylinux_2_17_x86_64
      - name: Verify generated native command catalogs before pytest fan-out
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          arguments=(--compiler rust/target/release/guard-command-source)
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            arguments+=(--changed-from "$BASE_SHA")
          fi
          python3 scripts/ci/verify_native_command_program.py "${arguments[@]}"
      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: ${{ env.CI_PYTHON_VERSION }}
          cache-dependency-glob: ${{ env.CI_UV_CACHE_DEPENDENCY_GLOB }}
      - name: Prepare current public directory before pytest collection
        run: |
          uv run --no-sync python scripts/export_extension_directory.py
          uv run --no-sync python scripts/render_command_extension_directory.py
          uv run --no-sync python scripts/export_extension_directory.py --check
          uv run --no-sync python scripts/render_command_extension_directory.py --check
      - name: Check native contract groups before pytest fan-out
        env:
          HOL_GUARD_NATIVE_SOURCE_COMPILER: ${{ github.workspace }}/rust/target/release/guard-command-source
          HOL_GUARD_NATIVE_TEST_SOURCE_COMPILER: ${{ github.workspace }}/rust/target/release/guard-command-source
          HOL_GUARD_NATIVE_BINARY: ${{ github.workspace }}/rust/target/release/hol-guard-runtime
          HOL_GUARD_NATIVE_REGRESSION: "1"
        run: |
          uv run --no-sync pytest -q --tb=short \
            ci/package_size \
            tests/test_guard_command_corpus_native_contract.py::test_native_contract_validates_every_authored_signature_without_rewriting_evidence \
            tests/test_pi_adapter.py::TestPiInstall::test_install_writes_managed_extension_that_denies_on_hook_errors \
            tests/test_pi_adapter.py::TestPiInstall::test_managed_extension_fails_safe_on_ambiguous_success_payloads
      - name: Upload native command evaluators
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pytest-native-command-evaluators
          path: |
            rust/target/release/guard-command-source
            rust/target/release/hol-guard-runtime
          if-no-files-found: error
          retention-days: 1
      - name: Upload matching native command projections
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pytest-native-command-projections
          path: |
            contracts/extensions/
            contributions/extensions/
            docs/guard/extensions/
            src/codex_plugin_scanner/guard/contracts/data/extensions/
          if-no-files-found: error
          retention-days: 1

  coverage-plan:
    needs: native-command-evaluators
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shard-indices: ${{ steps.shard-indices.outputs.indices }}
      shard-count: ${{ steps.shard-indices.outputs.count }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Download native command evaluators
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pytest-native-command-evaluators
          path: rust/target/release
      - name: Bind the compiled native runtime
        run: |
          chmod 0755 rust/target/release/hol-guard-runtime
          echo "HOL_GUARD_NATIVE_BINARY=$GITHUB_WORKSPACE/rust/target/release/hol-guard-runtime" >> "$GITHUB_ENV"
      - name: Download this run's current command projections
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pytest-native-command-projections
          path: .
      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: ${{ env.CI_PYTHON_VERSION }}
          cache-dependency-glob: ${{ env.CI_UV_CACHE_DEPENDENCY_GLOB }}
          save-cache: "true"
      - name: Build packaged command catalog before pytest inventory
        run: |
          chmod 0755 rust/target/release/guard-command-source
          uv run --no-sync python scripts/build_native_command_program.py --compiler rust/target/release/guard-command-source
      - uses: ./.github/actions/plan-pytest
        with:
          python-version: "3.12"
          shard-count: ${{ env.CI_PYTEST_COVERAGE_SHARDS }}
          telemetry-branch: ${{ github.event.pull_request.base.ref || github.ref_name }}
          github-token: ${{ github.token }}
      - name: Emit resolved shard indices
        id: shard-indices
        shell: bash
        run: |
          indices=$(ls pytest-shards/shard-*.txt | sed -E 's#.*shard-([0-9]+)\.txt#\1#' | sort -n | tr '\n' ' ' | sed 's/ $//')
          test -n "$indices" || { echo "no shard files produced" >&2; exit 1; }
          json=$(echo "$indices" | tr ' ' '\n' | jq -R 'tonumber' | jq -cs .)
          echo "indices=${json}" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$indices" | wc -w | tr -d ' ')" >> "$GITHUB_OUTPUT"

  coverage:
    name: coverage (3.12, ${{ matrix.shard-index }})
    needs: [plan, coverage-plan, native-command-evaluators]
    if: >-
      !cancelled() &&
      needs.coverage-plan.result == 'success' &&
      needs.native-command-evaluators.result == 'success' &&
      (github.event_name != 'pull_request' ||
       (needs.plan.result == 'success' && needs.plan.outputs.data_only != 'true'))
    runs-on: ubuntu-latest
    # Includes checkout/setup plus the instrumented shard. Five minutes can
    # cancel a healthy shard before it produces the coverage artifact Sonar needs.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard-index: ${{ fromJSON(needs.coverage-plan.outputs.shard-indices) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: ${{ env.CI_PYTHON_VERSION }}
          cache-dependency-glob: ${{ env.CI_UV_CACHE_DEPENDENCY_GLOB }}
      - name: Download pytest shard plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pytest-shard-plan-3.12
          path: pytest-shards
      - name: Download native command evaluators
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pytest-native-command-evaluators
          path: rust/target/release
      - uses: ./.github/actions/restore-command-projections
      - run: |
          chmod 0755 rust/target/release/guard-command-source rust/target/release/hol-guard-runtime
          echo "HOL_GUARD_NATIVE_SOURCE_COMPILER=$GITHUB_WORKSPACE/rust/target/release/guard-command-source" >> "$GITHUB_ENV"
          echo "HOL_GUARD_NATIVE_TEST_SOURCE_COMPILER=$GITHUB_WORKSPACE/rust/target/release/guard-command-source" >> "$GITHUB_ENV"
          echo "HOL_GUARD_BUILD_SOURCE_COMPILER=$GITHUB_WORKSPACE/rust/target/release/guard-command-source" >> "$GITHUB_ENV"
          echo "HOL_GUARD_NATIVE_BINARY=$GITHUB_WORKSPACE/rust/target/release/hol-guard-runtime" >> "$GITHUB_ENV"
          echo "HOL_GUARD_NATIVE_REGRESSION=1" >> "$GITHUB_ENV"
      - name: Run coverage shard ${{ matrix.shard-index }}
        shell: bash
        run: |
          shard_file=$(printf 'pytest-shards/shard-%03d.txt' "${{ matrix.shard-index }}")
          test -s "$shard_file"
          # PRs need the same behavioral suite, not the coverage tracer tax. Main
          # remains the authoritative coverage/Sonar producer after merge.
          coverage_args=()
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            export GUARD_PYTEST_UNDER_COVERAGE=1
            coverage_args=(--cov --cov-branch --cov-report=)
          fi
          PYTHONPATH=scripts/ci GUARD_PYTEST_DURATION_OUTPUT=pytest-durations.json \
            uv run --no-sync python scripts/ci/run_projection_shard.py "$shard_file" -- \
            -p pytest_duration_report "@$shard_file" --tb=short --durations=10 \
            -n 2 --dist loadfile --max-worker-restart 0 \
            --reruns 1 --reruns-delay 2 \
            --deselect tests/test_guard_hook_process_runner.py::test_scheduler_and_runner_complete_48_routine_reviews_without_capacity_denial \
            --deselect tests/test_guard_daemon_storage_liveness.py::test_locked_storage_hook_burst_fails_safe_without_stranding_daemon \
            --deselect tests/test_guard_approval_store_scale.py::TestQueueScaleTargets::test_listing_first_queue_page_with_100k_rows_stays_under_100ms \
            --deselect tests/test_guard_approval_store_scale.py::TestQueueScaleTargets::test_listing_queue_page_without_totals_stays_under_50ms_with_100k_rows \
            --deselect tests/test_guard_approval_store_scale.py::TestQueueScaleTargets::test_resolving_one_request_with_100k_rows_stays_under_100ms \
            --deselect 'tests/test_guard_daemon_acceptance.py::test_packaged_correctness_workloads[mixed-harness-fairness]' \
            --deselect tests/test_guard_omp_fast_path_regression.py::test_omp_post_tool_read_burst_uses_resident_scanner \
            --deselect tests/test_guard_cloud_review_runtime_recovery.py::test_cloud_review_worker_survives_ten_thousand_recurring_disconnects \
            --deselect tests/test_rust_io_ownership_gate.py::test_gate_inventories_reachable_io_and_passes_current_sources \
            --deselect tests/test_guard_gauntlet_parallel.py::test_interrupt_during_spawn_still_reaps_the_started_worker \
            --deselect tests/test_guard_gauntlet_parallel.py::test_signal_during_cleanup_grace_still_force_kills \
            --deselect 'tests/test_guard_runtime.py::test_runtime_hook_saved_v1_allow_matches_every_scope_in_actual_evaluator[artifact]' \
            --deselect 'tests/test_guard_runtime.py::test_runtime_hook_saved_v1_allow_matches_every_scope_in_actual_evaluator[workspace]' \
            --deselect 'tests/test_guard_runtime.py::test_runtime_hook_saved_v1_allow_matches_every_scope_in_actual_evaluator[publisher]' \
            --deselect 'tests/test_guard_runtime.py::test_runtime_hook_saved_v1_allow_matches_every_scope_in_actual_evaluator[harness]' \
            --deselect 'tests/test_guard_runtime.py::test_runtime_hook_saved_v1_allow_matches_every_scope_in_actual_evaluator[global]' \
            --deselect tests/test_guard_runtime.py::test_runtime_hook_integrity_rejection_outranks_valid_exact_one_shot_allow \
            --deselect tests/test_guard_headless_daemon_api.py::test_supply_chain_package_firewall_paid_install_and_test_roundtrip \
            --deselect tests/test_guard_shim_intercept_proofs.py::test_daemon_package_shim_test_uses_projected_shell_profile_path \
            --deselect tests/test_guard_continuation_runtime.py::test_codex_app_server_result_is_bounded_and_opaque \
            --deselect tests/test_guard_command_corpus.py::test_full_native_evaluation_matches_contract_and_reports_original_oracle_differences \
            --deselect tests/test_guard_policy_integrity.py::test_trust_backend_check_uses_spawn_from_concurrent_threads \
            --deselect tests/test_guard_daemon_stress_script.py::test_daemon_stress_gate_keeps_fresh_process_alive_with_populated_store \
            --deselect tests/test_guard_headless_daemon_api.py::test_supply_chain_audit_scans_workspace_manifests \
            --deselect tests/test_guard_command_activity_rollups.py::test_rebuild_reconciles_one_hundred_thousand_rows_and_analytics_stays_under_50ms \
            --deselect tests/test_guard_update_artifact.py::test_windows_regular_descriptor_uses_bound_handle_without_cross_api_path_stat \
            --deselect 'tests/test_guard_surface_server.py::TestGuardSurfaceServer::test_guard_daemon_pi_hook_endpoint_returns_blocked_runtime_review_payload' \
            "${coverage_args[@]}"
      - name: Upload pytest coverage data artifact
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pytest-coverage-${{ github.run_attempt }}-${{ matrix.shard-index }}
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Upload pytest duration artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pytest-durations-${{ github.run_attempt }}-${{ matrix.shard-index }}
          path: pytest-durations.json
          if-no-files-found: warn
          retention-days: 7

  duration-manifest-candidate:
    if: needs.coverage.result == 'success'
    needs: [coverage, coverage-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Download pytest duration reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: pytest-durations-${{ github.run_attempt }}-*
          path: duration-reports
      - name: Build duration manifest candidate
        id: duration-manifest
        shell: bash
        run: |
          shopt -s globstar nullglob
          reports=(duration-reports/**/pytest-durations.json)
          if [ "${#reports[@]}" -ne "${{ needs.coverage-plan.outputs.shard-count }}" ]; then
            echo "Incomplete attempt reports; retain the previous duration manifest."
            echo "complete=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/ci/build_pytest_duration_manifest.py \
            --output pytest-duration-manifest-candidate.json.gz \
            --observed-at "$(date --utc +%Y-%m-%dT%H:%M:%SZ)" \
            "${reports[@]}"
          echo "complete=true" >> "$GITHUB_OUTPUT"
      - name: Upload pytest duration manifest candidate
        if: steps.duration-manifest.outputs.complete == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pytest-duration-manifest-candidate
          path: pytest-duration-manifest-candidate.json.gz
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  sonar:
    # PRs already run the full behavioral suite above; Sonar consumes the
    # authoritative instrumented main run and stays off the contributor path.
    if: vars.SONAR_CI_ENABLED == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Check for SonarQube Cloud token
        id: token-presence
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if test -n "$SONAR_TOKEN"; then
            echo "has-token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-token=false" >> "$GITHUB_OUTPUT"
            echo "SONAR_TOKEN secret is not set; skipping SonarQube Cloud analysis"
          fi
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
        if: steps.token-presence.outputs.has-token == 'true'
      - uses: ./.github/actions/ci-job-sonar
        with:
          has-token: ${{ steps.token-presence.outputs.has-token }}
          secret-sonar-token: ${{ secrets.SONAR_TOKEN }}
        if: steps.token-presence.outputs.has-token == 'true'

  scheduling-sensitive:
    needs: [plan, native-command-evaluators]
    if: >-
      !cancelled() &&
      needs.native-command-evaluators.result == 'success' &&
      (github.event_name != 'pull_request' ||
       (needs.plan.result == 'success' && needs.plan.outputs.data_only != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12.14", "3.14.7"]
        slice: [0, 1]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-job-scheduling-sensitive
        with:
          python-version: ${{ matrix.python-version }}
          slice-index: ${{ matrix.slice }}
          slice-count: 2

  compatibility:
    needs: [plan, native-command-evaluators]
    if: >-
      !cancelled() &&
      needs.native-command-evaluators.result == 'success' &&
      (github.event_name != 'pull_request' ||
       (needs.plan.result == 'success' && needs.plan.outputs.data_only != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-job-compatibility
        with:
          python-version: ${{ matrix.python-version }}

  deep-compatibility:
    needs: native-command-evaluators
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
        shard-index: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-job-deep-compatibility
        with:
          python-version: ${{ matrix.python-version }}
          shard-index: ${{ matrix.shard-index }}

  mutation-baseline:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: native-command-evaluators
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-job-mutation-baseline

  ci-python-312:
    name: ci (3.12)
    if: always()
    needs: [plan, native-workspace, quality, coverage-plan, coverage, compatibility, scheduling-sensitive]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - name: Verify Python CI dependencies
        env:
          NATIVE_WORKSPACE_RESULT: ${{ needs.native-workspace.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          COVERAGE_PLAN_RESULT: ${{ needs.coverage-plan.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          SCHEDULING_SENSITIVE_RESULT: ${{ needs.scheduling-sensitive.result }}
          PLAN_DATA_ONLY: ${{ needs.plan.outputs.data_only }}
        run: |
          # Plan-aware: a lane-eligible job that the planner skipped is acceptable
          # only on a data-only plan. On a full plan skipped still fails.
          if [ "$PLAN_DATA_ONLY" = "true" ]; then
            ok_set='success skipped'
          else
            ok_set='success'
          fi
          for r in "$NATIVE_WORKSPACE_RESULT" "$QUALITY_RESULT" "$COVERAGE_PLAN_RESULT" \
                   "$COVERAGE_RESULT" "$COMPATIBILITY_RESULT" "$SCHEDULING_SENSITIVE_RESULT"; do
            case " $ok_set " in *" $r "*) : ;; *) echo "dependency result not OK: $r"; exit 1;; esac
          done

  pi-exact-continuation:
    needs: [plan, native-command-evaluators]
    if: >-
      !cancelled() &&
      needs.native-command-evaluators.result == 'success' &&
      (github.event_name != 'pull_request' ||
       (needs.plan.result == 'success' && needs.plan.outputs.data_only != 'true'))
    name: Pi exact continuation (actual SDKs)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pytest-native-command-projections
          path: .
      - uses: ./.github/actions/ci-job-pi-exact-continuation

  dashboard:
    needs: [plan]
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' ||
       (needs.plan.result == 'success' && needs.plan.outputs.data_only != 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: cd dashboard && bun install --frozen-lockfile
      - run: cd dashboard && bun run test
      - name: Dashboard build and bundle-size report (L331)
        run: |
          cd dashboard && bun run build
          git diff --exit-code -- ../src/codex_plugin_scanner/guard/daemon/static
          js_size=$(du -sh ../src/codex_plugin_scanner/guard/daemon/static/assets/guard-dashboard.js | cut -f1)
          css_size=$(du -sh ../src/codex_plugin_scanner/guard/daemon/static/assets/index.css | cut -f1)
          echo "Bundle JS: ${js_size:-unknown}, CSS: ${css_size:-unknown}"

  cisco-full:
    needs: [plan, native-command-evaluators]
    if: >-
      !cancelled() &&
      needs.native-command-evaluators.result == 'success' &&
      (github.event_name != 'pull_request' ||
       (needs.plan.result == 'success' && needs.plan.outputs.data_only != 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-job-cisco-full

  cross-platform:
    needs: [plan, native-command-evaluators]
    if: >-
      !cancelled() &&
      needs.native-command-evaluators.result == 'success' &&
      (github.event_name != 'pull_request' ||
       (needs.plan.result == 'success' && needs.plan.outputs.data_only != 'true'))
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-job-cross-platform
        with:
          python-version: ${{ matrix.python-version }}

  native-windows-evaluators:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-rust
        with:
          save-main-cache: "true"
      - name: Build Windows native command evaluators once for both updater Python versions
        shell: pwsh
        env:
          HOL_GUARD_BUILD_SHA: ${{ github.sha }}
        run: |
          python scripts/refresh_extension_artifacts.py --trust-only
          if ($LASTEXITCODE -ne 0) {
            throw "Staging Windows native trust bindings failed with exit code $LASTEXITCODE"
          }
          cargo build --manifest-path rust/Cargo.toml --locked --release -p guard-command -p hol-guard-runtime --bin guard-command-source --bin hol-guard-runtime
          if ($LASTEXITCODE -ne 0) {
            throw "Building Windows native command evaluators failed with exit code $LASTEXITCODE"
          }
      - name: Verify current Windows native command projections
        shell: pwsh
        run: |
          python scripts/ci/verify_native_command_program.py --compiler rust/target/release/guard-command-source.exe
          if ($LASTEXITCODE -ne 0) {
            throw "Verifying Windows native command projections failed with exit code $LASTEXITCODE"
          }
      - name: Verify Windows native runtime source binding
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          $runtime = (Resolve-Path -LiteralPath "rust/target/release/hol-guard-runtime.exe").Path
          $capabilitiesJson = & $runtime capabilities
          if ($LASTEXITCODE -ne 0) {
            throw "Reading Windows native runtime capabilities failed with exit code $LASTEXITCODE"
          }
          $capabilities = $capabilitiesJson | ConvertFrom-Json
          if ($capabilities.build_sha -ne $env:EXPECTED_SOURCE_SHA) {
            throw "Windows native runtime does not match this checkout's source SHA"
          }
      - name: Upload this attempt's verified Windows native command evaluators
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pytest-native-command-evaluators-Windows-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            rust/target/release/guard-command-source.exe
            rust/target/release/hol-guard-runtime.exe
          if-no-files-found: error
          retention-days: 1

  windows-updater:
    needs: [native-command-evaluators, native-windows-evaluators]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-job-windows-updater
        with:
          python-version: ${{ matrix.python-version }}

  # Shadow aggregate: reports the merged required-result contract. In shadow mode
  # it needs the full required set and evaluates the planner's lane choice so the
  # status name is stable before the fast lane is switched on. always() so the
  # aggregate runs even when an upstream required job fails — the point is to
  # evaluate results, not to be skipped by them.
  required:
    name: hol-guard / required
    if: always()
    needs: [plan, native-workspace, native-command-evaluators, quality, coverage-plan, coverage, compatibility, scheduling-sensitive, dashboard, cisco-full, ci-python-312, pi-exact-continuation, cross-platform]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      statuses: read
    steps:
      - name: Evaluate planned required results
        env:
          PLAN_LANES: ${{ needs.plan.outputs.lanes }}
          PLAN_SHARD_COUNT: ${{ needs.coverage-plan.outputs.shard-count }}
          EXPECTED_SHARDS: ${{ env.CI_PYTEST_COVERAGE_SHARDS }}
          PLAN_DATA_ONLY: ${{ needs.plan.outputs.data_only }}
          RESULTS: ${{ toJson(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          plan_result = needs.get("plan", {}).get("result")
          if os.environ.get("EVENT_NAME") == "pull_request" and plan_result != "success":
              print(f"::error::plan job result: {plan_result}")
              sys.exit(1)
          data_only = os.environ.get("PLAN_DATA_ONLY") == "true"
          # Always-on providers are never lane-gated: they must succeed on every
          # plan, including data-only. A failed or cancelled provider (or a
          # skipped one, which means its `if`/needs chain broke) must not let a
          # data-only plan coast through on surviving lane-gated residue.
          always_on = ["plan","native-workspace","native-command-evaluators",
                       "quality","coverage-plan","ci-python-312"]
          # Lane-gated required set: skipped is acceptable only on a data-only
          # plan; failure/cancelled always fails.
          required = ["coverage","compatibility","scheduling-sensitive",
                      "dashboard","cisco-full","pi-exact-continuation","cross-platform"]
          missing = [j for j in always_on + required if j not in needs]
          if missing:
              print("::error::required jobs absent from needs graph: "+", ".join(missing))
              sys.exit(1)
          # `plan` is `if: pull_request`, so on push/merge_group it is always
          # skipped — that is expected, not a provider failure. Off-PR it must
          # merely not have failed; on pull_request it must succeed outright.
          event = os.environ.get("EVENT_NAME", "")
          def _provider_ok(name):
              result = needs.get(name, {}).get("result")
              if name == "plan" and event != "pull_request":
                  return result in ("success", "skipped")
              return result == "success"
          bad_providers = [j for j in always_on if not _provider_ok(j)]
          failed = [j for j in required
                    if needs.get(j, {}).get("result") in ("failure","cancelled")]
          print(f"plan lanes={os.environ.get('PLAN_LANES')} data_only={data_only}")
          for j in always_on + required:
              print(f"  {j}: {needs.get(j,{}).get('result')}")
          if bad_providers:
              print("::error::always-on jobs did not succeed: " + ", ".join(bad_providers))
              sys.exit(1)
          if failed:
              print("::error::required jobs failed: " + ", ".join(failed))
              sys.exit(1)
          # Matrix cardinality: coverage must expand to exactly the planned shard
          # count. A truncated/empty matrix that still "passes" is a protection gap.
          shard_count = os.environ.get("PLAN_SHARD_COUNT", "")
          expected = os.environ.get("EXPECTED_SHARDS", "")
          if not data_only:
              if not shard_count.isdigit() or int(shard_count) < 1:
                  print(f"::error::coverage-plan shard count invalid ({shard_count!r})")
                  sys.exit(1)
              if expected.isdigit() and int(shard_count) != int(expected):
                  print(f"::error::coverage matrix {shard_count} != configured {expected}")
                  sys.exit(1)
          skipped = [j for j in required if needs.get(j,{}).get("result")=="skipped"]
          if skipped and not data_only:
              print("::error::required jobs skipped on a full-lane plan: "+", ".join(skipped))
              sys.exit(1)
          # Evidence residue is already enforced: `always_on` (plan, quality,
          # coverage-plan, ci-python-312, plus the native providers) must succeed,
          # so a data-only plan cannot coast with no green evidence. Lane-gated
          # jobs are all skipped on data-only by design — counting them as
          # residue would fail every valid fast lane.
          print("required aggregate: all planned required results green")
          PY
