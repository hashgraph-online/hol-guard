name: PR 2593 finalize

on:
  push:
    branches:
      - chore/reconcile-main-into-release-3.0
    paths:
      - .github/workflows/pr2593-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: chore/reconcile-main-into-release-3.0
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            requirements.txt
            docker-requirements.txt
          save-cache: false
      - name: Merge latest release branch and remove diagnostics
        shell: bash
        run: |
          git config user.name "Michael Kantor"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git fetch origin release/3.0:refs/remotes/origin/release/3.0
          set +e
          git merge --no-commit --no-ff origin/release/3.0
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            unresolved="$(git diff --name-only --diff-filter=U)"
            test "$unresolved" = "ci/test-suite-ratchet-baseline.json"
            git checkout --ours ci/test-suite-ratchet-baseline.json
            git add ci/test-suite-ratchet-baseline.json
          fi
          rm -f \
            .github/workflows/pr2593-base-merge-diagnostic.yml \
            .github/workflows/pr2593-conflict-list.yml \
            .github/workflows/pr2593-conflict-artifact.yml \
            .github/workflows/pr2593-finalize.yml \
            pr2593-conflicts.txt
      - name: Install Python dependencies
        run: uv sync --frozen --extra dev --python 3.12
      - name: Regenerate deterministic baselines
        shell: bash
        run: |
          uv run --no-sync python scripts/ci/test_inventory.py --output test-inventory.json
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path

          metrics = json.loads(Path("test-inventory.json").read_text(encoding="utf-8"))
          baseline = {
              "maximum_collected_cases": metrics["inventory"]["collected_cases"],
              "maximum_test_source_lines": metrics["test_source_lines"],
              "schema_version": 1,
          }
          Path("ci/test-suite-ratchet-baseline.json").write_text(
              json.dumps(baseline, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          uv run --no-sync python tests/guard_command_decision_diff.py --write
      - name: Verify reconciliation regressions
        shell: bash
        run: |
          uv run --no-sync pytest -q \
            tests/test_guard_frozen_daemon_runtime.py::test_non_frozen_daemon_launcher_drops_pyinstaller_environment \
            tests/test_update_desktop_core.py::test_dashboard_runner_and_daemon_env_preserve_desktop_version \
            tests/test_update_desktop_core.py::test_frozen_desktop_status_uses_embedded_version_without_package_probe \
            tests/test_guard_extension_control_runtime.py::test_daemon_starts_fail_closed_with_future_authority_schema \
            tests/test_guard_local_cli_api.py \
            tests/test_guard_package_json_scripts.py
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory test-inventory.json
          uv run --no-sync python scripts/ci/code_quality_audit.py \
            --root . \
            --baseline ci/code-quality-baseline.json \
            --json-output code-quality-audit.json
          uv run --no-sync python tests/guard_command_decision_diff.py --check
          uv run --no-sync python -m ruff check \
            src/codex_plugin_scanner/guard/cli/update_commands.py \
            src/codex_plugin_scanner/guard/daemon/manager.py \
            src/codex_plugin_scanner/guard/daemon/local_cli_api.py \
            src/codex_plugin_scanner/guard/runtime/package_json_script_memory.py \
            src/codex_plugin_scanner/guard/store_extension_control_authority.py \
            src/codex_plugin_scanner/guard/store_extension_control_authority_support.py \
            tests/test_guard_local_cli_api.py \
            tests/test_guard_package_json_scripts.py
          uv run --no-sync python -m ruff format --check \
            src/codex_plugin_scanner/guard/cli/update_commands.py \
            src/codex_plugin_scanner/guard/daemon/manager.py \
            src/codex_plugin_scanner/guard/daemon/local_cli_api.py \
            src/codex_plugin_scanner/guard/runtime/package_json_script_memory.py \
            src/codex_plugin_scanner/guard/store_extension_control_authority.py \
            src/codex_plugin_scanner/guard/store_extension_control_authority_support.py \
            tests/test_guard_local_cli_api.py \
            tests/test_guard_package_json_scripts.py
          git diff --check
          rm -f test-inventory.json code-quality-audit.json
      - name: Commit merged release branch
        shell: bash
        run: |
          git add -A
          git commit --signoff -m "Merge release/3.0 into chore/reconcile-main-into-release-3.0"
          git push origin HEAD:chore/reconcile-main-into-release-3.0
