name: CI macOS native runtime
description: Build and publish the macOS hol-guard-runtime for the skill-directory identity lane.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version: "3.12"
    - name: Stage trust bindings the native build embeds
      shell: bash
      run: python scripts/refresh_extension_artifacts.py --trust-only
    - name: Identify the native build platform
      id: runtime-platform
      shell: bash
      run: |
        echo "image=${ImageOS:?}" >> "$GITHUB_OUTPUT"
        python -m scripts.ci.native_cache_environment >> "$GITHUB_OUTPUT"
    - name: Restore the exact macOS native runtime
      id: runtime-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: rust/target/release/hol-guard-runtime
        # Hash before dependency restoration; do not accept partial-key matches.
        key: macos-hol-guard-runtime-v2-${{ runner.arch }}-${{ steps.runtime-platform.outputs.image }}-${{ steps.runtime-platform.outputs.compiler-env }}-lto-${{ env.CARGO_PROFILE_RELEASE_LTO }}-cgu-${{ env.CARGO_PROFILE_RELEASE_CODEGEN_UNITS }}-${{ hashFiles('rust/**', 'contributions/**', 'contracts/**', 'spec/**', 'src/codex_plugin_scanner/guard/contracts/**', '.cargo/**', '.github/actions/setup-rust/action.yml', '.github/actions/ci-job-macos-native-runtime/action.yml', 'scripts/ci/native_cache_environment.py', 'scripts/refresh_extension_artifacts.py') }}
    - uses: ./.github/actions/setup-rust
      if: steps.runtime-cache.outputs.cache-hit != 'true'
    - name: Install content-addressed compiler cache
      if: steps.runtime-cache.outputs.cache-hit != 'true'
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      with:
        version: v0.18.0
    - name: Route the runtime build through the compiler cache
      if: steps.runtime-cache.outputs.cache-hit != 'true'
      # The rust-cache key includes the runner image's toolchains, so it misses
      # on every PR between an image rollout and the next completed main push,
      # and the macOS build then recompiles every crate (about 4 min). sccache
      # keys on content and main pushes write objects as they compile, so a
      # cancelled main run still warms it. PRs only read.
      shell: bash
      env:
        SCCACHE_MODE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'READ_WRITE' || 'READ_ONLY' }}
      run: |
        {
          echo "RUSTC_WRAPPER=sccache"
          echo "SCCACHE_GHA_ENABLED=on"
          echo "SCCACHE_GHA_VERSION=cross-platform-runtime"
          echo "SCCACHE_GHA_RW_MODE=${SCCACHE_MODE}"
          echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1"
        } >> "$GITHUB_ENV"
    - name: Build the macOS native runtime
      if: steps.runtime-cache.outputs.cache-hit != 'true'
      shell: bash
      run: cargo build --manifest-path rust/Cargo.toml --locked --release -p hol-guard-runtime --bin hol-guard-runtime --timings
    - name: Save the macOS native runtime cache
      if: steps.runtime-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: rust/target/release/hol-guard-runtime
        key: ${{ steps.runtime-cache.outputs.cache-primary-key }}
    - name: Upload the macOS native runtime
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: macos-native-runtime
        path: rust/target/release/hol-guard-runtime
        if-no-files-found: error
        retention-days: 1
        overwrite: true
    - name: Retain native compilation timings
      if: always() && steps.runtime-cache.outputs.cache-hit != 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: native-compilation-timings-macos
        path: rust/target/cargo-timings/cargo-timing.html
        if-no-files-found: ignore
        retention-days: 1
        overwrite: true
