name: Build one verified native Guard wheel
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      version:
        required: true
        type: string
      channel:
        required: true
        type: string
      precompiled:
        required: true
        type: boolean
      release_repair:
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  wheel:
    name: Build native Guard wheel (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON('{"x86_64-unknown-linux-musl":[{"runner":"ubuntu-latest","platform_tag":"manylinux_2_17_x86_64","target":"x86_64-unknown-linux-musl","runtime":"rust/target/x86_64-unknown-linux-musl/release/hol-guard-runtime","source_compiler":"rust/target/x86_64-unknown-linux-musl/release/guard-command-source"}],"x86_64-apple-darwin":[{"runner":"macos-15-intel","platform_tag":"macosx_13_0_x86_64","target":"x86_64-apple-darwin","runtime":"rust/target/x86_64-apple-darwin/release/hol-guard-runtime","source_compiler":"rust/target/x86_64-apple-darwin/release/guard-command-source"}],"aarch64-apple-darwin":[{"runner":"macos-15","platform_tag":"macosx_11_0_arm64","target":"aarch64-apple-darwin","runtime":"rust/target/aarch64-apple-darwin/release/hol-guard-runtime","source_compiler":"rust/target/aarch64-apple-darwin/release/guard-command-source"}],"x86_64-pc-windows-msvc":[{"runner":"windows-latest","platform_tag":"win_amd64","rustflags":"-C link-arg=/Brepro","target":"x86_64-pc-windows-msvc","runtime":"rust/target/x86_64-pc-windows-msvc/release/hol-guard-runtime.exe","source_compiler":"rust/target/x86_64-pc-windows-msvc/release/guard-command-source.exe"}],"aarch64-pc-windows-msvc":[{"runner":"windows-11-arm","platform_tag":"win_arm64","rustflags":"-C link-arg=/Brepro","target":"aarch64-pc-windows-msvc","runtime":"rust/target/aarch64-pc-windows-msvc/release/hol-guard-runtime.exe","source_compiler":"rust/target/aarch64-pc-windows-msvc/release/guard-command-source.exe"}],"aarch64-unknown-linux-musl":[{"runner":"ubuntu-24.04-arm","platform_tag":"manylinux_2_17_aarch64","target":"aarch64-unknown-linux-musl","runtime":"rust/target/aarch64-unknown-linux-musl/release/hol-guard-runtime","source_compiler":"rust/target/aarch64-unknown-linux-musl/release/guard-command-source"}]}')[inputs.target] || fromJSON('[]') }}
    steps:
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          ref: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || inputs.source_sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.9.26"
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: distributions
          path: base-dist/
      - name: Verify release approval enrollment root pin
        if: inputs.channel != 'canary'
        env:
          HOL_GUARD_APPROVAL_ENROLLMENT_ROOT_HEX: ${{ vars.HOL_GUARD_APPROVAL_ENROLLMENT_ROOT_HEX }}
          HOL_GUARD_APPROVAL_ENROLLMENT_ROOT_FINGERPRINT_HEX: ${{ vars.HOL_GUARD_APPROVAL_ENROLLMENT_ROOT_FINGERPRINT_HEX }}
        run: python scripts/ci/native_approval_contract_gate.py --root . --require-release-root
      - name: Install pinned Rust target
        if: inputs.precompiled != true
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustup target add "$RUST_TARGET"
      - name: Install Linux static toolchain
        if: runner.os == 'Linux' && inputs.precompiled != true
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      - name: Cache trusted release compilation
        if: inputs.precompiled != true
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: release-native-v1
          workspaces: rust
          shared-key: release-${{ matrix.target }}
          # Shares keys with release-native-prepare.yml; workspace crates are
          # always stale after a fresh checkout, so storing them only spends quota.
          cache-workspace-crates: false
          cache-bin: false
          # Release builds never consume the validation cache. PR canaries can
          # restore this trusted cache, but cannot publish entries to it.
          save-if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/3.0') }}
      - name: Build version-matched runtime
        if: inputs.precompiled != true
        shell: bash
        env:
          HOL_GUARD_BUILD_SHA: ${{ inputs.source_sha }}
          HOL_GUARD_PACKAGE_VERSION: ${{ inputs.version }}
          HOL_GUARD_APPROVAL_ENROLLMENT_ROOT_HEX: ${{ vars.HOL_GUARD_APPROVAL_ENROLLMENT_ROOT_HEX }}
          HOL_GUARD_APPROVAL_ENROLLMENT_ROOT_FINGERPRINT_HEX: ${{ vars.HOL_GUARD_APPROVAL_ENROLLMENT_ROOT_FINGERPRINT_HEX }}
          RUSTFLAGS: ${{ matrix.rustflags }}
          RUST_TARGET: ${{ matrix.target }}
          RUNTIME: ${{ matrix.runtime }}
          SOURCE_COMPILER: ${{ matrix.source_compiler }}
        run: |
          # One invocation keeps feature unification identical to the verification build below,
          # so that build finds everything fresh instead of recompiling shared crates.
          cargo build --manifest-path rust/Cargo.toml --locked --release --target "$RUST_TARGET" \
            -p hol-guard-runtime -p guard-command --bin hol-guard-runtime --bin guard-command-source
          "$RUNTIME" self-test --json
      - name: Restore exact-run native binaries
        if: inputs.precompiled
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-native-${{ matrix.target }}
          path: prepared-native/
      - name: Verify and install prepared native binaries
        if: inputs.precompiled
        shell: bash
        env:
          RUNTIME: ${{ matrix.runtime }}
          SOURCE_COMPILER: ${{ matrix.source_compiler }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: python scripts/release/prepared_native.py install --directory prepared-native
      - name: Self-test prepared runtime on native hardware
        if: inputs.precompiled
        shell: bash
        env:
          RUNTIME: ${{ matrix.runtime }}
        # Prepared binaries may be cross-compiled; every target is executed
        # on its own architecture here before projection checks and packaging.
        run: '"$RUNTIME" self-test --json'
      - name: Verify native command program is current
        shell: bash
        env:
          HOL_GUARD_BUILD_SHA: ${{ inputs.source_sha }}
          HOL_GUARD_PACKAGE_VERSION: ${{ inputs.version }}
          HOL_GUARD_APPROVAL_ENROLLMENT_ROOT_HEX: ${{ vars.HOL_GUARD_APPROVAL_ENROLLMENT_ROOT_HEX }}
          HOL_GUARD_APPROVAL_ENROLLMENT_ROOT_FINGERPRINT_HEX: ${{ vars.HOL_GUARD_APPROVAL_ENROLLMENT_ROOT_FINGERPRINT_HEX }}
          RUSTFLAGS: ${{ matrix.rustflags }}
          SOURCE_COMPILER: ${{ matrix.source_compiler }}
          RUST_TARGET: ${{ matrix.target }}
          PRECOMPILED: ${{ inputs.precompiled }}
        run: |
          # Generated projections may lag their canonical tagged inputs.
          # Bind both the binary and packaged JSON to this release build.
          if [[ "$PRECOMPILED" != "true" ]]; then
            python scripts/build_native_command_program.py --compiler "$SOURCE_COMPILER"
            cargo build --manifest-path rust/Cargo.toml --locked --release --target "$RUST_TARGET" \
              -p hol-guard-runtime -p guard-command --bin hol-guard-runtime --bin guard-command-source
          fi
          arguments=(--compiler "$SOURCE_COMPILER")
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            arguments+=(--changed-from "${{ github.event.pull_request.base.sha }}")
          fi
          python scripts/ci/verify_native_command_program.py "${arguments[@]}"
      - name: Verify native source compiler output
        shell: bash
        env:
          SOURCE_COMPILER: ${{ matrix.source_compiler }}
        run: |
          # Python instead of jq: the Windows ARM64 runner image does not ship jq.
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          sys.path[:0] = [str(Path("scripts").resolve()), str(Path("src").resolve())]
          from prepare_extension_contribution import _development_release
          from codex_plugin_scanner.guard.extension_builder.bundle_baseline import authoring_request

          compiler = Path(os.environ["SOURCE_COMPILER"]).resolve(strict=True)
          source = json.loads(Path("rust/crates/guard-command/tests/fixtures/command-source-example.v1.json").read_text(encoding="utf-8"))
          trust = json.loads(Path("contracts/extensions/build-trust-class-map.v1.json").read_text(encoding="utf-8"))
          build = {"schema": "guard.command-extension-build.v1", "sources": [source], "mcp_sources": [], "trust": trust, "base": "packaged"}
          # Use the same native global admission context as maintainer authoring.
          with tempfile.TemporaryDirectory(prefix="hol-guard-publish-context-") as scratch:
              request = authoring_request(
                  "compile", build, compiler, installed=False,
                  cache_directory=Path(scratch).resolve(strict=True), development=_development_release,
              )
              result = subprocess.run(
                  [str(compiler), "compile"], input=json.dumps(request), text=True,
                  stdout=subprocess.PIPE, check=True,
              )
          compiled = json.loads(result.stdout)
          assert any(item["extension_id"] == source["extension"]["extension_id"] for item in compiled["program"]["extensions"])
          assert compiled["base_program_digest"] and compiled["implementation_digest"]
          Path("source-compiled.json").write_text(result.stdout, encoding="utf-8")
          PY
      - name: Rebuild Guard base wheel after projection regeneration
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          HOL_GUARD_BUILD_SOURCE_COMPILER: ${{ matrix.source_compiler }}
        run: |
          CURRENT_VERSION=$(uv run --no-project --with packaging==25.0 python scripts/sync_repo_version.py --check)
          if [[ "$CURRENT_VERSION" != "$VERSION" ]]; then
            uv run --no-project --with packaging==25.0 python scripts/sync_repo_version.py --version "$VERSION"
          fi
          BACKUP="$RUNNER_TEMP/hol-guard-pyproject.toml"
          cp pyproject.toml "$BACKUP"
          restore_pyproject() {
            cp "$BACKUP" pyproject.toml
          }
          trap restore_pyproject EXIT
          python3 - <<'PY'
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          start = text.index("[project.scripts]")
          end = text.index("\n\n[project.urls]")
          scripts = "[project.scripts]\n" \
              'hol-guard = "codex_plugin_scanner.cli:main"\n' \
              'plugin-guard = "codex_plugin_scanner.cli:main"\n' \
              'hol-guard-eval = "codex_plugin_scanner.guard.evaluation_cli:main"'
          path.write_text(text[:start] + scripts + text[end:], encoding="utf-8")
          PY
          uv build --wheel --out-dir "$RUNNER_TEMP/hol-guard-base-dist"
          mv "$RUNNER_TEMP/hol-guard-base-dist/hol_guard-${VERSION}-py3-none-any.whl" \
            "base-dist/hol_guard-${VERSION}-py3-none-any.whl"
      - name: Verify Linux runtime is static
        if: runner.os == 'Linux'
        shell: bash
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          LDD_OUTPUT=$(ldd "$RUNTIME" 2>&1 || true)
          if ! grep -Eq 'not a dynamic executable|statically linked' <<< "$LDD_OUTPUT"; then
            printf '%s\n' "$LDD_OUTPUT" >&2
            exit 1
          fi
      - name: Assemble native wheel
        shell: bash
        env:
          PLATFORM_TAG: ${{ matrix.platform_tag }}
          RUNTIME: ${{ matrix.runtime }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ inputs.version }}
          RELEASE_REPAIR: ${{ inputs.release_repair }}
        run: |
          RULE_DIGEST=$("$RUNTIME" capabilities --json | python -c 'import json,sys; print(json.load(sys.stdin)["rule_digest"])')
          python scripts/build_native_hol_guard_wheel.py \
            --wheel "base-dist/hol_guard-${VERSION}-py3-none-any.whl" \
            --runtime "$RUNTIME" \
            --output-dir native-dist \
            --version "$VERSION" \
            --platform-tag "$PLATFORM_TAG" \
            --target "$TARGET" \
            --source-sha "$SOURCE_SHA" \
            --rule-digest "$RULE_DIGEST" \
            --implementation-digest "$(python -c 'import json,sys; print(json.load(open("source-compiled.json"))["implementation_digest"])')" \
            --base-program-digest "$(python -c 'import json,sys; print(json.load(open("source-compiled.json"))["base_program_digest"])')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-guard-wheel-${{ matrix.platform_tag }}
          path: native-dist/*.whl
          if-no-files-found: error
