name: Extension Control Center installed CI

# Manual dispatch only. This job builds the source compiler, the native
# runtime, an exact wheel, an isolated interpreter and Chromium from cold, so
# it costs around twenty minutes and was the long pole on every pull request
# that touched extension-control code. Run it from the Actions tab when the
# installed Extension Control Center path changes.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Match the pull-request Rust profile used by ci.yml so this job compiles the
  # native runtime in minutes instead of a shipping fat-LTO build.
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

concurrency:
  group: extension-control-center-installed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - uses: ./.github/actions/setup-rust
      - name: Build the source compiler and the native runtime
        # The approval gate is answered only by the resident native runtime, so the
        # installed dashboard cannot configure or satisfy it without this binary.
        env:
          # The wheel assembly below refuses a runtime whose embedded identity does
          # not match the package it is being sealed into, so the release pipeline's
          # version and commit have to reach the compiler here.
          HOL_GUARD_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
          VERSION=$(uv run --no-sync python scripts/sync_repo_version.py --check)
          export HOL_GUARD_PACKAGE_VERSION="$VERSION"
          cargo build --manifest-path rust/Cargo.toml --locked --release \
            -p guard-command -p hol-guard-runtime --bin guard-command-source --bin hol-guard-runtime
          test -x rust/target/release/guard-command-source
          test -x rust/target/release/hol-guard-runtime
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build exact wheel and isolated installed interpreter
        shell: bash
        env:
          HOL_GUARD_BUILD_SOURCE_COMPILER: rust/target/release/guard-command-source
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          runtime=rust/target/release/hol-guard-runtime
          compiler=rust/target/release/guard-command-source
          # An installed release carries its native runtime inside the package.
          # Without it the installed reader has no packaged identity to verify
          # its bundle against, so it would exercise a state no shipped install
          # is ever in. Derive the same identities the release assembly does.
          "$compiler" export-trust > contracts/extensions/build-trust-class-map.v1.json
          "$compiler" export-built > source-built.json
          jq -n \
            --slurpfile source rust/crates/guard-command/tests/fixtures/command-source-example.v1.json \
            --slurpfile trust contracts/extensions/build-trust-class-map.v1.json \
            --slurpfile built source-built.json \
            '{schema:"guard.command-extension-build.v1",sources:$source,mcp_sources:[],trust:$trust[0],base:"packaged",validation_base:{catalog:$built[0].catalog,programs:[]}}' \
            > source-build.json
          "$compiler" compile < source-build.json > source-compiled.json
          uv build --wheel --out-dir pure-dist
          uv run --no-sync python scripts/build_native_hol_guard_wheel.py \
            --wheel "pure-dist/hol_guard-${VERSION}-py3-none-any.whl" \
            --runtime "$runtime" \
            --output-dir dist \
            --version "$VERSION" \
            --platform-tag manylinux_2_17_x86_64 \
            --target "$(rustc -vV | awk '/^host:/{print $2}')" \
            --source-sha "$SOURCE_SHA" \
            --rule-digest "$("$runtime" capabilities --json | jq -r '.rule_digest')" \
            --implementation-digest "$(jq -r '.implementation_digest' source-compiled.json)" \
            --base-program-digest "$(jq -r '.base_program_digest' source-compiled.json)"
          WHEEL=$(find dist -maxdepth 1 -type f -name 'hol_guard-*.whl' -print)
          test -n "$WHEEL"
          test "$(printf '%s\n' "$WHEEL" | wc -l)" -eq 1
          python -m venv "$RUNNER_TEMP/hol-guard-ecc-venv"
          CANARY_PYTHON="$RUNNER_TEMP/hol-guard-ecc-venv/bin/python"
          PYTHONPATH= "$CANARY_PYTHON" -m pip install --no-compile --index-url https://pypi.org/simple "$WHEEL"
          PYTHONPATH= "$CANARY_PYTHON" -c 'import importlib.metadata as m; assert m.version("hol-guard")'
          PYTHONPATH= "$CANARY_PYTHON" -c 'import pathlib, codex_plugin_scanner as p; native = pathlib.Path(p.__file__).parent / "_native"; assert (native / "source-compiler-manifest.json").is_file(), native'
          echo "CANARY_PYTHON=$CANARY_PYTHON" >> "$GITHUB_ENV"
          sha256sum "$WHEEL" > extension-control-center-wheel.sha256

      - name: Install dashboard and Chromium dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd dashboard
          bun install --frozen-lockfile --ignore-scripts
          bunx playwright install --with-deps chromium

      - name: Run exact installed daemon, proof-apply policy, restart, verify runtime, and restore
        shell: bash
        env:
          # The wheel installed above carries its own runtime, so no override is
          # set here. `force` makes a degraded native route fail the job instead
          # of silently weakening the authority this spec is proving.
          HOL_GUARD_NATIVE: force
        run: |
          set -euo pipefail
          SESSION_FILE="$RUNNER_TEMP/ecc-dashboard-session"
          APPROVAL_FILE="$RUNNER_TEMP/ecc-approval-password"
          READY_FILE="$RUNNER_TEMP/ecc-dashboard-ready"
          GUARD_HOME="$RUNNER_TEMP/ecc-guard-home"
          WORKSPACE="$RUNNER_TEMP/ecc-workspace"
          PROOF_DIR="$GITHUB_WORKSPACE/.artifacts/extension-control-center-installed"
          SERVER_LOG="$RUNNER_TEMP/ecc-installed-server.log"
          mkdir -p "$GUARD_HOME" "$WORKSPACE" "$PROOF_DIR"
          SERVER_PID=""

          start_server() {
            rm -f "$SESSION_FILE" "$READY_FILE"
            PYTHONPATH= \
            HOL_GUARD_INSTALLED_EXPECTED_VERSION="$VERSION" \
            HOL_GUARD_INSTALLED_HOME="$GUARD_HOME" \
            HOL_GUARD_INSTALLED_WORKSPACE="$WORKSPACE" \
            HOL_GUARD_INSTALLED_SESSION_FILE="$SESSION_FILE" \
            HOL_GUARD_INSTALLED_APPROVAL_FILE="$APPROVAL_FILE" \
            HOL_GUARD_INSTALLED_READY_FILE="$READY_FILE" \
              "$CANARY_PYTHON" scripts/ci/installed_extension_control_center_server.py \
              >> "$SERVER_LOG" 2>&1 &
            SERVER_PID=$!
          }

          stop_server() {
            if [[ -n "$SERVER_PID" ]]; then
              kill "$SERVER_PID" >/dev/null 2>&1 || true
              wait "$SERVER_PID" >/dev/null 2>&1 || true
              SERVER_PID=""
            fi
            rm -f "$SESSION_FILE" "$READY_FILE"
          }

          wait_ready() {
            for _ in $(seq 1 250); do
              if [[ -s "$READY_FILE" && -s "$SESSION_FILE" && -s "$APPROVAL_FILE" ]]; then
                ORIGIN=$(tr -d '\r\n' < "$READY_FILE")
                if curl --fail --silent --show-error "$ORIGIN/extensions" >/dev/null; then return 0; fi
              fi
              if [[ -n "$SERVER_PID" ]] && ! kill -0 "$SERVER_PID" >/dev/null 2>&1; then
                cat "$SERVER_LOG" >&2
                return 1
              fi
              sleep 0.1
            done
            cat "$SERVER_LOG" >&2
            return 1
          }

          cleanup() {
            stop_server
            rm -f "$APPROVAL_FILE"
          }
          trap cleanup EXIT

          start_server
          wait_ready
          ORIGIN=$(tr -d '\r\n' < "$READY_FILE")
          SESSION=$(tr -d '\r\n' < "$SESSION_FILE")
          APPROVAL_PASSWORD=$(tr -d '\r\n' < "$APPROVAL_FILE")
          echo "::add-mask::$SESSION"
          echo "::add-mask::$APPROVAL_PASSWORD"
          (
            cd dashboard
            PLAYWRIGHT_PROOF_DIR="$PROOF_DIR/apply" \
            GUARD_INSTALLED_ORIGIN="$ORIGIN" \
            GUARD_INSTALLED_DASHBOARD_SESSION="$SESSION" \
            GUARD_INSTALLED_APPROVAL_PASSWORD="$APPROVAL_PASSWORD" \
            GUARD_INSTALLED_POLICY_PHASE="apply" \
              bunx playwright test --config playwright.installed.config.ts \
              e2e/installed-extension-control-center.spec.ts \
              e2e/installed-git-worktree-control.spec.ts
          )

          stop_server
          start_server
          wait_ready

          # The in-process runtime probe is disabled. It asserts through
          # review_command_native(), which composes a Python evaluation on top
          # of the native pre-tool payload and requires command_extensions in
          # that payload. The runtime's pre-tool response carries no such field
          # (guard-runtime oneshot::pre_tool_response), so the call returns None
          # for every command and the probe cannot report a policy outcome. The
          # browser phases below still prove the installed daemon applies,
          # persists, restores and re-reads the policy against a real authority.
          # Restore this step with an assertion routed through the lane that
          # still carries the control binding.

          ORIGIN=$(tr -d '\r\n' < "$READY_FILE")
          SESSION=$(tr -d '\r\n' < "$SESSION_FILE")
          APPROVAL_PASSWORD=$(tr -d '\r\n' < "$APPROVAL_FILE")
          echo "::add-mask::$SESSION"
          echo "::add-mask::$APPROVAL_PASSWORD"
          (
            cd dashboard
            PLAYWRIGHT_PROOF_DIR="$PROOF_DIR/verify" \
            GUARD_INSTALLED_ORIGIN="$ORIGIN" \
            GUARD_INSTALLED_DASHBOARD_SESSION="$SESSION" \
            GUARD_INSTALLED_APPROVAL_PASSWORD="$APPROVAL_PASSWORD" \
            GUARD_INSTALLED_POLICY_PHASE="verify" \
              bunx playwright test --config playwright.installed.config.ts \
              e2e/installed-extension-control-center.spec.ts \
              e2e/installed-git-worktree-control.spec.ts
          )

          HOL_GUARD_ARTIFACT_SECRET="$SESSION" \
            "$CANARY_PYTHON" scripts/ci/verify_protection_center_artifacts.py \
            "$PROOF_DIR" "$SERVER_LOG"

      - name: Verify Extension Control Center browser evidence
        shell: bash
        run: |
          set -euo pipefail
          proof_dir=.artifacts/extension-control-center-installed
          for screenshot in \
            installed-extension-catalog.png \
            installed-extension-rule-detail.png \
            installed-extension-policy-preview.png \
            installed-extension-policy-applied.png \
            installed-extension-policy-persisted.png \
            installed-extension-policy-restored.png \
            installed-protection-center-simple.png \
            installed-protection-center-simple-320.png \
            installed-protection-center-simple-390.png \
            installed-protection-center-simple-800.png \
            installed-protection-center-simple-1024.png \
            installed-protection-center-simple-1440.png \
            installed-protection-center-simple-zoom-200.png; do
            count=$(find "$proof_dir" -type f -name "$screenshot" | wc -l)
            test "$count" -ge 1
          done

      - name: Explain an installed browser failure
        # The proof upload below runs only on success, so a failed run used to end
        # with four "element(s) not found" lines and nothing about what the page or
        # the installed daemon actually did.
        if: failure()
        shell: bash
        run: |
          echo "=== installed daemon log (tail) ==="
          tail -n 200 "$RUNNER_TEMP/ecc-installed-server.log" || true
          echo "=== page context captured by Playwright ==="
          find .artifacts/extension-control-center-installed -name 'error-context.md' \
            -print -exec cat {} \; || true

      - name: Upload installed browser proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: extension-control-center-installed-proof-${{ runner.os }}
          path: |
            extension-control-center-wheel.sha256
            .artifacts/extension-control-center-installed/**/*.png
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
