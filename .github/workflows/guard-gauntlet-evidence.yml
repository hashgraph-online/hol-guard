name: Guard Gauntlet evidence

on:
  pull_request:
    paths:
      - 'ci/gauntlet/**'
      - 'tests/test_guard_gauntlet*.py'
      - '.github/workflows/guard-gauntlet*.yml'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request whose current head was tested
        required: true
        type: string
      candidate_sha:
        description: Full pull request head SHA
        required: true
        type: string
      evidence_url:
        description: Optional direct HTTPS signed URL for a large public evidence ZIP
        required: false
        type: string
      evidence_base64:
        description: Public ZIP from Gauntlet dispatch inputs, as an alternative to a signed URL
        required: false
        type: string
      evidence_sha256:
        description: SHA-256 of that exact public evidence ZIP
        required: true
        type: string
      attest_real_inference:
        description: This evidence came from real model inference and the actual OMP CLI, not replayed or fabricated completions
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gauntlet-evidence-${{ github.event_name }}-${{ inputs.pr_number || github.event.pull_request.number }}-${{ inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

jobs:
  judge-native:
    name: Build Native judge artifacts and test plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Match ci.yml's test profile. Shipping wheels retain fat LTO; judge
      # tests need optimized execution without its whole-program link cost.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/ci-job-native-command-build
      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: '3.12.14'
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Prepare the same public directory as product CI
        run: |
          uv run --no-sync python scripts/prepare_extension_directory.py --compiler rust/target/release/guard-command-source
          uv run --no-sync python scripts/prepare_extension_directory.py --compiler rust/target/release/guard-command-source --check
      - name: Upload Native judge evaluators once
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pytest-native-command-evaluators
          path: |
            rust/target/release/guard-command-source
            rust/target/release/hol-guard-runtime
          if-no-files-found: error
          retention-days: 1
      - name: Upload matching Native projections
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pytest-native-command-projections
          path: |
            contracts/extensions/
            docs/guard/extensions/
            src/codex_plugin_scanner/guard/contracts/data/extensions/
          if-no-files-found: error
          retention-days: 1
      - name: Collect the complete Gauntlet corpus and prove shard coverage
        env:
          HOL_GUARD_NATIVE_BINARY: ${{ github.workspace }}/rust/target/release/hol-guard-runtime
          HOL_GUARD_NATIVE_SOURCE_COMPILER: ${{ github.workspace }}/rust/target/release/guard-command-source
          HOL_GUARD_NATIVE_TEST_SOURCE_COMPILER: ${{ github.workspace }}/rust/target/release/guard-command-source
          HOL_GUARD_NATIVE_REGRESSION: "1"
        run: |
          uv run --no-sync pytest --collect-only -q tests/test_guard_gauntlet*.py > gauntlet-judge-collection.txt
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import re

          raw = Path('gauntlet-judge-collection.txt').read_text(encoding='utf-8')
          nodes = sorted(line for line in raw.splitlines() if line.startswith('tests/') and '::' in line)
          summary = re.search(r'(\d+) tests? collected', raw)
          if summary is None or len(nodes) != int(summary[1]) or len(set(nodes)) != len(nodes):
              raise SystemExit('Gauntlet test discovery is incomplete or ambiguous')
          count = 8
          shards = [nodes[index::count] for index in range(count)]
          if any(not shard for shard in shards) or sorted(node for shard in shards for node in shard) != nodes:
              raise SystemExit('Gauntlet shards do not cover the complete corpus exactly once')
          root = Path('gauntlet-judge-shards')
          root.mkdir()
          pins = []
          for index, shard in enumerate(shards):
              value = ('\n'.join(shard) + '\n').encode()
              (root / f'shard-{index}.txt').write_bytes(value)
              pins.append({'index': index, 'tests': len(shard), 'sha256': hashlib.sha256(value).hexdigest()})
          manifest = {'schema': 'gauntlet-judge-shards.v1', 'tests': len(nodes), 'shards': pins}
          (root / 'manifest.json').write_text(json.dumps(manifest, sort_keys=True) + '\n')
          print(json.dumps(manifest, sort_keys=True))
          PY
      - name: Upload the complete judge test plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gauntlet-judge-shards
          path: gauntlet-judge-shards/
          if-no-files-found: error
          retention-days: 1

  contracts:
    name: judge (${{ matrix.shard-index }})
    if: github.event_name == 'pull_request'
    needs: judge-native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard-index: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      HOL_GUARD_NATIVE_BINARY: ${{ github.workspace }}/rust/target/release/hol-guard-runtime
      HOL_GUARD_NATIVE_SOURCE_COMPILER: ${{ github.workspace }}/rust/target/release/guard-command-source
      HOL_GUARD_NATIVE_TEST_SOURCE_COMPILER: ${{ github.workspace }}/rust/target/release/guard-command-source
      HOL_GUARD_NATIVE_REGRESSION: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: '3.12.14'
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pytest-native-command-evaluators
          path: rust/target/release
      - name: Restore executable modes on the exact build artifacts
        run: chmod 0755 rust/target/release/guard-command-source rust/target/release/hol-guard-runtime
      - uses: ./.github/actions/restore-command-projections
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: gauntlet-judge-shards
          path: gauntlet-judge-shards
      # Match product CI's verified overlay-capable sandbox. Each worker's
      # module fixtures and private Guard homes are process-isolated.
      - uses: ./.github/actions/setup-bubblewrap
      - name: Run every assigned judge and Native replay test
        env:
          SHARD_INDEX: ${{ matrix.shard-index }}
        run: |
          shard_file="gauntlet-judge-shards/shard-${SHARD_INDEX}.txt"
          test -s "$shard_file"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          index = int(os.environ['SHARD_INDEX'])
          root = Path('gauntlet-judge-shards')
          manifest = json.loads((root / 'manifest.json').read_bytes())
          rows = [row for row in manifest['shards'] if row['index'] == index]
          raw = (root / f'shard-{index}.txt').read_bytes()
          if (manifest['schema'] != 'gauntlet-judge-shards.v1' or len(rows) != 1
                  or rows[0]['sha256'] != hashlib.sha256(raw).hexdigest()
                  or rows[0]['tests'] != len(raw.splitlines())):
              raise SystemExit('Downloaded Gauntlet shard differs from the producer plan')
          print(f"Running {rows[0]['tests']} of {manifest['tests']} collected tests in shard {index}")
          PY
          uv run --no-sync python scripts/ci/run_projection_shard.py "$shard_file" -- \
            -q -x -n 2 --dist worksteal --max-worker-restart 0 "@$shard_file"

  verify:
    env:
      GUARD_GAUNTLET_BOOTSTRAP_VERIFIER_SHA: ${{ github.ref == 'refs/tags/guard-gauntlet-bootstrap-v3' && github.sha || '' }}
    if: github.event_name == 'workflow_dispatch' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/tags/guard-gauntlet-bootstrap-v3')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tested_source_sha: ${{ steps.prepare.outputs.tested_source_sha }}
    steps:
      # This is the trusted default-branch or pinned bootstrap verifier. No candidate
      # Python is imported or executed by the data-only validation job.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.14'
      - name: Verify submitter, current PR and bounded evidence archive
        id: prepare
        working-directory: trusted
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m ci.gauntlet.github_ci prepare --destination "$RUNNER_TEMP/gauntlet-evidence"
      - name: Recompute every outcome against immutable candidate Git blobs
        working-directory: trusted
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          python -m ci.gauntlet verify "$RUNNER_TEMP/gauntlet-evidence" \
            --expected-sha "$CANDIDATE_SHA" --source-manifest "$RUNNER_TEMP/gauntlet-source-manifest.json" \
            > "$RUNNER_TEMP/gauntlet-verified.json"
          {
            echo "## Guard Gauntlet: independently verified live evidence"
            echo '```json'
            cat "$RUNNER_TEMP/gauntlet-verified.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve verified public evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: guard-gauntlet-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/gauntlet-evidence/
          if-no-files-found: error
          retention-days: 90

  publish:
    env:
      GUARD_GAUNTLET_BOOTSTRAP_VERIFIER_SHA: ${{ github.ref == 'refs/tags/guard-gauntlet-bootstrap-v3' && github.sha || '' }}
    if: always() && github.event_name == 'workflow_dispatch' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/tags/guard-gauntlet-bootstrap-v3')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    steps:
      # The write-capable job never downloads or executes the submitted bundle
      # or candidate code. It receives only the verified source SHA and job result.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.14'
      - name: Publish exact-head qualification and evidence link
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATION_RESULT: ${{ needs.verify.result }}
          TESTED_SOURCE_SHA: ${{ needs.verify.outputs.tested_source_sha }}
        run: python -m ci.gauntlet.github_ci publish
