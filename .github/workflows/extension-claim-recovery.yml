name: Extension Claim Recovery

on:
  workflow_dispatch:
  schedule:
    - cron: "43 7 * * *"

permissions: {}

concurrency:
  group: extension-claim-recovery
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pull_requests: ${{ steps.plan.outputs.pull_requests }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Find missed introducing-contributor invitations
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pending=$(python3 scripts/plan_extension_claim_recovery.py --source-root "$GITHUB_WORKSPACE")
          echo "pull_requests=$pending" >> "$GITHUB_OUTPUT"

  notify:
    needs: plan
    if: needs.plan.outputs.pull_requests != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pr_number: ${{ fromJSON(needs.plan.outputs.pull_requests) }}
    concurrency:
      group: extension-claim-notice-${{ matrix.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Deliver missing claim invitation after rechecking authority
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr_number }}
        run: python3 scripts/notify_merged_extension_claimants.py --repo "$GITHUB_REPOSITORY" --pr-number "$PR_NUMBER" --source-root "$GITHUB_WORKSPACE" --refresh-existing
