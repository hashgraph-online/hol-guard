name: Temporary PR 2691 Windows read diagnostic

on:
  push:
    branches:
      - tmp/pr2691-windows-durable-debug-20260902
    paths:
      - .github/workflows/temporary-pr2691-windows-durable-debug.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: tmp/pr2691-windows-durable-debug-20260902
          persist-credentials: false
      - name: Trace private-file read failure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          @'
          from pathlib import Path

          path = Path('rust/crates/guard-runtime/src/resident_state_files.rs')
          text = path.read_text(encoding='utf-8')
          old = '''        Err(_) => return Err(format!("native_resident_{kind}_read_failed")),
              };
          '''
          new = '''        Err(error) => {
                      eprintln!(
                          "DBG open_private_read path={} kind={} io_kind={:?} raw={:?} error={}",
                          path.display(), kind, error.kind(), error.raw_os_error(), error
                      );
                      return Err(format!("native_resident_{kind}_read_failed"));
                  }
              };
          '''
          if text.count(old) != 1:
              raise RuntimeError(f'open_private_read target count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('rust/crates/guard-runtime/src/resident_state_windows.rs')
          text = path.read_text(encoding='utf-8')
          old = '''    with_existing_directory(parent, private_root, |binding| {
                  binding.open_private_file(name)
              })
          }
          '''
          new = '''    with_existing_directory(parent, private_root, |binding| {
                  binding.open_private_file(name)
              })
              .inspect_err(|error| {
                  eprintln!(
                      "DBG open_private_file path={} private_root={} io_kind={:?} raw={:?} error={}",
                      path.display(), private_root.display(), error.kind(), error.raw_os_error(), error
                  );
              })
          }
          '''
          if text.count(old) != 1:
              raise RuntimeError(f'open_private_file target count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          '@ | python -
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup default 1.88.0
          cargo fmt --manifest-path rust/Cargo.toml --all
          $env:RUST_BACKTRACE = '1'
          cargo test --manifest-path rust/Cargo.toml --locked -p hol-guard-runtime --bin hol-guard-runtime approval::approval_v4::tests::ed25519_assertion_validates_and_persists_counter_zero_and_one -- --nocapture --test-threads=1
