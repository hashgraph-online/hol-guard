name: Validate remaining Sonar contracts
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/ci/complete_sonar_review.py
      - .github/workflows/complete-sonar-review.yml
      - docs/guard/security/sonar-reviewed-contracts.json
permissions:
  contents: read
jobs:
  validate:
    if: github.event.pull_request.number == 2778 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/sonar-blocker-control-flow' && github.actor == 'kantorcodes'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Apply reviewed audit-request boundary
        run: python3 scripts/ci/complete_sonar_review.py prepare
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
      - run: uv sync --frozen --extra dev
      - name: Validate security boundaries and unchanged decision corpus
        run: python3 scripts/ci/complete_sonar_review.py validate
      - name: Export validated blobs without updating refs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/complete_sonar_review.py export
      - name: Record source-pinned individual review dispositions
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: python3 scripts/ci/complete_sonar_review.py review
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: sonar-final-review
          path: sonar-final-review/
          if-no-files-found: error
