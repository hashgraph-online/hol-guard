name: Apply scanner import fix

on:
  pull_request:
    branches: [release/3.0]

permissions:
  contents: write

concurrency:
  group: apply-scanner-import-fix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: false
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Apply exact Ruff import fix and remove temporary workflow
        run: |
          uv run --no-sync python -m ruff check src/codex_plugin_scanner/scanner.py --select I --fix
          rm .github/workflows/ruff-import-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/codex_plugin_scanner/scanner.py .github/workflows/ruff-import-diagnostic.yml
          git commit -m "style(scanner): organize extracted helper imports"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
