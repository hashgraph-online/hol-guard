name: PR 2870 decision report refresh

on:
  push:
    branches:
      - fix/secret-read-floors-and-contained-vitest

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
      - name: Install dependencies
        run: uv sync --frozen --extra dev --python 3.12
      - name: Refresh decision report
        run: >-
          uv run --no-sync python -c
          'from tests.guard_command_decision_diff import REPORT_PATH, canonical_json_bytes, generate_decision_diff_report; REPORT_PATH.write_bytes(canonical_json_bytes(generate_decision_diff_report()))'
      - name: Commit refreshed report
        shell: bash
        run: |
          if git diff --quiet -- tests/fixtures/guard-command-corpus/decision-diff-report.json; then
            exit 0
          fi
          git config user.name "kantorcodes"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git add tests/fixtures/guard-command-corpus/decision-diff-report.json
          git commit -m "test: refresh command decision diff report"
          git push origin HEAD:fix/secret-read-floors-and-contained-vitest
