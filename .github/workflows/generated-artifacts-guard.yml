name: generated-artifacts-guard
on:
  pull_request:

permissions:
  contents: read

jobs:
  regen-owned-paths:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Source and generated evidence are reviewed together. No author, fork,
    # branch prefix or changed-path exemption can waive this validation.
    # Required CI additionally checks the real native compiler and full corpus.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: "3.12.14"
      - name: Verify committed evidence bindings and package copies
        run: uv run --no-sync python scripts/ci/check_generated_evidence.py
