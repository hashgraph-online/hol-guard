name: Delete alpha release

# Withdraws a bad alpha cut from main. Deleting the prerelease and its
# alpha/v<version> tag removes the Desktop Core sidecars and stops
# `hol-guard update --alpha` and Desktop's Alpha channel from offering it.
# The restore-alpha-feed job then makes sure the newest remaining main alpha
# still carries signed Desktop Core sidecars, so the Alpha channel falls back to it.
# PyPI never allows a version to be reused or yanked by a CI token; a PyPI owner
# yanks it by hand. Runbook: docs/guard/alpha-rollback-runbook.md
on:
  workflow_dispatch:
    inputs:
      version:
        description: Alpha version to delete, for example 3.43.0a1
        type: string
        required: true

permissions: {}

concurrency:
  group: delete-alpha-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  delete:
    name: Delete alpha prerelease, tag and container image
    if: github.repository == 'hashgraph-online/hol-guard'
    runs-on: ubuntu-24.04
    # Leaves room for a rate-limit retry to wait out one quota reset.
    timeout-minutes: 75
    permissions:
      contents: write
      packages: write
    steps:
      - name: Require an authorized maintainer and a main alpha version
        env:
          ACTOR_ID: ${{ github.actor_id }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$ACTOR_ID" != "6068672" && "$ACTOR_ID" != "301892678" ]]; then
            echo "Alpha releases may only be deleted by an authorized maintainer" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.0a[1-9][0-9]*$ ]]; then
            echo "Only main alphas (X.Y.0aN) can be deleted here" >&2
            exit 1
          fi
          echo "### Alpha ${VERSION} retraction" >>"$GITHUB_STEP_SUMMARY"

      - name: Check out release API token tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: .release-api-token
          sparse-checkout: .github/actions/release-api-token
          sparse-checkout-cone-mode: false
      - name: Select release API token
        id: release-token
        uses: ./.release-api-token/.github/actions/release-api-token
        with:
          client-id: ${{ vars.HOL_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOL_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Confirm the tag is a prerelease cut from main
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="alpha/v${VERSION}"
          # Release-train alphas share the X.Y.0aN shape, so only main ancestry identifies a main alpha.
          if ! source_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/tags/${tag}" --jq .sha 2>lookup_error); then
            cat lookup_error >&2
            echo "No readable tag ${tag}; nothing verifiable to delete" >&2
            exit 1
          fi
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${source_sha}...main" --jq .status)
          if [[ "$status" != "ahead" && "$status" != "identical" ]]; then
            echo "Refusing to delete ${tag}: ${source_sha} is not on main (${status})" >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease >is_prerelease 2>release_error; then
            if [[ "$(cat is_prerelease)" != "true" ]]; then
              echo "Refusing to delete ${tag}: it is not a prerelease" >&2
              exit 1
            fi
          elif ! grep -q "release not found" release_error; then
            cat release_error >&2
            exit 1
          fi

      # The image goes first so a rerun after a partial failure still finds the tag to verify.
      - name: Delete the alpha container image tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          package="${GITHUB_REPOSITORY#*/}"
          if ! ids=$(gh api --paginate "orgs/${owner}/packages/container/${package}/versions" \
            --jq ".[] | select(.metadata.container.tags | index(\"${VERSION}\")) | .id" 2>lookup_error); then
            if grep -q "HTTP 404" lookup_error; then
              echo "- No container package ${package}" >>"$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            cat lookup_error >&2
            exit 1
          fi
          if [[ -z "$ids" ]]; then
            echo "- No container image tagged ${VERSION}" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for id in $ids; do
            gh api -X DELETE "orgs/${owner}/packages/container/${package}/versions/${id}"
            echo "- Deleted container image version ${id} (${VERSION})" >>"$GITHUB_STEP_SUMMARY"
          done

      - name: Delete the GitHub prerelease and tag
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="alpha/v${VERSION}"
          if [[ "$(cat is_prerelease 2>/dev/null)" == "true" ]]; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            echo "- Deleted prerelease ${tag}, its Desktop Core sidecars and its tag" >>"$GITHUB_STEP_SUMMARY"
          else
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}"
            echo "- Deleted orphaned tag ${tag} (no release existed)" >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Explain the PyPI follow-up
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo
            echo "\`hol-guard update --alpha\` and Desktop's Alpha channel no longer offer ${VERSION}."
            echo
            echo "PyPI keeps hol-guard ${VERSION} because published versions cannot be deleted or reused,"
            echo "and trusted publishing cannot yank. Until a PyPI owner yanks it, \`pip install --pre\`,"
            echo "\`uv pip install --prerelease=allow\`, \`pipx install --pip-args=--pre\` and the CLI's"
            echo "Desktop Core updater still resolve it. Yank it now at"
            echo "https://pypi.org/manage/project/hol-guard/release/${VERSION}/"
            echo "(Options > Yank, reason: withdrawn alpha). See docs/guard/alpha-rollback-runbook.md."
          } >>"$GITHUB_STEP_SUMMARY"

  restore-alpha-feed:
    name: Fall the Desktop Core alpha feed back to the last good alpha
    needs: delete
    if: github.repository == 'hashgraph-online/hol-guard'
    runs-on: ubuntu-24.04
    # Leaves room for a rate-limit retry to wait out one quota reset.
    timeout-minutes: 75
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out release API token tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: .release-api-token
          sparse-checkout: |
            .github/actions/release-api-token
            scripts/release/desktop_core_alpha_feed.py
          sparse-checkout-cone-mode: false
      - name: Route gh through the rate-limit retry wrapper
        uses: ./.release-api-token/.github/actions/release-api-token

      - name: Find the newest live main alpha
        id: fallback
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Newest first; the retracted tag is already deleted, but exclude it in case of a rerun race.
          candidates=$(git ls-remote --tags --refs "https://github.com/${GITHUB_REPOSITORY}.git" 'alpha/v*' \
            | awk '{print $2}' | sed 's#^refs/tags/alpha/v##' \
            | { grep -E '^[0-9]+\.[0-9]+\.0a[1-9][0-9]*$' || true; } | { grep -vxF "$VERSION" || true; } | sort -rV)
          for candidate in $candidates; do
            tag="alpha/v${candidate}"
            if ! release=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isPrerelease,isDraft \
              --jq '"\(.isPrerelease) \(.isDraft)"' 2>/dev/null); then
              continue
            fi
            [[ "$release" == "true false" ]] || continue
            source_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/tags/${tag}" --jq .sha)
            status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${source_sha}...main" --jq .status)
            [[ "$status" == "ahead" || "$status" == "identical" ]] || continue
            {
              echo "version=${candidate}"
              echo "source_sha=${source_sha}"
            } >>"$GITHUB_OUTPUT"
            echo "- Alpha channel falls back to ${candidate} (${source_sha})" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          done
          echo "No live main alpha prerelease remains; ship a fix-forward alpha" >&2
          echo "- No live main alpha remains to fall back to; ship a fix-forward alpha" >>"$GITHUB_STEP_SUMMARY"
          exit 1

      # Desktop's Alpha channel reads signed sidecars from the newest live prerelease, not PyPI.
      # The feed workflows verify the publication run themselves, so a wrong run id is refused there.
      - name: Dispatch missing Desktop Core sidecars for the fallback alpha
        env:
          GH_TOKEN: ${{ github.token }}
          FALLBACK: ${{ steps.fallback.outputs.version }}
          SOURCE_SHA: ${{ steps.fallback.outputs.source_sha }}
        run: |
          set -euo pipefail
          tag="alpha/v${FALLBACK}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            >"$RUNNER_TEMP/release-assets.txt"
          # Same complete/partial rule the feed workflows apply: binary, manifest and signed sidecar.
          missing=()
          partial=()
          for target in aarch64-apple-darwin x86_64-unknown-linux-gnu; do
            if ! mode=$(python3 -I .release-api-token/scripts/release/desktop_core_alpha_feed.py inspect-assets \
              --assets "$RUNNER_TEMP/release-assets.txt" --base "hol-guard-core-${FALLBACK}-${target}" | sed -n 's/^mode=//p'); then
              partial+=("$target")
            elif [[ "$mode" == "build" ]]; then
              missing+=("$target")
            fi
          done
          if [[ ${#partial[@]} -gt 0 ]]; then
            echo "${tag} has a partial Core asset set for ${partial[*]}; repair it by hand (see docs/guard/alpha-rollback-runbook.md)" >&2
            echo "- ${tag} has a partial Core asset set for ${partial[*]}; the feeds refuse it, so repair it by hand" >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ ${#missing[@]} -eq 0 ]]; then
            echo "- ${tag} already carries complete macOS and Linux Core asset sets; nothing to dispatch" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A later job (for example the container publish) can fail the run after PyPI succeeded,
          # and a rerun can fail before publishing, so pick the run whose alpha PyPI job succeeded.
          run_id=""
          for candidate in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/publish.yml/runs?event=workflow_dispatch&branch=main&head_sha=${SOURCE_SHA}&per_page=20" \
            --jq '.workflow_runs[].id'); do
            published=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate}/jobs?filter=latest&per_page=100" \
              --jq '.jobs[] | select(.name == "Publish alpha to PyPI" and .conclusion == "success") | .id')
            if [[ -n "$published" ]]; then
              run_id="$candidate"
              break
            fi
          done
          if [[ -z "$run_id" ]]; then
            echo "No publish run with a successful alpha PyPI job for ${SOURCE_SHA}; dispatch the feeds by hand (see docs/guard/alpha-rollback-runbook.md)" >&2
            exit 1
          fi
          for target in "${missing[@]}"; do
            case "$target" in
              aarch64-apple-darwin) feed=desktop-core-alpha-feed.yml ;;
              x86_64-unknown-linux-gnu) feed=desktop-core-linux-feed.yml ;;
            esac
            gh workflow run "$feed" --repo "$GITHUB_REPOSITORY" --ref main -f "core_version=$FALLBACK" -f release_channel=alpha -f "publication_run_id=$run_id" -f "publication_source_sha=$SOURCE_SHA"
            echo "- Dispatched ${feed} for ${FALLBACK} (publish run ${run_id}); watch it finish" >>"$GITHUB_STEP_SUMMARY"
          done

      # Runs even when no fallback or publish run was found: that is when the yank matters most.
      - name: Report the PyPI yank state
        if: ${{ !cancelled() }}
        env:
          VERSION: ${{ inputs.version }}
          FALLBACK: ${{ steps.fallback.outputs.version }}
        run: |
          set -euo pipefail
          yanked() {
            curl -fsS --max-time 20 "https://pypi.org/pypi/hol-guard/$1/json" \
              | jq -r 'if (.urls | length) > 0 and all(.urls[]; .yanked) then "yanked" else "live" end' \
              || echo "unknown"
          }
          bad=$(yanked "$VERSION")
          {
            echo
            echo "| Version | Role | PyPI |"
            echo "| --- | --- | --- |"
            echo "| ${VERSION} | withdrawn | ${bad} |"
          } >>"$GITHUB_STEP_SUMMARY"
          if [[ "$bad" != "yanked" ]]; then
            echo "::warning title=Yank ${VERSION} on PyPI::A PyPI owner must yank ${VERSION} by hand: https://pypi.org/manage/project/hol-guard/release/${VERSION}/"
          fi
          if [[ -z "$FALLBACK" ]]; then
            exit 0
          fi
          good=$(yanked "$FALLBACK")
          echo "| ${FALLBACK} | fallback | ${good} |" >>"$GITHUB_STEP_SUMMARY"
          if [[ "$good" != "live" ]]; then
            echo "::warning title=Fallback ${FALLBACK} is not live on PyPI::Desktop Core updates via the CLI skip yanked versions"
          fi
