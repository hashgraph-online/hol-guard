# SonarQube Cloud analysis. This file is the source of coverage and duplication scope.
sonar.projectKey=hashgraph-online_hol-guard
sonar.organization=hashgraph-online
sonar.projectName=hol-guard

# Production code spans the Python package and the native Rust workspace.
sonar.sources=src,rust
sonar.tests=tests,rust
sonar.test.inclusions=**/test_*.py,rust/**/tests/**/*.rs,rust/**/*_tests.rs

sonar.python.version=3.10, 3.11, 3.12, 3.13

# The Rust workspace is nested, so point Sonar's Clippy integration at its manifest.
sonar.rust.cargo.manifestPaths=rust/Cargo.toml

# Bundled dashboard output is generated. Rust integration/unit-test files are test code, not source LOC.
sonar.exclusions=src/codex_plugin_scanner/guard/daemon/static/**,rust/**/tests/**,rust/**/*_tests.rs
sonar.cpd.exclusions=src/codex_plugin_scanner/guard/daemon/static/**,tests/**,rust/**/tests/**,rust/**/*_tests.rs,rust/crates/guard-contracts/src/approval_contracts.rs,rust/crates/guard-contracts/src/approval_v4_contracts.rs,rust/crates/guard-runtime/src/approval.rs,rust/crates/guard-runtime/src/approval_v4.rs,rust/crates/guard-runtime/src/approval_context.rs,rust/crates/guard-runtime/src/policy_store_approval.rs,rust/crates/guard-rule-contract/src/lib.rs,rust/crates/guard-policy-snapshot/src/policy_snapshot_crypto.rs,rust/crates/guard-runtime/src/resident_transport.rs,rust/crates/guard-runtime/src/strict_json.rs,rust/crates/guard-command/src/pretool/generic_extract.rs,rust/crates/guard-runtime/src/resident_state_windows.rs,rust/crates/guard-command/src/pretool/search.rs

# Rust duplication exclusions. Every path appended above is intentional
# duplication that must not be consolidated:
# - guard-contracts approval envelopes (approval_contracts.rs,
#   approval_v4_contracts.rs) and the guard-runtime approval lifecycle files
#   (approval.rs, approval_v4.rs, approval_context.rs,
#   policy_store_approval.rs): v1-v4 approval wire contracts keep mirrored
#   envelope construction so each contract version stays independently
#   deserializable and evolvable; shared builders would couple the versions.
# - guard-rule-contract/src/lib.rs: the COMPONENTS manifest is pinned data —
#   its bytes ARE the native rule contract — and the parallel table rows are
#   irreducible.
# - guard-policy-snapshot/src/policy_snapshot_crypto.rs and
#   guard-runtime/src/resident_transport.rs: the duplicated HMAC-SHA256
#   framing is independently digest-pinned by the rule contract; editing
#   either invalidates native rule-contract verification.
# - guard-command/src/pretool/generic_extract.rs: pinned by the rule-contract
#   manifest; guard-runtime/src/strict_json.rs mirrors it across crates, so
#   the pair cannot be shared without editing the pinned file.
# - guard-runtime/src/resident_state_windows.rs: twin Windows ACL verification
#   preludes for the file and directory paths; the code is Windows-only and
#   cannot be exercised on other hosts, so the prelude is deliberately
#   repeated.
# - guard-command/src/pretool/search.rs: the rg and grep safety parsers stay
#   structurally parallel so each tool's flag surface and value roles evolve
#   independently (the shared glob character-class matcher itself was already
#   extracted into search/glob_class.rs).

# Coverage XML combined from the sharded pytest run by the ci.yml "sonar" job.
# Set the SONAR_CI_ENABLED repository variable only after disabling Automatic Analysis.
sonar.python.coverage.reportPaths=coverage.xml
