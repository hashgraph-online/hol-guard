# `hol-guard telemetry plugins`: matches installed agent plugins to public HOL
# listings on the device and builds the opt-in weekly install report. It reads
# plugin manifests under the runtime homes the request names, never sends
# anything itself, and never returns a plugin that is not in the public index.
