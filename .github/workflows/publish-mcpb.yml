name: MCPB Distribution

on:
  workflow_run:
    workflows: ["Publish to PyPI"]
    types: [completed]
    # Stable releases are dispatched on their vX.Y.Z tag, which GitHub reports as the branch.
    branches: [main, release/3.0, "v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      publication_run_id:
        description: Successful Publish to PyPI run of the latest stable release to republish
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: >-
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event) &&
          github.event.workflow_run.run_attempt == 1 &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          (
            contains(fromJSON('["main", "release/3.0"]'), github.event.workflow_run.head_branch) ||
            (github.event.workflow_run.event == 'workflow_dispatch' && startsWith(github.event.workflow_run.head_branch, 'v'))
          ) &&
          !contains(github.event.workflow_run.head_commit.message || '', '[skip release publish]')
        )
      )
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/verify-mcp-release-source.yml
    with:
      publication_run_id: ${{ inputs.publication_run_id || '' }}

  validate:
    needs: verify
    name: Validate one-click MCP bundle
    if: >-
      needs.verify.outputs.sha != '' &&
      needs.verify.outputs.branch != '' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event) &&
          github.event.workflow_run.run_attempt == 1 &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          (
            contains(fromJSON('["main", "release/3.0"]'), github.event.workflow_run.head_branch) ||
            (github.event.workflow_run.event == 'workflow_dispatch' && startsWith(github.event.workflow_run.head_branch, 'v'))
          ) &&
          !contains(github.event.workflow_run.head_commit.message || '', '[skip release publish]')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out verified immutable source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.sha }}
      - name: Validate Python wrapper
        run: python -m compileall -q distributions/mcpb/server
      - name: Pack the MCP bundle
        run: |
          set -euo pipefail
          python3 scripts/ci/pack_mcpb.py distributions/mcpb "$RUNNER_TEMP/hol-guard.mcpb"
          test -s "$RUNNER_TEMP/hol-guard.mcpb"

  publish:
    name: Attach versioned MCPB to release
    if: >-
      needs.verify.outputs.sha != '' &&
      needs.verify.outputs.branch != '' &&
      vars.RELEASE_PUBLISHING_ENABLED == 'true' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event) &&
          github.event.workflow_run.run_attempt == 1 &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          (
            contains(fromJSON('["main", "release/3.0"]'), github.event.workflow_run.head_branch) ||
            (github.event.workflow_run.event == 'workflow_dispatch' && startsWith(github.event.workflow_run.head_branch, 'v'))
          ) &&
          !contains(github.event.workflow_run.head_commit.message || '', '[skip release publish]')
        )
      )
    needs: [verify, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out verified exact release source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the completed release tag
        id: release
        env:
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
          SOURCE_REF: refs/heads/${{ needs.verify.outputs.branch }}
          VERIFIED_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          # The trusted verifier proved both PyPI and GitHub release jobs completed.
          # A missing tag is an integrity error, not a reason to occupy a runner for 30 minutes.
          git fetch --force --tags origin
          if [[ -n "$VERIFIED_TAG" ]]; then
            # The verifier proved this exact tag names the published commit; never substitute another tag at it.
            git tag --points-at "$SOURCE_SHA" --list 'v*' | grep -Fqx -- "$VERIFIED_TAG"
            tag="$VERIFIED_TAG"
          elif [[ "$SOURCE_REF" == "refs/heads/release/3.0" ]]; then
            tag=$(git tag --points-at "$SOURCE_SHA" --list 'alpha/v3.0.1a*' | sort -V | tail -n 1)
          elif [[ "$SOURCE_REF" == "refs/heads/main" ]]; then
            tag=$(git tag --points-at "$SOURCE_SHA" --list 'v*' | sort -V | tail -n 1)
          else
            echo "Unsupported release ref: $SOURCE_REF" >&2
            exit 1
          fi
          if [[ -z "$tag" ]]; then
            echo "Completed release has no canonical tag for $SOURCE_SHA" >&2
            exit 1
          fi
          if [[ "$tag" == alpha/v* ]]; then
            version="${tag#alpha/v}"
          else
            version="${tag#v}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Wait for exact PyPI package and GitHub release
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 6); do
            pypi_ok=false
            release_ok=false
            curl --fail --silent --show-error --connect-timeout 5 --max-time 10 --proto '=https' --tlsv1.2 \
              "https://pypi.org/pypi/hol-guard/${VERSION}/json" -o /tmp/pypi.json && \
              jq -e --arg version "$VERSION" '.info.version == $version' /tmp/pypi.json >/dev/null && pypi_ok=true
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && release_ok=true
            if [[ "$pypi_ok" == true && "$release_ok" == true ]]; then exit 0; fi
            [[ "$attempt" == "6" ]] && { echo "Release prerequisites did not become available" >&2; exit 1; }
            sleep 5
          done

      - name: Stamp exact release into isolated bundle source
        id: bundle
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          bundle_dir="$RUNNER_TEMP/hol-guard-mcpb"
          cp -R distributions/mcpb "$bundle_dir"
          python - "$bundle_dir" "$VERSION" <<'PY'
          import json
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])
          version = sys.argv[2]
          manifest_path = root / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["version"] = version
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          pyproject_path = root / "pyproject.toml"
          text = pyproject_path.read_text(encoding="utf-8")
          text = re.sub(r'(?m)^version = "[^"]+"$', f'version = "{version}"', text, count=1)
          text = re.sub(r'"hol-guard==[^"]+"', f'"hol-guard=={version}"', text, count=1)
          pyproject_path.write_text(text, encoding="utf-8")
          PY
          artifact="$RUNNER_TEMP/hol-guard-${VERSION}.mcpb"
          echo "dir=$bundle_dir" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Pack the immutable bundle
        env:
          BUNDLE_DIR: ${{ steps.bundle.outputs.dir }}
          ARTIFACT: ${{ steps.bundle.outputs.artifact }}
        run: |
          set -euo pipefail
          python3 scripts/ci/pack_mcpb.py "$BUNDLE_DIR" "$ARTIFACT"
          # Name the file by basename so `sha256sum -c` works next to the downloaded asset.
          (cd "$(dirname "$ARTIFACT")" && sha256sum "$(basename "$ARTIFACT")") > "${ARTIFACT}.sha256"

      - name: Attach bundle and checksum to canonical release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ARTIFACT: ${{ steps.bundle.outputs.artifact }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$ARTIFACT" "${ARTIFACT}.sha256" --clobber --repo "$GITHUB_REPOSITORY"
