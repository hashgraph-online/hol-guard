# `hol-guard plugin …`: reads a plugin source repository (Claude Code, Codex,
# Gemini CLI, MCP server.json, Agent Skills), checks it, and emits manifests
# for other agent runtimes. It reads and writes only inside the paths the
# request names (plus Guard's install record under the Guard home) and never
# touches the network.
