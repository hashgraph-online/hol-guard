name: Native release contract

on:
  pull_request:
    branches: [release/3.0]
    paths:
      - ".github/workflows/publish.yml"
      - ".github/workflows/native-release-contract.yml"
      - "scripts/verify_native_runtime_release.py"
      - "ci/native_runtime/test_native_runtime_release.py"
  push:
    branches: [release/3.0]
    paths:
      - ".github/workflows/publish.yml"
      - ".github/workflows/native-release-contract.yml"
      - "scripts/verify_native_runtime_release.py"
      - "ci/native_runtime/test_native_runtime_release.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run --no-sync python -m ruff format --check scripts/verify_native_runtime_release.py ci/native_runtime/test_native_runtime_release.py
      - run: uv run --no-sync python -m ruff check scripts/verify_native_runtime_release.py ci/native_runtime/test_native_runtime_release.py
      - run: uv run --no-sync pytest ci/native_runtime/test_native_runtime_release.py --tb=short
