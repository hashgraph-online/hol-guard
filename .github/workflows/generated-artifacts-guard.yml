name: generated-artifacts-guard
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Preserve the required context; validate build ownership identically on all refs.
  regen-owned-paths:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Keep derived build outputs out of source control
        run: python3 scripts/ci/check_build_owned_paths.py
