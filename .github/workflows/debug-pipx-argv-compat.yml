name: Apply pipx updater argv compatibility fix

on:
  pull_request:
    paths:
      - "src/codex_plugin_scanner/guard/cli/update_subprocess.py"
      - ".github/workflows/debug-pipx-argv-compat.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Apply compatibility patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/codex_plugin_scanner/guard/cli/update_subprocess.py")
          text = path.read_text(encoding="utf-8")

          old_bootstrap_line = '    "extra_import_paths=json.loads(sys.argv.pop(1)); "\n'
          new_bootstrap_line = '    "extra_import_paths=json.loads(sys.argv.pop(1)) if sys.argv[1].startswith(\'[\') else []; "\n'
          if old_bootstrap_line not in text:
              raise SystemExit("trusted module bootstrap line not found")
          text = text.replace(old_bootstrap_line, new_bootstrap_line, 1)

          start = text.index("    def python_module_command")
          end = text.index("    def _python_import_paths_json", start)
          method = text[start:end]
          if "        return [\n" not in method:
              raise SystemExit("python_module_command return not found")
          method = method.replace("        return [\n", "        command = [\n", 1)
          old_tail = (
              '            self._python_import_paths_json(),\n'
              '            json.dumps(extra_import_paths, separators=(",", ":")),\n'
              '            module,\n'
              '            *args,\n'
              '        ]\n\n'
          )
          new_tail = (
              '            self._python_import_paths_json(),\n'
              '        ]\n'
              '        if extra_import_paths:\n'
              '            command.append(json.dumps(extra_import_paths, separators=(",", ":")))\n'
              '        return [*command, module, *args]\n\n'
          )
          if old_tail not in method:
              raise SystemExit("python_module_command tail not found")
          method = method.replace(old_tail, new_tail, 1)
          text = text[:start] + method + text[end:]
          path.write_text(text, encoding="utf-8")
          PY
          python -m pip install --disable-pip-version-check ruff==0.15.17
          python -m ruff format src/codex_plugin_scanner/guard/cli/update_subprocess.py
          rm .github/workflows/debug-pipx-argv-compat.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/codex_plugin_scanner/guard/cli/update_subprocess.py .github/workflows/debug-pipx-argv-compat.yml
          git diff --cached --check
          git commit -m "fix(update): preserve updater argv without shared pip"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
