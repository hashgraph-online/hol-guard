name: CI Windows native runtime
description: Build and publish the Windows hol-guard-runtime for the packaged daemon gate.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version: "3.12"
    - name: Stage trust bindings the native build embeds
      shell: pwsh
      run: |
        python scripts/refresh_extension_artifacts.py --trust-only
        if ($LASTEXITCODE -ne 0) {
          throw "Staging Windows native trust bindings failed with exit code $LASTEXITCODE"
        }
    - name: Restore the cached Windows native runtime
      id: runtime-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: rust/target/release/hol-guard-runtime.exe
        # The hash must cover every build input outside rust/: guard-command's
        # build.rs reads contributions/ and contracts/extensions/trust, and
        # guard-policy-snapshot include_str!s spec/. A test asserts this key
        # stays complete.
        key: windows-hol-guard-runtime-v1-lto-${{ env.CARGO_PROFILE_RELEASE_LTO }}-cgu-${{ env.CARGO_PROFILE_RELEASE_CODEGEN_UNITS }}-${{ hashFiles('rust/**', 'contributions/**', 'contracts/**', 'spec/**', '.github/actions/setup-rust/action.yml', '.github/actions/ci-job-windows-native-runtime/action.yml') }}
    - uses: ./.github/actions/setup-rust
      if: steps.runtime-cache.outputs.cache-hit != 'true'
    - name: Build the Windows native runtime
      if: steps.runtime-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        cargo build --manifest-path rust/Cargo.toml --locked --release -p hol-guard-runtime --bin hol-guard-runtime
    - name: Save the Windows native runtime cache
      if: steps.runtime-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: rust/target/release/hol-guard-runtime.exe
        key: ${{ steps.runtime-cache.outputs.cache-primary-key }}
    - name: Upload the Windows native runtime
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: windows-native-runtime
        path: rust/target/release/hol-guard-runtime.exe
        if-no-files-found: error
        retention-days: 1
        overwrite: true
