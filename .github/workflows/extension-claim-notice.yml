name: Extension Claim Notice

on:
  pull_request_target:
    types: [closed]
    paths:
      - "contributions/extensions/**"
      - "contributions/mcp-servers/**"
      - "contributions/extension-listings/**"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Merged PR number to backfill"
        required: true
        type: string
      allow_renames:
        description: "Allow explicit maintainer backfill for rename-affected extensions"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: extension-claim-notice-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted workflow source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Post Extension Studio claim notice
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          ALLOW_RENAMES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.allow_renames || 'false' }}
          GUARD_EXTENSION_STUDIO_URL: https://hol.org/guard/extension-studio
        run: |
          args=(
            scripts/notify_merged_extension_claimants.py
            --repo "$GITHUB_REPOSITORY"
            --pr-number "$PR_NUMBER"
          )
          if [[ "$ALLOW_RENAMES" == "true" ]]; then
            args+=(--allow-renames)
          fi
          python3 "${args[@]}"
