name: Refresh Laravel extension projection vector

on:
  push:
    branches:
      - feat/laravel-artisan-command-safety

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/laravel-artisan-command-safety
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc
      - name: Install repository dependencies
        run: uv sync --frozen --extra dev --python 3.12
      - name: Regenerate signed extension projection vector and release pins
        run: |
          uv run --no-sync python - <<'PY'
          import json
          import re
          from pathlib import Path

          from codex_plugin_scanner.guard.managed_controls_policy_bundle import (
              signed_cloud_extension_projection_digest,
              signed_cloud_extension_projection_json,
          )
          from codex_plugin_scanner.guard.runtime import runner
          from tests.managed_controls_activation_support import parse_managed_bundle

          contracts = Path('contracts/managed-controls/v1')
          vector_path = contracts / 'extension-projection-digest-vector.json'
          bundle_path = contracts / 'policy-bundle-v2-extension-signature-vector.json'
          test_path = Path('tests/test_policy_bundle_delivery_runtime.py')

          catalog_digest = runner.build_builtin_extension_catalog_wire(
              guard_version='test',
              generated_at='2026-08-25T12:00:00Z',
          )['catalogDigest']
          bundle = json.loads(bundle_path.read_text(encoding='utf-8'))['bundle']
          parsed = parse_managed_bundle(bundle)
          canonical_projection_json = signed_cloud_extension_projection_json(
              parsed,
              catalog_digest=catalog_digest,
          )
          projection_digest = signed_cloud_extension_projection_digest(
              parsed,
              catalog_digest=catalog_digest,
          )

          vector = json.loads(vector_path.read_text(encoding='utf-8'))
          vector['catalogDigest'] = catalog_digest
          vector['canonicalProjectionJson'] = canonical_projection_json
          vector['expectedExtensionProjectionDigest'] = projection_digest
          vector_path.write_text(json.dumps(vector, indent=2) + '\n', encoding='utf-8')

          source = test_path.read_text(encoding='utf-8')
          source = re.sub(
              r'_GUARD_RELEASE_CATALOG_DIGEST = "[0-9a-f]+"',
              f'_GUARD_RELEASE_CATALOG_DIGEST = "{catalog_digest}"',
              source,
              count=1,
          )
          source = re.sub(
              r'_GUARD_RELEASE_PROJECTION_DIGEST = "sha256:[0-9a-f]+"',
              f'_GUARD_RELEASE_PROJECTION_DIGEST = "{projection_digest}"',
              source,
              count=1,
          )
          test_path.write_text(source, encoding='utf-8')
          print(catalog_digest)
          print(projection_digest)
          PY
      - name: Validate signed extension projection vector
        run: uv run --no-sync pytest tests/test_policy_bundle_delivery_runtime.py::test_signed_cloud_extension_projection_matches_shared_vector -q
      - name: Commit regenerated vector and pins
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contracts/managed-controls/v1/extension-projection-digest-vector.json tests/test_policy_bundle_delivery_runtime.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'test(guard): refresh extension projection vector'
          git push origin HEAD:feat/laravel-artisan-command-safety
