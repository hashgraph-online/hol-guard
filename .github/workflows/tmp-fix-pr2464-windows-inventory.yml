name: Diagnose PR 2464 Windows process inventory

on:
  push:
    branches:
      - fix/rust-daemon-edge-workflow-validation
    paths:
      - .github/workflows/tmp-fix-pr2464-windows-inventory.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnose-pr-2464-windows-inventory
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/rust-daemon-edge-workflow-validation
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Measure trusted Windows process queries
        shell: python
        run: |
          import json
          import os
          import subprocess
          import time
          from pathlib import Path

          windows = Path(os.environ["WINDIR"])
          system32 = windows / "System32"
          powershell = system32 / "WindowsPowerShell" / "v1.0" / "powershell.exe"
          modules = system32 / "WindowsPowerShell" / "v1.0" / "Modules"
          print(json.dumps({
              "powershell": str(powershell),
              "powershell_exists": powershell.is_file(),
              "modules": str(modules),
              "modules_exists": modules.is_dir(),
          }, sort_keys=True))

          original_env = {
              "ComSpec": str(system32 / "cmd.exe"),
              "PATH": str(system32),
              "SystemRoot": str(windows),
              "WINDIR": str(windows),
          }
          module_env = dict(original_env)
          module_env["PSModulePath"] = str(modules)

          prelude = (
              "$ErrorActionPreference = 'Stop'; "
              "$utf8 = New-Object System.Text.UTF8Encoding($false); "
              "[Console]::OutputEncoding = $utf8; $OutputEncoding = $utf8; "
          )
          commands = {
              "original": (
                  original_env,
                  prelude
                  + "$items = @(Get-CimInstance Win32_Process | Select-Object ProcessId,CommandLine); "
                  + "ConvertTo-Json -Compress -InputObject $items",
              ),
              "qualified": (
                  module_env,
                  prelude
                  + r"$items = @(CimCmdlets\Get-CimInstance -ClassName Win32_Process "
                  + r"-Property ProcessId,CommandLine | "
                  + r"Microsoft.PowerShell.Utility\Select-Object ProcessId,CommandLine); "
                  + "ConvertTo-Json -Compress -InputObject $items",
              ),
              "filtered": (
                  module_env,
                  prelude
                  + r'''$query = "SELECT ProcessId, CommandLine FROM Win32_Process WHERE Name='python.exe' OR Name='pythonw.exe' OR Name='python3.exe' OR Name='py.exe' OR Name='hol-guard.exe' OR Name='plugin-guard.exe'"; '''
                  + r"$items = @(CimCmdlets\Get-CimInstance -Query $query | "
                  + r"Microsoft.PowerShell.Utility\Select-Object ProcessId,CommandLine); "
                  + "ConvertTo-Json -Compress -InputObject $items",
              ),
              "module_probe": (
                  module_env,
                  prelude
                  + r"$items = @(Microsoft.PowerShell.Core\Get-Module -ListAvailable CimCmdlets | "
                  + r"Microsoft.PowerShell.Utility\Select-Object Name,Version,Path); "
                  + "ConvertTo-Json -Compress -InputObject $items",
              ),
          }

          failed = False
          for name, (environment, script) in commands.items():
              started = time.monotonic()
              try:
                  completed = subprocess.run(
                      [
                          str(powershell),
                          "-NoProfile",
                          "-NonInteractive",
                          "-Command",
                          script,
                      ],
                      stdin=subprocess.DEVNULL,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      env=environment,
                      timeout=30,
                      check=False,
                  )
              except subprocess.TimeoutExpired as error:
                  print(json.dumps({
                      "name": name,
                      "timeout": True,
                      "elapsed_seconds": round(time.monotonic() - started, 3),
                      "stdout_bytes": len(error.stdout or b""),
                      "stderr_bytes": len(error.stderr or b""),
                  }, sort_keys=True))
                  failed = True
                  continue
              elapsed = time.monotonic() - started
              stdout = completed.stdout.decode("utf-8", errors="replace")
              stderr = completed.stderr.decode("utf-8", errors="replace")
              payload = {
                  "name": name,
                  "returncode": completed.returncode,
                  "elapsed_seconds": round(elapsed, 3),
                  "stdout_bytes": len(completed.stdout),
                  "stderr_bytes": len(completed.stderr),
                  "stdout_prefix": stdout[:1000],
                  "stderr_prefix": stderr[:1000],
              }
              print(json.dumps(payload, sort_keys=True))
              if completed.returncode != 0:
                  failed = True

          if failed:
              raise SystemExit(1)
