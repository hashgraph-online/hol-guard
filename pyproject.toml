[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hol-guard"
version = "3.0.0a0"
description = "Open-source antivirus for AI agents: block risky tools, secret access, prompt injection, malicious packages, MCP servers, plugins, and skills at runtime."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Hashgraph Online", email = "michael@hol.org" },
]
keywords = ["ai", "agent", "security", "antivirus", "mcp", "prompt-injection", "supply-chain"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "click>=8.1.7",
  "cryptography>=42.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "jsonschema>=4.23.0",
  "keyring>=25.5.0",
  "mcp>=1.12.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "pyjwt[crypto]>=2.10.1",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0.2",
  "requests>=2.32.3",
  "rich>=13.9.4",
  "setproctitle>=1.3.4",
  "typer>=0.15.1",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "basedpyright>=1.29.5",
  "build>=1.2.2.post1",
  "mutmut>=3.3.1",
  "pytest>=8.3.5",
  "pytest-cov>=6.0.0",
  "ruff>=0.11.2",
]
scanner = [
  "cisco-ai-skill-scanner>=2.0.7",
  "magika>=0.6.2",
  "yara-x>=1.5.0",
]

[project.scripts]
guard = "codex_plugin_scanner.guard.cli.main:app"
hol-guard = "codex_plugin_scanner.guard.cli.main:app"
ai-plugin-scanner = "codex_plugin_scanner.cli:main"

[project.urls]
Homepage = "https://hol.org/guard"
Documentation = "https://github.com/hashgraph-online/hol-guard#readme"
Repository = "https://github.com/hashgraph-online/hol-guard"
Issues = "https://github.com/hashgraph-online/hol-guard/issues"
Changelog = "https://github.com/hashgraph-online/hol-guard/releases"
Dataset = "https://huggingface.co/datasets/HashgraphOnline/hol-plugin-security"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.hatch.build.targets.wheel]
packages = ["src/codex_plugin_scanner"]

[tool.hatch.build.targets.wheel.force-include]
"contracts/guard-cloud-review/v2/contract.json" = "codex_plugin_scanner/guard/contracts/data/guard-cloud-review/v2/contract.json"
"contracts/guard-cloud-review/v2/command-result.json" = "codex_plugin_scanner/guard/contracts/data/guard-cloud-review/v2/command-result.json"
"contracts/guard-cloud-review/v2/fixtures.json" = "codex_plugin_scanner/guard/contracts/data/guard-cloud-review/v2/fixtures.json"
"docs/guard/contracts/guard-cloud-review.md" = "codex_plugin_scanner/guard/contracts/data/guard-cloud-review/guard-cloud-review.md"

[tool.hatch.build]
artifacts = [
    "src/codex_plugin_scanner/guard/daemon/static/**",
    "src/codex_plugin_scanner/guard/schemas/**",
]
exclude = [
    ".guard-live/**",
    ".guard-package-venv/**",
    ".guard-e2e/**",
    ".guard-e2e-prod/**",
    ".guard-e2e-prod2/**",
    ".guard-prod-venv/**",
    ".guard-prod-venv-fresh/**",
    ".venv/**",
    ".venv-*/**",
    "dashboard/node_modules/**",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/mcp-canary-server.py" = ["N999"]
"scripts/codex-auto-resume-smoke.py" = ["N999"]
"scripts/e2e-cursor-hook-smoke.py" = ["N999"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--strict-markers", "-m", "not slow"]
markers = [
  "adapter_contract: verifies the shared security contract for a harness adapter",
  "daemon_aibom_refresh: enables the daemon AIBOM refresh worker for focused tests",
  "daemon_bundle_refresh: enables the daemon supply-chain bundle refresh worker for focused tests",
  "daemon_headless_queue: enables request-triggered daemon cloud sync for focused tests",
  "daemon_headless_refresh: enables the daemon headless cloud sync worker for focused tests",
  "daemon_service_workers: enables command queue and live request sync workers for focused tests",
  "installed: requires verification through an installed package artifact",
  "integration: verifies multiple Guard subsystems together",
  "parser: verifies parsing or normalization security semantics",
  "policy: verifies policy composition or enforcement semantics",
  "regression: protects a previously observed defect or security finding",
  "release: required for a release-candidate verification gate",
  "security_critical: protects a Guard security boundary that cannot be removed without an equivalent replacement",
  "slow: marks tests as slow (deselected by default; run with -m slow to include)",
  "soak: marks long-running acceptance workloads that require explicit opt-in",
  "compat: verifies a supported Python or platform compatibility contract",
]

[tool.mutmut]
source_paths = ["src/codex_plugin_scanner/guard/runtime/command_model.py"]
also_copy = [
  "src/codex_plugin_scanner",
  "contracts/guard-cloud-review",
  "docs/guard/contracts/guard-cloud-review.md",
]
pytest_add_cli_args_test_selection = [
  "tests/test_guard_command_model.py",
  "tests/test_guard_command_critical_floors.py",
  "tests/test_guard_command_corpus.py",
]

[tool.basedpyright]
include = ["src"]
pythonVersion = "3.10"
failOnWarnings = false
reportImportCycles = false
