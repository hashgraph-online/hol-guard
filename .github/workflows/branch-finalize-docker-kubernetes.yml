name: Finalize Docker and Kubernetes coverage

on:
  push:
    branches:
      - fix/docker-kubernetes-command-coverage

permissions:
  contents: write

concurrency:
  group: finalize-docker-kubernetes-coverage
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Apply final review fixes
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one replacement in {path}, found {count}: {old[:80]!r}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          helper = "src/codex_plugin_scanner/guard/runtime/command_common_extension_helpers.py"
          replace_once(
              helper,
              "        required_flags_in_all_arguments=True,\n        fail_secure_unknown_options=matcher.fail_secure_unknown_options,\n",
              "        required_flags_in_all_arguments=True,\n        fail_secure_unknown_options=True,\n",
          )

          kube = Path("src/codex_plugin_scanner/guard/runtime/command_kubernetes_common_extensions.py")
          text = kube.read_text(encoding="utf-8")
          alias_definition = '_HELM_REMOVE_ALIASES = AnyMatcher(matchers=(_helm("delete"), _helm("del"), _helm("un")))\n'
          if text.count(alias_definition) != 1:
              raise SystemExit("expected Helm alias matcher definition exactly once")
          text = text.replace(alias_definition, "", 1)
          marker = '    rule(\n        rule_id="command.kubernetes-operations.helm-uninstall-alias",'
          start = text.find(marker)
          if start < 0:
              raise SystemExit("Helm uninstall alias rule marker not found")
          end = text.find("\n)", start)
          if end < 0:
              raise SystemExit("Kubernetes rule tuple terminator not found")
          text = text[:start] + text[end:]
          kube.write_text(text, encoding="utf-8")

          domain = Path("src/codex_plugin_scanner/guard/runtime/command_domain_extensions.py")
          text = domain.read_text(encoding="utf-8")
          old = "    required_option_values: tuple[tuple[str, frozenset[str]], ...] = _EMPTY_OPTION_REQUIREMENTS,\n    required_flags_in_all_arguments: bool = False,\n) -> ExecutableMatcher:\n"
          new = "    required_option_values: tuple[tuple[str, frozenset[str]], ...] = _EMPTY_OPTION_REQUIREMENTS,\n    required_flags_in_all_arguments: bool = False,\n    fail_secure_unknown_options: bool = False,\n) -> ExecutableMatcher:\n"
          if text.count(old) != 1:
              raise SystemExit("domain matcher signature replacement failed")
          text = text.replace(old, new, 1)
          old = "        required_option_values=required_option_values,\n        required_flags_in_all_arguments=required_flags_in_all_arguments,\n    )\n"
          new = "        required_option_values=required_option_values,\n        required_flags_in_all_arguments=required_flags_in_all_arguments,\n        fail_secure_unknown_options=fail_secure_unknown_options,\n    )\n"
          if text.count(old) != 1:
              raise SystemExit("domain matcher construction replacement failed")
          text = text.replace(old, new, 1)

          kube_start = text.index("def _kubernetes_dry_run_variant")
          helm_start = text.index("def _helm_dry_run_variants", kube_start)
          kube_block = text[kube_start:helm_start]
          needle = "            required_flags_in_all_arguments=True,\n        ),\n"
          if kube_block.count(needle) != 1:
              raise SystemExit("kubectl dry-run conservative marker not found exactly once")
          kube_block = kube_block.replace(
              needle,
              "            required_flags_in_all_arguments=True,\n            fail_secure_unknown_options=True,\n        ),\n",
              1,
          )
          text = text[:kube_start] + kube_block + text[helm_start:]

          helm_start = text.index("def _helm_dry_run_variants")
          rule_start = text.index("def _rule", helm_start)
          helm_replacement = '''def _helm_dry_run_variant(subcommand: str, title: str) -> CommandSafeVariant:\n    return CommandSafeVariant(\n        variant_id="dry-run",\n        title=title,\n        matcher=_executable_matcher(\n            _HELM_EXECUTABLES,\n            subcommand,\n            required_flags=frozenset({"--dry-run"}),\n            leading_options_with_values=_HELM_GLOBAL_OPTIONS,\n            interspersed_flags=_HELM_GLOBAL_FLAGS,\n            required_flags_in_all_arguments=True,\n            fail_secure_unknown_options=True,\n        ),\n    )\n\n\n'''
          text = text[:helm_start] + helm_replacement + text[rule_start:]
          old_call = '            *_helm_dry_run_variants("uninstall", "Helm uninstall preview"),\n'
          new_call = '            _helm_dry_run_variant("uninstall", "Helm uninstall preview"),\n'
          if text.count(old_call) != 1:
              raise SystemExit("Helm uninstall safe variant call not found exactly once")
          text = text.replace(old_call, new_call, 1)
          domain.write_text(text, encoding="utf-8")

          regression = Path("tests/test_guard_command_common_extension_regressions.py")
          text = regression.read_text(encoding="utf-8")
          addition = '''\n\n@pytest.mark.parametrize(\n    "command",\n    [\n        "kubectl apply -f --dry-run=client",\n        "kubectl apply --filename --dry-run=server",\n        "kubectl delete -f --dry-run=client",\n        "helm uninstall api --description --dry-run",\n    ],\n)\ndef test_flag_shaped_option_values_cannot_fake_safe_preview(command: str, tmp_path: Path) -> None:\n    payload = inspect_command(command, cwd=tmp_path, home_dir=tmp_path)\n\n    assert payload["status"] == "review"\n'''
          if "test_flag_shaped_option_values_cannot_fake_safe_preview" in text:
              raise SystemExit("regression test already exists unexpectedly")
          regression.write_text(text.rstrip() + addition + "\n", encoding="utf-8")

          tests = Path("tests/test_guard_command_container_kubernetes_common_extensions.py")
          text = tests.read_text(encoding="utf-8")
          removals = [
              '        ("helm delete api --namespace prod", "command.kubernetes-operations.helm-uninstall-alias"),\n',
              '        "helm delete api --dry-run",\n',
              '        "helm.exe uninstall api --dry-run=client",\n',
          ]
          for item in removals:
              if text.count(item) != 1:
                  raise SystemExit(f"expected test fixture exactly once: {item!r}")
              text = text.replace(item, "", 1)
          unsafe_marker = '        "helm install api ./chart --dry-run=none",\n'
          if text.count(unsafe_marker) != 1:
              raise SystemExit("unsafe Helm fixture marker not found")
          text = text.replace(
              unsafe_marker,
              unsafe_marker + '        "helm.exe uninstall api --dry-run=client",\n',
              1,
          )
          legacy_marker = '''def test_legacy_compose_compatibility_is_not_registered(tmp_path: Path) -> None:\n    payload = inspect_command("docker-compose down --volumes", cwd=tmp_path, home_dir=tmp_path)\n\n    assert payload["status"] == "no_match"\n'''
          if text.count(legacy_marker) != 1:
              raise SystemExit("legacy Compose regression marker not found")
          legacy_helm = legacy_marker + '''\n\n@pytest.mark.parametrize("command", ["helm delete api", "helm del api", "helm un api"])\ndef test_legacy_helm_removal_aliases_are_not_registered(command: str, tmp_path: Path) -> None:\n    assert inspect_command(command, cwd=tmp_path, home_dir=tmp_path)["status"] == "no_match"\n'''
          text = text.replace(legacy_marker, legacy_helm, 1)
          tests.write_text(text, encoding="utf-8")

          coverage = Path("docs/guard/command-domain-extension-coverage.md")
          text = coverage.read_text(encoding="utf-8")
          old = "Helm install/upgrade/rollback/uninstall aliases"
          if text.count(old) != 1:
              raise SystemExit("coverage alias wording not found")
          coverage.write_text(text.replace(old, "Helm install/upgrade/rollback/uninstall", 1), encoding="utf-8")

          directory = Path("docs/guard/extensions/README.md")
          text = directory.read_text(encoding="utf-8")
          old = "| `command.kubernetes-operations` | Reviews cluster mutations, remote execution, file transfer, tunnels, certificate decisions, and Helm lifecycle operations. | 29 | Built in |"
          new = "| `command.kubernetes-operations` | Reviews cluster mutations, remote execution, file transfer, tunnels, certificate decisions, and Helm lifecycle operations. | 28 | Built in |"
          if text.count(old) != 1:
              raise SystemExit("generated extension directory Kubernetes rule count not found")
          directory.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Format changed Python
        run: |
          uv run --no-sync ruff format \
            src/codex_plugin_scanner/guard/runtime/command_common_extension_helpers.py \
            src/codex_plugin_scanner/guard/runtime/command_domain_extensions.py \
            src/codex_plugin_scanner/guard/runtime/command_kubernetes_common_extensions.py \
            tests/test_guard_command_common_extension_regressions.py \
            tests/test_guard_command_container_kubernetes_common_extensions.py
      - name: Regenerate catalog baseline and digest assertion
        run: |
          uv run --no-sync python - <<'PY'
          import json
          import re
          from pathlib import Path
          from codex_plugin_scanner.guard.runtime.command_extensions import BUILT_IN_COMMAND_EXTENSION_REGISTRY

          registry = BUILT_IN_COMMAND_EXTENSION_REGISTRY
          actual = {
              "catalog_digest": registry.catalog_digest,
              "extension_count": len(registry.extensions),
              "extension_ids": [extension.extension_id for extension in registry.extensions],
              "permission_count": sum(len(extension.permissions) for extension in registry.extensions),
              "permission_ids": [
                  permission.permission_id
                  for extension in registry.extensions
                  for permission in extension.permissions
              ],
              "rule_count": sum(len(extension.rules) for extension in registry.extensions),
              "rule_ids": [rule.rule_id for extension in registry.extensions for rule in extension.rules],
              "permission_examples": {
                  permission.permission_id: permission.example_command
                  for extension in registry.extensions
                  for permission in extension.permissions
              },
              "permission_families": {
                  permission.permission_id: permission.family
                  for extension in registry.extensions
                  for permission in extension.permissions
                  if permission.family is not None
              },
          }
          fixture = Path("tests/fixtures/extension-controls/catalog-baseline.v1.json")
          baseline = json.loads(fixture.read_text(encoding="utf-8"))
          baseline.update(actual)
          fixture.write_text(json.dumps(baseline, indent=2) + "\n", encoding="utf-8")

          catalog_test = Path("tests/test_guard_command_permission_catalog.py")
          text = catalog_test.read_text(encoding="utf-8")
          pattern = r'assert registry\.catalog_digest == "[0-9a-f]{64}"'
          replacement = f'assert registry.catalog_digest == "{registry.catalog_digest}"'
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit("catalog digest assertion not found exactly once")
          catalog_test.write_text(text, encoding="utf-8")
          print(registry.catalog_digest)
          PY
      - name: Validate focused coverage
        run: |
          uv run --no-sync ruff check \
            src/codex_plugin_scanner/guard/runtime/command_common_extension_helpers.py \
            src/codex_plugin_scanner/guard/runtime/command_domain_extensions.py \
            src/codex_plugin_scanner/guard/runtime/command_kubernetes_common_extensions.py \
            tests/test_guard_command_common_extension_regressions.py \
            tests/test_guard_command_container_kubernetes_common_extensions.py \
            tests/test_guard_command_permission_catalog.py
          uv run --no-sync pytest -q \
            tests/test_guard_command_common_extension_regressions.py \
            tests/test_guard_command_container_kubernetes_common_extensions.py \
            tests/test_guard_command_permission_catalog.py \
            tests/test_guard_extension_control_catalog_detail.py
          uv run --no-sync basedpyright \
            src/codex_plugin_scanner/guard/runtime/command_common_extension_helpers.py \
            src/codex_plugin_scanner/guard/runtime/command_domain_extensions.py \
            src/codex_plugin_scanner/guard/runtime/command_kubernetes_common_extensions.py
          test "$(wc -l < src/codex_plugin_scanner/guard/runtime/command_domain_extensions.py)" -le 500
      - name: Commit fixes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          remote_sha="$(git ls-remote origin refs/heads/fix/docker-kubernetes-command-coverage | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git config user.name "Michael Kantor"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git add \
            src/codex_plugin_scanner/guard/runtime/command_common_extension_helpers.py \
            src/codex_plugin_scanner/guard/runtime/command_domain_extensions.py \
            src/codex_plugin_scanner/guard/runtime/command_kubernetes_common_extensions.py \
            tests/test_guard_command_common_extension_regressions.py \
            tests/test_guard_command_container_kubernetes_common_extensions.py \
            tests/test_guard_command_permission_catalog.py \
            tests/fixtures/extension-controls/catalog-baseline.v1.json \
            docs/guard/command-domain-extension-coverage.md \
            docs/guard/extensions/README.md
          git commit -m "fix: close remaining command coverage review gaps"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push origin HEAD:fix/docker-kubernetes-command-coverage
