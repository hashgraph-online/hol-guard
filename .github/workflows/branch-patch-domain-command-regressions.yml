name: Branch patch domain command regressions

on:
  push:
    branches:
      - fix/docker-kubernetes-command-coverage
    paths:
      - .github/workflows/branch-patch-domain-command-regressions.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/docker-kubernetes-command-coverage
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Inspect remaining matcher regressions
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          from codex_plugin_scanner.guard.runtime.command_extensions import BUILT_IN_COMMAND_EXTENSION_REGISTRY
          from codex_plugin_scanner.guard.runtime.command_inspection import inspect_command
          from codex_plugin_scanner.guard.runtime.command_model import parse_shell_command
          from codex_plugin_scanner.guard.runtime.command_option_parsing import argument_semantics
          from codex_plugin_scanner.guard.runtime.command_rules import ExecutableMatcher, _after_leading_options, _without_options

          commands = [
              "docker compose down --rmi=all",
              "docker compose down --rmi local",
              "kubectl patch deployment api -p '{}' --local --local=false",
          ]
          root = Path.cwd()
          for command in commands:
              canonical = parse_shell_command(command, cwd=root, home_dir=root)
              print("COMMAND", command)
              print("PAYLOAD", inspect_command(command, cwd=root, home_dir=root))
              print("ARGS", canonical.segments[0].arguments)
              for extension in BUILT_IN_COMMAND_EXTENSION_REGISTRY.extensions:
                  for rule in extension.rules:
                      if rule.matcher is None:
                          continue
                      base = rule.matcher.match(canonical)
                      variants = [(variant.variant_id, variant.matcher.match(canonical), repr(variant.matcher)) for variant in rule.safe_variants]
                      if base or any(match for _, match, _ in variants):
                          print("RULE", rule.rule_id, "BASE", base)
                          for variant_id, match, matcher_repr in variants:
                              if match or rule.rule_id in {
                                  "command.container-runtime.compose-destructive-cleanup",
                                  "command.kubernetes-operations.patch-resources",
                              }:
                                  print("VARIANT", variant_id, "MATCH", match, matcher_repr)
                      if rule.rule_id not in {
                          "command.container-runtime.compose-destructive-cleanup",
                          "command.kubernetes-operations.patch-resources",
                      }:
                          continue
                      matcher = rule.matcher
                      leaves = matcher.matchers if hasattr(matcher, "matchers") else (matcher,)
                      for leaf in leaves:
                          if not isinstance(leaf, ExecutableMatcher):
                              continue
                          args = tuple(arg.lower() for arg in canonical.segments[0].arguments)
                          subargs = _without_options(args, leaf.interspersed_options_with_values, leaf.interspersed_flags)
                          if leaf.allow_leading_options:
                              subargs = _after_leading_options(subargs, leaf.leading_options_with_values, leaf.interspersed_flags)
                          flagargs = args if leaf.required_flags_in_all_arguments else subargs[len(leaf.subcommands):]
                          semantics = argument_semantics(
                              flagargs,
                              options_with_values=leaf.options_with_values | leaf.leading_options_with_values | leaf.interspersed_options_with_values,
                              inverse_flag_pairs=leaf.inverse_flag_pairs,
                          )
                          print("LEAF", repr(leaf), "SUBARGS", subargs, "FLAGARGS", flagargs, "SEM", semantics, "MATCH", leaf.match(canonical))
          PY
