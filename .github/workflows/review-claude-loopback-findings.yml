name: Review authenticated loopback findings
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/ci/review_claude_loopback_findings.py
      - .github/workflows/review-claude-loopback-findings.yml
permissions:
  contents: read
jobs:
  review:
    if: github.event.pull_request.number == 2771 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/sonar-adapter-path-authority' && github.actor == 'kantorcodes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
      - run: uv sync --frozen --extra dev
      - name: Verify existing authenticated transport regressions
        run: uv run --no-sync pytest -q tests/test_claude_daemon_hook_bridge.py tests/test_sonar_path_authority.py tests/test_sonar_lifecycle_edge_cases.py
      - name: Apply source-pinned individual review dispositions
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: python3 scripts/ci/review_claude_loopback_findings.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: sonar-loopback-review
          path: sonar-loopback-review/
          if-no-files-found: warn
