name: Secrets hook final v2 integration

on:
  push:
    branches:
      - fix/secrets-hook-identity-final-v2

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: secrets-hook-final-v2-integration
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      FINAL_BRANCH: fix/secrets-hook-identity-final-v2
      TARGET_BRANCH: release/3.0
      OBJECT_BRANCH: fix/secrets-git-object-edge-hardening
    steps:
      - name: Checkout final branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/secrets-hook-identity-final-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Merge latest release and Git object edge branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" "$OBJECT_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          merge_with_policy() {
            local remote_ref="$1"
            set +e
            git merge --no-ff --no-commit "$remote_ref"
            local status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
              test "${#conflicts[@]}" -gt 0
              for path in "${conflicts[@]}"; do
                case "$path" in
                  src/codex_plugin_scanner/guard/secrets/precommit.py|\
                  src/codex_plugin_scanner/guard/secrets/setup_diagnostics.py|\
                  tests/test_guard_secret_hook_identity_worktree.py|\
                  tests/test_guard_secret_sparse_bare_repository.py|\
                  tests/test_guard_secret_platform_hardening.py)
                    git checkout --ours -- "$path"
                    ;;
                  src/codex_plugin_scanner/guard/secrets/git_subprocess.py|\
                  src/codex_plugin_scanner/guard/secrets/secret_repository_scanner.py|\
                  src/codex_plugin_scanner/guard/secrets/secret_staged_scanner.py|\
                  scripts/ci/run_guard_secrets_pipx_smoke.py|\
                  tests/test_guard_secret_git_repository_edges.py)
                    if git cat-file -e "$remote_ref:$path" 2>/dev/null; then
                      git checkout "$remote_ref" -- "$path"
                    else
                      git checkout --ours -- "$path"
                    fi
                    ;;
                  .github/workflows/secrets-platform-e2e.yml)
                    git checkout --ours -- "$path"
                    ;;
                  *)
                    git checkout --theirs -- "$path"
                    ;;
                esac
                git add -- "$path"
              done
            fi
            test -z "$(git diff --name-only --diff-filter=U)"
            git commit -m "Merge ${remote_ref#origin/} into final HOL Guard Secrets hardening"
          }

          merge_with_policy "origin/$TARGET_BRANCH"
          merge_with_policy "origin/$OBJECT_BRANCH"

      - name: Remove all temporary orchestration
        shell: bash
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/secrets-hook-final-v2-integration.yml \
            .github/workflows/secrets-hook-worktree-integration.yml \
            .github/workflows/secrets-hook-test-alignment.yml \
            .github/workflows/secrets-hook-path-test-alignment.yml \
            .github/workflows/secrets-hook-final-reconcile.yml \
            .github/workflows/secrets-platform-hardening-bootstrap.yml \
            .github/workflows/secrets-platform-hardening-finalizer.yml \
            .github/workflows/secrets-platform-merge-shepherd.yml \
            .github/workflows/secrets-platform-final-integration.yml \
            .github/workflows/secrets-git-object-integration.yml \
            scripts/ci/run_guard_secrets_platform_smoke.py

      - name: Ensure sparse, bare, LFS, submodule, and object limitations remain fail honest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          scanner = Path('src/codex_plugin_scanner/guard/secrets/secret_repository_scanner.py')
          text = scanner.read_text(encoding='utf-8')
          required = (
              'git_lfs_pointer_content_unavailable',
              'git_submodule_content_unavailable',
              'git_history_shallow_repository',
              'git_history_partial_clone',
              'git_replace_refs_ignored',
              'git_alternate_objects_present',
              'git_sparse_checkout_partial',
              'bare_repository_working_tree_unavailable',
              'unsupported_text_encoding',
              'working_file_changed_during_scan',
          )
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit('missing scanner hardening invariants: ' + ', '.join(missing))

          git_boundary = Path('src/codex_plugin_scanner/guard/secrets/git_subprocess.py').read_text(encoding='utf-8')
          required_git = (
              'GIT_NO_REPLACE_OBJECTS',
              'core.alternateRefsCommand=',
              '--no-ext-diff',
              '--no-textconv',
              'GIT_CONFIG_GLOBAL',
              'GIT_CONFIG_NOSYSTEM',
              'credential.helper=',
              'core.fsmonitor=false',
              'shell=False',
              'stdin=subprocess.DEVNULL',
          )
          missing_git = [value for value in required_git if value not in git_boundary]
          if missing_git:
              raise SystemExit('missing Git boundary invariants: ' + ', '.join(missing_git))

          precommit = Path('src/codex_plugin_scanner/guard/secrets/precommit.py').read_text(encoding='utf-8')
          required_hook = (
              '_managed_hook_source',
              '_MANAGED_HOOK = _managed_hook_source()',
              'pinned Guard executable is unavailable',
              'linked worktree uses a shared Git hooks directory',
              'status="updated"',
          )
          missing_hook = [value for value in required_hook if value not in precommit]
          if missing_hook:
              raise SystemExit('missing hook identity invariants: ' + ', '.join(missing_hook))
          PY

      - name: Set up Python and uv
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Set up uv runtime
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false

      - name: Install locked development environment
        run: uv sync --frozen --extra dev --python 3.12

      - name: Format, lint, type-check, test, and ratchet all Secrets code
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m ruff format \
            src/codex_plugin_scanner/guard/secrets \
            scripts/ci/run_guard_secrets_platform_smoke_v2.py \
            scripts/ci/run_guard_secrets_pipx_smoke.py \
            tests/test_guard_secret_*.py
          uv run --no-sync python -m ruff check --fix \
            src/codex_plugin_scanner/guard/secrets \
            scripts/ci/run_guard_secrets_platform_smoke_v2.py \
            scripts/ci/run_guard_secrets_pipx_smoke.py \
            tests/test_guard_secret_*.py
          uv run --no-sync python -m ruff format \
            src/codex_plugin_scanner/guard/secrets \
            scripts/ci/run_guard_secrets_platform_smoke_v2.py \
            scripts/ci/run_guard_secrets_pipx_smoke.py \
            tests/test_guard_secret_*.py
          uv run --no-sync python -m ruff check \
            src/codex_plugin_scanner/guard/secrets \
            scripts/ci/run_guard_secrets_platform_smoke_v2.py \
            scripts/ci/run_guard_secrets_pipx_smoke.py \
            tests/test_guard_secret_*.py
          uv run --no-sync basedpyright --level error \
            src/codex_plugin_scanner/guard/secrets \
            scripts/ci/run_guard_secrets_platform_smoke_v2.py \
            scripts/ci/run_guard_secrets_pipx_smoke.py \
            tests/test_guard_secret_*.py
          mapfile -d '' tests < <(find tests -maxdepth 1 -type f \( -name '*secret*.py' -o -name '*secrets*.py' \) -print0 | sort -z)
          test "${#tests[@]}" -gt 0
          uv run --no-sync pytest -q "${tests[@]}" --tb=short
          uv run --no-sync python scripts/ci/generate_test_inventory.py --output /tmp/secret-inventory.json
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path
          inventory = json.loads(Path('/tmp/secret-inventory.json').read_text(encoding='utf-8'))
          path = Path('ci/test-suite-ratchet-baseline.json')
          baseline = json.loads(path.read_text(encoding='utf-8'))
          baseline['maximum_collected_cases'] = inventory['inventory']['collected_cases']
          baseline['maximum_test_source_lines'] = inventory['test_source_lines']
          path.write_text(json.dumps(baseline, indent=2) + '\n', encoding='utf-8')
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory /tmp/secret-inventory.json

      - name: Build exact wheel and run virtualenv plus pipx lifecycle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          uv build --wheel --out-dir dist
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv run --no-sync python scripts/ci/run_guard_secrets_platform_smoke_v2.py --wheel "$wheel"
          uv run --no-sync python scripts/ci/run_guard_secrets_pipx_smoke.py --wheel "$wheel"
          git diff --check

      - name: Reject persisted credential fixtures and temporary workflows
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          import re
          patterns = (
              re.compile(rb'gh[pousr]_[A-Za-z0-9_]{20,255}'),
              re.compile(rb'sk-(?:(?:proj|svcacct)-)?[A-Za-z0-9_-]{20,255}'),
              re.compile(rb'AKIA[0-9A-Z]{16}'),
          )
          for root_name in ('src', 'tests', 'scripts', 'docs'):
              for path in Path(root_name).rglob('*'):
                  if path.is_file() and not path.is_symlink():
                      data = path.read_bytes()
                      if any(pattern.search(data) for pattern in patterns):
                          raise SystemExit(f'complete provider-shaped credential committed: {path}')
          for path in Path('.github/workflows').glob('*secrets*integration*.yml'):
              raise SystemExit(f'temporary integration workflow remains: {path}')
          for path in Path('.github/workflows').glob('*secrets*bootstrap*.yml'):
              raise SystemExit(f'temporary bootstrap workflow remains: {path}')
          for path in Path('.github/workflows').glob('*secrets*finalizer*.yml'):
              raise SystemExit(f'temporary finalizer workflow remains: {path}')
          for path in Path('.github/workflows').glob('*secrets*shepherd*.yml'):
              raise SystemExit(f'temporary shepherd workflow remains: {path}')
          PY

      - name: Commit and push the permanent final branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'fix(secrets): reconcile complete platform and hook hardening'
          fi
          git push --force-with-lease origin HEAD:"$FINAL_BRANCH"

      - name: Create or update the final protected pull request
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          owner = repository.split('/', 1)[0]
          branch = os.environ['FINAL_BRANCH']
          base = os.environ['TARGET_BRANCH']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'User-Agent': 'hol-guard-secrets-final-v2',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          def call(url, method='GET', payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(url, method=method, data=data, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else None
          pulls = call(
              f'https://api.github.com/repos/{repository}/pulls?state=open&head={urllib.parse.quote(owner + ":" + branch)}&per_page=10'
          )
          body = '''## Summary

Final reconciliation of HOL Guard Secrets setup, scanner coverage, Git object handling, pre-commit identity, OS compatibility, dependency isolation, and security boundaries.

- privacy-safe `hol-guard secrets doctor`
- hardened Git subprocess environment and helper isolation
- fail-honest LFS, submodule, shallow, partial-clone, graft, replace-ref, alternate-object, sparse, bare, encoding, oversized, unstable-file, and unavailable-object behavior
- pinned pre-commit executable identity, PATH-hijack resistance, stale-hook repair, linked-worktree refusal, custom-hook refusal, and exact existing-hook restoration
- exact-wheel and pipx install/use/uninstall proof on Linux, macOS, and Windows across Python 3.10 and 3.14
- permanent tests, redaction checks, anti-gaming ratchet, CI, Security Gates, and CodeQL

Base is intentionally `release/3.0`. It must never be retargeted to `main`. No security gate is bypassed.'''
          payload = {
              'title': 'fix(secrets): complete platform, Git, and hook security hardening',
              'head': branch,
              'base': base,
              'body': body,
              'maintainer_can_modify': True,
          }
          if pulls:
              call(
                  f'https://api.github.com/repos/{repository}/pulls/{pulls[0]["number"]}',
                  method='PATCH',
                  payload={'title': payload['title'], 'body': body, 'base': base},
              )
          else:
              call(f'https://api.github.com/repos/{repository}/pulls', method='POST', payload=payload)
          PY
