name: Everyday offline validation tools
on:
  push:
    branches: [feat/everyday-runtime-r32-20260907]
    paths: [.github/workflows/tmp-everyday-offline-tooling.yml]
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Prepare locked frontend tooling
        working-directory: dashboard
        run: bun install --frozen-lockfile
      - name: Export validation binaries and dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip download --only-binary=:all: --no-deps ruff==0.13.0 -d "$RUNNER_TEMP/tools"
          cp "$(command -v bun)" "$RUNNER_TEMP/tools/bun"
          tar -czf "$RUNNER_TEMP/dashboard-node-modules.tar.gz" -C dashboard node_modules
          tar -czf "$RUNNER_TEMP/validation-tools.tar.gz" -C "$RUNNER_TEMP/tools" .
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: everyday-offline-tools-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dashboard-node-modules.tar.gz
            ${{ runner.temp }}/validation-tools.tar.gz
          if-no-files-found: error
          retention-days: 3
