name: Temporary decision diff fixture refresh

on:
  push:
    branches: [fix/command-coverage-followup]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run --no-sync python tests/guard_command_decision_diff.py --write
      - name: Commit canonical decision diff fixture
        shell: bash
        run: |
          if git diff --quiet -- tests/fixtures/guard-command-corpus/decision-diff-report.json; then
            echo "decision diff fixture already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/guard-command-corpus/decision-diff-report.json
          git commit -m "test: refresh command decision diff evidence"
          git fetch origin fix/command-coverage-followup
          git rebase origin/fix/command-coverage-followup
          git push origin HEAD:fix/command-coverage-followup
