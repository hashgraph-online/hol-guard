name: Branch regenerate command extension baselines

on:
  push:
    branches:
      - fix/docker-kubernetes-command-coverage
    paths:
      - .github/workflows/branch-regenerate-command-extension-baselines.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/docker-kubernetes-command-coverage
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Regenerate extension directory and catalog baseline
        run: |
          uv run --no-sync python scripts/render_command_extension_directory.py
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path
          from codex_plugin_scanner.guard.runtime.command_extensions import BUILT_IN_COMMAND_EXTENSION_REGISTRY

          registry = BUILT_IN_COMMAND_EXTENSION_REGISTRY
          snapshot = {
              "catalog_digest": registry.catalog_digest,
              "extension_count": len(registry.extensions),
              "extension_ids": [extension.extension_id for extension in registry.extensions],
              "permission_count": sum(len(extension.permissions) for extension in registry.extensions),
              "permission_ids": [
                  permission.permission_id
                  for extension in registry.extensions
                  for permission in extension.permissions
              ],
              "rule_count": sum(len(extension.rules) for extension in registry.extensions),
              "rule_ids": [rule.rule_id for extension in registry.extensions for rule in extension.rules],
              "permission_examples": {
                  permission.permission_id: permission.example_command
                  for extension in registry.extensions
                  for permission in extension.permissions
              },
              "permission_families": {
                  permission.permission_id: permission.family
                  for extension in registry.extensions
                  for permission in extension.permissions
                  if permission.family is not None
              },
          }
          fixture = Path("tests/fixtures/extension-controls/catalog-baseline.v1.json")
          baseline = json.loads(fixture.read_text(encoding="utf-8"))
          baseline.update(snapshot)
          fixture.write_text(json.dumps(baseline, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({
              "catalog_digest": registry.catalog_digest,
              "extension_count": snapshot["extension_count"],
              "permission_count": snapshot["permission_count"],
              "rule_count": snapshot["rule_count"],
          }, sort_keys=True))
          PY
      - name: Commit regenerated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/guard/extensions/README.md tests/fixtures/extension-controls/catalog-baseline.v1.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: regenerate command extension baselines"
          git push origin HEAD:fix/docker-kubernetes-command-coverage
