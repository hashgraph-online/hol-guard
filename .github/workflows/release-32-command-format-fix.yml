name: Release 3.2 command format fix

on:
  push:
    branches:
      - fix/3.2-command-review-followup
    paths:
      - .github/workflows/release-32-command-format-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/3.2-command-review-followup
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Format exact command files
        shell: bash
        run: |
          python -m pip install 'ruff==0.15.17'
          python -m ruff format \
            src/codex_plugin_scanner/guard/runtime/command_builtin_extension_catalog.py \
            src/codex_plugin_scanner/guard/runtime/command_common_cli_matchers.py \
            src/codex_plugin_scanner/guard/runtime/command_common_cli_rules_1.py \
            src/codex_plugin_scanner/guard/runtime/command_common_cli_rules_2.py \
            src/codex_plugin_scanner/guard/runtime/command_common_cli_rules_3.py \
            src/codex_plugin_scanner/guard/runtime/command_common_cli_rules_5.py \
            src/codex_plugin_scanner/guard/runtime/command_common_cli_specs.py \
            src/codex_plugin_scanner/guard/runtime/command_common_cli_support.py
          python -m ruff format --check \
            src/codex_plugin_scanner/guard/runtime/command_builtin_extension_catalog.py \
            src/codex_plugin_scanner/guard/runtime/command_common_cli_matchers.py \
            src/codex_plugin_scanner/guard/runtime/command_common_cli_rules_1.py \
            src/codex_plugin_scanner/guard/runtime/command_common_cli_rules_2.py \
            src/codex_plugin_scanner/guard/runtime/command_common_cli_rules_3.py \
            src/codex_plugin_scanner/guard/runtime/command_common_cli_rules_5.py \
            src/codex_plugin_scanner/guard/runtime/command_common_cli_specs.py \
            src/codex_plugin_scanner/guard/runtime/command_common_cli_support.py
      - name: Commit format fixes and remove helper
        shell: bash
        run: |
          rm .github/workflows/release-32-command-format-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style(commands): apply release 3.2 formatter'
          git push origin HEAD:fix/3.2-command-review-followup
