name: Validate the shipped native runtime size
description: Reuse only exact shipped builds and always enforce the wheel size budget.
runs:
  using: composite
  steps:
    - name: Stage shipped runtime trust bindings
      shell: bash
      run: python3 scripts/refresh_extension_artifacts.py --trust-only
    - name: Identify the shipping build platform
      id: shipping-platform
      shell: bash
      run: |
        echo "image=${ImageOS:?}-${ImageVersion:?}" >> "$GITHUB_OUTPUT"
        python3 -m scripts.ci.native_cache_environment >> "$GITHUB_OUTPUT"
    - name: Restore the exact shipped runtime
      id: shipped-runtime-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: rust/target/release/hol-guard-runtime
        # Build recipes and compiler overrides matter; unrelated lane edits do not.
        # Hash before setup-rust restores dependency artifacts. No prefix matches.
        key: shipped-runtime-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.shipping-platform.outputs.image }}-${{ steps.shipping-platform.outputs.compiler-env }}-${{ hashFiles('rust/**', 'contributions/**', 'contracts/**', 'spec/**', 'src/codex_plugin_scanner/guard/contracts/**', '.cargo/**', '.github/actions/setup-rust/action.yml', '.github/actions/ci-job-native-release-size/action.yml', 'scripts/ci/native_cache_environment.py', 'scripts/refresh_extension_artifacts.py') }}
    - uses: ./.github/actions/setup-rust
      if: steps.shipped-runtime-cache.outputs.cache-hit != 'true'
    - name: Install content-addressed compiler cache
      if: steps.shipped-runtime-cache.outputs.cache-hit != 'true'
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      with:
        version: v0.18.0
    - name: Build the shipped fat-LTO runtime
      if: steps.shipped-runtime-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        RUSTC_WORKSPACE_WRAPPER: sccache
        SCCACHE_GHA_ENABLED: 'on'
        SCCACHE_GHA_VERSION: native-release-size
        SCCACHE_GHA_RW_MODE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'READ_WRITE' || 'READ_ONLY' }}
        SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
      run: |
        unset CARGO_PROFILE_RELEASE_LTO
        unset CARGO_PROFILE_RELEASE_CODEGEN_UNITS
        if [ -n "${CARGO_PROFILE_RELEASE_LTO+x}" ] || [ -n "${CARGO_PROFILE_RELEASE_CODEGEN_UNITS+x}" ]; then
          echo "Shipped size gate must use the rust/Cargo.toml release profile" >&2
          exit 1
        fi
        # Only the runtime ships; the mandatory evaluator producer verifies
        # guard-command-source independently on this same commit.
        cargo build --manifest-path rust/Cargo.toml --locked --release -p hol-guard-runtime --bin hol-guard-runtime
    - name: Measure the shipped fat-LTO runtime size
      shell: bash
      run: |
        python3 scripts/ci/check_wheel_size.py --native-dir rust/target/release --platform manylinux_2_17_x86_64
    - name: Save the verified shipped runtime
      if: steps.shipped-runtime-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: rust/target/release/hol-guard-runtime
        key: ${{ steps.shipped-runtime-cache.outputs.cache-primary-key }}
