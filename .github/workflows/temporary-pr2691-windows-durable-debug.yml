name: Temporary PR 2691 Windows atomic rename diagnostic

on:
  push:
    branches:
      - tmp/pr2691-windows-durable-debug-20260902
    paths:
      - .github/workflows/temporary-pr2691-windows-durable-debug.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: tmp/pr2691-windows-durable-debug-20260902
          persist-credentials: false
      - name: Trace Windows atomic rename
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          @'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one target, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          state_windows = Path('rust/crates/guard-runtime/src/resident_state_windows.rs')
          replace_once(
              state_windows,
              '''    SetNamedSecurityInfo(
                  path.as_os_str(),
                  SeObjectType::SE_FILE_OBJECT,
                  SecurityInformation::Dacl | SecurityInformation::ProtectedDacl,
                  None,
                  None,
                  Some(dacl),
                  None,
              )
          ''',
              '''    SetNamedSecurityInfo(
                  path.as_os_str(),
                  SeObjectType::SE_FILE_OBJECT,
                  SecurityInformation::Dacl
                      | SecurityInformation::Owner
                      | SecurityInformation::ProtectedDacl,
                  Some(owner.as_ref()),
                  None,
                  Some(dacl),
                  None,
              )
          ''',
          )

          private_files = Path('rust/crates/guard-runtime-windows-process/src/private_files.rs')
          replace_once(
              private_files,
              '''    let header_size = size_of::<FILE_RENAME_INFO>() - size_of::<u16>();
          ''',
              '''    let header_size = std::mem::offset_of!(FILE_RENAME_INFO, FileName);
          ''',
          )
          replace_once(
              private_files,
              '''    if unsafe {
                  SetFileInformationByHandle(
                      source.as_raw_handle() as HANDLE,
                      FileRenameInfo,
                      buffer.as_ptr() as *mut _,
                      buffer_size as DWORD,
                  )
              } == FALSE
              {
                  return Err(io::Error::last_os_error());
              }
          ''',
              '''    if unsafe {
                  SetFileInformationByHandle(
                      source.as_raw_handle() as HANDLE,
                      FileRenameInfo,
                      buffer.as_ptr() as *mut _,
                      buffer_size as DWORD,
                  )
              } == FALSE
              {
                  let error = io::Error::last_os_error();
                  eprintln!(
                      "DBG rename destination={:?} struct_size={} filename_offset={} buffer_size={} kind={:?} raw={:?} error={}",
                      destination,
                      size_of::<FILE_RENAME_INFO>(),
                      header_size,
                      buffer_size,
                      error.kind(),
                      error.raw_os_error(),
                      error
                  );
                  return Err(error);
              }
          ''',
          )
          '@ | python -

          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup default 1.88.0
          cargo fmt --manifest-path rust/Cargo.toml --all
          $env:RUST_BACKTRACE = '1'
          cargo test --manifest-path rust/Cargo.toml --locked -p hol-guard-runtime --bin hol-guard-runtime approval::approval_v4::tests::ed25519_assertion_validates_and_persists_counter_zero_and_one -- --nocapture --test-threads=1
