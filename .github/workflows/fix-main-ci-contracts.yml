name: Fix broken main CI contracts

on:
  push:
    branches:
      - fix/main-publish-yanked-release-anchor
    paths:
      - ".github/workflows/fix-main-ci-contracts.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/main-publish-yanked-release-anchor
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Repair broken main contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Keep the package-shim status schema stable even when no orphaned shim is recovered.
          replace_once(
              "src/codex_plugin_scanner/guard/package_shim_status.py",
              '    enriched["recoveredManagers"] = _string_list(status.get("recovered_managers"))\n',
              '    recovered_managers = _string_list(status.get("recovered_managers"))\n'
              '    enriched["recovered_managers"] = recovered_managers\n'
              '    enriched["recoveredManagers"] = recovered_managers\n',
          )

          # The OMP proof verifier intentionally trusts only the real user home/Guard home.
          # Make the unit test's fake home authoritative instead of weakening that boundary.
          test_path = Path("tests/test_guard_hotfix_regressions.py")
          test_text = test_path.read_text(encoding="utf-8")
          if "import pytest\n" not in test_text:
              test_text = test_text.replace("from pathlib import Path\n", "from pathlib import Path\n\nimport pytest\n", 1)
          old_omp = '''def test_omp_managed_install_proof_is_recognized_as_live_hook(tmp_path: Path) -> None:\n    store = GuardStore(tmp_path / "guard-home")\n    hook_path = tmp_path / "home" / ".omp" / "agent" / "extensions" / "hol-guard.ts"\n'''
          new_omp = '''def test_omp_managed_install_proof_is_recognized_as_live_hook(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    store = GuardStore(tmp_path / "guard-home")\n    home_dir = tmp_path / "home"\n    monkeypatch.setattr(Path, "home", lambda: home_dir)\n    hook_path = home_dir / ".omp" / "agent" / "extensions" / "hol-guard.ts"\n'''
          if test_text.count(old_omp) != 1:
              raise SystemExit("OMP regression test shape changed unexpectedly")
          test_text = test_text.replace(old_omp, new_omp, 1)
          test_text = test_text.replace(
              "context = HarnessContext(home_dir=tmp_path / \"home\", workspace_dir=None, guard_home=store.guard_home)",
              "context = HarnessContext(home_dir=home_dir, workspace_dir=None, guard_home=store.guard_home)",
              1,
          )
          test_path.write_text(test_text, encoding="utf-8")

          # Direct shell environment assignments are not executables. Resolve the primary
          # command first, but only tolerate a RIPGREP_CONFIG_PATH prefix when rg explicitly
          # disables config loading. `env ... rg` and config-enabled rg remain rejected.
          observers = Path(
              "src/codex_plugin_scanner/guard/runtime/secret_file_request_services/interpreter_observers.py"
          )
          observer_text = observers.read_text(encoding="utf-8")
          old_import = '''from .developer_inspection import (\n    _is_read_only_observer_interpreter_command,\n    _read_only_lookup_primary_segment_is_safe,\n    _static_shell_segment_is_safe,\n)\n'''
          new_import = '''from .developer_inspection import (\n    _is_read_only_observer_interpreter_command,\n    _read_only_lookup_primary_segment_is_safe,\n    _ripgrep_config_is_disabled,\n    _static_shell_segment_is_safe,\n)\n'''
          if observer_text.count(old_import) != 1:
              raise SystemExit("developer_inspection import block changed unexpectedly")
          observer_text = observer_text.replace(old_import, new_import, 1)
          old_loop = '''        command = Path(segment[0]).name.lower()\n        if "/" in segment[0] or "\\\\" in segment[0]:\n            return False\n        if index > 0 and command not in _READ_ONLY_LOOKUP_FILTERS:\n            return False\n        if index == 0:\n            if command not in _READ_ONLY_LOOKUP_COMMANDS:\n                return False\n            if command == "rg" and _ripgrep_args_expand_hidden_files(segment[1:]):\n                return False\n            if not _read_only_lookup_primary_segment_is_safe(command, segment[1:], home_dir=home_dir):\n                return False\n        elif not _read_only_lookup_filter_segment_is_safe(command, segment[1:], home_dir=home_dir):\n            return False\n'''
          new_loop = '''        command, command_index = _shell_segment_primary_command(segment)\n        if command is None or command_index is None:\n            return False\n        command_token = segment[command_index]\n        args = segment[command_index + 1 :]\n        if "/" in command_token or "\\\\" in command_token:\n            return False\n        if command_index > 0:\n            direct_config_prefix = segment[:command_index]\n            if (\n                index != 0\n                or command != "rg"\n                or not _ripgrep_config_is_disabled(args)\n                or any(\n                    _shell_env_assignment_key(token) != "RIPGREP_CONFIG_PATH"\n                    for token in direct_config_prefix\n                )\n            ):\n                return False\n        if index > 0 and command not in _READ_ONLY_LOOKUP_FILTERS:\n            return False\n        if index == 0:\n            if command not in _READ_ONLY_LOOKUP_COMMANDS:\n                return False\n            if command == "rg" and _ripgrep_args_expand_hidden_files(args):\n                return False\n            if not _read_only_lookup_primary_segment_is_safe(command, args, home_dir=home_dir):\n                return False\n        elif not _read_only_lookup_filter_segment_is_safe(command, args, home_dir=home_dir):\n            return False\n'''
          if observer_text.count(old_loop) != 1:
              raise SystemExit("read-only lookup loop changed unexpectedly")
          observers.write_text(observer_text.replace(old_loop, new_loop, 1), encoding="utf-8")

          # Require local high-risk authorization before revealing cloud entitlement state
          # for the repair-all mutation, matching install/sync ordering.
          server = Path("src/codex_plugin_scanner/guard/daemon/server.py")
          server_text = server.read_text(encoding="utf-8")
          function_start = server_text.index("    def _handle_supply_chain_repair(self, payload: dict[str, object]) -> None:")
          function_end = server_text.index("\n    def ", function_start + 5)
          block = server_text[function_start:function_end]
          rate_anchor = '''        if not self._enforce_package_firewall_rate_limit("repair", payload):\n            return\n'''
          if block.count(rate_anchor) != 1:
              raise SystemExit("repair rate-limit anchor changed unexpectedly")
          gate_start = block.index("        try:\n            require_high_risk(")
          gate_end = block.index("\n\n        result = coordinate_supply_chain_repair(", gate_start)
          gate = block[gate_start:gate_end]
          block_without_gate = block[:gate_start] + block[gate_end + 2 :]
          block_new = block_without_gate.replace(rate_anchor, rate_anchor + "\n" + gate + "\n\n", 1)
          if block_new.index("require_high_risk(") > block_new.index("self._supply_chain_entitlement()"):
              raise SystemExit("repair approval gate was not moved ahead of entitlement")
          server_text = server_text[:function_start] + block_new + server_text[function_end:]
          server.write_text(server_text, encoding="utf-8")
          PY

      - name: Install development environment
        run: uv sync --frozen --extra dev --python 3.12

      - name: Format and lint repaired contracts
        shell: bash
        run: |
          uv run --no-sync python -m ruff check --fix \
            src/codex_plugin_scanner/guard/package_shim_status.py \
            src/codex_plugin_scanner/guard/runtime/secret_file_request_services/interpreter_observers.py \
            src/codex_plugin_scanner/guard/daemon/server.py \
            tests/test_guard_hotfix_regressions.py
          uv run --no-sync python -m ruff format \
            src/codex_plugin_scanner/guard/package_shim_status.py \
            src/codex_plugin_scanner/guard/runtime/secret_file_request_services/interpreter_observers.py \
            src/codex_plugin_scanner/guard/daemon/server.py \
            tests/test_guard_hotfix_regressions.py

      - name: Run focused broken-main regressions
        shell: bash
        run: |
          uv run --no-sync pytest \
            tests/test_guard_hotfix_regressions.py::test_orphaned_package_shim_symlink_is_not_recovered \
            tests/test_guard_hotfix_regressions.py::test_omp_managed_install_proof_is_recognized_as_live_hook \
            tests/test_guard_search_input_hardening.py \
            tests/test_guard_phase07_entitlement_daemon_security.py::test_phase07_install_and_sync_require_approval_gate \
            --tb=short

      - name: Refresh deterministic decision evidence
        shell: bash
        run: |
          uv run --no-sync python tests/guard_command_decision_diff.py --write
          uv run --no-sync pytest \
            tests/test_guard_command_decision_diff.py::test_report_is_exactly_reproducible_and_source_bound \
            --tb=short

      - name: Ratchet intentional test-source change
        shell: bash
        run: |
          uv run --no-sync python scripts/ci/test_inventory.py --output test-inventory.json
          python - <<'PY'
          import json
          from pathlib import Path

          inventory = json.loads(Path("test-inventory.json").read_text(encoding="utf-8"))
          baseline_path = Path("ci/test-suite-ratchet-baseline.json")
          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
          baseline["maximum_collected_cases"] = max(
              int(baseline["maximum_collected_cases"]), int(inventory["inventory"]["collected_cases"])
          )
          baseline["maximum_test_source_lines"] = max(
              int(baseline["maximum_test_source_lines"]), int(inventory["test_source_lines"])
          )
          baseline_path.write_text(json.dumps(baseline, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory test-inventory.json
          rm test-inventory.json

      - name: Verify final focused quality
        shell: bash
        run: |
          uv run --no-sync python -m ruff check src/
          uv run --no-sync python -m ruff format --check src/
          uv run --no-sync basedpyright --level error

      - name: Commit repaired CI contracts
        shell: bash
        run: |
          rm .github/workflows/fix-main-ci-contracts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "fix(ci): repair broken main test contracts"
          git push origin HEAD:fix/main-publish-yanked-release-anchor
