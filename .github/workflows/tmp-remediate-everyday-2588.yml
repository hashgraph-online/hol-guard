name: One-shot Everyday EVM-101-200 review remediation

on:
  push:
    branches:
      - feat/everyday-mode-101-200

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply review fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          semantic = Path('src/codex_plugin_scanner/guard/runtime/semantic_explanations.py')
          text = semantic.read_text()

          old_upload = 'required_tokens=(frozenset({"-d", "--data", "--data-binary", "--form", "--upload-file", "--body", "-infile"}),),'
          new_upload = 'required_tokens=(frozenset({"-d", "--data", "--data-binary", "--form", "-F", "--upload-file", "-T", "--body", "-infile"}),),'
          if old_upload not in text and new_upload not in text:
              raise SystemExit('network.upload token block not found')
          text = text.replace(old_upload, new_upload)

          old_tokens = '''def _normalized_tokens(arguments: Iterable[str]) -> Iterable[str]:
    for argument in arguments:
        value = argument.strip().casefold()
        if value:
            yield value
            if "=" in value:
                yield value.split("=", 1)[0]
'''
          new_tokens = '''def _normalized_tokens(arguments: Iterable[str]) -> Iterable[str]:
    for argument in arguments:
        raw = argument.strip()
        if not raw:
            continue
        folded = raw.casefold()
        yield folded
        # curl short options are case-sensitive: -F/--form and -T/--upload-file
        # are uploads, while -f/--fail is not. Preserve two-character short flags
        # alongside the casefolded token so catalog rules can express that safely.
        if raw.startswith("-") and not raw.startswith("--") and len(raw) == 2:
            yield raw
        if "=" in raw:
            prefix = raw.split("=", 1)[0]
            yield prefix.casefold()
            if prefix.startswith("-") and not prefix.startswith("--") and len(prefix) == 2:
                yield prefix
'''
          if old_tokens not in text and new_tokens not in text:
              raise SystemExit('normalized token block not found')
          text = text.replace(old_tokens, new_tokens)

          old_host = '''def _network_host(input: CommandSemanticInput, arguments: Sequence[str]) -> str | None:
    for value in input.network_hosts:
        host = value.strip().strip("[]")
        if host:
            return host
    for argument in arguments:
        match = _URL_RE.search(argument)
        if match:
            return match.group(1).strip("[]")
    return None
'''
          new_host = '''def _network_host(input: CommandSemanticInput, arguments: Sequence[str]) -> str | None:
    for value in input.network_hosts:
        host = _host_only(value)
        if host:
            return host
    for argument in arguments:
        if "://" not in argument:
            continue
        host = _host_only(argument)
        if host:
            return host
    return None


def _host_only(value: str) -> str | None:
    candidate = value.strip()
    if not candidate:
        return None
    try:
        from urllib.parse import urlsplit

        parsed = urlsplit(candidate if "://" in candidate else f"//{candidate}")
        if parsed.hostname:
            return parsed.hostname
    except ValueError:
        pass
    if candidate.startswith("[") and "]" in candidate:
        return candidate[1 : candidate.index("]")]
    return candidate.strip("[]")
'''
          if old_host not in text and new_host not in text:
              raise SystemExit('network host block not found')
          text = text.replace(old_host, new_host)
          semantic.write_text(text)

          builder = Path('src/codex_plugin_scanner/guard/runtime/action_explanation_builder.py')
          text = builder.read_text()
          old_import = '''from .action_explanation_contract import (
    ACTION_EXPLANATION_REDACTION_VERSION,
    ACTION_EXPLANATION_RENDERER_VERSION,
    GuardActionExplanationV1,
    parse_action_explanation,
)'''
          new_import = '''from .action_explanation_contract import (
    ACTION_EXPLANATION_REDACTION_VERSION,
    ACTION_EXPLANATION_RENDERER_VERSION,
    ACTION_EXPLANATION_SCHEMA_VERSION,
    ACTION_EXPLANATION_VERSION,
    GuardActionExplanationV1,
    parse_action_explanation,
)'''
          if old_import not in text and new_import not in text:
              raise SystemExit('contract import block not found')
          text = text.replace(old_import, new_import)
          text = text.replace('                    operands=tuple(segment.arguments),', '                    operands=(),')
          text = text.replace('        "schema_version": "guard.action-explanation.v1",\n        "explanation_version": "1.0.0",', '        "schema_version": ACTION_EXPLANATION_SCHEMA_VERSION,\n        "explanation_version": ACTION_EXPLANATION_VERSION,')
          if 'operands=tuple(segment.arguments)' in text:
              raise SystemExit('compound operands review fix did not apply')
          if '"schema_version": "guard.action-explanation.v1"' in text or '"explanation_version": "1.0.0"' in text:
              raise SystemExit('hardcoded contract versions remain')
          builder.write_text(text)

          tests = Path('tests/test_guard_semantic_explanations.py')
          text = tests.read_text()
          marker = 'def test_curl_short_upload_flags_remain_case_sensitive() -> None:'
          if marker not in text:
              text += '''\n\ndef test_curl_short_upload_flags_remain_case_sensitive() -> None:\n    def explain(args: tuple[str, ...]):\n        return explain_command(\n            CommandSemanticInput(\n                action_identity="curl-short-flag",\n                canonical_identity="curl-short-flag",\n                actor_label="an AI app",\n                executable="curl",\n                arguments=args,\n            )\n        )\n\n    assert explain(("-F", "field=data", "https://example.test/upload")).kind == "network_send"\n    assert explain(("-T", "artifact.bin", "https://example.test/upload")).kind == "network_send"\n    assert explain(("-f", "https://example.test/status")).kind == "network_read"\n\n\ndef test_ipv6_network_host_strips_brackets_and_port() -> None:\n    explanation = explain_command(\n        CommandSemanticInput(\n            action_identity="ipv6-host",\n            canonical_identity="ipv6-host",\n            actor_label="an AI app",\n            executable="curl",\n            arguments=("https://[::1]:8080/path",),\n        )\n    )\n    label = explanation.everyday.targets[0].label\n    assert label == "the service at ::1"\n    assert ":8080" not in label\n'''
              tests.write_text(text)

          tests = Path('tests/test_guard_action_explanation_builder.py')
          text = tests.read_text()
          marker = 'def test_compound_filesystem_flags_are_not_promoted_to_targets() -> None:'
          if marker not in text:
              text += '''\n\ndef test_compound_filesystem_flags_are_not_promoted_to_targets() -> None:\n    command = parse_shell_command("echo ok && rm ./build -rf")\n    explanation = build_action_explanation(\n        action_envelope={"command": "echo ok && rm ./build -rf"},\n        action_identity="compound-flags",\n        actor_label="an AI app",\n        canonical_command=command,\n    )\n    labels = [target.label for target in explanation.everyday.targets]\n    assert "the item named -rf" not in labels\n    assert any("build" in label for label in labels)\n\n\ndef test_compound_uses_contract_version_constants() -> None:\n    command = parse_shell_command("echo ok && rm ./build")\n    explanation = build_action_explanation(\n        action_envelope={"command": "echo ok && rm ./build"},\n        action_identity="compound-version",\n        actor_label="an AI app",\n        canonical_command=command,\n    )\n    from codex_plugin_scanner.guard.runtime.action_explanation_contract import (\n        ACTION_EXPLANATION_SCHEMA_VERSION,\n        ACTION_EXPLANATION_VERSION,\n    )\n\n    assert explanation.schema_version == ACTION_EXPLANATION_SCHEMA_VERSION\n    assert explanation.explanation_version == ACTION_EXPLANATION_VERSION\n'''
              tests.write_text(text)
          PY

      - name: Validate focused Core and dashboard
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
          uv run ruff format src/codex_plugin_scanner/guard/runtime/semantic_explanations.py src/codex_plugin_scanner/guard/runtime/action_explanation_builder.py tests/test_guard_semantic_explanations.py tests/test_guard_action_explanation_builder.py
          uv run ruff check src/codex_plugin_scanner/guard/runtime/semantic_explanations.py src/codex_plugin_scanner/guard/runtime/action_explanation_builder.py tests/test_guard_semantic_explanations.py tests/test_guard_action_explanation_builder.py
          uv run pytest -q tests/test_guard_semantic_explanations.py tests/test_guard_action_explanation_builder.py tests/test_guard_action_explanation_contract.py tests/test_guard_presentation_mode.py
          cd dashboard
          bun install --frozen-lockfile
          bun test src/action-explanation.test.tsx src/presentation-mode.test.ts
          bun run build

      - name: Commit fixes and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-remediate-everyday-2588.yml
          git config user.name "Michael Kantor"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: address Everyday semantic review findings" -m "Signed-off-by: Michael Kantor <6068672+kantorcodes@users.noreply.github.com>"
          git push origin HEAD:feat/everyday-mode-101-200
