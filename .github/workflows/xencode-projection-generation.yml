name: Temporary Xencode projection generation

on:
  push:
    paths:
      - contributions/command-sources/command.xencode.json
      - tests/fixtures/command-source-xencode.v1.json
      - contracts/extensions/trust-class-map.v1.json

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
      - name: Install locked development environment
        run: uv sync --frozen --extra dev
      - name: Build native source compiler
        run: cargo build --manifest-path rust/Cargo.toml --locked --release -p guard-command --bin guard-command-source
      - name: Validate fixture and regenerate projections
        run: |
          uv run --no-sync python scripts/prepare_extension_contribution.py \
            --compiler "$GITHUB_WORKSPACE/rust/target/release/guard-command-source" \
            --source contributions/command-sources/command.xencode.json \
            --fixture tests/fixtures/command-source-xencode.v1.json
          uv run --no-sync python scripts/render_command_extension_directory.py
      - name: Commit generated projections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore: regenerate Xencode extension projections"
          git push
