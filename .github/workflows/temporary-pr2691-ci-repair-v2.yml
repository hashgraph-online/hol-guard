name: Temporary PR 2691 CI repair v2

on:
  push:
    branches:
      - fix/native-runtime-process-lifecycle
    paths:
      - .github/workflows/temporary-pr2691-ci-repair-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
      - name: Apply and validate repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one replacement target, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          lease_path = Path("rust/crates/guard-runtime/src/managed_resident_lease.rs")
          replace_once(
              lease_path,
              '''pub(super) fn acquire(state_base: &Path) -> Result<ClientLease, String> {
              let private_root = private_root_for_state_base(state_base)?;
              let directory = lease_directory(state_base)?;
              let _lock =
                  acquire_directory_lock_with_retry(&directory, &private_root, LEASE_ACQUIRE_RETRY_BUDGET)?;
              let process_id = std::process::id();
              let start_marker = process_start_marker(process_id)?;
              let digest = crate::resident_state::runtime_digest()?;
              let mut nonce = [0u8; 16];
              getrandom::fill(&mut nonce).map_err(|_| "native_client_random_failed".to_owned())?;
              let nonce = crate::resident_state_encoding::hex_bytes(&nonce);
              let path = directory.join(format!("{LEASE_PREFIX}{process_id}-{nonce}{LEASE_SUFFIX}"));
              let contents = format!("{process_id}\\n{start_marker}\\n{digest}\\n");
              let mut file = crate::resident_state::private_file(&path, true, &private_root)?;
              let identity = match LeaseIdentity::from_file(&file) {
                  Ok(identity) => identity,
                  Err(error) => {
                      let _ = identity::remove_open_file_if_same(&path, &file);
                      return Err(error);
                  }
              };
          ''',
              '''pub(super) fn acquire(state_base: &Path) -> Result<ClientLease, String> {
              let private_root = private_root_for_state_base(state_base)?;
              let directory = lease_directory(state_base)?;
              let process_id = std::process::id();
              let start_marker = process_start_marker(process_id)?;
              let digest = crate::resident_state::runtime_digest()?;
              let mut nonce = [0u8; 16];
              getrandom::fill(&mut nonce).map_err(|_| "native_client_random_failed".to_owned())?;
              let nonce = crate::resident_state_encoding::hex_bytes(&nonce);
              let path = directory.join(format!("{LEASE_PREFIX}{process_id}-{nonce}{LEASE_SUFFIX}"));
              let contents = format!("{process_id}\\n{start_marker}\\n{digest}\\n");
              let directory_lock =
                  acquire_directory_lock_with_retry(&directory, &private_root, LEASE_ACQUIRE_RETRY_BUDGET)?;
              let mut file = crate::resident_state::private_file(&path, true, &private_root)?;
              let identity = match LeaseIdentity::from_file(&file) {
                  Ok(identity) => identity,
                  Err(error) => {
                      let _ = identity::remove_open_file_if_same(&path, &file);
                      return Err(error);
                  }
              };
              // Lease paths are nonce-qualified and identity-bound. Release the
              // directory lock before the durability flush so unrelated clients
              // are not serialized behind filesystem latency. Recent partial
              // records remain fail-closed as live until the write completes.
              drop(directory_lock);
          ''',
          )
          replace_once(
              lease_path,
              '''            if let Ok(Some(_lock)) =
                          acquire_directory_lock(&heartbeat_directory, &heartbeat_private_root)
                      {
                          let Ok(mut file) = crate::resident_state::private_file(
                              &heartbeat_path,
                              false,
                              &heartbeat_private_root,
                          ) else {
                              break;
                          };
                          if file
          ''',
              '''            if let Ok(Some(directory_lock)) =
                          acquire_directory_lock(&heartbeat_directory, &heartbeat_private_root)
                      {
                          let Ok(mut file) = crate::resident_state::private_file(
                              &heartbeat_path,
                              false,
                              &heartbeat_private_root,
                          ) else {
                              break;
                          };
                          // As with initial publication, keep the directory lock
                          // only for opening the identity-bound lease path. A
                          // recent partial heartbeat is conservatively live.
                          drop(directory_lock);
                          if file
          ''',
          )

          state_files_path = Path("rust/crates/guard-runtime/src/resident_state_files.rs")
          replace_once(
              state_files_path,
              '''            windows_security::verify_private_file(&file).map_err(|error| {
                          let _ = guard_runtime_windows_process::delete_private_file_handle(&file);
                          error
                      })?;
          ''',
              '''            windows_security::verify_private_file(&file).inspect_err(|_| {
                          let _ = guard_runtime_windows_process::delete_private_file_handle(&file);
                      })?;
          ''',
          )
          PY

          cargo fmt --manifest-path rust/Cargo.toml --all
          git diff --check
          uv sync --frozen --extra dev --python 3.12
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
          cargo clippy --manifest-path rust/Cargo.toml --locked -p hol-guard-runtime --all-targets -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --locked -p hol-guard-runtime managed_resident_lease -- --nocapture

          VERSION="$(uv run --no-sync python scripts/sync_repo_version.py --check)"
          export HOL_GUARD_PACKAGE_VERSION="$VERSION"
          export HOL_GUARD_BUILD_SHA="$(git rev-parse HEAD)"
          cargo build --manifest-path rust/Cargo.toml --locked --release -p hol-guard-runtime
          for attempt in 1 2 3 4 5; do
            HOL_GUARD_NATIVE=force \
            HOL_GUARD_NATIVE_BINARY="$PWD/rust/target/release/hol-guard-runtime" \
              uv run --no-sync pytest -q \
                ci/native_runtime/test_native_runtime_recovery.py::test_native_clients_share_one_generation_across_processes \
                --tb=short
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            rust/crates/guard-runtime/src/managed_resident_lease.rs \
            rust/crates/guard-runtime/src/resident_state_files.rs
          git diff --cached --check
          git commit -m "fix(runtime): avoid lease acquisition stalls"
          git push origin HEAD:fix/native-runtime-process-lifecycle

