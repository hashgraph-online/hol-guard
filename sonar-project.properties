# SonarQube Cloud analysis. This file is the source of coverage and duplication scope.
sonar.projectKey=hashgraph-online_hol-guard
sonar.organization=hashgraph-online
sonar.projectName=hol-guard

# Production code spans the Python package and the native Rust workspace.
sonar.sources=src,rust
sonar.tests=tests,rust
sonar.test.inclusions=**/test_*.py,rust/**/tests/**/*.rs

sonar.python.version=3.10, 3.11, 3.12, 3.13

# The Rust workspace is nested, so point Sonar's Clippy integration at its manifest.
sonar.rust.cargo.manifestPaths=rust/Cargo.toml

# Bundled dashboard output is generated. Rust integration tests are test code, not source LOC.
sonar.exclusions=src/codex_plugin_scanner/guard/daemon/static/**,rust/**/tests/**
sonar.cpd.exclusions=src/codex_plugin_scanner/guard/daemon/static/**,tests/**,rust/**/tests/**

# Coverage XML combined from the sharded pytest run by the ci.yml "sonar" job.
# Set the SONAR_CI_ENABLED repository variable only after disabling Automatic Analysis.
sonar.python.coverage.reportPaths=coverage.xml
