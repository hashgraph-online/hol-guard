name: Retire superseded publisher branch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/retire-superseded-publisher-branch.yml

permissions: {}

jobs:
  retire:
    if: >-
      github.repository_id == '1194748811' &&
      github.event.pull_request.number == 2835 &&
      github.event.pull_request.user.id == 6068672 &&
      github.event.pull_request.head.repo.id == 1194748811 &&
      github.event.pull_request.head.ref == 'feat/extension-publisher-profiles'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Remove only the closed predecessor's unchanged branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          root = 'https://api.github.com/repos/hashgraph-online/hol-guard'
          expected = '7e8f1603695a73dd9f354776ee76d662c5026db8'
          def request(path, method='GET'):
              req = urllib.request.Request(root + path, method=method, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(req, timeout=20) as response:
                  data = response.read(100000)
                  return json.loads(data) if data else None
          old = request('/pulls/2831')
          assert old['state'] == 'closed' and not old['merged']
          assert old['user']['id'] == 6068672
          assert old['head']['repo']['id'] == 1194748811
          assert old['head']['sha'] == expected
          branch = old['head']['ref']
          assert branch.startswith('feat/extension-creator-')
          assert branch not in ('main', 'release/3.0', 'feat/extension-publisher-profiles')
          ref = '/git/refs/heads/' + urllib.parse.quote(branch, safe='')
          try:
              current = request(ref)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              print('The superseded branch is already absent.')
          else:
              assert current['object']['sha'] == expected, 'Branch changed; preserve it.'
              request(ref, method='DELETE')
              print('Removed the unchanged branch of closed PR #2831.')
