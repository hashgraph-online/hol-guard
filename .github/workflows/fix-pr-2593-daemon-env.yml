name: Fix PR 2593 daemon launcher environment

on:
  push:
    branches:
      - chore/reconcile-main-into-release-3.0
    paths:
      - .github/workflows/fix-pr-2593-daemon-env.yml

permissions:
  contents: write

concurrency:
  group: fix-pr-2593-daemon-env
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Correct daemon launcher environment isolation
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config commit.gpgsign false

          python <<'PY'
          from pathlib import Path

          path = Path("src/codex_plugin_scanner/guard/daemon/manager.py")
          source = path.read_text(encoding="utf-8")
          start_marker = '    if getattr(sys, "frozen", False) is True or executable is not None:\n'
          end_marker = '    if platform.system() == "Linux":\n'
          if source.count(start_marker) != 1:
              raise RuntimeError("expected daemon launcher environment block start was not found exactly once")
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          replacement = "\n".join(
              [
                  '    if getattr(sys, "frozen", False) is True or executable is not None:',
                  '        env["PYINSTALLER_RESET_ENVIRONMENT"] = "1"',
                  '        for key in _GUARD_DAEMON_DESKTOP_ENV_KEYS:',
                  '            if value := os.environ.get(key):',
                  '                env[key] = value',
                  '            else:',
                  '                env.pop(key, None)',
                  '    else:',
                  '        env.pop("PYINSTALLER_RESET_ENVIRONMENT", None)',
                  '        for key in _GUARD_DAEMON_DESKTOP_ENV_KEYS:',
                  '            env.pop(key, None)',
                  '',
              ]
          )
          path.write_text(source[:start] + replacement + source[end:], encoding="utf-8")
          PY

          python -m py_compile src/codex_plugin_scanner/guard/daemon/manager.py
          git rm .github/workflows/fix-pr-2593-daemon-env.yml
          git add src/codex_plugin_scanner/guard/daemon/manager.py
          git diff --cached --check
          git -c commit.gpgsign=false commit \
            -m "fix(daemon): isolate desktop launch context" \
            -m "Signed-off-by: Michael Kantor <6068672+kantorcodes@users.noreply.github.com>"
          git push origin HEAD:chore/reconcile-main-into-release-3.0
