[package]
name = "gauntlet-dashboard"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Read-only loopback dashboard for public Gauntlet state"

[dependencies]
rustix = { version = "=1.1.5", features = ["fs"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }

[dev-dependencies]
tempfile = "=3.27.0"
