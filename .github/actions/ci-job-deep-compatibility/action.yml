name: CI deep-compatibility
description: Run the deep-compatibility checks inside the existing CI job.
inputs:
  python-version:
    description: Explicit python-version from the calling job.
    required: true
  shard-index:
    description: Explicit shard-index from the calling job.
    required: true
runs:
  using: composite
  steps:
  - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
    with:
      python-version: ${{ inputs.python-version }}
  - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
    with:
      version: 0.9.26
      enable-cache: true
      cache-dependency-glob: ${{ env.CI_UV_CACHE_DEPENDENCY_GLOB }}
      save-cache: false
  - run: uv sync --frozen --no-dev --group ci-test --python ${{ inputs.python-version }}
    shell: bash
  - name: Secure the CI virtualenv interpreter
    shell: bash
    run: |
      interpreter="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
      target="$(realpath "$interpreter")"
      mode="$(stat -c '%a' "$target")"
      if (( (8#$mode & 2) != 0 )); then
        replacement="${interpreter}.guard-ci"
        cp --dereference "$target" "$replacement"
        chmod 0755 "$replacement"
        mv "$replacement" "$target"
      fi
      secured_mode="$(stat -c '%a' "$(realpath "$interpreter")")"
      (( (8#$secured_mode & 2) == 0 ))
  - name: Download native command evaluators
    uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
    with:
      name: pytest-native-command-evaluators
      path: rust/target/release
  - name: Download matching native command projections
    uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
    with:
      name: pytest-native-command-projections
      path: .
  - run: |
      chmod 0755 rust/target/release/guard-command-source rust/target/release/hol-guard-runtime
      echo "HOL_GUARD_NATIVE_SOURCE_COMPILER=$GITHUB_WORKSPACE/rust/target/release/guard-command-source" >> "$GITHUB_ENV"
      echo "HOL_GUARD_NATIVE_TEST_SOURCE_COMPILER=$GITHUB_WORKSPACE/rust/target/release/guard-command-source" >> "$GITHUB_ENV"
      echo "HOL_GUARD_NATIVE_BINARY=$GITHUB_WORKSPACE/rust/target/release/hol-guard-runtime" >> "$GITHUB_ENV"
      echo "HOL_GUARD_NATIVE_REGRESSION=1" >> "$GITHUB_ENV"
    shell: bash
  - name: Run deep compatibility shard ${{ inputs.shard-index }}
    shell: bash
    run: |
      uv run --no-sync python scripts/ci/pytest_shard.py \
        --shard-index "${{ inputs.shard-index }}" \
        --shard-count 4 \
        --granularity file > pytest-files.txt
      test -s pytest-files.txt
      uv run --no-sync pytest @pytest-files.txt --tb=short
